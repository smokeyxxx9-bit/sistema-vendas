  // ---------- tela de estoque ----------
  // extrai os números da medida (ex: "175/70 R14" -> largura 175, perfil 70, aro 14)
  function medidaNums(medida){
    var nums = String(medida||"").match(/\d+/g) || [];
    return {
      largura: nums[0]!==undefined ? parseInt(nums[0],10) : null,
      perfil:  nums[1]!==undefined ? parseInt(nums[1],10) : null,
      aro:     nums[2]!==undefined ? parseInt(nums[2],10) : null
    };
  }
  // compara dois números que podem ser nulos (sem número identificado vai pro final da lista)
  function cmpNullableNum(x,y){
    if (x===null && y===null) return 0;
    if (x===null) return 1;
    if (y===null) return -1;
    return x-y;
  }
  // ordem: aro (1°), depois perfil (2°), depois largura (3°) — e por fim o texto completo, se empatar
  function estoqueSorted(){
    return loadEstoque().slice().sort(function(a,b){
      var ma = medidaNums(a.medida), mb = medidaNums(b.medida);
      var cmp = cmpNullableNum(ma.aro, mb.aro);
      if (cmp) return cmp;
      cmp = cmpNullableNum(ma.perfil, mb.perfil);
      if (cmp) return cmp;
      cmp = cmpNullableNum(ma.largura, mb.largura);
      if (cmp) return cmp;
      return String(a.medida||"").localeCompare(String(b.medida||""), "pt-BR", {numeric:true});
    });
  }

  function estoqueRowHtml(i){
    var qtd = Math.max(0, parseNum(i.quantidade));
    var min = Math.max(0, parseNum(i.minimo));
    var baixo = min>0 && qtd<min;
    return '<div class="arow">'+
      '<span class="d">'+escHtml(i.medida||"—")+(i.marca?' <span style="color:var(--text-faint);">· '+escHtml(i.marca)+'</span>':'')+
        (baixo?' <span class="est-baixo-badge" title="Abaixo do mínimo configurado ('+min+' un.)">⚠ estoque baixo</span>':'')+'</span>'+
      '<span class="stats">'+
        '<span><b'+(qtd<=0?' class="est-zero"':'')+'>'+qtd+' un.</b></span>'+
        '<span>'+fmtCurrency(parseNum(i.preco))+'</span>'+
        (podeCusto() ? (function(){
          var c = parseNum(i.custo), p = parseNum(i.preco);
          var margem = (c>0 && p>0) ? ' <span class="est-margem'+(p<c?' neg':'')+'">('+Math.round((p-c)/p*100)+'%)</span>' : '';
          return '<button type="button" class="est-custo-btn'+(c>0?'':' vazio')+'" data-est-custo="'+escAttr(i.id)+'" title="Clique para informar/alterar o preço de custo por unidade">'+
            (c>0 ? 'custo '+fmtCurrency(c)+margem : '+ custo')+'</button>';
        })() : '')+
        '<span class="est-actions">'+
          '<button class="icon-btn" data-est-out="'+escAttr(i.id)+'" title="Retirar do estoque">−</button>'+
          '<button class="icon-btn" data-est-in="'+escAttr(i.id)+'" title="Adicionar ao estoque">+</button>'+
          '<button class="icon-btn" data-est-edit="'+escAttr(i.id)+'" title="Editar medida, marca, preço ou custo">✎</button>'+
          '<button class="icon-btn" data-est-del="'+escAttr(i.id)+'" title="Apagar item">✕</button>'+
        '</span>'+
      '</span>'+
    '</div>';
  }

  function renderEstoque(){
    var estoquista = state.role==="estoquista";
    var list = estoqueSorted();
    var q = (state.estoqueQuery||"").trim().toLowerCase();
    // ignora espaços na comparação: "175/70r14" acha "175/70 R14"
    var qn = q.replace(/\s+/g,"");
    var filtered = q ? list.filter(function(i){
      return (i.medida||"").toLowerCase().replace(/\s+/g,"").indexOf(qn)>-1 ||
             (i.marca||"").toLowerCase().replace(/\s+/g,"").indexOf(qn)>-1;
    }) : list;
    // teclado numérico na tela (números, "/" e "R"): ligado por padrão no celular/tablet, dá pra alternar
    var tecladoOn = (state.estTeclado===undefined)
      ? !!(window.matchMedia && window.matchMedia("(pointer:coarse)").matches)
      : state.estTeclado;
    var totalUnidades = 0, totalValor = 0, totalCusto = 0, zerados = 0;
    list.forEach(function(i){
      var qt = Math.max(0, parseNum(i.quantidade));
      totalUnidades += qt;
      totalValor += qt * parseNum(i.preco);
      totalCusto += qt * parseNum(i.custo);
      if (qt<=0) zerados++;
    });

    root.innerHTML =
      '<div class="topbar">'+
        '<div class="brand"><span class="mark"></span><h1>Estoque</h1><span class="tag">MEDIDA · MARCA · QUANTIDADE · PREÇO</span>'+syncBadgeHtml()+'</div>'+
        authZoneHtml()+
      '</div>'+

      '<div class="totals-bar">'+
        tstat("Medidas cadastradas", list.length, true)+
        tstat("Unidades em estoque", totalUnidades)+
        tstat("Medidas zeradas", zerados)+
        (estoquista ? '' : tstat("Valor do estoque", fmtCurrency(totalValor)))+
        (state.role==="master" ? tstat("Custo do estoque", fmtCurrency(totalCusto)) : '')+
      '</div>'+

      '<div class="tbl-head">'+
        '<div class="tbl-head-left"><h2>Itens em estoque</h2><span class="save-flag" id="saveFlag">salvo</span></div>'+
        '<span style="display:flex;gap:8px;">'+
          '<button class="btn ghost" data-act="printestoque" title="Imprimir relatório do estoque">🖨 Imprimir relatório</button>'+
          '<button class="btn primary" data-act="estoquenew">+ Cadastrar medida</button>'+
        '</span>'+
      '</div>'+

      '<div class="card" style="padding:14px 16px;">'+
        '<input type="text" id="estSearch" class="dash-cust-search" placeholder="Buscar por medida ou marca..." autocomplete="off"'+(tecladoOn ? ' inputmode="none"' : '')+' value="'+escAttr(state.estoqueQuery||"")+'">'+
        (tecladoOn
          ? '<div class="est-keypad">'+
              ["7","8","9","4","5","6","1","2","3","/","0","R"].map(function(k){ return '<button type="button" class="kp-key" data-kp="'+k+'">'+k+'</button>'; }).join("")+
              '<button type="button" class="kp-key kp-fn" data-kp="BACK" title="Apagar">⌫</button>'+
              '<button type="button" class="kp-key kp-fn" data-kp="CLEAR">Limpar</button>'+
              '<button type="button" class="kp-key kp-fn" data-kp="ABC" title="Voltar para o teclado normal (marca, letras)">ABC</button>'+
            '</div>'
          : '<button type="button" class="btn ghost small est-kp-toggle" data-kp="ON">🔢 Teclado numérico</button>')+
        '<div class="archive-list">'+
          (filtered.length
            ? filtered.map(estoqueRowHtml).join("")
            : '<div class="arow-empty">'+(list.length ? 'Nenhum item encontrado.' : 'Nenhuma medida cadastrada ainda. Use o botão “+ Cadastrar medida”.')+'</div>')+
        '</div>'+
      '</div>';

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });

    var search = document.getElementById("estSearch");
    if (search){
      search.addEventListener("input", function(){
        state.estoqueQuery = search.value;
        var pos = search.selectionStart;
        renderEstoque();
        var again = document.getElementById("estSearch");
        if (again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
      });
    }
    root.querySelectorAll("[data-kp]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-kp");
        var cur = state.estoqueQuery||"";
        if (k==="ON"){ state.estTeclado = true; renderEstoque(); return; }
        if (k==="ABC"){
          state.estTeclado = false; renderEstoque();
          var again = document.getElementById("estSearch");
          if (again) again.focus();
          return;
        }
        if (k==="BACK") state.estoqueQuery = cur.slice(0,-1);
        else if (k==="CLEAR") state.estoqueQuery = "";
        else state.estoqueQuery = cur + k;
        renderEstoque();
      });
    });

    function askQtd(mensagem){
      var v = window.prompt(mensagem, "1");
      if (v===null) return 0;
      var n = Math.floor(parseNum(v));
      return n>0 ? n : 0;
    }

    root.querySelectorAll("[data-est-in]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-in");
        var item = estoqueItem(id);
        if (!item) return;
        var n = askQtd("Quantas unidades ENTRARAM de "+estoqueLabel(item)+"?");
        if (n>0){
          var moved = moveEstoque(id, n);
          if (moved>0){
            addEstoqueLog("entrada", estoqueLabel(item), moved);
            checkProcuradosOnEntrada(item.medida);
          }
          renderEstoque();
        }
      });
    });
    root.querySelectorAll("[data-est-out]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-out");
        var item = estoqueItem(id);
        if (!item) return;
        var n = askQtd("Quantas unidades SAÍRAM de "+estoqueLabel(item)+"?");
        if (n>0){
          var moved = moveEstoque(id, -n);
          if (moved<0) addEstoqueLog("saida", estoqueLabel(item), Math.abs(moved));
          renderEstoque();
        }
      });
    });
    root.querySelectorAll("[data-est-custo]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-custo");
        var item = estoqueItem(id);
        if (!item) return;
        var atual = parseNum(item.custo);
        var v = window.prompt("Preço de custo por unidade de "+estoqueLabel(item)+" (R$):", atual>0 ? String(atual).replace(".",",") : "");
        if (v===null) return;
        var novo = Math.max(0, parseNum(v));
        if (novo===atual) return;
        updateEstoqueItem(id, {custo: novo});
        renderEstoque();
      });
    });
    root.querySelectorAll("[data-est-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.modal = {type:"estoqueForm", itemId: btn.getAttribute("data-est-edit"), error:""};
        renderModal();
      });
    });
    root.querySelectorAll("[data-est-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-del");
        var item = estoqueItem(id);
        if (!item) return;
        deleteEstoqueItemWithUndo(id, function(){ renderEstoque(); });
      });
    });
  }

            validade:"7", obs:"", desconto:"", items:[novoOrcItem(), novoOrcItem(), novoOrcItem()]};

  function loadOrcamentoDraft(){
    var o = lsGetJSON(K_ORCAMENTO, null);
    if (!o || !Array.isArray(o.items) || !o.items.length) return novoOrcamento();
    return o;
  }
  function saveOrcamentoDraft(){
    if (state.orcamento) lsSetJSON(K_ORCAMENTO, state.orcamento);
  }
  function nextOrcNumber(){
    var n = parseInt(localStorage.getItem(K_ORC_SEQ)||"0",10);
    if (isNaN(n)) n = 0;
    var next = n+1;
    try{ localStorage.setItem(K_ORC_SEQ, String(next)); }catch(e){}
    cloudPush(K_ORC_SEQ, next);
    return next;
  }
  function orcItemTotal(it){ return Math.max(0, parseNum(it.qty)) * parseNum(it.unit); }
  function orcTotals(o){
    var sub = 0;
    (o.items||[]).forEach(function(it){ sub += orcItemTotal(it); });
    var desc = parseNum(o.desconto);
    return {subtotal: sub, desconto: desc, total: Math.max(0, sub - desc)};
  }

  // ---------- orçamentos salvos (lista separada das notas) + PDF ----------
  function loadOrcamentos(){ var l = lsGetJSON(K_ORCAMENTOS, []); return Array.isArray(l) ? l : []; }
  function saveOrcamentos(list){ return lsSetJSON(K_ORCAMENTOS, list); }
  function orcItensValidos(o){
    return (o.items||[]).filter(function(it){ return (it.desc||"").trim() !== "" || orcItemTotal(it) > 0; });
  }
  // o número e a data de emissão ficam fixos desde a primeira vez que o orçamento é impresso, salvo ou baixado em PDF
  function orcGarantirNumero(o){
    if (!o.num){ o.num = nextOrcNumber(); o.createdAt = Date.now(); }
  }
  function orcClienteDe(o){
    var c = o.clienteId ? loadCustomers().filter(function(x){ return x.id===o.clienteId; })[0] : null;
    if (c) return c;
    if (o.clienteId && o.cliente) return o.cliente;
    return {nome: o.clienteNome, telefone: o.clienteTelefone};
  }
  function salvarOrcamentoAtual(){
    var o = state.orcamento;
    var itens = orcItensValidos(o);
    if (!itens.length){ alert("Adicione ao menos um item com descrição ou valor antes de salvar."); return null; }
    orcGarantirNumero(o);
    var cli = orcClienteDe(o);
    var cliSnap = {};
    try{ cliSnap = JSON.parse(JSON.stringify(cli||{})); }catch(e){}
    var list = loadOrcamentos();
    var idx = -1;
    if (o.savedId){ list.forEach(function(r, k){ if (r.id===o.savedId) idx = k; }); }
    var rec = {
      id: idx>-1 ? list[idx].id : uid(),
      num: o.num, createdAt: o.createdAt, updatedAt: Date.now(),
      clienteId: o.clienteId || "", cliente: cliSnap, clienteNome: cli.nome || "", clienteTelefone: cli.telefone || "",
      veiculo: o.veiculo || "", placa: o.placa || "", validade: o.validade, obs: o.obs || "", desconto: o.desconto || "",
      items: itens.map(function(it){ return {id: it.id, desc: it.desc, qty: it.qty, unit: it.unit}; }),
      total: orcTotals({items: itens, desconto: o.desconto}).total
    };
    if (idx>-1) list[idx] = rec; else list.push(rec);
    saveOrcamentos(list);
    o.savedId = rec.id;
    saveOrcamentoDraft();
    return rec;
  }
  function abrirOrcamentoSalvo(rec){
    var cust = rec.clienteId ? loadCustomers().filter(function(c){ return c.id===rec.clienteId; })[0] : null;
    var snap = rec.cliente || {};
    var itens = (rec.items||[]).map(function(it){ return {id: uid(), desc: it.desc||"", qty: it.qty, unit: it.unit}; });
    if (!itens.length) itens = [novoOrcItem()];
    state.orcamento = {
      clienteId: cust ? rec.clienteId : "", cliente: snap,
      clienteNome: cust ? "" : (snap.nome || rec.clienteNome || ""),
      clienteTelefone: cust ? "" : (snap.telefone || rec.clienteTelefone || ""),
      veiculo: rec.veiculo || "", placa: rec.placa || "", validade: rec.validade, obs: rec.obs || "", desconto: rec.desconto || "",
      items: itens, num: rec.num, createdAt: rec.createdAt, savedId: rec.id
    };
    saveOrcamentoDraft();
    state.orcReturn = "orcamentos";
    state.view = "orcamento";
    render();
  }
  function apagarOrcamentoSalvo(id){
    var list = loadOrcamentos();
    var rec = list.filter(function(r){ return r.id===id; })[0];
    if (!rec) return;
    if (!confirm("Apagar o orçamento #"+rec.num+(rec.clienteNome ? " de "+rec.clienteNome : "")+"? Isso não pode ser desfeito.")) return;
    saveOrcamentos(list.filter(function(r){ return r.id!==id; }));
    if (state.orcamento && state.orcamento.savedId===id){ delete state.orcamento.savedId; saveOrcamentoDraft(); }
    render();
  }

  // ---------- PDF do orçamento (mesmo layout da impressão) ----------
  function htmlParaPdfBlob(fullHtml, cb){
    if (!window.html2canvas || !window.jspdf){ cb(null); return; }
    var fr = document.createElement("iframe");
    fr.setAttribute("aria-hidden", "true");
    fr.style.cssText = "position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;background:#fff;";
    document.body.appendChild(fr);
    var doc = fr.contentDocument || fr.contentWindow.document;
    doc.open(); doc.write(fullHtml); doc.close();
    function limpar(){ if (fr.parentNode) fr.parentNode.removeChild(fr); }
    setTimeout(function(){
      window.html2canvas(doc.body, {scale:2, backgroundColor:"#ffffff"}).then(function(canvas){
        limpar();
        try{ cb(canvasToPdfBlob(canvas)); }catch(e){ console.error("Erro ao montar o PDF", e); cb(null); }
      }).catch(function(err){ limpar(); console.error("Erro ao gerar PDF", err); cb(null); });
    }, 200);
  }
  function baixarBlobComo(nome, blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }
  function orcBaixarPdf(o, btn){
    var itens = orcItensValidos(o);
    if (!itens.length){ alert("Este orçamento não tem itens."); return; }
    var cli = orcClienteDe(o);
    var html = buildOrcamentoHtml(o, itens, cli, o.num);
    var rotulo = btn ? btn.textContent : "";
    if (btn){ btn.disabled = true; btn.textContent = "Gerando PDF…"; }
    htmlParaPdfBlob(html, function(blob){
      if (btn){ btn.disabled = false; btn.textContent = rotulo; }
      if (!blob){
        alert("Não foi possível gerar o PDF agora (a biblioteca de PDF pode não ter carregado). Use 'Imprimir' e escolha 'Salvar como PDF'.");
        return;
      }
      var nomeCli = String((cli && cli.nome) || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 30);
      baixarBlobComo("Orcamento-"+o.num+(nomeCli ? "-"+nomeCli : "")+".pdf", blob);
      toast("PDF do orçamento #"+o.num+" baixado.");
    });
  }

  // ---------- tela: orçamentos salvos ----------
  function renderOrcamentos(){
    var all = loadOrcamentos().slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
    var q = (state.orcQuery||"").trim().toLowerCase();
    var filtered = q ? all.filter(function(r){
      return String(r.num).indexOf(q)>-1 ||
             (r.clienteNome||"").toLowerCase().indexOf(q)>-1 ||
             (r.veiculo||"").toLowerCase().indexOf(q)>-1 ||
             (r.placa||"").toLowerCase().indexOf(q)>-1;
    }) : all;
    var totalValor = filtered.reduce(function(a,r){ return a+parseNum(r.total); }, 0);
    var agora = Date.now();

    function vencimento(r){
      var dias = parseInt(r.validade,10); if (isNaN(dias) || dias<0) dias = 0;
      return new Date((r.createdAt||0) + dias*86400000);
    }
    function rowHtml(r){
      var d = new Date(r.createdAt);

  // ---------- tela: notas emitidas (todas, em ordem de emissão) ----------
  function csvEscape(v){
    var s = String(v===undefined||v===null?"":v);
    if (/[";\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function downloadTextFile(filename, content, mime){
    var blob = new Blob(["\uFEFF"+content], {type:(mime||"text/csv")+";charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function exportNotasCSV(list){
    var header = ["Número","Data","Hora","Cliente","Documento","Valor","Forma de pagamento","Status"];
    var lines = [header.map(csvEscape).join(";")];
    list.forEach(function(n){
      var d = new Date(n.createdAt);
      var hora = isNaN(d.getTime()) ? "" : pad(d.getHours())+":"+pad(d.getMinutes());
      lines.push([
        n.vendaNum, fmtDateBR(n.date), hora, (n.customer&&n.customer.nome)||"",
        customerDocLabel(n.customer||{}), parseNum(n.totalProdutos).toFixed(2).replace(".",","),
        n.formaPagamento||"", (n.pago==="✅"?"Pago":"Pendente")
      ].map(csvEscape).join(";"));
    });
    downloadTextFile("notas-"+today+".csv", lines.join("\r\n"));
  }

  // ======================= PNEUS DO MÊS: registro mensal (medida, qtd, preço, placa, carro) + fotos + PDF =======================
  // Linhas e lista de fotos ficam em "vo_regmes:AAAA-MM" (sincroniza entre aparelhos). As fotos em si (já reduzidas)
  // ficam só na nuvem, em "fotomes:AAAA-MM:<id>", para não encher o armazenamento do navegador.
  var regFotoCache = {}, regTimer = null;
  function regKey(m){ return K_REGMES + m; }
  function regCap(s){ s = String(s||""); return s.charAt(0).toUpperCase() + s.slice(1); }
  function regLoad(m){
    var r = lsGetJSON(regKey(m), null);
    if (!r || typeof r!=="object") r = {};
    if (!Array.isArray(r.linhas)) r.linhas = [];
    if (!Array.isArray(r.fotos)) r.fotos = [];
    return r;
  }
  function regSave(m, r){ return lsSetJSON(regKey(m), r); }
  function regSaveSoon(){
    clearTimeout(regTimer);
    var m = state.regMes, r = state.regData;
    regTimer = setTimeout(function(){ regTimer = null; regSave(m, r); }, 500);
  }
  function regFlush(){
    if (regTimer){ clearTimeout(regTimer); regTimer = null; if (state.regData) regSave(state.regMes, state.regData); }
  }
  function regTotais(d){
    var q = 0, v = 0;
    d.linhas.forEach(function(l){ q += parseNum(l.qtd); v += parseNum(l.preco); });
    return {linhas:d.linhas.length, qtd:q, valor:v};
  }
  function regAtualizaTotais(){
    var t = regTotais(state.regData);
    var a = document.getElementById("rmTotLinhas"), b = document.getElementById("rmTotQtd"), c = document.getElementById("rmTotValor");
    if (a) a.textContent = t.linhas; if (b) b.textContent = t.qtd; if (c) c.textContent = fmtCurrency(t.valor);

  // ---- fotos ----
  function fotoKey(m, id){ return K_FOTOMES + m + ":" + id; }
  function fotoSalvar(m, id, dataUrl){
    if (!sb) return Promise.reject(new Error("As fotos ficam guardadas na nuvem: configure o Supabase para anexar imagens."));
    return sb.from("kv_store").upsert({key:fotoKey(m,id), value:{d:dataUrl}, updated_at:new Date().toISOString()}).then(function(res){
      if (res && res.error) throw new Error(res.error.message || "A nuvem recusou a foto.");
    });
  }
  function fotoCarregar(m, id){
    var k = fotoKey(m, id);
    if (regFotoCache[k]) return Promise.resolve(regFotoCache[k]);
    if (!sb) return Promise.reject(new Error("Sem nuvem."));
    return sb.from("kv_store").select("value").eq("key", k).limit(1).then(function(res){
      var row = res && res.data && res.data[0];
      if (!row || !row.value || !row.value.d) throw new Error("Foto não encontrada.");
      regFotoCache[k] = row.value.d;
      return row.value.d;
    });
  }
  // reduz a foto (máx. 1280 px, JPEG) antes de enviar: fica leve e cabe bem no PDF
  function regComprimir(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var MAX = 1280, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, MAX/Math.max(w,h));
        var c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w*s)); c.height = Math.max(1, Math.round(h*s));
        var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);
        res({d:c.toDataURL("image/jpeg",0.72), w:c.width, h:c.height});
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("não consegui ler a imagem "+file.name)); };
      img.src = url;
    });
  }
  function regAddFotos(files){
    var m = state.regMes, dados = state.regData;
    var lista = Array.prototype.slice.call(files||[]).filter(function(f){ return /^image\//.test(f.type); });
    if (!lista.length) return;
    state.regBusy = "Enviando fotos…"; renderRegMes();
    var seq = Promise.resolve();
    lista.forEach(function(f){
      seq = seq.then(function(){
        return regComprimir(f).then(function(img){
          var id = uid();
          return fotoSalvar(m, id, img.d).then(function(){
            regFotoCache[fotoKey(m,id)] = img.d;
            dados.fotos.push({id:id, nome:f.name, w:img.w, h:img.h, ts:Date.now()});
          });
        }).catch(function(e){ alert("Foto não enviada: "+((e && e.message) || e)); });
      });
    });
    seq.then(function(){
      regSave(m, dados);
      state.regBusy = "";
      if (state.view==="regmes") renderRegMes();
    });
  }
  function regApagarFoto(m, dados, id){
    dados.fotos = dados.fotos.filter(function(f){ return f.id!==id; });
    regSave(m, dados);
    delete regFotoCache[fotoKey(m,id)];
    if (sb) sb.from("kv_store").delete().eq("key", fotoKey(m,id)).then(function(){}, function(){});
  }
  function regAbrirFoto(m, id){
    fotoCarregar(m, id).then(function(du){
      var o = document.createElement("div"); o.className = "rm-lightbox";
      var im = document.createElement("img"); im.src = du; im.alt = "";
      o.appendChild(im); o.addEventListener("click", function(){ o.remove(); });
      document.body.appendChild(o);
    }).catch(function(){ alert("Não foi possível abrir esta foto."); });
  }

  // ---- PDF do mês: tabela + todas as fotos anexadas ----
  function regExportarPDF(){
    var mes = state.regMes, d = state.regData;
    if (!window.jspdf || !window.jspdf.jsPDF){ alert("O gerador de PDF não carregou. Confira a internet e tente de novo."); return; }
    if (!d.linhas.length && !d.fotos.length){ alert("Este mês ainda não tem linhas nem fotos para exportar."); return; }
    regFlush();
    state.regBusy = "Montando o PDF…"; renderRegMes();
    var imgs = [], p = Promise.resolve();
    d.fotos.forEach(function(f){
      p = p.then(function(){
        return fotoCarregar(mes, f.id).then(function(du){ imgs.push({f:f, d:du}); }, function(){ imgs.push({f:f, d:null}); });
      });
    });
    p.then(function(){
      var pdf = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
      var PW = pdf.internal.pageSize.getWidth(), PH = pdf.internal.pageSize.getHeight(), M = 40, y = M;
      function num(n){ return n.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2}); }
      function cortar(txt, w){ var s = pdf.splitTextToSize(String(txt||""), w); return s.length ? s[0] : ""; }
      var cols = [{t:"#",w:26,a:"c"},{t:"Medida",w:112},{t:"Qtd",w:46,a:"r"},{t:"Preço (R$)",w:86,a:"r"},{t:"Placa",w:76},{t:"Carro",w:PW-2*M-26-112-46-86-76}];
      function celula(txt, x, yy, c){
        var tx = x+5, opt = {};
        if (c.a==="r"){ tx = x+c.w-5; opt.align = "right"; } else if (c.a==="c"){ tx = x+c.w/2; opt.align = "center"; }
        pdf.text(cortar(txt, c.w-10), tx, yy+13.5, opt);
      }
      function cabecalhoTabela(){
        var x = M;
        pdf.setFillColor(235,235,235); pdf.rect(M, y, PW-2*M, 20, "F");
        pdf.setFont("helvetica","bold"); pdf.setFontSize(9); pdf.setTextColor(40);
        cols.forEach(function(c){ celula(c.t, x, y, c); x += c.w; });
        y += 20;
        pdf.setFont("helvetica","normal"); pdf.setFontSize(9.5); pdf.setTextColor(20);
      }
      pdf.setFont("helvetica","bold"); pdf.setFontSize(15); pdf.setTextColor(20);
      pdf.text(EMPRESA.nome, M, y+12);
      pdf.setFont("helvetica","normal"); pdf.setFontSize(11); pdf.setTextColor(80);
      pdf.text("Registro de pneus - "+regCap(monthLabel(mes)), M, y+30);
      pdf.setFontSize(9);
      pdf.text("Gerado em "+fmtDateTimeBR(new Date().toISOString()).replace(" às "," "), PW-M, y+12, {align:"right"});
      y += 46;
      cabecalhoTabela();
      var totQ = 0, totV = 0;
      d.linhas.forEach(function(l, i){
        if (y+20 > PH-M){ pdf.addPage(); y = M; cabecalhoTabela(); }
        var q = parseNum(l.qtd), v = parseNum(l.preco); totQ += q; totV += v;
        var vals = [String(i+1), l.medida, (l.qtd===""||l.qtd===undefined) ? "" : String(q), v ? num(v) : "", String(l.placa||"").toUpperCase(), l.carro];
        var x = M;
        cols.forEach(function(c, ci){ celula(vals[ci], x, y, c); x += c.w; });
        pdf.setDrawColor(215); pdf.line(M, y+20, PW-M, y+20);
        y += 20;
      });
      if (!d.linhas.length){ pdf.setTextColor(120); pdf.text("Nenhuma linha neste mês.", M+5, y+14); y += 22; }
      else {
        if (y+26 > PH-M){ pdf.addPage(); y = M; }
        pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.setTextColor(20);
        var xT = M+26+112;
        pdf.text("TOTAL", xT-5, y+17, {align:"right"});
        pdf.text(String(totQ), xT+46-5, y+17, {align:"right"});
        pdf.text("R$ "+num(totV), xT+46+86-5, y+17, {align:"right"});
        y += 26;
      }
      if (imgs.length){
        pdf.addPage(); y = M;
        pdf.setFont("helvetica","bold"); pdf.setFontSize(12); pdf.setTextColor(20);
        pdf.text("Fotos anexadas ("+imgs.length+") - "+regCap(monthLabel(mes)), M, y+12);
        y += 28;
        var gap = 14, cw = (PW-2*M-gap)/2, chMax = 300;
        for (var i=0; i<imgs.length; i+=2){
          var par = [imgs[i], imgs[i+1]].filter(Boolean);
          var dims = par.map(function(it){
            var w = it.f.w || 800, h = it.f.h || 600, s = Math.min(cw/w, chMax/h);
            return {iw:w*s, ih:h*s};
          });
          var rowH = Math.max.apply(null, dims.map(function(z){ return z.ih; })) + 18;
          if (y+rowH > PH-M){ pdf.addPage(); y = M; }
          par.forEach(function(it, k){
            var x0 = M + k*(cw+gap);
            if (it.d){ try{ pdf.addImage(it.d, "JPEG", x0+(cw-dims[k].iw)/2, y, dims[k].iw, dims[k].ih); }catch(e){} }
            else { pdf.setFont("helvetica","normal"); pdf.setFontSize(9); pdf.setTextColor(150); pdf.text("(foto indisponível)", x0, y+12); }
            pdf.setFont("helvetica","normal"); pdf.setFontSize(8); pdf.setTextColor(110);
            pdf.text(cortar(it.f.nome||"", cw), x0, y+dims[k].ih+11);
          });
          y += rowH + 6;
        }
      }
      pdf.save("pneus-"+mes+".pdf");
    }).catch(function(e){
      alert("Não foi possível gerar o PDF: "+((e && e.message) || e));
    }).then(function(){
      state.regBusy = "";
      if (state.view==="regmes") renderRegMes();
    });
  }

  function renderEstoqueFormModal(){
    var item = state.modal.itemId ? estoqueItem(state.modal.itemId) : null;

      if (state.modal.returnTo==="selectMedida"){

      } else {

      }

    }

        var antes = Math.max(0, parseNum(item.quantidade));
        var depois = Math.max(0, parseNum(dados.quantidade));
        updateEstoqueItem(item.id, dados);
        var diff = depois - antes;
        if (diff !== 0) addEstoqueLog("ajuste", estoqueLabel({medida:medida, marca:dados.marca}), diff);

              '</div>'
            : '<div class="cust-empty" style="margin-bottom:12px;">Nenhuma medida cadastrada no estoque ainda.</div>')+
          '<label>Quantidade</label><input type="text" inputmode="numeric" id="grQtd" placeholder="1" value="'+escAttr(state.modal.qtd||"")+'">'+
        '</div>'+
        '<div class="err">'+escHtml(state.modal.error||"")+'</div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="grCancel">Cancelar</button>'+
          '<button class="btn primary small" id="grSave">Dar baixa</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);

    var selectedId = selecionado;

    div.querySelectorAll(".cust-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedId = btn.getAttribute("data-mid");
        state.modal.medidaId = selectedId;
        div.querySelectorAll(".cust-item").forEach(function(b){ b.classList.remove("sel"); });
        btn.classList.add("sel");
        var selDiv = document.getElementById("grMedSel");
        if (selDiv){
          var item = estoqueItem(selectedId);
          selDiv.innerHTML = item ? 'Selecionada: <b style="color:var(--text);">'+escHtml(estoqueLabel(item))+'</b>' : 'Nenhuma medida selecionada';
        }
      });
    });

    var searchInput = document.getElementById("grMedSearch");
    if (searchInput){
      searchInput.addEventListener("input", function(){
        var q = searchInput.value.trim().toLowerCase();
        div.querySelectorAll(".cust-item").forEach(function(btn){
          var hay = btn.getAttribute("data-search")||"";
          btn.style.display = (!q || hay.indexOf(q)>-1) ? "" : "none";
        });
      });
      searchInput.focus();
    } else {
      var qtdInput = document.getElementById("grQtd");
      if (qtdInput) qtdInput.focus();
    }

    function goBack(){ state.modal = null; render(); }
    document.getElementById("grCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });

    var saveBtn = document.getElementById("grSave");
    if (saveBtn){
      saveBtn.addEventListener("click", function(){
        var id = selectedId;
        var item = id ? estoqueItem(id) : null;
        var qtd = Math.floor(parseNum(document.getElementById("grQtd").value));
        state.modal.qtd = document.getElementById("grQtd").value;
        if (!item){
          state.modal.error = "Escolha a medida do pneu.";
          renderModal();
          return;
        }
        if (!qtd || qtd<=0){
          state.modal.error = "Informe uma quantidade válida.";
          renderModal();
          return;
        }
        var atual = Math.max(0, parseNum(item.quantidade));
        if (qtd > atual && !window.confirm("O estoque de "+estoqueLabel(item)+" tem só "+atual+" un. disponível(is). Baixar mesmo assim (o estoque vai zerar)?")){
          return;
        }
        var moved = moveEstoque(id, -qtd);
        if (moved<0) addEstoqueLog("saida", estoqueLabel(item)+" (Garantia)", Math.abs(moved));
        state.modal = null;
        render();
      });
    }
  }

  function renderCreditoModal(){
    var row = findTblRow(state.modal.rowId);

    var total = computeValor(row);
    var deb = row.formaPagamento==="Débito";
    var selS = "width:100%;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px;";
    var div = document.createElement("div");
    div.className = "overlay";
    div.innerHTML =
      '<div class="modal">'+
        '<h3>💳 '+(deb?'Débito — maquininha':'Crédito — maquininha e parcelas')+'</h3>'+
        '<p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">Valor no '+(deb?'débito':'crédito')+': <b style="color:var(--text);">'+fmtCurrency(total)+'</b></p>'+
        '<div class="field-group"><label>Maquininha</label><select id="crMaq" style="'+selS+'">'+maqOptsHtml(row.maquininha)+'</select></div>'+

        '<div id="crResumo" style="font-size:12.5px;margin:6px 2px 12px;"></div>'+

      '</div>';
    document.body.appendChild(div);
    function atual(){ return {maquininha: div.querySelector("#crMaq").value, parcelas: deb ? 1 : (parseInt(div.querySelector("#crPar").value,10)||1)}; }
    function resumo(){
      var a = atual(), pct = pctMaq(a.maquininha, deb?"Débito":"Crédito", a.parcelas), tx = Math.round(total*pct)/100;
      if (!descontaTaxas(isNovosTbl())){
        div.querySelector("#crResumo").innerHTML = '<span style="color:var(--text-dim);">O master desligou o desconto das taxas nesta tabela.</span>';
        return;
      }
      div.querySelector("#crResumo").innerHTML = pct>0
        ? 'Taxa de <b>'+String(pct).replace(".",",")+'%</b>: <span style="color:var(--red);">-'+fmtCurrency(tx)+'</span> · líquido <b>'+fmtCurrency(Math.max(0,total-tx))+'</b>'
        : '<span style="color:var(--text-dim);">Sem taxa cadastrada para '+(deb?'o débito dessa maquininha':'essa combinação')+' (o master define em 💳 Taxas).</span>';
    }
    resumo();
    div.querySelector("#crMaq").addEventListener("change", resumo);
    if (!deb) div.querySelector("#crPar").addEventListener("change", resumo);
    function fechar(){ state.modal = null; render(); }
    div.querySelector("#crCancel").addEventListener("click", fechar);
    div.addEventListener("click", function(e){ if (e.target===div) fechar(); });
    div.querySelector("#crSave").addEventListener("click", function(){
      var a = atual();
      row.maquininha = a.maquininha; if (deb) delete row.parcelas; else row.parcelas = a.parcelas; snapshotTaxa(row, deb?"Débito":"Crédito");
      state.modal = null; render(); scheduleSave();
    });
  }

  // ---------- modal: dividir o pagamento entre até 4 formas ----------
  function renderMultiPagModal(){
    var rowId = state.modal.rowId;
    var row = findTblRow(rowId);
    if (!row){ state.modal = null; render(); return; }
    var total = computeValor(row);
    var existentes = Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos.slice() : [];
    if (existentes.length===0){
      existentes = [{metodo:"Dinheiro", valor: total}];
    }
    while (existentes.length < 4) existentes.push({metodo:"Nenhum", valor:""});
    existentes = existentes.slice(0,4);

    var div = document.createElement("div");
    div.className = "overlay";
    var opcoesMetodo = ["Nenhum"].concat(METODOS_PAGAMENTO);
    var linhasHtml = existentes.map(function(p, i){
      var selOpts = opcoesMetodo.map(function(m){
        return '<option value="'+m+'"'+(p.metodo===m?" selected":"")+'>'+m+'</option>';
      }).join("");
      var credStyle = "flex:1;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px;";
      return '<div class="mpLinha" style="margin-bottom:8px;"><div style="display:flex;gap:8px;">'+
        '<select class="mpMetodo" data-idx="'+i+'" style="flex:1.2;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px;">'+selOpts+'</select>'+
        '<input type="text" inputmode="decimal" class="mpValor" data-idx="'+i+'" placeholder="0,00" value="'+escAttr(p.valor!==""&&p.valor!==undefined&&p.valor!==null?parseNum(p.valor):"")+'" style="flex:1;">'+
      '</div>'+
        '<div class="mpCred" style="display:'+((p.metodo==="Crédito"||p.metodo==="Débito")?"flex":"none")+';gap:8px;margin-top:6px;">'+
          '<select class="mpMaq" style="'+credStyle+'">'+maqOptsHtml(p.maquininha)+'</select>'+
          '<select class="mpPar" style="'+credStyle+(p.metodo==="Débito"?'display:none;':'')+'">'+parOptsHtml(p.parcelas)+'</select>'+
        '</div></div>';
    }).join("");

    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>Dividir pagamento (até 4 formas)</h3>'+
        '<p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">Total da venda: <b style="color:var(--text);">'+fmtCurrency(total)+'</b></p>'+
        '<div id="mpLinhas">'+linhasHtml+'</div>'+
        '<div id="mpResumo" style="font-size:12.5px;color:var(--text-dim);margin:6px 2px 12px;"></div>'+
        '<div class="err">'+escHtml(state.modal.error||"")+'</div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="mpCancel">Voltar</button>'+
          '<button class="btn primary small" id="mpSave">Salvar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);

    function lerValores(){
      var metodos = div.querySelectorAll(".mpMetodo");
      var valores = div.querySelectorAll(".mpValor");
      var lista = [];
      for (var i=0;i<metodos.length;i++){
        var m = metodos[i].value;
        var v = parseNum(valores[i].value);
        if (m!=="Nenhum" && v>0){
          var it = {metodo:m, valor:v};
          if (m==="Crédito" || m==="Débito"){
            var ln = metodos[i].closest(".mpLinha");
            it.maquininha = ln.querySelector(".mpMaq").value;
            if (m==="Crédito") it.parcelas = parseInt(ln.querySelector(".mpPar").value,10)||1;
            snapshotTaxa(it, m);
          }
          lista.push(it);
        }
      }
      return lista;
    }
    function atualizarResumo(){
      var lista = lerValores();
      var soma = lista.reduce(function(s,p){ return s+p.valor; }, 0);
      var resumo = document.getElementById("mpResumo");
      var diff = total - soma;
      if (!resumo) return;
      if (Math.abs(diff) < 0.005){
        resumo.innerHTML = '<span style="color:var(--green);">Soma bate certinho com o total (' + fmtCurrency(soma) + ').</span>';
      } else if (diff > 0){
        resumo.innerHTML = 'Soma atual: '+fmtCurrency(soma)+' — <span style="color:var(--yellow);">ainda falta '+fmtCurrency(diff)+'</span>';
      } else {
        resumo.innerHTML = 'Soma atual: '+fmtCurrency(soma)+' — <span style="color:var(--red);">passou '+fmtCurrency(-diff)+' do total</span>';
      }
    }
    atualizarResumo();
    div.querySelectorAll(".mpMetodo").forEach(function(el){
      el.addEventListener("change", function(){
        var ln = el.closest(".mpLinha");
        ln.querySelector(".mpCred").style.display = (el.value==="Crédito" || el.value==="Débito") ? "flex" : "none";
        ln.querySelector(".mpPar").style.display = el.value==="Débito" ? "none" : "";
      });
    });
    div.querySelectorAll(".mpMetodo, .mpValor").forEach(function(el){
      el.addEventListener("input", atualizarResumo);
      el.addEventListener("change", atualizarResumo);
    });

    function goBack(){ state.modal = null; render(); }
    document.getElementById("mpCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });
    document.getElementById("mpSave").addEventListener("click", function(){
      var lista = lerValores();
      if (lista.length===0){
        state.modal.error = "Escolha ao menos uma forma de pagamento com um valor maior que zero.";
        renderModal();
        return;
      }
      var soma = lista.reduce(function(s,p){ return s+p.valor; }, 0);
      if (Math.abs(soma-total) > 0.01){
        if (!window.confirm("A soma das formas de pagamento (" + fmtCurrency(soma) + ") é diferente do total da venda (" + fmtCurrency(total) + "). Quer salvar assim mesmo?")) return;
      }
      row.formaPagamento = "Múltiplo (até 4 formas)";
      row.pagamentosMultiplos = lista;
      state.modal = null;
      render();
      scheduleSave();
    });
  }

  // ---------- modal: "Outros" — vários itens: o que foi, valor e quem fez (soma no card da pessoa) ----------
  function renderOutrosFormModal(){
    var row = findTblRow(state.modal.rowId);
    if (!row){ state.modal = null; render(); return; }
    var lista;
    var destinos = {"Renan":"Cambagem","Wesley":"Bicos","João":"Rodas"};
    var descAntiga = row.outrosDescricao ? String(row.outrosDescricao).trim() : "";
    if (Array.isArray(row.outrosLista) && row.outrosLista.length){
      lista = row.outrosLista.map(function(o){ return {nome:o.nome||"", valor:o.valor, pessoa:o.pessoa||"", split:(Array.isArray(o.split)&&o.split.length ? o.split.map(function(q){return {pessoa:q.pessoa,valor:q.valor};}) : null)}; });
    } else if (Array.isArray(row.outrosSplit) && row.outrosSplit.length){
      lista = row.outrosSplit.map(function(o){ return {nome:descAntiga, valor:parseNum(o.valor), pessoa:o.pessoa||""}; });
    } else if (parseNum(row.outros)>0 || descAntiga){
      lista = [{nome:descAntiga, valor: parseNum(row.outros)>0 ? parseNum(row.outros) : "", pessoa:""}];
    } else {
      lista = [{nome:"", valor:"", pessoa:"", split:null}];
    }
    var div = document.createElement("div");
    div.className = "overlay";
    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>Serviço desta venda</h3>'+
        '<p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">Informe o que foi, o valor e quem fez. Se o serviço foi feito por mais de uma pessoa, use "÷ Dividir" e coloque o valor de cada uma (até 3). A soma vai para o campo "Serviço" e cada valor soma no card de quem fez (Renan → Cambagem, Wesley → Bicos, João → Rodas). Na nota sai só o serviço normal, sem a divisão.</p>'+
        '<div id="otLinhas"></div>'+
        '<button class="btn ghost small" id="otAdd" style="margin:4px 0 10px;">+ Adicionar serviço</button>'+
        '<div id="otResumo" style="font-size:12.5px;color:var(--text-dim);margin:6px 2px 12px;"></div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="otCancel">Voltar</button>'+
          '<button class="btn primary small" id="otSave">Salvar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);
    var box = div.querySelector("#otLinhas");
    var pessoasOpts = function(sel){
      return '<option value="">Sem pessoa</option>'+MAODEOBRA_PESSOAS.map(function(pp){ return '<option value="'+escAttr(pp)+'"'+(pp===sel?' selected':'')+'>'+escHtml(pp)+'</option>'; }).join("");
    };
    function lerDosCampos(){
      var out = [];
      box.querySelectorAll(".otLinha").forEach(function(ln){
        var nome = ln.querySelector(".otNome").value;
        if (ln.getAttribute("data-split")==="1"){
          var partes = [], soma = 0;
          ln.querySelectorAll(".otSp").forEach(function(inp){
            partes.push({pessoa: inp.getAttribute("data-p"), valor: inp.value});
            soma += parseNum(inp.value);
          });
          out.push({nome: nome, valor: soma>0 ? soma : "", pessoa:"", split: partes});
        } else {
          out.push({nome: nome, valor: ln.querySelector(".otValor").value, pessoa: ln.querySelector(".otPessoa").value, split:null});
        }
      });
      return out;
    }
    function resumo(){
      var itens = lerDosCampos(), soma = 0, porPessoa = {};
      itens.forEach(function(o){
        if (o.split){
          o.split.forEach(function(q){ var v = parseNum(q.valor); soma += v; if (v>0) porPessoa[q.pessoa] = (porPessoa[q.pessoa]||0) + v; });
          return;
        }
        var v = parseNum(o.valor); soma += v;
        if (o.pessoa && v>0) porPessoa[o.pessoa] = (porPessoa[o.pessoa]||0) + v;
      });
      var pp = Object.keys(porPessoa).map(function(k){ return escHtml(k)+' '+fmtCurrency(porPessoa[k]); }).join(' · ');
      div.querySelector("#otResumo").innerHTML = 'Total de "Serviço": <b style="color:var(--text);">'+fmtCurrency(soma)+'</b>'+(pp ? '<br>Por pessoa: '+pp : '');
    }
    function fmtCampo(v){ return v!=="" && v!==undefined && v!==null ? String(v).replace(".",",") : ""; }
    function desenhar(){
      box.innerHTML = lista.map(function(o,i){
        var nomeInp = '<input type="text" class="otNome" placeholder="O que foi (ex: troca de válvula, frete...)" value="'+escAttr(o.nome)+'" style="flex:1 1 0;min-width:0;">';
        var del = '<button class="icon-btn otDel" data-i="'+i+'" title="Remover item" style="flex:0 0 auto;">✕</button>';
        var dividirBtn = '<button class="btn ghost small otDiv" data-i="'+i+'" title="'+(o.split?'Voltar para uma pessoa só':'Dividir o valor entre até 3 pessoas')+'" style="flex:0 0 auto;white-space:nowrap;">'+(o.split?'Uma pessoa':'÷ Dividir')+'</button>';
        var topo = '<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">'+nomeInp+dividirBtn+del+'</div>';
        var cx = 'margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-soft);';
        if (o.split){
          var campos = MAODEOBRA_PESSOAS.map(function(pp){
            var ex = o.split.filter(function(q){ return q.pessoa===pp; })[0];
            return '<div style="flex:1 1 0;min-width:0;"><label style="display:block;font-size:13px;color:var(--text-dim);margin:0 0 3px;">'+escHtml(pp)+'</label>'+
                   '<input type="text" inputmode="decimal" class="otSp" data-p="'+escAttr(pp)+'" placeholder="0,00" value="'+escAttr(fmtCampo(ex?ex.valor:""))+'" style="width:100%;margin:0;"></div>';
          }).join("");
          return '<div class="otLinha" data-split="1" style="'+cx+'">'+topo+'<div style="display:flex;gap:10px;">'+campos+'</div></div>';
        }
        return '<div class="otLinha" data-split="0" style="'+cx+'">'+topo+
          '<div style="display:flex;gap:10px;">'+
            '<input type="text" inputmode="decimal" class="otValor" placeholder="Valor 0,00" value="'+escAttr(fmtCampo(o.valor))+'" style="flex:1 1 0;min-width:0;margin:0;">'+
            '<select class="otPessoa" style="flex:1 1 0;min-width:0;" title="Quem fez (opcional)">'+pessoasOpts(o.pessoa)+'</select>'+
          '</div></div>';
      }).join("");
      box.querySelectorAll(".otValor,.otNome,.otSp").forEach(function(el){ el.addEventListener("input", resumo); });
      box.querySelectorAll(".otPessoa").forEach(function(el){ el.addEventListener("change", resumo); });
      box.querySelectorAll(".otDiv").forEach(function(b){
        b.addEventListener("click", function(){
          lista = lerDosCampos();
          var i = parseInt(b.getAttribute("data-i"),10), o = lista[i];
          if (o.split){
            o.split = null; // volta para uma pessoa só (o valor total é mantido)
          } else {
            var v = o.valor, pe = o.pessoa;
            o.split = MAODEOBRA_PESSOAS.map(function(pp){ return {pessoa:pp, valor:(pe===pp ? v : "")}; });
            o.pessoa = "";
          }
          desenhar();
        });
      });
      box.querySelectorAll(".otDel").forEach(function(b){
        b.addEventListener("click", function(){
          lista = lerDosCampos();
          lista.splice(parseInt(b.getAttribute("data-i"),10),1);
          if (!lista.length) lista.push({nome:"", valor:"", pessoa:"", split:null});
          desenhar();
        });
      });
      resumo();
    }
    desenhar();
    div.querySelector("#otAdd").addEventListener("click", function(){
      lista = lerDosCampos();
      lista.push({nome:"", valor:"", pessoa:"", split:null});
      desenhar();
      var nomes = box.querySelectorAll(".otNome");
      if (nomes.length) nomes[nomes.length-1].focus();
    });
    function goBack(){ state.modal = null; render(); }
    div.querySelector("#otCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });
    div.querySelector("#otSave").addEventListener("click", function(){
      var final = lerDosCampos().map(function(o){
          var item = {nome:String(o.nome||"").trim(), valor:parseNum(o.valor), pessoa:o.pessoa||""};
          if (o.split){
            var partes = o.split.map(function(q){ return {pessoa:q.pessoa, valor:parseNum(q.valor)}; }).filter(function(q){ return q.valor>0; });
            if (partes.length){ item.split = partes; item.pessoa = ""; }
          }
          return item;
        }).filter(function(o){ return o.nome || o.valor>0; });
      delete row.outrosSplit; // a divisão agora fica em cada item
      if (final.length){
        row.outrosLista = final;
        var soma = final.reduce(function(sm,o){ return sm+o.valor; }, 0);
        row.outros = soma>0 ? soma.toFixed(2).replace(".",",") : "";
        var nomes = final.map(function(o){ return o.nome; }).filter(Boolean);
        if (nomes.length) row.outrosDescricao = nomes.join(", "); else delete row.outrosDescricao;
      } else {
        delete row.outrosLista;
        delete row.outrosDescricao;
      }
      state.modal = null;
      render();
      scheduleSave();
    });
  }

  // ---------- modal: dar desconto numa venda, escolhendo de qual campo ele sai ----------
  // ---------- modal: vincular vendas do mesmo cliente (uma nota e uma garantia só) ----------
  function renderLinkSalesModal(){
    var row = findTblRow(state.modal.rowId);
    if (!row){ state.modal = null; render(); return; }
    var outras = tblRows().filter(function(r){ return r.id!==row.id; });
    var atuais = groupRows(row).map(function(r){ return r.id; });
    var listHtml = outras.length ? outras.map(function(r){
      var cli = customerNameById(r.clienteId);
      return '<label class="cust-item" style="display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left;">'+
        '<input type="checkbox" data-lsid="'+escAttr(r.id)+'"'+(atuais.indexOf(r.id)>-1?' checked':'')+' style="width:auto;margin:0;flex:0 0 auto;">'+
        '<span style="flex:1;min-width:0;display:flex;flex-direction:column;">'+
          '<span class="cust-name">'+escHtml(rowResumo(r))+'</span>'+
          '<span class="cust-sub">'+fmtCurrency(computeValor(r))+(cli?' · '+escHtml(cli):'')+'</span>'+
        '</span></label>';
    }).join("") : '<div class="cust-empty">Não há outras vendas neste dia. Adicione a outra linha (por exemplo, o outro carro) e volte aqui.</div>';
    var div = document.createElement("div");
    div.className = "overlay";
    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>🔗 Vincular vendas do mesmo cliente</h3>'+
        '<p>Venda atual: <b style="color:var(--text);">'+escHtml(rowResumo(row))+'</b><br>Marque as outras linhas que são do mesmo cliente (ex.: uma linha por carro). Ao imprimir, sai <b>uma nota e uma garantia só</b> com tudo.</p>'+
        '<div class="cust-list" style="max-height:260px;">'+listHtml+'</div>'+
        '<div class="modal-actions" style="margin-top:14px;">'+
          '<button class="btn ghost small" id="lsCancel">Cancelar</button>'+
          '<button class="btn primary small" id="lsSave">Salvar vínculo</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);
    function close(){ state.modal = null; render(); }
    document.getElementById("lsCancel").addEventListener("click", close);
    div.addEventListener("click", function(e){ if (e.target===div) close(); });
    document.getElementById("lsSave").addEventListener("click", function(){
      var marcados = [];
      div.querySelectorAll("[data-lsid]").forEach(function(c){ if (c.checked) marcados.push(c.getAttribute("data-lsid")); });
      var antes = groupRows(row);
      var novos = [row].concat(outras.filter(function(r){ return marcados.indexOf(r.id)>-1; }));
      var envolvidos = {};
      novos.forEach(function(r){ if (r.grupoId) envolvidos[r.grupoId] = true; });
      // quem estava vinculado e foi desmarcado sai do grupo
      antes.forEach(function(r){ if (novos.indexOf(r)===-1) delete r.grupoId; });
      if (novos.length<2){
        novos.forEach(function(r){ delete r.grupoId; });
      } else {
        var gid = row.grupoId || (novos.filter(function(r){ return r.grupoId; })[0]||{}).grupoId || uid();
        // se juntou com outro grupo já existente, o grupo inteiro entra
        tblRows().forEach(function(r){ if (r.grupoId && envolvidos[r.grupoId]) r.grupoId = gid; });
        novos.forEach(function(r){ r.grupoId = gid; });
        // o cliente da compra vale para todas as linhas do grupo
        var cid = novos.map(function(r){ return r.clienteId; }).filter(Boolean)[0];
        if (cid) novos.forEach(function(r){ if (!r.clienteId) r.clienteId = cid; });
      }
      state.modal = null;
      render();
      scheduleSave();
    });
  }

  function renderDescontoFormModal(){

    function lerLinhas(){
      var vs = div.querySelectorAll("[data-dsc-valor]"), os = div.querySelectorAll("[data-dsc-origem]");
      for (var k=0;k<linhas.length;k++){
        if (vs[k]) linhas[k].valor = vs[k].value;
        if (os[k]) linhas[k].origem = os[k].value;

    }
    function atualizarResumo(){
      lerLinhas();
      var tot = 0;
      linhas.forEach(function(l){ tot += Math.max(0, parseNum(l.valor)); });
      g("dscResumo").innerHTML = 'Total de descontos: <b style="color:var(--red);">-'+fmtCurrency(tot)+'</b><br>Total final da venda: <b style="color:var(--text);">'+fmtCurrency(Math.max(0, subtotal-tot))+'</b>';
    }
    function desenharLinhas(){
      g("dscLinhas").innerHTML = linhas.map(function(l, idx){
        var opts = DESCONTO_ORIGENS.map(function(o){
          return '<option value="'+escAttr(o.key)+'"'+(o.key===l.origem?' selected':'')+'>'+escHtml(o.label)+'</option>';
        }).join("");
        return '<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;">'+
          '<div style="flex:0 0 120px;"><label style="font-size:11px;">Valor (R$)</label>'+
            '<input type="text" inputmode="decimal" data-dsc-valor placeholder="0,00" style="margin-bottom:0;" value="'+escAttr(l.valor!==""&&l.valor!==undefined&&l.valor!==null?parseNum(l.valor):"")+'"></div>'+
          '<div style="flex:1;min-width:0;"><label style="font-size:11px;">Sai de</label>'+
            '<select data-dsc-origem style="margin-bottom:0;">'+opts+'</select></div>'+
          (linhas.length>1 ? '<button class="icon-btn" data-dsc-del="'+idx+'" title="Tirar este desconto" style="margin-top:20px;">✕</button>' : '')+
        '</div>';
      }).join("");
      div.querySelectorAll("[data-dsc-valor]").forEach(function(n){ n.addEventListener("input", atualizarResumo); });
      div.querySelectorAll("[data-dsc-origem]").forEach(function(n){ n.addEventListener("change", atualizarResumo); });
      div.querySelectorAll("[data-dsc-del]").forEach(function(b){
        b.addEventListener("click", function(){
          lerLinhas();
          linhas.splice(parseInt(b.getAttribute("data-dsc-del"),10), 1);
          desenharLinhas();
        });
      });
      atualizarResumo();
    }
    desenharLinhas();
    var primeiro = div.querySelector("[data-dsc-valor]"); if (primeiro) primeiro.focus();
    g("dscAdd").addEventListener("click", function(){
      lerLinhas();
      // sugere o próximo campo ainda não usado
      var usados = linhas.map(function(l){ return l.origem; });
      var livre = DESCONTO_ORIGENS.filter(function(o){ return usados.indexOf(o.key)===-1; })[0];
      linhas.push({origem: (livre||DESCONTO_ORIGENS[0]).key, valor: ""});
      desenharLinhas();
      var vs = div.querySelectorAll("[data-dsc-valor]"); if (vs.length) vs[vs.length-1].focus();
    });

    g("dscCancel").addEventListener("click", close);
    div.addEventListener("click", function(e){ if (e.target===div) close(); });
    if (g("dscRemove")){
      g("dscRemove").addEventListener("click", function(){
        delete row.desconto; delete row.descontos;
        state.modal = null;
        render();
        scheduleSave();
      });
    }
    g("dscSave").addEventListener("click", function(){
      lerLinhas();
      var validas = linhas.filter(function(l){ return parseNum(l.valor)>0; })
        .map(function(l){ return {origem:l.origem, valor:Math.max(0,parseNum(l.valor))}; });
      delete row.desconto; // formato antigo (um desconto só) é substituído pela lista
      if (!validas.length) delete row.descontos;
      else row.descontos = validas;
      state.modal = null;
      render();
      scheduleSave();
    });
  }

  // ---------- pneus novos (faturamento separado do painel principal; só o LUCRO entra nos totais/metas dele) ----------
  var NOVOS_PAYMENTS = PAYMENT_OPTIONS.filter(function(p){ return p.indexOf("Múltiplo")!==0; });
  // mesmas colunas da tabela principal (COLUMNS); só a quantidade vai até 12
  var NV_COLUMNS = COLUMNS.map(function(c){
    var o = {}; Object.keys(c).forEach(function(k){ o[k] = c[k]; });
    if (o.key==="quantidade") o.options = range(0,12);
    return o;
  });
  // pneus novos: "Custo dos pneus" (total pago pelos pneus da linha, igual ao "Valor dos pneus") e "Lucro" (calculado)
  (function(){
    var iv = -1;
    NV_COLUMNS.forEach(function(c, idx){ if (c.key==="valorPneus") iv = idx; });
    NV_COLUMNS.splice(iv+1, 0, {key:"custoPneus", label:"Custo dos pneus", type:"currency", w:"115px"});
    var iValor = -1;
    NV_COLUMNS.forEach(function(c, idx){ if (c.key==="valor") iValor = idx; });
    NV_COLUMNS.splice(iValor+1, 0, {key:"lucro", label:"Lucro", type:"lucro", w:"110px"});
  })();

  function novosKey(month){ return K_NOVOS + month; }
  // gravação adiada: enquanto a pessoa digita na tabela, a lista do mês fica em memória e é salva ~0,5s depois
  var novosPend = null, novosTimer = null;
  // vendas antigas: "valor por unidade" vira "Valor dos pneus" (qtd × unit) e a marca passa a fazer parte da medida;
  // campos que a tabela principal tem e a venda antiga não tinha entram com o valor padrão
  function migrateNovos(list){
    list.forEach(function(n){
      if (n.valorUnit!==undefined){
        if (!n.valorPneus){ var t = parseNum(n.quantidade)*parseNum(n.valorUnit); n.valorPneus = t>0 ? String(Math.round(t*100)/100) : ""; }
        delete n.valorUnit;
      }
      if (n.marca){
        var m = (n.medida||"").trim(), mk = String(n.marca).trim();
        if (mk && m.toLowerCase().indexOf(mk.toLowerCase())===-1) n.medida = (m ? m+" · " : "")+mk;
        n.marca = "";
      }
      if (n.medidaId===undefined) n.medidaId = "";
      if (n.medidaBaixa===undefined) n.medidaBaixa = 0;
      if (n.clienteId===undefined) n.clienteId = "";
      NV_COLUMNS.forEach(function(c){
        if (c.type==="computed" || c.type==="lucro" || n[c.key]!==undefined) return;
        n[c.key] = c.type==="select" ? (c.key==="carro" ? "Carro 1" : (c.key==="pago" ? "❌" : (c.key==="formaPagamento" ? "Nenhum" : (c.key==="vendedor" ? VENDEDORES[0] : "0")))) : "";
      });
    });
    return list;
  }
  function loadNovosMonth(month){
    if (novosPend && novosPend.month===month) return novosPend.list;
    return migrateNovos(lsGetJSON(novosKey(month), []));
  }
  function saveNovosMonth(month, list){
    if (novosPend && novosPend.month===month){ clearTimeout(novosTimer); novosPend = null; }
    return lsSetJSON(novosKey(month), list);
  }
  function flushNovos(){
    if (!novosPend) return;
    var p = novosPend;
    clearTimeout(novosTimer);
    novosPend = null;
    lsSetJSON(novosKey(p.month), p.list);
  }
  function novosSaveLater(month, list){
    if (novosPend && novosPend.month!==month) flushNovos();
    novosPend = {month:month, list:list};
    clearTimeout(novosTimer);
    novosTimer = setTimeout(function(){
      flushNovos();
      var flag = document.getElementById("saveFlag");
      if (flag){
        flag.textContent = "salvo ✓";
        flag.classList.add("show");
        setTimeout(function(){ flag.classList.remove("show"); }, 1400);
      }
    }, 550);
  }
  window.addEventListener("beforeunload", flushNovos);
  window.addEventListener("pagehide", flushNovos);
  function loadNovosMeta(){ var m = lsGetJSON(K_NOVOS_META, {}); return parseNum(m && m.meta); }
  function saveNovosMeta(v){ return lsSetJSON(K_NOVOS_META, {meta: v}); }
  function novoTotal(n){ return computeValor(n); }
  // ---- lucro dos pneus novos: (valor dos pneus − desconto dado nos pneus) − custo de compra ----
  // só conta quando o custo foi informado (sem custo não dá pra saber o lucro)
  function novoTemCusto(n){ return parseNum(n.custoPneus) > 0; }
  function novoReceitaPneus(n){
    var descPneus = 0;
    descontosList(n).forEach(function(d){ if (!d.origem || d.origem==="valorPneus") descPneus += d.valor; });
    return parseNum(n.valorPneus) - descPneus;
  }
  function novoLucro(n){ return novoTemCusto(n) ? novoReceitaPneus(n) - parseNum(n.custoPneus) : 0; }
  // serviços/peças da venda nova (alinhamento, bicos, cambagem, balanceamento, rodas, outros, peças, mão de obra),
  // já descontados os descontos que não saíram do pneu. Esse valor soma inteiro no Dashboard principal.
  function novoServicos(n){
    var descPneus = 0;
    descontosList(n).forEach(function(d){ if (!d.origem || d.origem==="valorPneus") descPneus += d.valor; });
    return Math.max(0, computeSubtotal(n) - parseNum(n.valorPneus) - (descontoValor(n) - descPneus));
  }
  function lucroCellInfo(n){
    if (!novoTemCusto(n)) return {text:"—", color:"var(--text-faint)"};
    var l = novoLucro(n);
    return {text:fmtCurrency(l), color:(l>=0 ? "var(--green)" : "var(--red)")};
  }
  function novosSorted(list){
    return list.slice().sort(function(a,b){
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.criadoEm||"").localeCompare(a.criadoEm||"");
    });
  }
  function novosOfDay(iso){ return loadNovosMonth(iso.slice(0,7)).filter(function(n){ return n.date===iso; }); }
  function novoEditable(date){ return date===today || state.authed; }
  function mv(s){ return state.hideValues ? "••••" : s; }

  function isBlankNovo(n){ return !(n.medida||"").trim() && !(n.marca||"").trim() && !(n.cliente||"").trim() && novoTotal(n)===0; }

  function novosStats(list){
    var t = {total:0, qtd:0, count:list.length, pend:0, porVendedor:{}, porPagamento:{"Dinheiro":0,"Pix":0,"Débito":0,"Crédito":0}, porMedida:{}, porDia:{}, lucro:0, semCusto:0, receitaCusto:0, qtdCusto:0, lucroDia:{}, servicos:0, aporte:0, aporteDia:{}};
    list.forEach(function(n){
      if (isBlankNovo(n)){ t.count--; return; }
      var v = novoTotal(n), q = parseNum(n.quantidade);
      t.total += v; t.qtd += q;
      var l = novoLucro(n);
      var sv = novoServicos(n);
      t.servicos += sv; t.aporte += l + sv; t.aporteDia[n.date] = (t.aporteDia[n.date]||0) + l + sv;
      if (novoTemCusto(n)){ t.lucro += l; t.receitaCusto += novoReceitaPneus(n); t.qtdCusto += q; t.lucroDia[n.date] = (t.lucroDia[n.date]||0) + l; }
      else if (parseNum(n.valorPneus)>0) t.semCusto++;
      if (n.pago!=="✅" && v>0) t.pend += v;
      var vend = vendedorEfetivo(n.vendedor);
      var pv = t.porVendedor[vend] || (t.porVendedor[vend] = {count:0, total:0, qtd:0, lucro:0});
      pv.count++; pv.total += v; pv.qtd += q; pv.lucro += l;
      var b = paymentBreakdown(n);
      Object.keys(b).forEach(function(k){ t.porPagamento[k] += b[k]; });
      var mk = (n.medida||"—").trim() + (n.marca ? " · "+n.marca.trim() : "");
      var pm = t.porMedida[mk] || (t.porMedida[mk] = {qtd:0, total:0, lucro:0});
      pm.qtd += q; pm.total += v; pm.lucro += l;
      t.porDia[n.date] = (t.porDia[n.date]||0) + v;
    });
    return t;
  }

  function novoRowHtml(n){
    var v = novoTotal(n);
    var q = parseNum(n.quantidade);
    var meta = [
      fmtDateBR(n.date),
      vendedorEfetivo(n.vendedor),
      n.cliente || "",
      (n.formaPagamento && n.formaPagamento!=="Nenhum") ? n.formaPagamento : ""

    var pago = n.pago==="✅" ? '<span style="color:var(--green);">pago</span>' : '<span style="color:var(--yellow);">pendente</span>';
    return '<div class="nota-row">'+
      '<div>'+
        '<span class="nota-num">'+escHtml(n.medida||"—")+'</span>'+(n.marca ? ' · <span>'+escHtml(n.marca)+'</span>' : '')+
        ' · <span>'+q+' un.</span>'+
        '<div class="nota-meta">'+meta+' · '+pago+(n.detalhes ? ' · '+escHtml(n.detalhes) : '')+'</div>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:10px;">'+
        '<span class="nota-valor">'+mv(fmtCurrency(v))+'</span>'+
        '<button class="icon-btn edit-btn" data-act="novosedit" data-id="'+escAttr(n.id)+'" data-month="'+escAttr(n.date.slice(0,7))+'" title="Editar venda">✎</button>'+
        '<button class="icon-btn" data-act="novosdel" data-id="'+escAttr(n.id)+'" data-month="'+escAttr(n.date.slice(0,7))+'" title="Apagar venda">✕</button>'+
      '</div>'+
    '</div>';
  }

  function renderNovos(){
    if (state.novosTab==="vendas"){ renderNovosVendas(); return; }
    var month = state.novosMonth || today.slice(0,7);
    var tab = state.novosTab==="vendas" ? "vendas" : "dash";
    var list = loadNovosMonth(month);
    var st = novosStats(list);
    var curMonthKey = today.slice(0,7);

  function deleteNovoWithUndo(id, month){
    var list = loadNovosMonth(month);
    var idx = -1, item = null;
    for (var i=0;i<list.length;i++){ if (list[i].id===id){ idx=i; item=list[i]; break; } }
    if (idx===-1) return;
    var logId = addLinhaApagada("Pneus novos", item, item.date);
    releaseRowEstoque(item); // devolve pro estoque o que essa venda havia baixado
    list.splice(idx,1);
    saveNovosMonth(month, list);
    render();
    showUndoToast("Venda de pneu novo apagada", function(){
      desfazLinhaApagada(logId);
      var l2 = loadNovosMonth(month);
      l2.splice(Math.min(idx,l2.length), 0, item);
      syncRowEstoque(item);
      saveNovosMonth(month, l2);
      render();
    });
  }

  function exportNovosCSV(list, month){
    var cols = NV_COLUMNS;
    var lines = [["Data"].concat(cols.map(function(c){ return c.label; })).concat(["Detalhes"]).map(csvEscape).join(";")];
    list.forEach(function(n){
      var cells = [fmtDateBR(n.date)];
      cols.forEach(function(c){
        if (c.type==="computed") cells.push(novoTotal(n).toFixed(2).replace(".",","));
        else if (c.type==="lucro") cells.push(novoTemCusto(n) ? novoLucro(n).toFixed(2).replace(".",",") : "");
        else if (c.key==="pago") cells.push(n.pago==="✅" ? "Pago" : "Pendente");
        else cells.push(n[c.key]===undefined ? "" : n[c.key]);
      });
      cells.push(n.detalhes||"");
      lines.push(cells.map(csvEscape).join(";"));
    });
    downloadTextFile("pneus-novos-"+month+".csv", lines.join("\r\n"));
  }

  // ---------- reage a mudanças feitas em outro aparelho ----------
  function handleRemoteChange(key){
    if (key===K_PERMS) aplicarPermissoes();
    if (key.indexOf(K_REGMES)===0){
      // outro aparelho mudou um mês do registro: não atropela quem está digitando agora
      var ae = document.activeElement;
      if (state.view==="regmes" && ae && ae.classList && ae.classList.contains("rm-in")) return;
      state.regData = null;
      if (state.view!=="regmes") return;
    }
    // não atropela quem está preenchendo um formulário de O.S. no celular
    if (key===K_OS && state.modal && (state.modal.type==="osForm" || state.modal.type==="osServico")) return;
    // o servidor pode ter somado só 1 bico quando o montador lançou 4: confere o dia de hoje e o dia aberto
    if (key===K_OS || key.indexOf(K_ROWS)===0){ osReconciliarNovos(); osConferirQtds(toISO(new Date())); if (state.date) osConferirQtds(state.date); }
    if (key.indexOf(K_ROWS)===0){
      var date = key.slice(K_ROWS.length);
      var month = date.slice(0,7);
      delete state.monthSummaryCache[month];
      delete state.monthPartsCache[month];
      // se a linha alterada é do dia aberto na tela e não há edição pendente,
      // recarrega para não perder digitação em andamento
      if (state.view==="table" && state.date===date && !state.saving){
        getRows(date).then(function(rows){ state.rows = rows; render(); });
        return;
      }
    } else if (key.indexOf(K_SUMMARY)===0){
      var m = key.slice(K_SUMMARY.length);
      delete state.monthSummaryCache[m];
      delete state.monthPartsCache[m];
    }
    render();
  }

  // ---------- login de acesso ao site (Supabase Auth — senha nunca fica no código) ----------
  var LEMBRAR_KEY = "lembrar_usuario";
  function lerUsuarioLembrado(){ try{ return localStorage.getItem(LEMBRAR_KEY) || ""; }catch(e){ return ""; } }
  function guardarUsuarioLembrado(email){ try{ if (email) localStorage.setItem(LEMBRAR_KEY, email); else localStorage.removeItem(LEMBRAR_KEY); }catch(e){} }

  function renderLoginScreen(errorMsg){
    root.classList.remove("wide");
    var lembrado = lerUsuarioLembrado();
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">'+
        '<div class="brand"><span class="mark"></span><h1>Painel de Vendas</h1></div>'+
        '<p class="hint">Entre com seu e-mail e senha para acessar o sistema.</p>'+
        '<input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username" value="'+escAttr(lembrado)+'">'+
        '<input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">'+
        '<label class="remember-row"><input type="checkbox" id="loginRemember"'+(lembrado?' checked':'')+'><span>Lembrar usuário</span></label>'+
        '<div class="err">'+escHtml(errorMsg||"")+'</div>'+
        '<button class="btn primary" id="loginBtn">Entrar</button>'+
      '</div></div>';
    var emailInput = document.getElementById("loginEmail");
    var passInput = document.getElementById("loginPassword");
    var btn = document.getElementById("loginBtn");
    var rememberInput = document.getElementById("loginRemember");
    if (lembrado) passInput.focus(); else emailInput.focus();
    function tryLogin(){
      var email = emailInput.value.trim();
      var pass = passInput.value;
      // guarda só o e-mail (nunca a senha) se a caixa estiver marcada; desmarcada, esquece
      guardarUsuarioLembrado(rememberInput.checked ? email : "");
      if (!email || !pass){ renderLoginScreen("Preencha e-mail e senha."); return; }
      btn.disabled = true; btn.textContent = "Entrando...";
      sb.auth.signInWithPassword({email:email, password:pass}).then(function(res){
        if (!res.error) return res;
        // não achou com o e-mail digitado → tenta o e-mail-apelido (logins criados com e-mail "inválido")
        return sb.auth.signInWithPassword({email:aliasAuthEmail(email), password:pass}).then(function(res2){
          return res2.error ? res : res2;
        });
      }).then(function(res){
        if (res.error){ renderLoginScreen((res.error && res.error.message) ? res.error.message : "E-mail ou senha inválidos."); }
        else {
          var u = res && res.data && res.data.user;
          var emailLogado = u ? emailExibicao(u) : email;
          // só registra o login DEPOIS de baixar a lista mais atual da nuvem,
          // senão a gente sobrescreve o histórico com uma versão desatualizada
          // (apagando por engano logins feitos em outros aparelhos)
          bootApp(function(){ addLoginLog(emailLogado); });
        }
      });
    }
    btn.addEventListener("click", tryLogin);
    passInput.addEventListener("keydown", function(e){ if (e.key==="Enter") tryLogin(); });
    emailInput.addEventListener("keydown", function(e){ if (e.key==="Enter") passInput.focus(); });
  }

  // ---------- papel do usuário: "vendedor" (painel de vendas), "estoquista" (só estoque) ou "master" (tudo + histórico + usuários) ----------
  function loadRole(cb){
    if (!sb){ state.role = "vendedor"; return cb(); }
    sb.auth.getUser().then(function(res){
      var user = res && res.data && res.data.user;
      if (!user){ state.role = "vendedor"; return cb(); }
      state.userEmail = emailExibicao(user);
      state.userId = user.id;
      state.userNome = (user.user_metadata && user.user_metadata.nome) || (function(){ try{ return localStorage.getItem("perfil_nome")||""; }catch(e){ return ""; } })();
      sb.from("perfis").select("papel").eq("user_id", user.id).limit(1).then(function(r){
        var row = r && r.data && r.data[0];
        var papel = row && row.papel;
        state.role = (papel === "estoquista" || papel === "master") ? papel : "vendedor";
        state.baseRole = state.role;
        cb();
      }).catch(function(){ state.role = "vendedor"; cb(); });
    }).catch(function(){ state.role = "vendedor"; cb(); });
  }

  function bootApp(afterPull){
    // (montador/estoquista não gravam em vendas: pula as tarefas de boot que mexem nelas)
    loadRole(function(){
      cloudPullAll(function(hadRemoteData){
        aplicarPermissoes(); // já com as permissões mais recentes da nuvem
        (can("vendas") ? migrarBalanceamentoAuto : function(d){ d(); })(function(){
          if (typeof afterPull === "function") afterPull(); // ex: registrar o login já com os dados mais recentes em mãos
          render();
          if (!hadRemoteData) pushAllLocalToCloud(); // primeira ativação: sobe o histórico local pra nuvem
          initCloudSync(handleRemoteChange);
          bkpPronto = true; // dados já baixados da nuvem: backups automáticos liberados
          avisarPendenciasNoBoot();
        });
      });
    });
  }

  // avisa uma vez por dia, ao abrir o app, se há lembretes vencidos ou clientes cuja medida chegou
  function avisarPendenciasNoBoot(){
    if (sb && !can("avisos")) return;
    try{
      var chave = "vo_last_avisos_toast";
      if (localStorage.getItem(chave) === today) return;
      localStorage.setItem(chave, today);
    }catch(e){}
    var vencidos = lembretesVencidos().length;
    var matched = loadProcurados().filter(function(p){ return !p.resolved && p.matched; }).length;
    var baixo = estoqueBaixoList().length;
    if (!window.uiToast) return;
    if (vencidos>0) window.uiToast("⏰ Você tem "+vencidos+" lembrete(s) para conferir hoje. Veja em 🔔 Avisos.", "", 8000);
    if (matched>0) window.uiToast("🔔 "+matched+" cliente(s) aguardando uma medida que já chegou em estoque.", "ok", 8000);
    if (baixo>0) window.uiToast("📉 "+baixo+" medida(s) abaixo do estoque mínimo.", "err", 8000);
  }

  function checkAuthAndBoot(){
    if (!sb){ bootApp(); return; } // sem Supabase configurado, não há como validar login sem expor a senha — segue liberado
    sb.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if (session) bootApp();
      else renderLoginScreen();
    });
  }

  // ---------- pontes para o script de melhorias no rodapé (atalhos de teclado, tema) ----------
  window.__appOpenSearch = function(){
    if (sb && !(can("clientes") || can("notas"))) return; // a busca global mostra clientes/notas
    if (!state.authed && state.view!=="table" && !state.modal){ /* segue liberado, busca não exige login */ }
    state.modal = {type:"globalSearch", query:""};
    renderModal();
  };
  window.__appShortcut = function(key){
    if (state.modal) return; // não atropela um modal já aberto
    if (key==="e"){ state.view="estoque"; render(); }
    else if (key==="c"){ state.clientesDetailId=null; state.view="clientes"; render(); }
    else if (key==="n"){
      if (state.view==="table"){ addRow(); }
      else {
        state.date = today; state.view = "table"; state.openDetails = {};
        getRows(today).then(function(rows){ state.rows = rows; addRow(); });
      }
    }
  };

  checkAuthAndBoot();
})();
});
</script>
