  function renderClientes(){
    if (state.clientesDetailId) return renderClienteDetalhe();

    var customers = loadCustomers().slice().sort(function(a,b){
      return String(a.nome||"").localeCompare(String(b.nome||""), "pt-BR");
    });
    var notas = loadNotas();
    var q = (state.clientesQuery||"").trim().toLowerCase();
    var filtered = q ? customers.filter(function(c){
      return (c.nome||"").toLowerCase().indexOf(q)>-1 ||
             (customerDocInfo(c).documento||"").toLowerCase().indexOf(q)>-1 ||
             (c.telefone||"").toLowerCase().indexOf(q)>-1;
    }) : customers;

    var pf = customers.filter(function(c){ return customerDocInfo(c).tipo!=="cnpj"; }).length;
    var pj = customers.filter(function(c){ return customerDocInfo(c).tipo==="cnpj"; }).length;

    root.innerHTML =
      clientesTopbarHtml("Clientes", "NOME · CPF/CNPJ · TELEFONE · E-MAIL · ENDEREÇO") +

      '<div class="totals-bar">'+
        tstat("Clientes cadastrados", customers.length, true)+
        tstat("Pessoa física (CPF)", pf)+
        tstat("Pessoa jurídica (CNPJ)", pj)+
      '</div>'+

      '<div class="tbl-head">'+
        '<div class="tbl-head-left"><h2>Clientes</h2><span class="save-flag" id="saveFlag">salvo</span></div>'+
        '<button class="btn primary" data-act="clientenew">+ Cadastrar cliente</button>'+
      '</div>'+

      '<div class="card" style="padding:14px 16px;">'+
        '<input type="text" id="cliSearch" class="dash-cust-search" placeholder="Buscar por nome, CPF/CNPJ ou telefone..." value="'+escAttr(state.clientesQuery||"")+'">'+
        '<div class="archive-list">'+
          (filtered.length
            ? filtered.map(function(c){
                var count = notas.filter(function(n){return n.customerId===c.id;}).length;
                return clienteRowHtml(c, count);
              }).join("")
            : '<div class="arow-empty">'+(customers.length ? 'Nenhum cliente encontrado.' : 'Nenhum cliente cadastrado ainda. Use o botão “+ Cadastrar cliente”.')+'</div>')+
        '</div>'+
      '</div>';

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });

    var search = document.getElementById("cliSearch");
    if (search){
      search.addEventListener("input", function(){
        state.clientesQuery = search.value;
        var pos = search.selectionStart;
        renderClientes();
        var again = document.getElementById("cliSearch");
        if (again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
      });
    }

    root.querySelectorAll("[data-cli-open]").forEach(function(el){
      el.addEventListener("click", function(){
        state.clientesDetailId = el.getAttribute("data-cli-open");
        renderClientes();
      });
    });
    root.querySelectorAll("[data-cli-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.modal = {type:"customerForm", customerId: btn.getAttribute("data-cli-edit"), error:""};
        renderModal();
      });
    });
    root.querySelectorAll("[data-cli-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-cli-del");
        var c = customers.filter(function(x){return x.id===id;})[0];
        if (!c) return;
        deleteCustomerWithUndo(id, function(){ renderClientes(); });
      });
    });
  }

  function renderClienteDetalhe(){
    var customer = loadCustomers().filter(function(c){return c.id===state.clientesDetailId;})[0];
    if (!customer){ state.clientesDetailId = null; return renderClientes(); }
    var notas = loadNotas().filter(function(n){return n.customerId===customer.id;})
      .sort(function(a,b){ return b.createdAt - a.createdAt; });
    var sub = [customerDocLabel(customer), customer.telefone, customer.email].filter(Boolean).join(" · ");
    var notasHtml = notas.length
      ? notas.map(function(n){
          return '<div class="arow">'+
            '<span class="d" data-nota="'+escAttr(n.id)+'" role="button" tabindex="0" style="cursor:pointer;">Venda #'+n.vendaNum+' · '+fmtDateBR(n.date)+'</span>'+
            '<span class="stats"><span><b>'+fmtCurrency(n.totalProdutos)+'</b></span><span>'+escHtml(n.formaPagamento||"")+'</span>'+
            '<button class="icon-btn" data-delnota="'+escAttr(n.id)+'" title="Apagar nota">✕</button></span>'+
          '</div>';
        }).join("")
      : '<div class="arow-empty">Nenhuma nota registrada para este cliente ainda.</div>';

    root.innerHTML =
      clientesTopbarHtml("Clientes", "FICHA DO CLIENTE") +
      '<div class="card" style="padding:14px 16px;">'+
        '<button class="backlink" id="cliBack" style="padding:4px 0 10px;">‹ Voltar aos clientes</button>'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">'+
          '<div>'+
            '<div class="cust-detail-name">'+escHtml(customer.nome)+'</div>'+
            (sub?'<div class="cust-detail-sub">'+escHtml(sub)+'</div>':'')+
            (customer.endereco?'<div class="cust-detail-sub">'+escHtml(customer.endereco)+'</div>':'')+
          '</div>'+
          '<button class="btn ghost small" data-act="clientedit" data-id="'+escAttr(customer.id)+'">✎ Editar</button>'+
        '</div>'+
        '<div class="archive-list">'+notasHtml+'</div>'+
      '</div>';

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });
    var backBtn = document.getElementById("cliBack");
    if (backBtn) backBtn.addEventListener("click", function(){ state.clientesDetailId = null; renderClientes(); });

    root.querySelectorAll("[data-nota]").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-nota");
        var nota = loadNotas().filter(function(n){return n.id===id;})[0];
        if (nota) reprintNota(nota);
      });
    });
    root.querySelectorAll("[data-delnota]").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var id = btn.getAttribute("data-delnota");
        deleteNotaWithUndo(id, function(){ renderClienteDetalhe(); });
      });
    });
  }

  function renderEstoqueFormModal(){

    div.className = "overlay";
    div.innerHTML =

          '<label>Quantidade em estoque</label><input type="text" inputmode="numeric" id="efQtd" placeholder="0" value="'+escAttr(item?Math.max(0,parseNum(item.quantidade)):"")+'">'+
          '<label>Preço por unidade (R$)</label><input type="text" inputmode="decimal" id="efPreco" placeholder="0,00" value="'+escAttr(item?parseNum(item.preco):"")+'">'+
        '</div>'+
        '<div class="err">'+escHtml(state.modal.error||"")+'</div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="efCancel">Voltar</button>'+
          '<button class="btn primary small" id="efSave">Salvar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);
    document.getElementById("efMedida").focus();

    function goBack(){
      if (state.modal.returnTo==="selectMedida"){
        state.modal = {type:"selectMedida", rowId: state.modal.rowId};
      } else {
        state.modal = null;
      }
      render();
    }
    document.getElementById("efCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });
    document.getElementById("efSave").addEventListener("click", function(){
      var medida = document.getElementById("efMedida").value.trim();
      if (!medida){
        state.modal.error = "Informe a medida.";
        renderModal();
        return;
      }
      var dados = {
        medida: medida,
        marca: document.getElementById("efMarca").value.trim(),
        quantidade: document.getElementById("efQtd").value,
        preco: document.getElementById("efPreco").value
      };
      if (item){
        var antes = Math.max(0, parseNum(item.quantidade));
        var depois = Math.max(0, parseNum(dados.quantidade));
        updateEstoqueItem(item.id, dados);
        var diff = depois - antes;
        if (diff !== 0) addEstoqueLog("ajuste", estoqueLabel({medida:medida, marca:dados.marca}), diff);
      } else {
        addEstoqueItem(dados);
      }
      goBack();
    });
  }

        '</div>'+
      '</div>';
    document.body.appendChild(div);

    var selectedId = selecionado;

    div.querySelectorAll(".cust-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        selectedId = btn.getAttribute("data-mid");
        state.modal.medidaId = selectedId;
        div.querySelectorAll(".cust-item").forEach(function(b){ b.classList.remove("sel"); });
        btn.classList.add("sel");
        var selDiv = document.getElementById("grMedSel");
        if (selDiv){
          var item = estoqueItem(selectedId);
          selDiv.innerHTML = item ? 'Selecionada: <b style="color:var(--text);">'+escHtml(estoqueLabel(item))+'</b>' : 'Nenhuma medida selecionada';
        }
      });
    });

    var searchInput = document.getElementById("grMedSearch");
    if (searchInput){
      searchInput.addEventListener("input", function(){
        var q = searchInput.value.trim().toLowerCase();
        div.querySelectorAll(".cust-item").forEach(function(btn){
          var hay = btn.getAttribute("data-search")||"";
          btn.style.display = (!q || hay.indexOf(q)>-1) ? "" : "none";
        });
      });
      searchInput.focus();
    } else {
      var qtdInput = document.getElementById("grQtd");
      if (qtdInput) qtdInput.focus();
    }

    function goBack(){ state.modal = null; render(); }
    document.getElementById("grCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });

    var saveBtn = document.getElementById("grSave");
    if (saveBtn){
      saveBtn.addEventListener("click", function(){
        var id = selectedId;
        var item = id ? estoqueItem(id) : null;
        var qtd = Math.floor(parseNum(document.getElementById("grQtd").value));
        state.modal.qtd = document.getElementById("grQtd").value;
        if (!item){
          state.modal.error = "Escolha a medida do pneu.";
          renderModal();
          return;
        }
        if (!qtd || qtd<=0){
          state.modal.error = "Informe uma quantidade válida.";
          renderModal();
          return;
        }
        var atual = Math.max(0, parseNum(item.quantidade));
        if (qtd > atual && !window.confirm("O estoque de "+estoqueLabel(item)+" tem só "+atual+" un. disponível(is). Baixar mesmo assim (o estoque vai zerar)?")){
          return;
        }
        var moved = moveEstoque(id, -qtd);
        if (moved<0) addEstoqueLog("saida", estoqueLabel(item)+" (Garantia)", Math.abs(moved));
        state.modal = null;
        render();
      });
    }
  }

  // ---------- modal: dividir o pagamento entre até 4 formas ----------
  function renderMultiPagModal(){
    var rowId = state.modal.rowId;
    var row = state.rows.filter(function(r){ return r.id===rowId; })[0];
    if (!row){ state.modal = null; render(); return; }
    var total = computeValor(row);
    var existentes = Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos.slice() : [];
    if (existentes.length===0){
      existentes = [{metodo:"Dinheiro", valor: total}];
    }
    while (existentes.length < 4) existentes.push({metodo:"Nenhum", valor:""});
    existentes = existentes.slice(0,4);

    var div = document.createElement("div");
    div.className = "overlay";
    var opcoesMetodo = ["Nenhum"].concat(METODOS_PAGAMENTO);
    var linhasHtml = existentes.map(function(p, i){
      var selOpts = opcoesMetodo.map(function(m){
        return '<option value="'+m+'"'+(p.metodo===m?" selected":"")+'>'+m+'</option>';
      }).join("");
      return '<div style="display:flex;gap:8px;margin-bottom:8px;">'+
        '<select class="mpMetodo" data-idx="'+i+'" style="flex:1.2;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px;">'+selOpts+'</select>'+
        '<input type="text" inputmode="decimal" class="mpValor" data-idx="'+i+'" placeholder="0,00" value="'+escAttr(p.valor!==""&&p.valor!==undefined&&p.valor!==null?parseNum(p.valor):"")+'" style="flex:1;">'+
      '</div>';
    }).join("");

    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>Dividir pagamento (até 4 formas)</h3>'+
        '<p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">Total da venda: <b style="color:var(--text);">'+fmtCurrency(total)+'</b></p>'+
        '<div id="mpLinhas">'+linhasHtml+'</div>'+
        '<div id="mpResumo" style="font-size:12.5px;color:var(--text-dim);margin:6px 2px 12px;"></div>'+
        '<div class="err">'+escHtml(state.modal.error||"")+'</div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="mpCancel">Voltar</button>'+
          '<button class="btn primary small" id="mpSave">Salvar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);

    function lerValores(){
      var metodos = div.querySelectorAll(".mpMetodo");
      var valores = div.querySelectorAll(".mpValor");
      var lista = [];
      for (var i=0;i<metodos.length;i++){
        var m = metodos[i].value;
        var v = parseNum(valores[i].value);
        if (m!=="Nenhum" && v>0) lista.push({metodo:m, valor:v});
      }
      return lista;
    }
    function atualizarResumo(){
      var lista = lerValores();
      var soma = lista.reduce(function(s,p){ return s+p.valor; }, 0);
      var resumo = document.getElementById("mpResumo");
      var diff = total - soma;
      if (!resumo) return;
      if (Math.abs(diff) < 0.005){
        resumo.innerHTML = '<span style="color:var(--green);">Soma bate certinho com o total (' + fmtCurrency(soma) + ').</span>';
      } else if (diff > 0){
        resumo.innerHTML = 'Soma atual: '+fmtCurrency(soma)+' — <span style="color:var(--yellow);">ainda falta '+fmtCurrency(diff)+'</span>';
      } else {
        resumo.innerHTML = 'Soma atual: '+fmtCurrency(soma)+' — <span style="color:var(--red);">passou '+fmtCurrency(-diff)+' do total</span>';
      }
    }
    atualizarResumo();
    div.querySelectorAll(".mpMetodo, .mpValor").forEach(function(el){
      el.addEventListener("input", atualizarResumo);
      el.addEventListener("change", atualizarResumo);
    });

    function goBack(){ state.modal = null; render(); }
    document.getElementById("mpCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });
    document.getElementById("mpSave").addEventListener("click", function(){
      var lista = lerValores();
      if (lista.length===0){
        state.modal.error = "Escolha ao menos uma forma de pagamento com um valor maior que zero.";
        renderModal();
        return;
      }
      var soma = lista.reduce(function(s,p){ return s+p.valor; }, 0);
      if (Math.abs(soma-total) > 0.01){
        if (!window.confirm("A soma das formas de pagamento (" + fmtCurrency(soma) + ") é diferente do total da venda (" + fmtCurrency(total) + "). Quer salvar assim mesmo?")) return;
      }
      row.formaPagamento = "Múltiplo (até 4 formas)";
      row.pagamentosMultiplos = lista;
      state.modal = null;
      render();
      scheduleSave();
    });
  }

  // ---------- modal: escolher a medida na linha da venda ----------
  function renderSelectMedidaModal(){
    var rowId = state.modal.rowId;
    var row = state.rows.filter(function(r){ return r.id===rowId; })[0];
    var list = estoqueSorted();
    var div = document.createElement("div");
    div.className = "overlay";
    var listHtml = list.length
      ? list.map(function(i){
          var qtd = Math.max(0, parseNum(i.quantidade));
          var search = ((i.medida||"")+" "+(i.marca||"")).toLowerCase();
          return '<button class="cust-item" data-mid="'+escAttr(i.id)+'" data-search="'+escAttr(search)+'">'+
            '<span class="cust-name">'+escHtml(i.medida||"—")+(i.marca?' · '+escHtml(i.marca):'')+'</span>'+
            '<span class="cust-sub"'+(qtd<=0?' style="color:#e2554c;"':'')+'>'+(qtd<=0 ? 'sem estoque — dá pra vender mesmo assim' : qtd+' un. em estoque')+' · '+fmtCurrency(parseNum(i.preco))+'</span>'+
          '</button>';
        }).join("")
      : '<div class="cust-empty">Nenhuma medida cadastrada no estoque ainda.</div>';

    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>Escolher medida</h3>'+
        (list.length ? '<input type="text" id="medSearch" class="search-input" placeholder="Buscar medida ou marca...">' : '')+
        '<div class="cust-list" id="medList">'+listHtml+'</div>'+
        '<div class="modal-actions" style="justify-content:space-between;margin-top:14px;">'+
          '<button class="btn ghost small" id="medCancel">Cancelar</button>'+
          '<span style="display:flex;gap:8px;">'+
            (row && row.medidaId ? '<button class="btn ghost small" id="medClear">Limpar medida</button>' : '')+
            '<button class="btn primary small" id="medNew">+ Cadastrar medida</button>'+
          '</span>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);

    div.querySelectorAll(".cust-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        var item = estoqueItem(btn.getAttribute("data-mid"));
        if (row && item){
          if (row.medidaId !== item.id) releaseRowEstoque(row);
          row.medidaId = item.id;
          row.medida = estoqueLabel(item);
          syncRowEstoque(row);
          if (!row.valorPneus && parseNum(item.preco)>0 && parseNum(row.quantidade)>0){
            row.valorPneus = (parseNum(item.preco)*parseNum(row.quantidade)).toFixed(2);
          }
        }
        state.modal = null;
        render();
        scheduleSave();
      });
    });

    var searchInput = document.getElementById("medSearch");
    if (searchInput){
      searchInput.addEventListener("input", function(){
        var q = searchInput.value.trim().toLowerCase();
        div.querySelectorAll(".cust-item").forEach(function(btn){
          var hay = btn.getAttribute("data-search")||"";
          btn.style.display = (!q || hay.indexOf(q)>-1) ? "" : "none";
        });
      });
      searchInput.focus();
    }

    var clearBtn = document.getElementById("medClear");
    if (clearBtn){
      clearBtn.addEventListener("click", function(){
        if (row){
          releaseRowEstoque(row);
          row.medidaId = "";
          row.medida = "";
        }
        state.modal = null;
        render();
        scheduleSave();
      });
    }
    document.getElementById("medNew").addEventListener("click", function(){
      state.modal = {type:"estoqueForm", itemId:null, rowId:rowId, returnTo:"selectMedida", error:""};
      render();
    });
    document.getElementById("medCancel").addEventListener("click", function(){ state.modal=null; render(); });
    div.addEventListener("click", function(e){ if (e.target===div){ state.modal=null; render(); } });
  }

  // ---------- reage a mudanças feitas em outro aparelho ----------
  function handleRemoteChange(key){
    if (key.indexOf(K_ROWS)===0){
      var date = key.slice(K_ROWS.length);
      var month = date.slice(0,7);
      delete state.monthSummaryCache[month];
      delete state.monthPartsCache[month];
      // se a linha alterada é do dia aberto na tela e não há edição pendente,
      // recarrega para não perder digitação em andamento
      if (state.view==="table" && state.date===date && !state.saving){
        getRows(date).then(function(rows){ state.rows = rows; render(); });
        return;
      }
    } else if (key.indexOf(K_SUMMARY)===0){
      var m = key.slice(K_SUMMARY.length);
      delete state.monthSummaryCache[m];
      delete state.monthPartsCache[m];
    }
    render();
  }

  // ---------- login de acesso ao site (Supabase Auth — senha nunca fica no código) ----------
  function renderLoginScreen(errorMsg){
    root.classList.remove("wide");
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">'+
        '<div class="brand"><span class="mark"></span><h1>Painel de Vendas</h1></div>'+
        '<p class="hint">Entre com seu e-mail e senha para acessar o sistema.</p>'+
        '<input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">'+
        '<input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">'+
        '<div class="err">'+escHtml(errorMsg||"")+'</div>'+
        '<button class="btn primary" id="loginBtn">Entrar</button>'+
      '</div></div>';
    var emailInput = document.getElementById("loginEmail");
    var passInput = document.getElementById("loginPassword");
    var btn = document.getElementById("loginBtn");
    emailInput.focus();
    function tryLogin(){
      var email = emailInput.value.trim();
      var pass = passInput.value;
      if (!email || !pass){ renderLoginScreen("Preencha e-mail e senha."); return; }
      btn.disabled = true; btn.textContent = "Entrando...";
      sb.auth.signInWithPassword({email:email, password:pass}).then(function(res){
        if (res.error){ renderLoginScreen((res.error && res.error.message) ? res.error.message : "E-mail ou senha inválidos."); }
        else {
          var u = res && res.data && res.data.user;
          var emailLogado = u ? u.email : email;
          // só registra o login DEPOIS de baixar a lista mais atual da nuvem,
          // senão a gente sobrescreve o histórico com uma versão desatualizada
          // (apagando por engano logins feitos em outros aparelhos)
          bootApp(function(){ addLoginLog(emailLogado); });
        }
      });
    }
    btn.addEventListener("click", tryLogin);
    passInput.addEventListener("keydown", function(e){ if (e.key==="Enter") tryLogin(); });
    emailInput.addEventListener("keydown", function(e){ if (e.key==="Enter") passInput.focus(); });
  }

  // ---------- papel do usuário: "vendedor" (painel de vendas), "estoquista" (só estoque) ou "master" (tudo + histórico + usuários) ----------
  function loadRole(cb){
    if (!sb){ state.role = "vendedor"; return cb(); }
    sb.auth.getUser().then(function(res){
      var user = res && res.data && res.data.user;
      if (!user){ state.role = "vendedor"; return cb(); }
      state.userEmail = user.email || "";
      sb.from("perfis").select("papel").eq("user_id", user.id).limit(1).then(function(r){
        var row = r && r.data && r.data[0];
        var papel = row && row.papel;
        state.role = (papel === "estoquista" || papel === "master") ? papel : "vendedor";
        cb();
      }).catch(function(){ state.role = "vendedor"; cb(); });
    }).catch(function(){ state.role = "vendedor"; cb(); });
  }

  function bootApp(afterPull){
    loadRole(function(){
      cloudPullAll(function(hadRemoteData){
        if (typeof afterPull === "function") afterPull(); // ex: registrar o login já com os dados mais recentes em mãos
        render();
        if (!hadRemoteData) pushAllLocalToCloud(); // primeira ativação: sobe o histórico local pra nuvem
        initCloudSync(handleRemoteChange);
      });
    });
  }

  function checkAuthAndBoot(){
    if (!sb){ bootApp(); return; } // sem Supabase configurado, não há como validar login sem expor a senha — segue liberado
    sb.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if (session) bootApp();
      else renderLoginScreen();
    });
  }

  checkAuthAndBoot();
})();
</script>
