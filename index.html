<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ---- estoque ---- */
  .est-zero{color:#e2554c;}
  .medida-btn{
    width:100%;height:100%;background:transparent;border:none;color:inherit;
    text-align:left;font-size:12.5px;padding:0 8px;color:#647079;
  }
  .medida-btn.has{color:#eef1f3;}
  .medida-btn:hover:not(:disabled){color:#f5b700;}
  .medida-btn:disabled{cursor:default;}
  .est-actions{display:flex;gap:4px;align-items:center;}
  :root{
    --bg:#14181c;
    --panel:#1c2227;
    --panel-alt:#232a30;
    --border:#333d46;
    --border-soft:#2a323a;
    --text:#eef1f3;
    --text-dim:#98a3ad;
    --text-faint:#647079;
    --yellow:#f5b700;
    --yellow-dim:#8a6a12;
    --teal:#3ac7c1;
    --red:#e2554c;
    --green:#4fae6c;
    --radius-card:8px;
  }
  html[data-theme="light"]{
    --bg:#eef1f4;
    --panel:#ffffff;
    --panel-alt:#f4f6f8;
    --border:#c9d1d8;
    --border-soft:#dbe1e6;
    --text:#1c2227;
    --text-dim:#4a555e;
    --text-faint:#6c7681;
    --yellow:#c98f00;
    --yellow-dim:#e7c473;
    --teal:#0f8f89;
    --red:#c8433b;
    --green:#2f8c4f;
  }
  html[data-theme="light"] .brand .mark{background:var(--yellow);}
  html[data-theme="light"] ::selection{background:var(--yellow);color:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--yellow);color:#1c1c1c;}
  /* ---- padronização de raio/contraste (cards, botões desativados, texto secundário) ---- */
  .card, .dt-card, .parts-card, .archive-row, .cust-row, .est-row, .hero, .dd-card, .modal, .nota-row, .aviso-card, .aviso-row{
    border-radius:var(--radius-card) !important;
  }
  .btn:disabled, button:disabled{ opacity:.55; color:var(--text-dim); }
  .text-secondary, .dt-sub, .dd-note, .tag, .k, .hint{ color:var(--text-dim); }

  #app{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}
  #app.wide{max-width:none;padding-left:16px;padding-right:16px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:24px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    width:11px;height:11px;background:var(--yellow);
    display:inline-block;transform:rotate(45deg);
  }
  .brand h1{font-size:22px;color:var(--text);}
  .brand span.tag{color:var(--text-faint);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .sync-badge{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border-soft);color:var(--text-faint);margin-left:10px;letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .sync-badge.on{color:var(--green);border-color:var(--green);}
  .sync-badge.connecting{color:var(--yellow);border-color:var(--yellow);}
  .sync-badge.error{color:var(--red);border-color:var(--red);}
  .auth-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .pill{
    font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:3px;
    color:var(--text-dim);display:flex;align-items:center;gap:6px;
  }
  .pill.on{border-color:var(--green);color:var(--green);}
  .btn{
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);
    padding:8px 14px;border-radius:3px;font-size:13.5px;font-weight:500;
    transition:border-color .15s, background .15s;cursor:pointer;display:inline-flex;align-items:center;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1a1500;font-weight:600;}
  .btn.primary:hover{background:#ffc61f;}
  .btn.ghost{background:transparent;}
  .btn.danger{border-color:var(--red);color:var(--red);background:transparent;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- dashboard hero ---- */
  .hero{
    display:grid;grid-template-columns:1.1fr 1.4fr;gap:0;
    border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:18px;
  }
  @media(max-width:820px){.hero{grid-template-columns:1fr;}}
  .hero-left{
    background:var(--panel);padding:26px 28px;display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--border-soft);
  }
  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;font-size:14px;line-height:1;
  }
  .month-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .month-nav button.hide-vals-btn{
    width:auto;height:auto;margin-left:4px;padding:5px 10px;font-size:12px;line-height:1.2;
  }
  .month-nav .label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-dim);text-transform:capitalize;}
  .big-total{font-size:44px;color:var(--text);line-height:1;margin-bottom:6px;}
  .big-total .cents{font-size:24px;color:var(--text-faint);}
  .hero-left .sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
  .goal-row{margin-bottom:14px;}
  .goal-row:last-child{margin-bottom:0;}
  .goal-row .goal-label{
    display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;
  }
  .goal-label b{color:var(--text);font-weight:600;}
  .goal-track{height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:99px;background:var(--teal);transition:width .5s ease;}
  .goal-fill.reached{background:var(--green);}

  .hero-right{background:var(--panel-alt);padding:22px 26px 14px;}
  .hero-right h2{font-size:13px;color:var(--text-dim);font-weight:500;text-transform:none;margin-bottom:14px;font-family:'IBM Plex Sans',sans-serif;}
  .chart-wrap{width:100%;}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible;}
  .chart-empty{color:var(--text-faint);font-size:13px;padding:40px 0;text-align:center;}

  /* ---- secondary row ---- */
  .daily-target-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .daily-target{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  @media(max-width:600px){.daily-target{grid-template-columns:1fr;}}
  .dt-card{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--teal);
    border-radius:6px;padding:16px 18px;
  }
  .dt-card:nth-child(2){border-left-color:var(--yellow);}
  .dt-card.dt-done{border-left-color:var(--green);}
  .dt-card.dt-closed{border-left-color:var(--text-faint);}
  .dt-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;}
  .dt-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .dt-percent{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .dt-value{font-size:23px;color:var(--teal);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .dt-card:nth-child(2) .dt-value{color:var(--yellow);}
  .dt-value .dt-unit{font-size:13px;color:var(--text-faint);margin-left:5px;font-family:'IBM Plex Sans',sans-serif;}
  .dt-card.dt-done .dt-value{color:var(--green);font-size:19px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .dt-card.dt-closed .dt-value{color:var(--text-dim);}
  .dt-sub{font-size:12px;color:var(--text-dim);margin-top:8px;}

  .parts-visor-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .parts-visor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:820px){.parts-visor{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.parts-visor{grid-template-columns:1fr;}}
  .parts-card{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--border-soft);
    border-radius:6px;padding:16px 18px;
  }
  .parts-card.pc-teal{border-left-color:var(--teal);}
  .parts-card.pc-yellow{border-left-color:var(--yellow);}
  .parts-card.pc-green{border-left-color:var(--green);}
  .parts-card .pc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
  .parts-card .pc-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .parts-card .pc-qty{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .parts-card .pc-value{font-size:23px;color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .parts-card.pc-teal .pc-value{color:var(--teal);}
  .parts-card.pc-yellow .pc-value{color:var(--yellow);}
  .parts-card.pc-green .pc-value{color:var(--green);}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:820px){.row2{grid-template-columns:1fr;}}
  .card{border:1px solid var(--border-soft);border-radius:4px;background:var(--panel);padding:20px 22px;}
  .card h3{font-size:13px;color:var(--text-dim);font-weight:500;margin-bottom:12px;font-family:'IBM Plex Sans',sans-serif;}
  .yesterday-total{font-size:26px;color:var(--text);margin-bottom:2px;}
  .yesterday-meta{font-size:12.5px;color:var(--text-faint);margin-bottom:14px;}
  .today-card{display:flex;flex-direction:column;justify-content:space-between;}
  .today-card .date-big{font-size:26px;color:var(--text);text-transform:capitalize;margin-bottom:2px;}
  .today-card .date-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:16px;}

  /* ---- archive ---- */
  .archive-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;}
  .archive-head h2{font-size:15px;color:var(--text);}
  .archive-head .hint{font-size:12px;color:var(--text-faint);}
  .archive-list{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;max-height:360px;overflow-y:auto;}
  .arow{
    display:flex;align-items:center;justify-content:space-between;padding:11px 16px;
    border-bottom:1px solid var(--border-soft);background:var(--panel);font-size:13.5px;
  }
  .arow:last-child{border-bottom:none;}
  .arow:hover{background:var(--panel-alt);}
  .arow .d{color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-width:90px;}
  .arow .stats{display:flex;gap:18px;color:var(--text-dim);font-size:12.5px;}
  .arow .stats b{color:var(--text);}
  .arow-empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* ---- table screen ---- */
  .tbl-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .tbl-head-left{display:flex;align-items:center;gap:12px;}
  .day-nav{display:flex;align-items:center;gap:6px;}
  .day-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;
  }
  .day-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .tbl-head h2{font-size:19px;text-transform:capitalize;}
  .save-flag{font-size:11.5px;color:var(--green);opacity:0;transition:opacity .3s;font-family:'IBM Plex Mono',monospace;}
  .save-flag.show{opacity:1;}

  .totals-bar{
    display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border-soft);border-radius:4px;
    background:var(--panel);margin-bottom:14px;overflow:hidden;
  }
  .tstat{padding:12px 18px;border-right:1px solid var(--border-soft);min-width:120px;}
  .tstat:last-child{border-right:none;}
  .tstat .k{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
  .tstat .v{font-size:15px;color:var(--text);font-family:'IBM Plex Mono',monospace;}
  .tstat .v.accent{color:var(--yellow);}

  .sticky-head-block{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px;}

  /* ---- orçamento ---- */
  .orc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .orc-field label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em;}
  .orc-field input,.orc-field select,.orc-field textarea{
    width:100%;background:var(--panel-alt);border:1px solid var(--border-soft);color:var(--text);
    border-radius:4px;padding:9px 10px;font-size:13.5px;font-family:inherit;
  }
  .orc-field textarea{min-height:64px;resize:vertical;}
  .orc-field input:focus,.orc-field select:focus,.orc-field textarea:focus{outline:none;border-color:var(--yellow);}
  .orc-items{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:12px;}
  .orc-item{display:grid;grid-template-columns:1fr 80px 120px 120px 36px;gap:8px;align-items:center;
    padding:8px 10px;border-bottom:1px solid var(--border-soft);}
  .orc-item:last-child{border-bottom:none;}
  .orc-item.head{background:var(--panel-alt);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);}
  .orc-item input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    border-radius:3px;padding:6px 6px;font-size:13.5px;font-family:inherit;}
  .orc-item input:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .orc-item .tot{font-size:13.5px;text-align:right;color:var(--text-dim);}
  .orc-total{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;margin:6px 2px 18px;}
  .orc-total .lbl{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .orc-total .val{font-size:22px;font-weight:bold;color:var(--yellow);}
  @media (max-width:760px){
    .orc-grid{grid-template-columns:1fr;}
    .orc-item{grid-template-columns:1fr 60px 92px 36px;}
    .orc-item .tot{display:none;}
  }
  .orc-cli-search{display:flex;gap:8px;}
  .orc-cli-search input{flex:1;}
  .orc-cli-results{margin-top:6px;max-height:260px;}
  .orc-cli-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--panel-alt);border:1px solid var(--teal);border-radius:4px;padding:9px 12px;}
  .orc-cli-chip b{display:block;font-size:14px;color:var(--text);}
  .orc-cli-chip span{font-size:12px;color:var(--text-dim);}
  .orc-cli-actions{display:flex;gap:6px;}
  .cust-item.cust-create{color:var(--yellow);}

  /* ---- detalhes do dia (evolução diária) ---- */
  .dd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:6px 0 12px;}
  .dd-head h2{font-size:15px;color:var(--text);}
  .dd-head .dd-cmp-toggle{margin-right:auto;}
  .dd-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .dd-nav button.nav{background:transparent;border:1px solid var(--border);color:var(--text-dim);width:26px;height:26px;border-radius:3px;font-size:14px;line-height:1;}
  .dd-nav button.nav:hover{border-color:var(--yellow);color:var(--yellow);}
  .dd-nav .dd-date{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text);text-transform:capitalize;}
  .dd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px;}
  @media(max-width:820px){.dd-grid{grid-template-columns:1fr;}}
  .dd-card{border:1px solid var(--border-soft);border-radius:6px;background:var(--panel);padding:16px 18px;}
  .dd-card.span2{grid-column:1 / -1;}
   .dd-card h3{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-family:'IBM Plex Sans',sans-serif;font-weight:600;margin-bottom:12px;}
   .dd-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
   .dd-card-head h3{margin-bottom:0;}
   .dd-cmp-toggle{display:inline-flex;border:1px solid var(--border-soft);border-radius:99px;overflow:hidden;}
   .dd-cmp-toggle .seg{background:none;border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:11px;color:var(--text-dim);padding:4px 12px;line-height:1;}
   .dd-cmp-toggle .seg.on{background:var(--yellow);color:#1c2227;font-weight:600;}
  .dd-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  @media(max-width:520px){.dd-kpis{grid-template-columns:1fr 1fr;}}
  .dd-kpi{background:var(--panel-alt);border-radius:4px;padding:10px 12px;}
  .dd-kpi .k{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .dd-kpi .v{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--text);line-height:1.1;}
  .dd-kpi.big .v{color:var(--yellow);font-size:21px;}
  .dd-kpi.warn .v{color:var(--red);}
  .dd-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .dd-row:last-child{border-bottom:none;}
  .dd-row .lbl{flex:0 0 160px;color:var(--text);min-width:0;}
  .dd-row .lbl small{white-space:normal;}
  @media(max-width:520px){.dd-row .lbl{flex:0 0 110px;} .dd-row .pct{display:none;}}
  .dd-row .lbl small{display:block;color:var(--text-faint);font-size:11px;}
  .dd-row .track{flex:1;height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .dd-row .fill{height:100%;border-radius:99px;background:var(--teal);}
  .dd-row .fill.y{background:var(--yellow);} .dd-row .fill.g{background:var(--green);} .dd-row .fill.r{background:var(--red);}
  .dd-row .val{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text);text-align:right;min-width:92px;}
  .dd-row .pct{flex:0 0 44px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);}
  .dd-rank{flex:0 0 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);}
  .dd-cmp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .dd-cmp:last-child{border-bottom:none;}
  .dd-cmp .who{color:var(--text-dim);}
  .dd-cmp .who small{display:block;color:var(--text-faint);font-size:11px;}
  .dd-cmp .amt{font-family:'IBM Plex Mono',monospace;color:var(--text);font-size:12.5px;}
  .dd-delta{display:inline-block;min-width:58px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11.5px;padding:3px 7px;border-radius:99px;margin-left:8px;
    background:var(--border-soft);color:var(--text-dim);}
  .dd-delta.up{background:rgba(79,174,108,.16);color:var(--green);}
  .dd-delta.down{background:rgba(226,85,76,.16);color:var(--red);}
  .dd-empty{color:var(--text-faint);font-size:12.5px;padding:8px 0;}
  .dd-hours svg{width:100%;height:auto;display:block;overflow:visible;}
  .dd-note{font-size:11px;color:var(--text-faint);margin-top:8px;}
  .chart-wrap circle[data-iso]{cursor:pointer;}
  .sticky-head-block .tbl-head{margin-bottom:12px;}
  .sticky-head-block .tbl-toolbar{margin:0 0 10px;}
  .grid-scroll-head{border:1px solid var(--border-soft);border-radius:4px 4px 0 0;border-bottom:none;overflow:hidden;background:var(--panel-alt);}
  .grid-scroll-head .grid-row.head{border-bottom:none;}

  .grid-scroll{border:1px solid var(--border-soft);border-radius:0 0 4px 4px;overflow:hidden;background:var(--panel);}
  #gridInner{transform-origin:top left;}
  .grid-row{display:grid;align-items:stretch;}
  .grid-row.head{
    background:var(--panel-alt);
    border-bottom:1px solid var(--border);
  }
  .grid-row.head .cell{
    font-size:10.5px;color:var(--text-dim);font-weight:500;padding:10px 8px;
    border-right:1px solid var(--border-soft);display:flex;align-items:center;line-height:1.25;
  }
  .grid-row.data{border-bottom:1px solid var(--border-soft);}
  .grid-row.data:hover{background:rgba(255,255,255,.015);}
  .grid-row .cell{
    padding:6px 8px;border-right:1px solid var(--border-soft);display:flex;align-items:center;
  }
  .grid-row .cell:last-child, .grid-row.head .cell:last-child{border-right:none;}
  .grid-row.head .head-actions-cell{padding:6px 8px;justify-content:center;}
  .head-actions-cell .btn{width:100%;justify-content:center;white-space:nowrap;}
  .cellval{
    width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    font-size:13px;padding:6px 6px;border-radius:3px;
  }
  .cellval:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .cellval:disabled{color:var(--text-dim);}
  select.cellval{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2398a3ad'/></svg>");background-repeat:no-repeat;background-position:right 6px center;padding-right:18px;}
  select.cellval:disabled{background-image:none;}
  .cellval.computed{color:var(--yellow);font-family:'IBM Plex Mono',monospace;font-weight:500;background:transparent;border-color:transparent;}
  .rowactions{display:flex;align-items:center;justify-content:center;gap:4px;}
  .icon-btn{
    width:24px;height:24px;border-radius:3px;border:1px solid var(--border);background:transparent;
    color:var(--text-faint);font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .icon-btn.print-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.cli-btn.has{border-color:var(--teal);color:var(--teal);}
  .icon-btn.cli-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.drag-btn{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:14px;letter-spacing:-1px;}
  .icon-btn.drag-btn:hover{border-color:var(--yellow);color:var(--yellow);}
  .icon-btn.drag-btn:active{cursor:grabbing;}
  /* a linha (venda) e o toggle/detalhe dela viajam juntos como um único bloco
     durante o arraste, pra não ter mais aquele "descolamento" visual entre
     a linha principal e os detalhes abertos abaixo dela */
  .row-group{position:relative;}
  /* o bloco arrastado fica "levantado" e gruda no cursor/dedo, igual a aba de
     navegador; as outras linhas abrem espaço deslizando em tempo real */
  .row-group.row-dragging{
    z-index:30;
    background:var(--panel-alt);
    border-radius:4px;
    box-shadow:0 0 0 1px var(--yellow), 0 12px 26px rgba(0,0,0,.5);
    will-change:transform;
  }
  .row-group.row-dragging .grid-row{background:transparent;border-bottom-color:transparent;}
  .row-group.row-dragging .grid-row.data{border-bottom:none;}
  /* deslizar das linhas que abrem espaço + encaixe final do bloco arrastado */
  .row-group.row-shifting{transition:transform .17s cubic-bezier(.2,.8,.2,1);}
  body.grid-dragging{cursor:grabbing;}
  body.grid-dragging .grid-row.data:hover{background:transparent;}

  /* linha com quantidade x valor que não bate (ex: 3 bicos mas R$ 0,00) */
  .cell.cell-warn{box-shadow:inset 0 0 0 1.5px var(--yellow);background:rgba(245,183,0,.08);border-radius:3px;}

  /* barra com os filtros/atalhos acima da tabela do dia */
  .tbl-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px;}
  .count-badge{display:inline-block;background:rgba(0,0,0,.25);border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;}

  /* toast de "linha apagada — desfazer" */
  .undo-toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;
    background:#20262c;border:1px solid var(--border);color:var(--text);
    padding:10px 10px 10px 16px;border-radius:8px;display:flex;align-items:center;gap:14px;
    font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  .undo-toast .undo-btn{
    background:var(--yellow);color:#1a1500;border:none;border-radius:5px;
    padding:6px 12px;font-size:12.5px;font-weight:600;
  }

  .detail-toggle-row{grid-column:1/-1;padding:0;background:var(--panel-alt);}
  .detail-toggle{
    width:100%;background:transparent;border:none;border-top:1px solid var(--border-soft);
    color:var(--text-faint);font-size:11px;padding:4px 12px;text-align:left;
    display:flex;align-items:center;gap:6px;
  }
  .detail-toggle:hover{color:var(--yellow);}
  .detail-toggle .car{transition:transform .15s;display:inline-block;}
  .detail-toggle.open .car{transform:rotate(90deg);}
  .detail-box{grid-column:1/-1;padding:12px 16px 16px;background:var(--panel-alt);border-top:1px solid var(--border-soft);}
  .detail-box label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:6px;}
  .detail-box textarea{
    width:100%;min-height:64px;background:var(--panel);border:1px solid var(--border);border-radius:3px;
    color:var(--text);padding:8px 10px;font-size:13px;resize:vertical;
  }
  .detail-box textarea:focus{outline:none;border-color:var(--yellow);}

  .tbl-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .empty-state{padding:44px 20px;text-align:center;color:var(--text-faint);}
  .empty-state p{margin-bottom:14px;font-size:13.5px;}

  /* ---- modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,14,.7);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:24px 26px;width:100%;max-width:340px;
  }
  .modal.wide{max-width:440px;}
  .modal h3{font-size:15px;margin-bottom:6px;}
  .modal p{font-size:12.5px;color:var(--text-dim);margin:0 0 16px;line-height:1.5;}
  .modal input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:10px 12px;font-size:14px;margin-bottom:10px;letter-spacing:2px;
  }
  .modal .field-group input{letter-spacing:normal;margin-bottom:12px;}
  .modal input.search-input{letter-spacing:normal;}
  .modal .field-group label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;}
  .modal input:focus{outline:none;border-color:var(--yellow);}
  .modal .err{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .cust-list{max-height:280px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:4px;margin-bottom:4px;}
  .cust-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    background:transparent;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);
    padding:10px 12px;font-size:13px;
  }
  .cust-item:last-child{border-bottom:none;}
  .cust-item:hover{background:var(--panel-alt);}
  .cust-item.sel{background:var(--panel-alt);border-left:3px solid var(--yellow);padding-left:9px;}
  .cust-name{color:var(--text);font-weight:500;}
  .cust-sub{color:var(--text-faint);font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
  .cust-empty{padding:20px 12px;text-align:center;color:var(--text-faint);font-size:12.5px;}

  .dash-cust-search{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:9px 12px;font-size:13px;margin-bottom:10px;
  }
  .dash-cust-search:focus{outline:none;border-color:var(--yellow);}
  .cust-detail-name{font-size:14px;color:var(--text);font-weight:500;}
  .cust-detail-sub{color:var(--text-faint);font-size:12px;margin-top:2px;}

  .backlink{color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:6px;border:none;background:transparent;padding:6px 0;}

  /* ---- login de acesso ao site ---- */
  .login-screen{min-height:82vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:34px 32px;width:100%;max-width:360px;}
  .login-card .brand{margin-bottom:18px;}
  .login-card p.hint{font-size:12.5px;color:var(--text-dim);margin:0 0 20px;line-height:1.5;}
  .login-card input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:10px 12px;font-size:14px;margin-bottom:10px;
  }
  .login-card input:focus{outline:none;border-color:var(--yellow);}
  .login-card .err{color:var(--red);font-size:12px;margin:-2px 0 12px;min-height:14px;}
  .login-card button.btn{width:100%;justify-content:center;padding:11px;font-size:14px;margin-top:4px;}
  .backlink:hover{color:var(--yellow);}

  /* ==========================================================================
     AJUSTES SOMENTE PARA TELA DE CELULAR — não afeta a versão de computador
     ========================================================================== */
  @media(max-width:700px){
    #app, #app.wide{padding:12px 10px 60px;}

    /* topo: deixa quebrar linha em vez de espremer tudo numa fileira só */
    .topbar{flex-wrap:wrap;gap:10px;padding:10px 0 14px;margin-bottom:16px;}
    .brand{flex-wrap:wrap;gap:6px;}
    .brand h1{font-size:17px;}
    .brand span.tag{display:none;} /* subtítulo técnico não cabe e não faz falta no celular */
    .sync-badge{margin-left:0;}
    .auth-zone{width:100%;justify-content:flex-start;gap:6px;}
    .btn{padding:8px 11px;font-size:12.5px;}
    .btn.small{padding:6px 9px;font-size:11.5px;}

    /* cabeçalho do dia (data + adicionar linha) */
    .tbl-head{gap:8px;}
    .tbl-head h2{font-size:16px;}
    .tbl-head-left{gap:8px;flex-wrap:wrap;}
    .day-nav button{width:30px;height:30px;}

    /* resumo do mês (número grande de faturamento) */
    .hero-left{padding:18px 16px;}
    .hero-right{padding:16px 14px 12px;}
    .big-total{font-size:30px;}
    .big-total .cents{font-size:18px;}
    .hero-left .sub{margin-bottom:16px;}
    .month-nav .label{font-size:11.5px;}

    /* cartões de meta diária e peças/vendedores */
    .dt-card{padding:13px 14px;}
    .dt-value{font-size:20px;}
    .parts-visor{gap:8px;}
    .parts-card{padding:12px 13px;}
    .parts-card .pc-value{font-size:19px;}

    /* barras de totais do dia: cartões menores, cabem mais por linha */
    .tstat{min-width:96px;padding:9px 10px;flex:1 1 30%;}
    .tstat .k{font-size:9.5px;}
    .tstat .v{font-size:13px;}

    /* tabela de vendas: em vez de encolher o texto até ficar ilegível,
       deixa a tabela no tamanho normal e permite arrastar o dedo pros lados */
    .grid-scroll, .grid-scroll-head{overflow-x:auto;-webkit-overflow-scrolling:touch;height:auto !important;}
    #gridInner, .grid-scroll-head .grid-row.head{transform:none !important;}
    .grid-row .cell{font-size:12.5px;padding:7px 7px;}
    .grid-row.head .cell{font-size:10px;padding:9px 7px;}
    .icon-btn{width:26px;height:26px;}

    /* modais e telas de login/estoque/histórico/usuários */
    .login-card{padding:24px 18px;max-width:100%;}
    .modal{padding:18px 16px;max-width:92vw;}
    .cust-list{max-height:220px;}

    /* listas de histórico (logins / movimentações de estoque) e usuários */
    .arow{flex-wrap:wrap;gap:6px 14px;padding:10px 12px;font-size:12.5px;}
    .arow .stats{flex-wrap:wrap;gap:8px 14px;}
  }
</style>

<style id="oficina-redesign">
:root{
  --bg:#0d1114;--panel:#151b20;--panel-alt:#1b2329;--border:#34414a;--border-soft:#253039;
  --text:#f4f5f2;--text-dim:#aab4ba;--text-faint:#74818a;--yellow:#ffc400;--yellow-dim:#846b11;
  --teal:#37c9bd;--red:#ef6157;--green:#5dc779;
}
html{background:var(--bg);scrollbar-color:var(--border) var(--bg)}
body{min-height:100vh;background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px);background-size:100% 28px}
body:before{content:"";position:fixed;inset:0 0 auto;height:4px;background:var(--yellow);z-index:1000}
#app{max-width:1280px;padding:22px 24px 96px}
.topbar{position:relative;padding:16px 0 20px;margin-bottom:22px;border-bottom:1px solid var(--border)}
.brand{gap:12px}.brand .mark{width:14px;height:14px;border-radius:2px;box-shadow:0 0 0 4px rgba(255,196,0,.1)}
.brand h1{font-size:25px;text-transform:uppercase}.brand span.tag{letter-spacing:.05em}
.panel,.dash-hero,.daily-detail,.archive,.login-card,.modal,.estoque-wrap,.clientes-wrap,.usuarios-wrap,.historico-wrap{box-shadow:0 14px 38px rgba(0,0,0,.18)}
button,.btn,input,select,textarea{border-radius:4px!important}
.btn{min-height:38px;font-weight:600;transition:border-color .16s ease,background .16s ease,color .16s ease,transform .16s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 5px 14px rgba(255,196,0,.12)}
.dash-hero{border-color:var(--border);background:linear-gradient(135deg,var(--panel) 0%,var(--panel-alt) 100%);overflow:hidden;position:relative}
.dash-hero:after{content:"";position:absolute;right:-50px;top:-70px;width:170px;height:170px;border:18px solid rgba(255,196,0,.045);border-radius:50%;pointer-events:none}
.big-number,.hero-value,.dd-total{font-variant-numeric:tabular-nums}.progress-fill,.bar-fill{background:var(--yellow)!important}
.parts-card,.seller-card,.daily-target-card,.stat-card{border-top:2px solid var(--yellow)!important;background:var(--panel)!important}
.table-wrap,.estoque-table-wrap{border:1px solid var(--border);border-radius:6px;background:var(--panel);box-shadow:0 14px 35px rgba(0,0,0,.2)}
thead th{background:#10161a!important;color:var(--text-dim)!important;text-transform:uppercase;letter-spacing:.06em;font-size:10px!important}
tbody tr:hover{background:rgba(255,196,0,.035)}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(255,196,0,.22)!important;outline-offset:-1px;border-color:var(--yellow)!important}
.modal-overlay{backdrop-filter:blur(8px);background:rgba(5,8,10,.78)!important}
.sync-badge{border-radius:3px!important}
@media(max-width:700px){
  body{background-size:100% 24px}
  #app,#app.wide{width:100%;max-width:none;padding:12px 12px 92px}
  .topbar{position:sticky;top:0;z-index:30;margin:0 -12px 14px;padding:14px 12px 12px;background:rgba(13,17,20,.96);backdrop-filter:blur(12px);gap:10px}
  .brand{width:100%;align-items:center}.brand h1{font-size:20px}.brand span.tag{font-size:10px;flex:1}.brand .mark{width:11px;height:11px}
  .auth-zone{width:100%;display:flex;overflow-x:auto;gap:7px;padding:0 0 3px;scrollbar-width:none;flex-wrap:nowrap!important}.auth-zone::-webkit-scrollbar{display:none}
  .auth-zone .btn,.auth-zone .pill,.auth-zone .sync-badge{flex:0 0 auto;white-space:nowrap;min-height:36px}
  .dash-title-row,.screen-head,.section-head,.dd-head{align-items:flex-start!important;gap:10px;flex-wrap:wrap!important}
  .dash-title-row>*:first-child,.screen-head>*:first-child{min-width:0;flex:1}
  h2{font-size:18px!important}.dash-sub,.subtitle{font-size:11px!important;line-height:1.45}
  .dash-hero{padding:18px 16px!important;border-radius:6px!important}.dash-hero .hero-value,.big-number{font-size:34px!important;line-height:1.05}
  .hero-grid,.summary-row,.secondary-row,.parts-grid,.seller-grid,.daily-targets{grid-template-columns:1fr 1fr!important;gap:8px!important}
  .parts-card,.seller-card,.daily-target-card,.stat-card{min-width:0;padding:12px!important;border-radius:5px!important}
  .pc-label,.dt-label{font-size:10px!important}.pc-value,.dt-value{font-size:18px!important;overflow-wrap:anywhere}.pc-qty,.dt-percent{font-size:9px!important}
  .archive{padding:14px!important;border-radius:5px!important}.archive-list{gap:7px!important}.arow{padding:12px!important;gap:8px!important}
  .table-screen{min-width:0}.table-toolbar,.filter-bar,.day-actions{display:flex!important;overflow-x:auto;flex-wrap:nowrap!important;gap:7px;padding-bottom:5px;scrollbar-width:none}.table-toolbar::-webkit-scrollbar,.filter-bar::-webkit-scrollbar,.day-actions::-webkit-scrollbar{display:none}.table-toolbar>* ,.filter-bar>* ,.day-actions>*{flex:0 0 auto}
  .table-wrap,.estoque-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  table{font-size:12px!important}th,td{min-height:44px!important}td input,td select{font-size:16px!important;min-height:42px!important}
  .row-actions{position:sticky;right:0;background:var(--panel);box-shadow:-8px 0 14px rgba(0,0,0,.22)}
  .dd-summary,.dd-totals{grid-template-columns:1fr 1fr!important;gap:8px!important}.dd-box{padding:11px!important}.dd-chart{overflow-x:auto}
  .modal{width:calc(100vw - 20px)!important;max-width:none!important;max-height:88vh!important;padding:18px 14px!important;border-radius:6px!important}.modal-actions{position:sticky;bottom:0;background:var(--panel);padding-top:10px}
  .form-grid,.customer-grid,.estoque-form,.orc-grid{grid-template-columns:1fr!important}.login-screen{min-height:calc(100vh - 28px)}.login-card{padding:24px 18px;border-radius:6px!important}
  .history-row,.user-row,.customer-row{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;padding:13px!important}
}
@media(max-width:430px){
  .hero-grid,.summary-row,.secondary-row{grid-template-columns:1fr!important}
  .parts-grid,.seller-grid,.daily-targets{grid-template-columns:1fr 1fr!important}
  .dash-hero .hero-value,.big-number{font-size:31px!important}
  .btn{padding-left:10px!important;padding-right:10px!important}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
<style id="oficina-novidades">
  /* ---- skeleton de carregamento inicial ---- */
  .app-skeleton{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}
  .sk-row{background:linear-gradient(90deg,var(--panel) 25%,var(--panel-alt) 37%,var(--panel) 63%);
    background-size:400% 100%;animation:skShimmer 1.4s ease infinite;border-radius:8px;}
  @keyframes skShimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  .sk-topbar{height:44px;margin-bottom:24px;}
  .sk-hero{height:160px;margin-bottom:18px;}
  .sk-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .sk-card{height:70px;}
  .sk-list{height:44px;margin-bottom:8px;}

  /* ---- indicador de meta do dia (barra fixa no topo) ---- */
  .today-goal-bar{margin:-4px 2px 18px;background:var(--panel);border:1px solid var(--border-soft);border-radius:8px;
    padding:10px 14px;display:flex;align-items:center;gap:12px;}
  .today-goal-bar .tg-label{font-size:12px;color:var(--text-dim);white-space:nowrap;}
  .today-goal-bar .tg-track{flex:1;height:8px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .today-goal-bar .tg-fill{height:100%;background:var(--yellow);border-radius:99px;transition:width .5s ease;}
  .today-goal-bar .tg-fill.reached{background:var(--green);}
  .today-goal-bar .tg-pct{font-size:12px;color:var(--text);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
  .today-goal-bar.reached{border-left:3px solid var(--green);}
  .today-goal-bar:not(.reached){border-left:3px solid var(--yellow);}

  /* ---- badges de aviso na navegação ---- */
  .nav-badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:99px;
    padding:1px 6px;margin-left:5px;font-family:'IBM Plex Mono',monospace;}

  /* ---- notas e avisos ---- */
  .nota-row, .aviso-row{background:var(--panel);border:1px solid var(--border-soft);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .nota-row .nota-num{font-family:'IBM Plex Mono',monospace;color:var(--yellow);font-size:13px;font-weight:600;}
  .nota-row .nota-meta{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .nota-row .nota-valor{font-family:'IBM Plex Mono',monospace;font-size:15px;}

    if (cloudStatus==="on") return '<span id="syncBadge" class="sync-badge on" title="Sincronizado com a nuvem">● nuvem conectada</span>';
    if (cloudStatus==="error") return '<span id="syncBadge" class="sync-badge error" title="Falha ao conectar com a nuvem — dados continuam salvos localmente">⚠ erro de conexão</span>';
    return '<span id="syncBadge" class="sync-badge connecting" title="Conectando à nuvem...">○ conectando…</span>';
  }

  // envia uma chave (já salva localmente) para a tabela kv_store no Supabase
  function cloudPush(key, value){
    if (!sb) return;
    sb.from("kv_store").upsert({key:key, value:value, updated_at:new Date().toISOString()})
      .then(function(res){
        if (res && res.error){ cloudStatus = "error"; console.error("Erro ao sincronizar", key, res.error); }
        else {
          // esta alteração vai voltar pra nós mesmos pelo canal em tempo real daqui a pouco;
          // marcamos que esperamos esse "eco" pra não tratá-lo como mudança de outro aparelho
          pendingEchoKeys[key] = (pendingEchoKeys[key]||0) + 1;
          if (cloudStatus!=="on"){ cloudStatus = "on"; refreshSyncBadge(); }
        }
      });
  }

  // baixa tudo da nuvem e grava no localStorage (usado ao abrir o app)
  // cb recebe true se a nuvem já tinha dados, false se estava vazia
  function cloudPullAll(cb){
    if (!sb) return cb(false);
    sb.from("kv_store").select("key,value").then(function(res){
      var hadData = false;
      if (res && !res.error && res.data){
        hadData = res.data.length>0;
        res.data.forEach(function(row){
          try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        });
        cloudStatus = "on";
      } else {
        cloudStatus = "error";
        if (res && res.error) console.error("Erro ao baixar dados da nuvem", res.error);
      }
      cb(hadData);
    }).catch(function(err){ cloudStatus = "error"; console.error(err); cb(false); });
  }

  // envia TUDO que já está salvo neste navegador pra nuvem de uma vez
  // (usado na primeira ativação, e também pelo botão manual "Enviar pra nuvem")
  function pushAllLocalToCloud(){
    if (!sb) return 0;
    var n = 0;
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (!k || k.indexOf("vo_")!==0 || k===K_AUTOBACKUP) continue;
      try{
        var val = JSON.parse(localStorage.getItem(k));
        cloudPush(k, val);
        n++;
      }catch(e){ /* ignora chave que não seja JSON válido */ }
    }
    return n;
  }

  // escuta mudanças feitas em OUTROS aparelhos e atualiza a tela na hora
  function initCloudSync(onRemoteChange){
    if (!sb) return;
    sb.channel("kv_store_changes")
      .on("postgres_changes", {event:"*", schema:"public", table:"kv_store"}, function(payload){
        var row = payload.new;
        if (!row || !row.key) return;
        try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        if (pendingEchoKeys[row.key] > 0){
          // é só o eco da nossa própria digitação/salvamento — os dados já estão certos localmente,
          // então não precisamos redesenhar a tela (isso é o que tirava o foco de quem estava digitando)
          pendingEchoKeys[row.key]--;
          return;
        }
        onRemoteChange(row.key);
      })
      .subscribe(function(status){
        if (status==="SUBSCRIBED"){ cloudStatus = "on"; refreshSyncBadge(); }
      });
  }

  function lsGetJSON(key, fallback){

  }
  function lsSetJSON(key, obj){
    try{
      localStorage.setItem(key, JSON.stringify(obj));
      cloudPush(key, obj);
      return true;
    }
    catch(e){ return false; }
  }

  function computeValor(row){
    return parseNum(row.alinhamento)+parseNum(row.valorBicos)+parseNum(row.valorCambagem)+
           parseNum(row.valorBalanceamento)+parseNum(row.valorRodas)+parseNum(row.outros)+
           parseNum(row.valorPecas)+parseNum(row.maoDeObra)+parseNum(row.valorPneus);
  }
  // divide o valor da linha entre as formas de pagamento reais (Dinheiro/Pix/Débito/Crédito).
  // quando a forma escolhida é combinada (ex: "Débito/Crédito"), usa o valor manual definido
  // em row.splitValor pra primeira forma listada; se não foi definido, divide meio a meio.
  function paymentBreakdown(row){
    var buckets = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    var fp = row.formaPagamento;
    var total = computeValor(row);
    if (!fp || fp==="Nenhum" || total===0) return buckets;
    if (fp.indexOf("Múltiplo")===0){
      var lista = Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos : [];
      lista.forEach(function(p){
        if (p && p.metodo && buckets.hasOwnProperty(p.metodo)){
          buckets[p.metodo] += Math.max(0, parseNum(p.valor));
        }
      });
      return buckets;
    }
    if (fp.indexOf("/")===-1){
      if (buckets.hasOwnProperty(fp)) buckets[fp] = total;
      return buckets;
    }
    var parts = fp.split("/");
    var first = parts[0], second = parts[1];
    var firstVal = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="")
      ? Math.max(0, Math.min(parseNum(row.splitValor), total))
      : total/2;
    var secondVal = total - firstVal;
    if (buckets.hasOwnProperty(first)) buckets[first] += firstVal;
    if (buckets.hasOwnProperty(second)) buckets[second] += secondVal;
    return buckets;
  }
  function saveRows(date, rows){
    var ok1 = lsSetJSON(K_ROWS+date, rows);
    var month = date.slice(0,7);
    var summary = lsGetJSON(K_SUMMARY+month, {});
    var total = 0;
    for (var i=0;i<rows.length;i++) total += computeValor(rows[i]);
    summary[date] = {total: total, count: rows.length};
    var ok2 = lsSetJSON(K_SUMMARY+month, summary);
    if (!ok1 || !ok2){
      return Promise.reject(new Error("Não foi possível salvar — armazenamento do navegador cheio ou bloqueado."));
    }
    return Promise.resolve();
  }

  // ---------- estoque (medida, marca, quantidade, preço) ----------
  function loadEstoque(){ return lsGetJSON(K_ESTOQUE, []); }
  function saveEstoque(list){ return lsSetJSON(K_ESTOQUE, list); }
  function estoqueItem(id){ return loadEstoque().filter(function(i){ return i.id===id; })[0] || null; }

        Object.keys(changes).forEach(function(k){ list[i][k] = changes[k]; });
        list[i].quantidade = Math.max(0, parseNum(list[i].quantidade));
        list[i].preco = Math.max(0, parseNum(list[i].preco));
        list[i].minimo = Math.max(0, parseNum(list[i].minimo));

      }
    }
    saveEstoque(list);
  }
  // estoque abaixo do mínimo definido (só considera itens com mínimo >0 configurado)
  function estoqueBaixoList(){
    return loadEstoque().filter(function(i){
      var min = Math.max(0, parseNum(i.minimo));
      return min>0 && Math.max(0, parseNum(i.quantidade)) < min;
    });
  }
  function deleteEstoqueItem(id){
    saveEstoque(loadEstoque().filter(function(i){ return i.id!==id; }));

  // apaga um item do estoque mas permite desfazer por alguns segundos
  function deleteEstoqueItemWithUndo(id, onDone){
    var list = loadEstoque();
    var idx=-1, item=null;
    for (var i=0;i<list.length;i++){ if (list[i].id===id){ idx=i; item=list[i]; break; } }
    if (idx===-1) return;
    list.splice(idx,1);
    saveEstoque(list);
    onDone();
    showUndoToast("Item apagado do estoque", function(){
      var list2 = loadEstoque();
      list2.splice(Math.min(idx,list2.length), 0, item);
      saveEstoque(list2);

  }
  // movimenta o estoque de um item: delta positivo entra, negativo sai.
  // nunca deixa negativo — se faltar, para no 0. devolve quanto realmente mexeu.
  function moveEstoque(id, delta){
    if (!id || !delta) return 0;
    var list = loadEstoque();
    var moved = 0;
    for (var i=0;i<list.length;i++){
      if (list[i].id===id){
        var atual = Math.max(0, parseNum(list[i].quantidade));
        var novo = atual + delta;
        if (novo < 0) novo = 0;
        moved = novo - atual;
        list[i].quantidade = novo;
        break;
      }
    }
    if (moved !== 0) saveEstoque(list);
    return moved;
  }
  // acerta a baixa de estoque de uma linha de venda conforme a medida e a quantidade escolhidas
  function syncRowEstoque(row){
    var desejada = row.medidaId ? Math.max(0, parseNum(row.quantidade)) : 0;
    var jaBaixado = Math.max(0, parseNum(row.medidaBaixa));
    var delta = desejada - jaBaixado;
    if (delta === 0) return;
    var moved = moveEstoque(row.medidaId, -delta);
    // saiu estoque de verdade por causa da venda: registra no histórico como "venda" (nunca como "ajuste")
    if (moved < 0){
      var item = estoqueItem(row.medidaId);
      addEstoqueLog("venda", estoqueLabel(item) || row.medida || "", Math.abs(moved));
    }
    row.medidaBaixa = jaBaixado - moved; // moved vem negativo quando saiu do estoque
  }
  // ---------- avisos: clientes procurando uma medida ----------
  function loadProcurados(){ return lsGetJSON(K_PROCURADOS, []); }
  function saveProcurados(list){ return lsSetJSON(K_PROCURADOS, list); }
  function addProcurado(obj){
    var list = loadProcurados();
    obj.id = uid();
    obj.createdAt = Date.now();
    obj.resolved = false;
    obj.matched = false;
    list.push(obj);
    saveProcurados(list);
    return obj;
  }
  function deleteProcuradoWithUndo(id, onDone){
    var list = loadProcurados();
    var idx=-1, item=null;
    for (var i=0;i<list.length;i++){ if (list[i].id===id){ idx=i; item=list[i]; break; } }
    if (idx===-1) return;
    list.splice(idx,1);
    saveProcurados(list);
    onDone();
    showUndoToast("Aviso apagado", function(){
      var list2 = loadProcurados();
      list2.splice(Math.min(idx,list2.length), 0, item);
      saveProcurados(list2);
      onDone();
    });
  }
  function resolveProcurado(id){
    var list = loadProcurados();
    list.forEach(function(p){ if (p.id===id) p.resolved = true; });
    saveProcurados(list);
  }
  // chamado toda vez que entra estoque de uma medida — avisa quem estava esperando essa medida
  function checkProcuradosOnEntrada(medidaLabel){
    var alvo = (medidaLabel||"").toLowerCase();
    if (!alvo) return;
    var list = loadProcurados();
    var mudou = false;
    list.forEach(function(p){
      if (p.resolved || p.matched) return;
      var termo = (p.medida||"").toLowerCase().trim();
      if (termo && alvo.indexOf(termo)>-1){
        p.matched = true;
        mudou = true;
        if (window.uiToast) window.uiToast("🔔 "+(p.cliente||"Cliente")+" está esperando "+p.medida+" — acabou de chegar em estoque!", "ok", 9000);
      }
    });
    if (mudou) saveProcurados(list);
  }

  // marca como conferido hoje; se tiver repetição, agenda o próximo lembrete daqui a X dias
  function completeLembrete(id){
    var list = loadLembretes();
    list.forEach(function(l){
      if (l.id!==id) return;
      var rep = parseInt(l.repetirDias||0, 10);
      if (rep>0){ l.proximo = addDays(today, rep); }
      else { l.proximo = null; l.feito = true; }
    });
    saveLembretes(list);
  }
  function lembretesVencidos(){
    return loadLembretes().filter(function(l){ return !l.feito && l.proximo && l.proximo<=today; });
  }
  function avisosPendentesCount(){
    var procurados = loadProcurados().filter(function(p){ return !p.resolved && p.matched; }).length;
    var lembretes = lembretesVencidos().length;
    var baixo = estoqueBaixoList().length;
    return procurados + lembretes + baixo;

  // ---------- gerar o PDF da nota (mesmo layout da impressão) ----------
  function renderNotaToCanvas(nota, cb){
    var full = buildNotaHtml(nota);
    var styleMatch = full.match(/<style>[\s\S]*?<\/style>/);
    var bodyMatch = full.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    var container = document.createElement("div");
    container.style.position = "fixed";
    container.style.left = "-10000px";
    container.style.top = "0";
    container.style.width = "780px";
    container.style.background = "#ffffff";
    container.innerHTML = (styleMatch?styleMatch[0]:"") + (bodyMatch?bodyMatch[1]:full);
    document.body.appendChild(container);
    window.html2canvas(container, {scale:2, backgroundColor:"#ffffff"}).then(function(canvas){
      document.body.removeChild(container);
      cb(canvas);
    }).catch(function(err){
      document.body.removeChild(container);
      console.error("Erro ao gerar PDF", err);
      cb(null);
    });
  }
  function canvasToPdfBlob(canvas){
    var imgData = canvas.toDataURL("image/jpeg", 0.92);
    var pdf = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var imgWidth = pageWidth;
    var imgHeight = canvas.height * (imgWidth/canvas.width);
    var heightLeft = imgHeight;
    var position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    return pdf.output("blob");
  }

  function parseNum(v){
    if (v===undefined||v===null||v==="") return 0;

  }
  function fmtCurrency(n){
    return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fromISO(s){ var p=s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function fmtDateBR(iso){ var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function fmtDateTimeBR(isoDateTime){
    var d = new Date(isoDateTime);
    if (isNaN(d.getTime())) return "—";
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    return dd+"/"+mm+"/"+yy+" às "+hh+":"+mi;
  }
  function daysInMonth(monthStr){ var p=monthStr.split("-"); return new Date(parseInt(p[0]), parseInt(p[1]), 0).getDate(); }
  function monthLabel(monthStr){
    var p=monthStr.split("-"); var d=new Date(parseInt(p[0]), parseInt(p[1])-1, 1);
    return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  }
  function weekdayLabel(iso){
    return fromISO(iso).toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
  }
  function addMonths(monthStr, delta){
    var p=monthStr.split("-"); var d=new Date(parseInt(p[0]), parseInt(p[1])-1+delta, 1);
    return d.getFullYear()+"-"+pad(d.getMonth()+1);
  }
  function addDays(iso, delta){
    var d=fromISO(iso); d.setDate(d.getDate()+delta); return toISO(d);
  }

  // ---------- feriados nacionais (não trabalhamos aos domingos nem feriados) ----------
  var nationalHolidaysCache = {};
  function easterISO(year){
    // algoritmo de Meeus/Jones/Butcher
    var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return toISO(new Date(year, month-1, day));
  }
  function nationalHolidays(year){
    if (nationalHolidaysCache[year]) return nationalHolidaysCache[year];
    var easter = easterISO(year);
    var list = [
      year+"-01-01",              // confraternização universal
      addDays(easter, -48),       // carnaval (segunda)
      addDays(easter, -47),       // carnaval (terça)
      addDays(easter, -2),        // sexta-feira santa
      year+"-04-21",              // tiradentes
      year+"-05-01",              // dia do trabalho
      addDays(easter, 60),        // corpus christi
      year+"-09-07",              // independência
      year+"-10-12",              // n. sra. aparecida
      year+"-11-02",              // finados
      year+"-11-15",              // proclamação da república
      year+"-12-25"               // natal
    ];
    if (year>=2024) list.push(year+"-11-20"); // consciência negra (feriado nacional desde 2024)
    nationalHolidaysCache[year] = list;
    return list;
  }
  function isBusinessDay(iso){
    if (fromISO(iso).getDay()===0) return false; // domingo
    return nationalHolidays(parseInt(iso.slice(0,4),10)).indexOf(iso)===-1;
  }
  // conta dias úteis (sem domingo/feriado) de fromDay até o fim do mês
  function countBusinessDays(monthStr, fromDayInclusive){
    var nd = daysInMonth(monthStr);
    var count = 0;
    for (var day=fromDayInclusive; day<=nd; day++){
      if (isBusinessDay(monthStr+"-"+pad(day))) count++;
    }
    return count;
  }

  // ---------- encolhe a tabela para caber na largura da tela, sem scroll lateral ----------
  var fitRAF = null;
  function fitGridToWidth(){
    var wrap = document.querySelector(".grid-scroll");
    var inner = document.getElementById("gridInner");
    var headWrap = document.querySelector(".grid-scroll-head");
    var headRow = headWrap ? headWrap.querySelector(".grid-row.head") : null;
    if (!wrap || !inner) return;
    inner.style.transform = "none";
    wrap.style.height = "";
    if (headRow) headRow.style.transform = "none";
    if (headWrap) headWrap.style.height = "";

    var naturalWidth = Math.max(inner.scrollWidth, headRow ? headRow.scrollWidth : 0);
    var naturalHeight = inner.scrollHeight;
    var headNaturalHeight = headRow ? headRow.scrollHeight : 0;
    var available = wrap.clientWidth;
    var scale = available > 0 && naturalWidth > available ? (available / naturalWidth) : 1;
    if (scale < 1){
      inner.style.transform = "scale(" + scale + ")";
      wrap.style.height = Math.ceil(naturalHeight * scale) + "px";
      if (headRow){
        headRow.style.transform = "scale(" + scale + ")";
        headRow.style.transformOrigin = "top left";
        if (headWrap) headWrap.style.height = Math.ceil(headNaturalHeight * scale) + "px";
      }
    }
  }
  function scheduleFitGrid(){
    if (fitRAF) cancelAnimationFrame(fitRAF);
    fitRAF = requestAnimationFrame(fitGridToWidth);

  function loadDashboardData(cb){
    var need = [];
    if (!state.monthSummaryCache[state.dashMonth]) need.push(state.dashMonth);
    var ym = yesterday.slice(0,7);
    if (!state.monthSummaryCache[ym]) need.push(ym);
    var jobs = need.map(function(m){ return getSummary(m).then(function(s){ state.monthSummaryCache[m]=s; }); });
    if (!state.monthPartsCache[state.dashMonth]){
      jobs.push(loadMonthParts(state.dashMonth).then(function(totals){ state.monthPartsCache[state.dashMonth]=totals; }));
    }
    if (jobs.length===0) return cb();
    Promise.all(jobs).then(cb);
  }

  // soma qtd./valor de bicos, cambagens e rodas em todos os dias lançados no mês
  function loadMonthParts(month){
    var dates = listAllDates().filter(function(d){ return d.slice(0,7)===month; });
    return Promise.all(dates.map(function(d){ return getRows(d); })).then(function(allRows){
      var t = {qtdBicos:0, valorBicos:0, qtdCambagem:0, valorCambagem:0, qtdRodas:0, valorRodas:0, porVendedor:{}};
      VENDEDORES.forEach(function(v){ if (v!=="Nenhum") t.porVendedor[v] = {count:0, total:0}; });
      allRows.forEach(function(rows){
        rows.forEach(function(r){
          t.qtdBicos += parseNum(r.qtdBicos);
          t.valorBicos += parseNum(r.valorBicos);
          t.qtdCambagem += parseNum(r.qtdCambagem);
          t.valorCambagem += parseNum(r.valorCambagem);
          t.qtdRodas += parseNum(r.qtdRodas);
          t.valorRodas += parseNum(r.valorRodas);
          var v = r.vendedor;
          if (v && t.porVendedor[v]){
            t.porVendedor[v].count += 1;
            t.porVendedor[v].total += computeValor(r);
          }
        });
      });
      return t;
    });
  }

        filtered.map(function(c){

            '<span class="cust-sub">'+(sub?escHtml(sub)+' · ':'')+count+' nota(s)</span>'+

            return '<div class="arow">'+

              '<button class="icon-btn" data-delnota="'+escAttr(n.id)+'" title="Apagar nota">✕</button></span>'+
            '</div>';
          }).join("")
        : '<div class="arow-empty">Nenhuma nota registrada para este cliente ainda.</div>';
      area.innerHTML =
        '<button class="backlink" id="custBack" style="padding:4px 0 10px;">‹ Voltar aos clientes</button>'+
        '<div style="margin-bottom:10px;">'+
          '<div class="cust-detail-name">'+escHtml(customer.nome)+'</div>'+
          (sub?'<div class="cust-detail-sub">'+escHtml(sub)+'</div>':'')+
          (customer.endereco?'<div class="cust-detail-sub">'+escHtml(customer.endereco)+'</div>':'')+
        '</div>'+
        '<div class="archive-list">'+notasHtml+'</div>';

      var backBtn = document.getElementById("custBack");
      if (backBtn) backBtn.onclick = function(){ local.selectedId=null; draw(); };

      area.querySelectorAll("[data-nota]").forEach(function(el){
        el.onclick = function(){

    input.oninput = function(){
      local.query = input.value;
      local.selectedId = null;

  function buildChartSvg(points, selectedIso){
    if (points.every(function(p){return p.v===0;})){
      return '<div class="chart-empty">Sem lançamentos neste mês ainda.</div>';
    }
    var W = 720, H = 190, padL = 6, padR = 6, padT = 14, padB = 22;
    var maxV = Math.max.apply(null, points.map(function(p){return p.v;}));
    if (maxV<=0) maxV = 1;
    var stepX = (W-padL-padR) / Math.max(1, points.length-1);
    function xFor(i){ return padL + i*stepX; }
    function yFor(v){ return padT + (1 - v/maxV) * (H-padT-padB); }

    var linePts = points.map(function(p,i){ return xFor(i).toFixed(1)+","+yFor(p.v).toFixed(1); }).join(" ");
    var circles = points.map(function(p,i){
      var x=xFor(i).toFixed(1), y=yFor(p.v).toFixed(1);
      var sel = p.iso===selectedIso;
      var r = sel ? 5 : (p.v>0 ? 3.4 : 2);
      var fill = sel ? "var(--yellow)" : (p.v>0 ? "var(--teal)" : "var(--border)");
      return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" data-iso="'+p.iso+'"'+(sel?' stroke="var(--yellow)" stroke-opacity=".35" stroke-width="6"':'')+'><title>Dia '+p.day+': '+fmtCurrency(p.v)+' — clique para ver detalhes</title></circle>';
    }).join("");
    var labelEvery = points.length>20 ? 5 : (points.length>10?2:1);
    var labels = points.map(function(p,i){
      if (p.day % labelEvery !== 0 && p.day!==1 && p.day!==points.length) return "";
      return '<text x="'+xFor(i).toFixed(1)+'" y="'+(H-6)+'" font-size="8.5" fill="var(--text-faint)" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+p.day+'</text>';
    }).join("");

    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--border-soft)" stroke-width="1"/>'+
      '<polyline points="'+linePts+'" fill="none" stroke="var(--teal)" stroke-width="1.6" opacity="0.85"/>'+
      circles + labels +
      '</svg>';
  }

  // ---------- detalhes de um dia (comparativos, vendedores, pagamentos, produtos, horários) ----------
  function rowsOfDay(iso){ return lsGetJSON(K_ROWS+iso, []); }
  function sumRows(rows){ var t=0; rows.forEach(function(r){ t += computeValor(r); }); return t; }
  // soma um mês inteiro a partir das datas salvas localmente
  function sumMonth(monthStr){
    var dates = listAllDates().filter(function(d){ return d.slice(0,7)===monthStr; });
    var total=0, count=0, days=0;
    dates.forEach(function(d){ var rr = rowsOfDay(d); if (rr.length){ days++; total += sumRows(rr); count += rr.length; } });
    return {total:total, count:count, days:days};
  }
  function dayDetails(iso){
    var rows = rowsOfDay(iso);
    var total = sumRows(rows);
    var count = rows.length;
    var pend = rows.filter(function(r){ return r.pago!=="✅" && computeValor(r)>0; });
    var pendTotal = sumRows(pend);

    // comparativos (dia)
    var prev = addDays(iso, -1);
    var prevRows = rowsOfDay(prev);
    var lastWeek = addDays(iso, -7);
    var lwRows = rowsOfDay(lastWeek);
    var month = iso.slice(0,7);
    var monthDates = listAllDates().filter(function(d){ return d.slice(0,7)===month && d!==iso; })
      .filter(function(d){ return rowsOfDay(d).length>0; });
    var monthSum = 0, monthCount = 0;
    monthDates.forEach(function(d){ var rr = rowsOfDay(d); monthSum += sumRows(rr); monthCount += rr.length; });
    var avgDay = monthDates.length ? monthSum/monthDates.length : 0;
    var avgCount = monthDates.length ? monthCount/monthDates.length : 0;

    // comparativos (mês)
    var curM = sumMonth(month);
    var prevMKey = addMonths(month, -1);
    var prevM = sumMonth(prevMKey);
    var sameLYKey = addMonths(month, -12);
    var sameLY = sumMonth(sameLYKey);
    // meses do mesmo ano com vendas (exceto o mês atual) → média mensal
    var yearMonths = [];
    for (var m=1; m<=12; m++){
      var mk = month.slice(0,5)+pad(m);
      if (mk===month) continue;
      var sm = sumMonth(mk);
      if (sm.days>0) yearMonths.push({key:mk, total:sm.total, count:sm.count, days:sm.days});
    }
    var ySum=0, yCount=0;
    yearMonths.forEach(function(y){ ySum += y.total; yCount += y.count; });
    var avgMTotal = yearMonths.length ? ySum/yearMonths.length : 0;
    var avgMCount = yearMonths.length ? yCount/yearMonths.length : 0;

    var det = {iso:iso, rows:rows, total:total, count:count, ticket: count?total/count:0,
      pendCount:pend.length, pendTotal:pendTotal,
      prev:{iso:prev, total:sumRows(prevRows), count:prevRows.length},
      lastWeek:{iso:lastWeek, total:sumRows(lwRows), count:lwRows.length},
      avg:{total:avgDay, count:avgCount, days:monthDates.length},
      month:{key:month, total:curM.total, count:curM.count, days:curM.days,
        prevMonth:{key:prevMKey, total:prevM.total, count:prevM.count, days:prevM.days},
        sameLastYear:{key:sameLYKey, total:sameLY.total, count:sameLY.count, days:sameLY.days},
        avg:{total:avgMTotal, count:avgMCount, months:yearMonths.length}}};

    // agregações (vendedores, pagamentos, produtos, horários) do dia e do mês inteiro
    det.dayAgg = aggregateRows(rows);
    det.monthAgg = aggregateRows(rowsOfMonth(month));
    det.vendedores = det.dayAgg.vendedores;
    det.pagamentos = det.dayAgg.pagamentos;
    det.produtos   = det.dayAgg.produtos;
    det.horas      = det.dayAgg.horas;
    det.semHora    = det.dayAgg.semHora;
    return det;
  }

  // todas as vendas de um mês (todos os dias com lançamento)
  function rowsOfMonth(monthStr){
    var out = [];
    listAllDates().filter(function(d){ return d.slice(0,7)===monthStr; })
      .forEach(function(d){ out = out.concat(rowsOfDay(d)); });
    return out;
  }

  // calcula os quadros (vendedores / pagamentos / produtos / horas) de qualquer conjunto de vendas
  function aggregateRows(rows){
    var total = sumRows(rows);
    var count = rows.length;
    var pend = rows.filter(function(r){ return r.pago!=="✅" && computeValor(r)>0; });

    // vendedores
    var vend = {};
    rows.forEach(function(r){
      var v = r.vendedor && r.vendedor!=="Nenhum" ? r.vendedor : "Sem vendedor";
      if (!vend[v]) vend[v] = {nome:v, count:0, total:0};
      vend[v].count += 1; vend[v].total += computeValor(r);
    });
    var vendList = Object.keys(vend).map(function(k){ return vend[k]; }).sort(function(a,b){ return b.total-a.total; });

    // formas de pagamento
    var pag = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    var semForma = 0;
    rows.forEach(function(r){
      var b = paymentBreakdown(r);
      var soma = 0;
      Object.keys(b).forEach(function(k){ pag[k] += b[k]; soma += b[k]; });
      var v = computeValor(r);
      if (v>0 && soma<v-0.005) semForma += (v-soma);
    });
    var pagList = Object.keys(pag).map(function(k){ return {nome:k, total:pag[k]}; });
    if (semForma>0) pagList.push({nome:"Sem forma definida", total:semForma});
    pagList = pagList.filter(function(p){ return p.total>0; }).sort(function(a,b){ return b.total-a.total; });

    // produtos e serviços
    function sumF(f){ var t=0; rows.forEach(function(r){ t+=parseNum(r[f]); }); return t; }
    var prod = [
      {nome:"Pneus",         total:sumF("valorPneus"),        qtd:sumF("quantidade")},
      {nome:"Alinhamento",   total:sumF("alinhamento"),       qtd:rows.filter(function(r){return parseNum(r.alinhamento)>0;}).length},
      {nome:"Balanceamento", total:sumF("valorBalanceamento"),qtd:sumF("qtdBalanceamento")},
      {nome:"Bicos",         total:sumF("valorBicos"),        qtd:sumF("qtdBicos")},
      {nome:"Cambagem",      total:sumF("valorCambagem"),     qtd:sumF("qtdCambagem")},
      {nome:"Rodas",         total:sumF("valorRodas"),        qtd:sumF("qtdRodas")},
      {nome:"Peças",         total:sumF("valorPecas"),        qtd:0},
      {nome:"Mão de obra",   total:sumF("maoDeObra"),         qtd:0},
      {nome:"Outros",        total:sumF("outros"),            qtd:0}
    ].filter(function(p){ return p.total>0; }).sort(function(a,b){ return b.total-a.total; });

    // horários
    var horas = []; for (var h=0; h<24; h++) horas.push({h:h, count:0, total:0});
    var semHora = 0;
    rows.forEach(function(r){
      var d = r.criadoEm ? new Date(r.criadoEm) : null;
      if (!d || isNaN(d.getTime())){ semHora++; return; }
      horas[d.getHours()].count += 1; horas[d.getHours()].total += computeValor(r);
    });

    return {total:total, count:count, ticket: count?total/count:0,
      pendCount:pend.length, pendTotal:sumRows(pend),
      vendedores:vendList, pagamentos:pagList, produtos:prod, horas:horas, semHora:semHora};
  }

  function deltaBadge(cur, ref){
    if (state.hideValues) return '<span class="dd-delta">••</span>';
    if (!ref) return '<span class="dd-delta">—</span>';
    var pct = ((cur-ref)/ref)*100;
    var cls = pct>0.5 ? "up" : (pct<-0.5 ? "down" : "");
    return '<span class="dd-delta '+cls+'">'+(pct>0?"+":"")+pct.toFixed(0)+'%</span>';
  }

  function buildDayDetailHtml(iso, det){
    function hv(v){ return state.hideValues ? '••••' : fmtCurrency(v); }
    function hq(v){ return state.hideValues ? '••' : v; }
    var isToday = iso===today;
    var isMonth = state.cmpMode==="month";
    // no modo "Por mês" todos os quadros passam a somar o mês inteiro
    var A = isMonth ? det.monthAgg : det.dayAgg;
    var periodo = isMonth ? "do mês" : "do dia";

    function barRows(list, keyLabel, colorCls, withRank){
      if (!list.length) return '<div class="dd-empty">Nada lançado neste '+(isMonth?'mês':'dia')+'.</div>';
      var max = Math.max.apply(null, list.map(function(x){return x.total;})) || 1;
      var sum = list.reduce(function(a,x){return a+x.total;},0) || 1;
      return list.map(function(x, i){
        var w = state.hideValues ? 0 : (x.total/max*100);
        return '<div class="dd-row">'+
          (withRank ? '<span class="dd-rank">'+(i+1)+'º</span>' : '')+
          '<span class="lbl">'+escHtml(x.nome)+(keyLabel ? '<small>'+keyLabel(x)+'</small>' : '')+'</span>'+
          '<span class="track"><span class="fill '+colorCls+'" style="width:'+w.toFixed(1)+'%;display:block;"></span></span>'+
          '<span class="val">'+hv(x.total)+'</span>'+
          '<span class="pct">'+(state.hideValues?'••%':(x.total/sum*100).toFixed(0)+'%')+'</span>'+
        '</div>';
      }).join("");
    }

    var cmpToggle = '<div class="dd-cmp-toggle">'+
        '<button class="seg'+(isMonth?'':' on')+'" data-act="cmpday">Por dia</button>'+
        '<button class="seg'+(isMonth?' on':'')+'" data-act="cmpmonth">Por mês</button>'+

      cmpHtml =

          '<span><span class="amt">'+hv(m.total)+'</span><span class="dd-delta">atual</span></span></div>'+
        '<div class="dd-cmp"><span class="who">Mês anterior<small>'+escHtml(monthLabel(m.prevMonth.key))+' · '+hq(m.prevMonth.days)+' dia(s) com vendas · '+hq(m.prevMonth.count)+' venda(s)</small></span>'+

        '<div class="dd-cmp"><span class="who">Mesmo mês do ano passado<small>'+escHtml(monthLabel(m.sameLastYear.key))+' · '+hq(m.sameLastYear.days)+' dia(s) com vendas · '+hq(m.sameLastYear.count)+' venda(s)</small></span>'+
          '<span><span class="amt">'+hv(m.sameLastYear.total)+'</span>'+deltaBadge(m.total, m.sameLastYear.total)+'</span></div>'+

          '<span><span class="amt">'+hv(m.avg.total)+'</span>'+deltaBadge(m.total, m.avg.total)+'</span></div>';

      }).join("");
      var pico = withData.slice().sort(function(a,b){return b.total-a.total;})[0];
      hoursHtml = '<div class="dd-hours"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+

          '<span class="dd-date">'+(isMonth ? escHtml(monthLabel(det.month.key)) : escHtml(weekdayLabel(iso))+(isToday?' <span style="color:var(--yellow);">· hoje</span>':''))+'</span>'+
          '<button class="nav" data-dd="next" title="Próximo dia">›</button>'+
          (isToday ? '' : '<button class="btn ghost small" data-dd="today">Hoje</button>')+
          '<button class="btn ghost small" data-act="opendate" data-date="'+iso+'">Abrir tabela →</button>'+
        '</div>'+

        '<div class="dd-kpi big"><div class="k">Faturamento '+periodo+'</div><div class="v">'+hv(A.total)+'</div></div>'+
        '<div class="dd-kpi"><div class="k">Vendas</div><div class="v">'+hq(A.count)+'</div></div>'+
        '<div class="dd-kpi"><div class="k">Ticket médio</div><div class="v">'+hv(A.ticket)+'</div></div>'+

  // ---------- histórico: logins e movimentações de estoque ----------
  function renderHistorico(){
    var tab = state.historicoTab || "logins";
    var logins = loadLoginLog().slice().reverse();
    var movsAll = loadEstoqueLog().slice().reverse();
    var q = (state.historicoQuery||"").trim().toLowerCase();
    var movs = q ? movsAll.filter(function(m){ return (m.medida||"").toLowerCase().indexOf(q)>-1; }) : movsAll;

    var loginsHtml = logins.length
      ? logins.map(function(l){
          return '<div class="arow">'+
            '<span class="d">'+fmtDateTimeBR(l.ts)+'</span>'+
            '<span class="stats"><span><b>'+escHtml(l.email)+'</b></span></span>'+
          '</div>';
        }).join("")
      : '<div class="arow-empty">Nenhum login registrado ainda.</div>';

    var tipoLabel = {entrada:"Entrada", saida:"Saída", ajuste:"Ajuste", venda:"Venda"};
    var tipoColor = {entrada:"var(--green)", saida:"var(--red)", ajuste:"var(--yellow)", venda:"var(--red)"};
    var movsHtml = movs.length
      ? movs.map(function(m){
          var sinal = (m.tipo==="saida" || m.tipo==="venda") ? "-" : (m.tipo==="entrada" ? "+" : (m.qtd>=0?"+":"-"));
          return '<div class="arow">'+
            '<span class="d">'+fmtDateTimeBR(m.ts)+'</span>'+
            '<span class="stats">'+
              '<span style="color:'+(tipoColor[m.tipo]||"var(--text)")+';font-weight:600;">'+(tipoLabel[m.tipo]||m.tipo)+'</span>'+
              '<span>'+escHtml(m.medida||"—")+'</span>'+
              '<span><b>'+sinal+Math.abs(parseNum(m.qtd))+' un.</b></span>'+
              '<span>'+escHtml(m.email)+'</span>'+
            '</span>'+
          '</div>';
        }).join("")
      : '<div class="arow-empty">'+(movsAll.length ? 'Nenhuma movimentação encontrada para essa medida.' : 'Nenhuma movimentação de estoque registrada ainda.')+'</div>';

    root.innerHTML =
      '<div class="topbar">'+
        '<div class="brand"><span class="mark"></span><h1>Histórico</h1><span class="tag">LOGINS · MOVIMENTAÇÕES DE ESTOQUE</span>'+syncBadgeHtml()+'</div>'+
        '<div class="auth-zone">'+
          '<button class="btn ghost small" data-act="back">‹ Painel de vendas</button>'+
          '<button class="btn ghost small" data-act="openestoque">📦 Estoque</button>'+
          '<button class="btn ghost small" data-act="openclientes">👥 Clientes</button>'+

      '<div class="tbl-head">'+
        '<div class="tbl-head-left">'+
          '<button class="btn small'+(tab==="logins"?" primary":" ghost")+'" data-act="historicotab" data-tab="logins">Logins</button> '+
          '<button class="btn small'+(tab==="estoque"?" primary":" ghost")+'" data-act="historicotab" data-tab="estoque" style="margin-left:8px;">Movimentações de estoque</button>'+
        '</div>'+
      '</div>'+

      (tab==="estoque" ? '<div class="card" style="padding:12px 16px;margin-bottom:14px;">'+
        '<input type="text" id="histSearch" class="dash-cust-search" placeholder="Buscar por medida (ex: 175/70 R14)..." value="'+escAttr(state.historicoQuery||"")+'">'+
      '</div>' : '')+

      '<div class="card" style="padding:14px 16px;">'+
        '<div class="archive-list">'+
          (tab==="logins" ? loginsHtml : movsHtml)+
        '</div>'+
      '</div>';

        var pos = histSearch.selectionStart;
        renderHistorico();

  function renderUsuarios(){
    if (!sb){
      root.innerHTML =
