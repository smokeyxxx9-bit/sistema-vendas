    t.appendChild(span); t.appendChild(x);
    wrap.appendChild(t);
    var timer = setTimeout(close, ms || 4600);
    function close(){ clearTimeout(timer); if (t.parentNode) t.parentNode.removeChild(t); }
    x.addEventListener("click", close);
    return close;
  }
  window.uiToast = toast;

  // avisos do sistema passam a aparecer como toast em vez de caixa do navegador
  window.alert = function(msg){
    var s = String(msg == null ? "" : msg);
    var kind = /não foi poss|erro|inválid|falh/i.test(s) ? "err"
             : /sucesso|salvo|enviado|conclu/i.test(s) ? "ok" : "";
    toast(s, kind, 6000);
  };

  // aviso de conexão
  var offBar = null;
  function setOnline(on){
    if (on){ if (offBar){ offBar.remove(); offBar = null; toast("Conexão restabelecida — sincronizando.", "ok"); } }
    else if (!offBar){
      offBar = document.createElement("div");
      offBar.className = "ui-offline";
      offBar.textContent = "Sem internet — as vendas continuam sendo salvas neste aparelho";
      document.body.appendChild(offBar);
    }
  }
  window.addEventListener("online", function(){ setOnline(true); });
  window.addEventListener("offline", function(){ setOnline(false); });
  if (navigator.onLine === false) setOnline(false);

  // botão voltar ao topo
  var top = document.createElement("button");
  top.className = "ui-top"; top.type = "button"; top.innerHTML = "&#8593;";
  top.setAttribute("aria-label","Voltar ao topo");
  top.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  document.body.appendChild(top);
  var ticking = false;
  window.addEventListener("scroll", function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      top.classList.toggle("show", window.scrollY > 420);
      ticking = false;
    });
  }, { passive:true });

  // atalhos: Esc fecha o que estiver aberto, "/" vai direto para a busca,
  // Ctrl/Cmd+K abre a busca global, N/E/C abrem nova venda/estoque/clientes
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      var ov = document.querySelectorAll(".modal-overlay, .overlay");
      var last = ov[ov.length-1];
      if (last){
        var cancel = last.querySelector('[data-close], .btn.ghost, .modal-actions .btn:not(.primary)');
        if (cancel) cancel.click(); else last.remove();
      }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")){
      e.preventDefault();
      if (window.__appOpenSearch) window.__appOpenSearch();
      return;
    }
    if (e.key === "/" ){
      var tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      var s = document.querySelector(".search-input, .dash-cust-search, #custSearch");
      if (s){ e.preventDefault(); s.focus(); s.select && s.select(); }
      return;
    }
    var tagN = (e.target && e.target.tagName || "").toLowerCase();
    if (tagN === "input" || tagN === "textarea" || tagN === "select" || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key||"").toLowerCase();
    if ((k==="n" || k==="e" || k==="c") && window.__appShortcut){
      window.__appShortcut(k);
    }
  });

  // botão flutuante: alternar tema claro/escuro
  var themeBtn = document.createElement("button");
  themeBtn.className = "ui-theme-toggle"; themeBtn.type = "button";
  themeBtn.setAttribute("aria-label","Alternar tema claro/escuro");
  function currentTheme(){ try{ return localStorage.getItem("vo_theme") || "dark"; }catch(e){ return "dark"; } }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.innerHTML = t==="light" ? "&#9789;" : "&#9788;";
    try{ localStorage.setItem("vo_theme", t); }catch(e){}
  }
  applyTheme(currentTheme());
  themeBtn.addEventListener("click", function(){ applyTheme(currentTheme()==="light" ? "dark" : "light"); });
  document.body.appendChild(themeBtn);
})();
});
</script>
</body>
</html>
