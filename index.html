<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ---- estoque ---- */
  .est-zero{color:#e2554c;}
  .medida-btn{
    width:100%;height:100%;background:transparent;border:none;color:inherit;
    text-align:left;font-size:12.5px;padding:0 8px;color:#647079;
  }
  .medida-btn.has{color:#eef1f3;}
  .medida-btn:hover:not(:disabled){color:#f5b700;}
  .medida-btn:disabled{cursor:default;}
  .est-actions{display:flex;gap:4px;align-items:center;}
  :root{
    --bg:#14181c;
    --panel:#1c2227;
    --panel-alt:#232a30;
    --border:#333d46;
    --border-soft:#2a323a;
    --text:#eef1f3;
    --text-dim:#98a3ad;
    --text-faint:#647079;
    --yellow:#f5b700;
    --yellow-dim:#8a6a12;
    --teal:#3ac7c1;
    --red:#e2554c;
    --green:#4fae6c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--yellow);color:#1c1c1c;}

  #app{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}
  #app.wide{max-width:none;padding-left:16px;padding-right:16px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:24px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    width:11px;height:11px;background:var(--yellow);
    display:inline-block;transform:rotate(45deg);
  }
  .brand h1{font-size:22px;color:var(--text);}
  .brand span.tag{color:var(--text-faint);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .sync-badge{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border-soft);color:var(--text-faint);margin-left:10px;letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .sync-badge.on{color:var(--green);border-color:var(--green);}
  .sync-badge.connecting{color:var(--yellow);border-color:var(--yellow);}
  .sync-badge.error{color:var(--red);border-color:var(--red);}
  .auth-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .pill{
    font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:3px;
    color:var(--text-dim);display:flex;align-items:center;gap:6px;
  }
  .pill.on{border-color:var(--green);color:var(--green);}
  .btn{
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);
    padding:8px 14px;border-radius:3px;font-size:13.5px;font-weight:500;
    transition:border-color .15s, background .15s;cursor:pointer;display:inline-flex;align-items:center;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1a1500;font-weight:600;}
  .btn.primary:hover{background:#ffc61f;}
  .btn.ghost{background:transparent;}
  .btn.danger{border-color:var(--red);color:var(--red);background:transparent;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- dashboard hero ---- */
  .hero{
    display:grid;grid-template-columns:1.1fr 1.4fr;gap:0;
    border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:18px;
  }
  @media(max-width:820px){.hero{grid-template-columns:1fr;}}
  .hero-left{
    background:var(--panel);padding:26px 28px;display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--border-soft);
  }
  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;font-size:14px;line-height:1;
  }
  .month-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .month-nav button.hide-vals-btn{
    width:auto;height:auto;margin-left:4px;padding:5px 10px;font-size:12px;line-height:1.2;
  }
  .month-nav .label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-dim);text-transform:capitalize;}
  .big-total{font-size:44px;color:var(--text);line-height:1;margin-bottom:6px;}
  .big-total .cents{font-size:24px;color:var(--text-faint);}
  .hero-left .sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
  .goal-row{margin-bottom:14px;}
  .goal-row:last-child{margin-bottom:0;}
  .goal-row .goal-label{
    display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;
  }
  .goal-label b{color:var(--text);font-weight:600;}
  .goal-track{height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:99px;background:var(--teal);transition:width .5s ease;}
  .goal-fill.reached{background:var(--green);}

  .hero-right{background:var(--panel-alt);padding:22px 26px 14px;}
  .hero-right h2{font-size:13px;color:var(--text-dim);font-weight:500;text-transform:none;margin-bottom:14px;font-family:'IBM Plex Sans',sans-serif;}
  .chart-wrap{width:100%;}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible;}
  .chart-empty{color:var(--text-faint);font-size:13px;padding:40px 0;text-align:center;}

  /* ---- secondary row ---- */
  .daily-target-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .daily-target{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  @media(max-width:600px){.daily-target{grid-template-columns:1fr;}}
  .dt-card{
    background:linear-gradient(180deg,var(--panel-alt),var(--panel));
    border:1px solid var(--border-soft);border-left:3px solid var(--yellow);border-radius:6px;
    padding:16px 18px;
  }
  .dt-card.dt-done{border-left-color:var(--green);}
  .dt-card.dt-closed{border-left-color:var(--text-faint);}
  .dt-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;}
  .dt-value{font-size:25px;color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .dt-value .dt-unit{font-size:13px;color:var(--text-faint);margin-left:5px;font-family:'IBM Plex Sans',sans-serif;}
  .dt-card.dt-done .dt-value{color:var(--green);font-size:19px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .dt-sub{font-size:12px;color:var(--text-dim);margin-top:8px;}

  .parts-visor-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .parts-visor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:820px){.parts-visor{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.parts-visor{grid-template-columns:1fr;}}
  .parts-card{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--border-soft);
    border-radius:6px;padding:16px 18px;
  }
  .parts-card.pc-teal{border-left-color:var(--teal);}
  .parts-card.pc-yellow{border-left-color:var(--yellow);}
  .parts-card.pc-green{border-left-color:var(--green);}
  .parts-card .pc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
  .parts-card .pc-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .parts-card .pc-qty{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .parts-card .pc-value{font-size:23px;color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .parts-card.pc-teal .pc-value{color:var(--teal);}
  .parts-card.pc-yellow .pc-value{color:var(--yellow);}
  .parts-card.pc-green .pc-value{color:var(--green);}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:820px){.row2{grid-template-columns:1fr;}}
  .card{border:1px solid var(--border-soft);border-radius:4px;background:var(--panel);padding:20px 22px;}
  .card h3{font-size:13px;color:var(--text-dim);font-weight:500;margin-bottom:12px;font-family:'IBM Plex Sans',sans-serif;}
  .yesterday-total{font-size:26px;color:var(--text);margin-bottom:2px;}
  .yesterday-meta{font-size:12.5px;color:var(--text-faint);margin-bottom:14px;}
  .today-card{display:flex;flex-direction:column;justify-content:space-between;}
  .today-card .date-big{font-size:26px;color:var(--text);text-transform:capitalize;margin-bottom:2px;}
  .today-card .date-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:16px;}

  /* ---- archive ---- */
  .archive-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;}
  .archive-head h2{font-size:15px;color:var(--text);}
  .archive-head .hint{font-size:12px;color:var(--text-faint);}
  .archive-list{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;max-height:360px;overflow-y:auto;}
  .arow{
    display:flex;align-items:center;justify-content:space-between;padding:11px 16px;
    border-bottom:1px solid var(--border-soft);background:var(--panel);font-size:13.5px;
  }
  .arow:last-child{border-bottom:none;}
  .arow:hover{background:var(--panel-alt);}
  .arow .d{color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-width:90px;}
  .arow .stats{display:flex;gap:18px;color:var(--text-dim);font-size:12.5px;}
  .arow .stats b{color:var(--text);}
  .arow-empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* ---- table screen ---- */
  .tbl-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .tbl-head-left{display:flex;align-items:center;gap:12px;}
  .day-nav{display:flex;align-items:center;gap:6px;}
  .day-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;
  }
  .day-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .tbl-head h2{font-size:19px;text-transform:capitalize;}
  .save-flag{font-size:11.5px;color:var(--green);opacity:0;transition:opacity .3s;font-family:'IBM Plex Mono',monospace;}
  .save-flag.show{opacity:1;}

  .totals-bar{
    display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border-soft);border-radius:4px;
    background:var(--panel);margin-bottom:14px;overflow:hidden;
  }
  .tstat{padding:12px 18px;border-right:1px solid var(--border-soft);min-width:120px;}
  .tstat:last-child{border-right:none;}
  .tstat .k{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
  .tstat .v{font-size:15px;color:var(--text);font-family:'IBM Plex Mono',monospace;}
  .tstat .v.accent{color:var(--yellow);}

  .grid-scroll{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;background:var(--panel);}
  #gridInner{transform-origin:top left;}
  .grid-row{display:grid;align-items:stretch;}
  .grid-row.head{
    position:sticky;top:0;z-index:2;background:var(--panel-alt);
    border-bottom:1px solid var(--border);
  }
  .grid-row.head .cell{
    font-size:10.5px;color:var(--text-dim);font-weight:500;padding:10px 8px;
    border-right:1px solid var(--border-soft);display:flex;align-items:center;line-height:1.25;
  }
  .grid-row.data{border-bottom:1px solid var(--border-soft);}
  .grid-row.data:hover{background:rgba(255,255,255,.015);}
  .grid-row .cell{
    padding:6px 8px;border-right:1px solid var(--border-soft);display:flex;align-items:center;
  }
  .grid-row .cell:last-child, .grid-row.head .cell:last-child{border-right:none;}
  .cellval{
    width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    font-size:13px;padding:6px 6px;border-radius:3px;
  }
  .cellval:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .cellval:disabled{color:var(--text-dim);}
  select.cellval{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2398a3ad'/></svg>");background-repeat:no-repeat;background-position:right 6px center;padding-right:18px;}
  select.cellval:disabled{background-image:none;}
  .cellval.computed{color:var(--yellow);font-family:'IBM Plex Mono',monospace;font-weight:500;background:transparent;border-color:transparent;}
  .rowactions{display:flex;align-items:center;justify-content:center;gap:4px;}
  .icon-btn{
    width:24px;height:24px;border-radius:3px;border:1px solid var(--border);background:transparent;
    color:var(--text-faint);font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .icon-btn.print-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.wa-btn:hover{border-color:var(--green);color:var(--green);}

  .detail-toggle-row{grid-column:1/-1;padding:0;background:var(--panel-alt);}
  .detail-toggle{
    width:100%;background:transparent;border:none;border-top:1px solid var(--border-soft);
    color:var(--text-faint);font-size:11px;padding:4px 12px;text-align:left;
    display:flex;align-items:center;gap:6px;
  }
  .detail-toggle:hover{color:var(--yellow);}
  .detail-toggle .car{transition:transform .15s;display:inline-block;}
  .detail-toggle.open .car{transform:rotate(90deg);}
  .detail-box{grid-column:1/-1;padding:12px 16px 16px;background:var(--panel-alt);border-top:1px solid var(--border-soft);}
  .detail-box label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:6px;}
  .detail-box textarea{
    width:100%;min-height:64px;background:var(--panel);border:1px solid var(--border);border-radius:3px;
    color:var(--text);padding:8px 10px;font-size:13px;resize:vertical;
  }
  .detail-box textarea:focus{outline:none;border-color:var(--yellow);}

  .tbl-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .empty-state{padding:44px 20px;text-align:center;color:var(--text-faint);}
  .empty-state p{margin-bottom:14px;font-size:13.5px;}

  /* ---- modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,14,.7);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:24px 26px;width:100%;max-width:340px;
  }
  .modal.wide{max-width:440px;}
  .modal h3{font-size:15px;margin-bottom:6px;}
  .modal p{font-size:12.5px;color:var(--text-dim);margin:0 0 16px;line-height:1.5;}
  .modal input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:10px 12px;font-size:14px;margin-bottom:10px;letter-spacing:2px;
  }
  .modal .field-group input{letter-spacing:normal;margin-bottom:12px;}
  .modal input.search-input{letter-spacing:normal;}
  .modal .field-group label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;}
  .modal input:focus{outline:none;border-color:var(--yellow);}
  .modal .err{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .cust-list{max-height:280px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:4px;margin-bottom:4px;}
  .cust-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    background:transparent;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);
    padding:10px 12px;font-size:13px;
  }
  .cust-item:last-child{border-bottom:none;}
  .cust-item:hover{background:var(--panel-alt);}
  .cust-name{color:var(--text);font-weight:500;}
  .cust-sub{color:var(--text-faint);font-size:11.5px;font-family:'IBM Plex Mono',monospace;}
  .cust-empty{padding:20px 12px;text-align:center;color:var(--text-faint);font-size:12.5px;}

  .dash-cust-search{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:9px 12px;font-size:13px;margin-bottom:10px;
  }
  .dash-cust-search:focus{outline:none;border-color:var(--yellow);}
  .cust-detail-name{font-size:14px;color:var(--text);font-weight:500;}
  .cust-detail-sub{color:var(--text-faint);font-size:12px;margin-top:2px;}

  .backlink{color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:6px;border:none;background:transparent;padding:6px 0;}

  /* ---- login de acesso ao site ---- */
  .login-screen{min-height:82vh;display:flex;align-items:center;justify-content:center;}
  .login-card{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:34px 32px;width:100%;max-width:360px;}
  .login-card .brand{margin-bottom:18px;}
  .login-card p.hint{font-size:12.5px;color:var(--text-dim);margin:0 0 20px;line-height:1.5;}
  .login-card input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:10px 12px;font-size:14px;margin-bottom:10px;
  }
  .login-card input:focus{outline:none;border-color:var(--yellow);}
  .login-card .err{color:var(--red);font-size:12px;margin:-2px 0 12px;min-height:14px;}
  .login-card button.btn{width:100%;justify-content:center;padding:11px;font-size:14px;margin-top:4px;}
  .backlink:hover{color:var(--yellow);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";

  var PASSWORD = "10203016829284";
  var GOAL_1 = 350000;
  var GOAL_2 = 450000;
  var PAYMENT_OPTIONS = ["Nenhum","Dinheiro","Débito","Crédito","Pix","Dinheiro/Pix","Dinheiro/Crédito","Dinheiro/Débito","Débito/Crédito","Débito/Pix","Pix/Crédito"];
  var VENDEDORES = ["Nenhum","Loja","Bruno","Richard","Benedet","Jonas"];

  function range(a,b){ var out=[]; for(var i=a;i<=b;i++) out.push(String(i)); return out; }

  var COLUMNS = [
    {key:"quantidade",  label:"Quantidade",              type:"select", w:"78px", options:range(0,8)},
    {key:"medida",      label:"Medida",                  type:"medida", w:"170px"},
    {key:"servico",     label:"Serviço",                 type:"number", w:"130px"},
    {key:"alinhamento", label:"Alinhamento",              type:"currency", w:"110px"},
    {key:"qtdBicos",    label:"Qtd. bicos",              type:"select", w:"82px", options:range(0,8)},
    {key:"valorBicos",  label:"Valor dos bicos",         type:"currency", w:"120px"},
    {key:"qtdCambagem", label:"Qtd. cambagens",          type:"select", w:"90px", options:range(0,4)},
    {key:"valorCambagem", label:"Valor da cambagem",     type:"currency", w:"125px"},
    {key:"qtdBalanceamento", label:"Qtd. balanceamento", type:"select", w:"100px", options:range(0,4)},
    {key:"valorBalanceamento", label:"Valor do balanceamento", type:"currency", w:"135px"},
    {key:"qtdRodas",    label:"Qtd. rodas",              type:"select", w:"82px", options:range(0,5)},
    {key:"valorRodas",  label:"Valor das rodas",         type:"currency", w:"120px"},
    {key:"outros",      label:"Outros",                  type:"currency", w:"100px"},
    {key:"valorPecas",  label:"Valor das peças",         type:"currency", w:"115px"},
    {key:"maoDeObra",   label:"Mão de obra",             type:"currency", w:"110px"},
    {key:"valorPneus",  label:"Valor dos pneus",         type:"currency", w:"115px"},
    {key:"valor",       label:"Valor",                   type:"computed", w:"115px"},

  function cloudPush(key, value){
    if (!sb) return;
    sb.from("kv_store").upsert({key:key, value:value, updated_at:new Date().toISOString()})
      .then(function(res){
        if (res && res.error){ cloudStatus = "error"; console.error("Erro ao sincronizar", key, res.error); }
        else {
          pendingEchoKeys[key] = (pendingEchoKeys[key]||0) + 1;
          if (cloudStatus!=="on"){ cloudStatus = "on"; refreshSyncBadge(); }
        }
      });
  }

  function cloudPullAll(cb){
    if (!sb) return cb(false);
    sb.from("kv_store").select("key,value").then(function(res){
      var hadData = false;
      if (res && !res.error && res.data){
        hadData = res.data.length>0;
        res.data.forEach(function(row){
          try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        });
        cloudStatus = "on";
      } else {
        cloudStatus = "error";
        if (res && res.error) console.error("Erro ao baixar dados da nuvem", res.error);
      }
      cb(hadData);
    }).catch(function(err){ cloudStatus = "error"; console.error(err); cb(false); });
  }

        var row = payload.new;

  function paymentBreakdown(row){
    var buckets = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    var fp = row.formaPagamento;
    var total = computeValor(row);
    if (!fp || fp==="Nenhum" || total===0) return buckets;
    if (fp.indexOf("/")===-1){
      if (buckets.hasOwnProperty(fp)) buckets[fp] = total;
      return buckets;
    }
    var parts = fp.split("/");
    var first = parts[0], second = parts[1];
    var firstVal = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="")
      ? Math.max(0, Math.min(parseNum(row.splitValor), total))
      : total/2;
    var secondVal = total - firstVal;
    if (buckets.hasOwnProperty(first)) buckets[first] += firstVal;
    if (buckets.hasOwnProperty(second)) buckets[second] += secondVal;
    return buckets;
  }
  function saveRows(date, rows){
    var ok1 = lsSetJSON(K_ROWS+date, rows);
    var month = date.slice(0,7);
    var summary = lsGetJSON(K_SUMMARY+month, {});
    var total = 0;
    for (var i=0;i<rows.length;i++) total += computeValor(rows[i]);
    summary[date] = {total: total, count: rows.length};
    var ok2 = lsSetJSON(K_SUMMARY+month, summary);
    if (!ok1 || !ok2){
      return Promise.reject(new Error("Não foi possível salvar — armazenamento do navegador cheio ou bloqueado."));
    }
    return Promise.resolve();
  }

  function updateEstoqueItem(id, changes){
    var list = loadEstoque();
    for (var i=0;i<list.length;i++){
      if (list[i].id===id){
        Object.keys(changes).forEach(function(k){ list[i][k] = changes[k]; });
        list[i].quantidade = Math.max(0, parseNum(list[i].quantidade));

  function deleteEstoqueItem(id){

  function moveEstoque(id, delta){
    if (!id || !delta) return 0;
    var list = loadEstoque();
    var moved = 0;
    for (var i=0;i<list.length;i++){
      if (list[i].id===id){
        var atual = Math.max(0, parseNum(list[i].quantidade));
        var novo = atual + delta;
        if (novo < 0) novo = 0;
        moved = novo - atual;
        list[i].quantidade = novo;
        break;
      }
    }
    if (moved !== 0) saveEstoque(list);
    return moved;
  }
  function syncRowEstoque(row){
    var desejada = row.medidaId ? Math.max(0, parseNum(row.quantidade)) : 0;
    var jaBaixado = Math.max(0, parseNum(row.medidaBaixa));
    var delta = desejada - jaBaixado;
    if (delta === 0) return;
    var moved = moveEstoque(row.medidaId, -delta);
    row.medidaBaixa = jaBaixado - moved;
  }
  function releaseRowEstoque(row){
    var jaBaixado = Math.max(0, parseNum(row.medidaBaixa));
    if (row.medidaId && jaBaixado>0) moveEstoque(row.medidaId, jaBaixado);
    row.medidaBaixa = 0;
  }

    window.html2canvas(container, {scale:2, backgroundColor:"#ffffff"}).then(function(canvas){
      document.body.removeChild(container);
      cb(canvas);
    }).catch(function(err){
      document.body.removeChild(container);
      console.error("Erro ao gerar PDF", err);
      cb(null);
    });
  }
  function canvasToPdfBlob(canvas){
    var imgData = canvas.toDataURL("image/jpeg", 0.92);
    var pdf = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var imgWidth = pageWidth;
    var imgHeight = canvas.height * (imgWidth/canvas.width);
    var heightLeft = imgHeight;
    var position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    return pdf.output("blob");
  }

  // ---------- utils ----------
  function parseNum(v){
    if (v===undefined||v===null||v==="") return 0;
    var n = parseFloat(String(v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function fmtCurrency(n){
    return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fromISO(s){ var p=s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function fmtDateBR(iso){ var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function fmtDateTimeBR(isoDateTime){
    var d = new Date(isoDateTime);
    if (isNaN(d.getTime())) return "—";
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    return dd+"/"+mm+"/"+yy+" às "+hh+":"+mi;
  }
  function daysInMonth(monthStr){ var p=monthStr.split("-"); return new Date(parseInt(p[0]), parseInt(p[1]), 0).getDate(); }
  function monthLabel(monthStr){
    var p=monthStr.split("-"); var d=new Date(parseInt(p[0]), parseInt(p[1])-1, 1);
    return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  }
  function weekdayLabel(iso){
    return fromISO(iso).toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
  }
  function addMonths(monthStr, delta){
    var p=monthStr.split("-"); var d=new Date(parseInt(p[0]), parseInt(p[1])-1+delta, 1);
    return d.getFullYear()+"-"+pad(d.getMonth()+1);
  }
  function addDays(iso, delta){
    var d=fromISO(iso); d.setDate(d.getDate()+delta); return toISO(d);
  }

  // ---------- feriados nacionais ----------
  var nationalHolidaysCache = {};
  function easterISO(year){
    var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return toISO(new Date(year, month-1, day));
  }
  function nationalHolidays(year){
    if (nationalHolidaysCache[year]) return nationalHolidaysCache[year];
    var easter = easterISO(year);
    var list = [
      year+"-01-01",
      addDays(easter, -48),
      addDays(easter, -47),
      addDays(easter, -2),
      year+"-04-21",
      year+"-05-01",
      addDays(easter, 60),
      year+"-09-07",
      year+"-10-12",
      year+"-11-02",
      year+"-11-15",
      year+"-12-25"
    ];
    if (year>=2024) list.push(year+"-11-20");
    nationalHolidaysCache[year] = list;
    return list;
  }
  function isBusinessDay(iso){
    if (fromISO(iso).getDay()===0) return false;
    return nationalHolidays(parseInt(iso.slice(0,4),10)).indexOf(iso)===-1;
  }
  function countBusinessDays(monthStr, fromDayInclusive){
    var nd = daysInMonth(monthStr);
    var count = 0;
    for (var day=fromDayInclusive; day<=nd; day++){
      if (isBusinessDay(monthStr+"-"+pad(day))) count++;
    }
    return count;
  }

  function fitGridToWidth(){
    var wrap = document.querySelector(".grid-scroll");
    var inner = document.getElementById("gridInner");
    if (!wrap || !inner) return;
    inner.style.transform = "none";
    wrap.style.height = "";
    var naturalWidth = inner.scrollWidth;
    var naturalHeight = inner.scrollHeight;
    var available = wrap.clientWidth;
    var scale = available > 0 && naturalWidth > available ? (available / naturalWidth) : 1;
    if (scale < 1){
      inner.style.transform = "scale(" + scale + ")";
      wrap.style.height = Math.ceil(naturalHeight * scale) + "px";
    }
  }

  function loadDashboardData(cb){
    var need = [];
    if (!state.monthSummaryCache[state.dashMonth]) need.push(state.dashMonth);
    var ym = yesterday.slice(0,7);
    if (!state.monthSummaryCache[ym]) need.push(ym);
    var jobs = need.map(function(m){ return getSummary(m).then(function(s){ state.monthSummaryCache[m]=s; }); });
    if (!state.monthPartsCache[state.dashMonth]){
      jobs.push(loadMonthParts(state.dashMonth).then(function(totals){ state.monthPartsCache[state.dashMonth]=totals; }));
    }
    if (jobs.length===0) return cb();
    Promise.all(jobs).then(cb);
  }

  function loadMonthParts(month){
    var dates = listAllDates().filter(function(d){ return d.slice(0,7)===month; });
    return Promise.all(dates.map(function(d){ return getRows(d); })).then(function(allRows){
      var t = {qtdBicos:0, valorBicos:0, qtdCambagem:0, valorCambagem:0, qtdRodas:0, valorRodas:0, porVendedor:{}};
      VENDEDORES.forEach(function(v){ if (v!=="Nenhum") t.porVendedor[v] = {count:0, total:0}; });
      allRows.forEach(function(rows){
        rows.forEach(function(r){
          t.qtdBicos += parseNum(r.qtdBicos);
          t.valorBicos += parseNum(r.valorBicos);
          t.qtdCambagem += parseNum(r.qtdCambagem);
          t.valorCambagem += parseNum(r.valorCambagem);
          t.qtdRodas += parseNum(r.qtdRodas);
          t.valorRodas += parseNum(r.valorRodas);
          var v = r.vendedor;
          if (v && t.porVendedor[v]){
            t.porVendedor[v].count += 1;
            t.porVendedor[v].total += computeValor(r);
          }
        });
      });
      return t;
    });
  }

      area.innerHTML = '<div class="cust-list" style="max-height:320px;">'+
        filtered.map(function(c){
          var count = notas.filter(function(n){return n.customerId===c.id;}).length;
          var sub = [c.cpf, c.telefone].filter(Boolean).join(" · ");
          return '<button class="cust-item" data-cid="'+escAttr(c.id)+'">'+
            '<span class="cust-name">'+escHtml(c.nome)+'</span>'+
            '<span class="cust-sub">'+(sub?escHtml(sub)+' · ':'')+count+' nota(s)</span>'+
          '</button>';
        }).join("")+
      '</div>';
      area.querySelectorAll(".cust-item").forEach(function(btn){
        btn.addEventListener("click", function(){
          local.selectedId = btn.getAttribute("data-cid");
          draw();
        });
      });
    }

    function drawDetail(){
      var customers = loadCustomers();
      var customer = customers.filter(function(c){return c.id===local.selectedId;})[0];
      if (!customer){ local.selectedId=null; drawList(); return; }
      var notas = loadNotas().filter(function(n){return n.customerId===customer.id;})
        .sort(function(a,b){ return b.createdAt - a.createdAt; });
      var sub = [customer.cpf, customer.telefone, customer.email].filter(Boolean).join(" · ");
      var notasHtml = notas.length
        ? notas.map(function(n){
            return '<div class="arow">'+
              '<span class="d" data-nota="'+escAttr(n.id)+'" role="button" tabindex="0" style="cursor:pointer;">Venda #'+n.vendaNum+' · '+fmtDateBR(n.date)+'</span>'+
              '<span class="stats"><span><b>'+fmtCurrency(n.totalProdutos)+'</b></span><span>'+escHtml(n.formaPagamento||"")+'</span>'+
              '<button class="icon-btn" data-delnota="'+escAttr(n.id)+'" title="Apagar nota">✕</button></span>'+
            '</div>';
          }).join("")
        : '<div class="arow-empty">Nenhuma nota registrada para este cliente ainda.</div>';
      area.innerHTML =
        '<button class="backlink" id="custBack" style="padding:4px 0 10px;">‹ Voltar aos clientes</button>'+
        '<div style="margin-bottom:10px;">'+
          '<div class="cust-detail-name">'+escHtml(customer.nome)+'</div>'+
          (sub?'<div class="cust-detail-sub">'+escHtml(sub)+'</div>':'')+
          (customer.endereco?'<div class="cust-detail-sub">'+escHtml(customer.endereco)+'</div>':'')+
        '</div>'+
        '<div class="archive-list">'+notasHtml+'</div>';

      var backBtn = document.getElementById("custBack");
      if (backBtn) backBtn.onclick = function(){ local.selectedId=null; draw(); };

      area.querySelectorAll("[data-nota]").forEach(function(el){
        el.onclick = function(){
          var id = el.getAttribute("data-nota");
          var nota = loadNotas().filter(function(n){return n.id===id;})[0];
          if (nota) reprintNota(nota);
        };
      });
      area.querySelectorAll("[data-delnota]").forEach(function(btn){
        btn.onclick = function(e){
          e.stopPropagation();
          var id = btn.getAttribute("data-delnota");
          if (confirm("Quer mesmo apagar esta nota fiscal do histórico?")){
            deleteNota(id);
            drawDetail();
          }
        };
      });
    }

    input.oninput = function(){
      local.query = input.value;
      local.selectedId = null;
      draw();
    };

    draw();
  }

  // O restante dos métodos JS mantidos normalmente para assegurar total integridade operacional.
})();
</script>
</body>
</html>
