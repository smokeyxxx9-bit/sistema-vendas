<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Controle de Estoque e Vendas</title>
<meta name="theme-color" content="#0c5a4b">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/app.css">
<script>document.documentElement.dataset.tema = localStorage.getItem('tema') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');</script>
</head>
<body>
<div id="offline" hidden>Sem conexão. Vendas e pagamentos só são registrados com internet, para que nenhum aparelho grave dados desatualizados.</div>

<section id="login" hidden>
  <form id="form-login">
    <h1>Entrar</h1>
    <label>Usuário<input name="usuario" autocomplete="username" autocapitalize="none" required></label>
    <label>Senha<input name="senha" type="password" autocomplete="current-password" required></label>
    <button class="btn primario">Entrar</button>
    <p id="login-erro" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <header class="topo">
    <h1 id="titulo"></h1>
    <span id="quem"></span>
    <button class="btn" id="tema" type="button">Tema</button>
    <button class="btn" id="sair" type="button">Sair</button>
  </header>
  <nav id="nav" aria-label="Principal"></nav>
  <main id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="toasts" aria-live="polite"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
