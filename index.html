  // ======================= IMPORTAR TABELAS ANTIGAS (HTML) — só master =======================
  function impNorm(t){ return String(t===undefined||t===null ? "" : t).replace(/\u00a0/g," ").replace(/[ \t\r\f\v]+/g," ").trim(); }
  function impSemAcento(t){ return impNorm(t).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
  function impNumero(t){
    var x = String(t).replace(/R\$/gi,"").replace(/\s/g,"");
    if (!/^[\d.,]+$/.test(x)) return NaN;
    if (x.indexOf(",")>-1) x = x.replace(/\./g,"").replace(",",".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g,"");
    var n = parseFloat(x);
    return isNaN(n) ? NaN : n;
  }
  function impDinheiro(t){ var n = impNumero(impNorm(t)); return (isNaN(n) || n===0) ? "" : (Math.round(n*100)/100 % 1===0 ? String(Math.round(n*100)/100) : (Math.round(n*100)/100).toFixed(2)); }
  function impInteiro(t){ var x = impNorm(t); return /^\d+$/.test(x) ? String(parseInt(x,10)) : "0"; }
  // cabeçalho da tabela antiga -> campo do sistema novo
  var IMP_CAMPOS = {quantidade:"quantidade", servico:"servico", alinh:"alinhamento", alinhamento:"alinhamento",
    qbicos:"qtdBicos", bicos:"valorBicos", qcamb:"qtdCambagem", cambagem:"valorCambagem",
    qbalan:"qtdBalanceamento", balanceamento:"valorBalanceamento", qrodas:"qtdRodas", rodas:"valorRodas",
    peca:"valorPecas", pecas:"valorPecas", maodeobra:"maoDeObra", pneus:"valorPneus", valor:"valorAntigo",
    formadepagamento:"formaPagamento", pago:"pago", carro:"carro", vendedor:"vendedor"};
  var IMP_ORDEM_PADRAO = ["quantidade","servico","alinhamento","qtdBicos","valorBicos","qtdCambagem","valorCambagem","qtdBalanceamento",
    "valorBalanceamento","qtdRodas","valorRodas","valorPecas","maoDeObra","valorPneus","valorAntigo","formaPagamento","pago","carro","vendedor"];
  function impMapaColunas(cab){
    var mapa = cab.map(function(h){ return IMP_CAMPOS[impSemAcento(h).replace(/[^a-z0-9]/g,"")] || ""; });
    var reconhecidas = mapa.filter(Boolean).length;
    return reconhecidas>=8 ? mapa : IMP_ORDEM_PADRAO.slice();
  }
  function impMetodo(t){
    var x = impSemAcento(t);
    if (x.indexOf("din")===0) return "Dinheiro";
    if (x.indexOf("deb")===0) return "Débito";
    if (x.indexOf("cred")===0) return "Crédito";
    if (x.indexOf("pix")===0) return "Pix";
    return "";
  }
  // forma de pagamento antiga ("Pix", "Débito/Pix"...) -> forma do sistema novo; combinações viram "Múltiplo" com os valores
  // lidos da observação da venda (ex.: "849 pix e 31 cartão"); se não der para saber, divide igualmente e avisa
  function impPagamento(forma, total, detalhe){
    var metodos = [];
    String(forma||"").split(/[\/+&,;]| e /i).forEach(function(p){
      var m = impMetodo(p); if (m && metodos.indexOf(m)===-1) metodos.push(m);
    });
    metodos = metodos.slice(0,4);
    if (!metodos.length) return {formaPagamento:"Nenhum"};
    if (metodos.length===1 || !(total>0)) return {formaPagamento:metodos[0]};
    var achados = {}, t = impSemAcento(detalhe).replace(/r\$\s*/g,"");
    var re = /(\d+(?:[.,]\d+)?)\s*(?:reais\s*)?(?:no|na|em|de|do|da|pelo|pela|via)?\s*(pix|dinheiro|din|debito|credito|cartao)\b/g, m;
    var cartoes = metodos.filter(function(x){ return x==="Débito" || x==="Crédito"; });
    while ((m = re.exec(t))){
      var v = impNumero(m[1]); if (isNaN(v) || !(v>0)) continue;
      var nome = m[2]==="pix" ? "Pix" : (m[2]==="dinheiro"||m[2]==="din" ? "Dinheiro" : (m[2]==="debito" ? "Débito" : (m[2]==="credito" ? "Crédito" : (cartoes.length===1 ? cartoes[0] : ""))));
      if (nome && metodos.indexOf(nome)>-1) achados[nome] = (achados[nome]||0) + v;
    }
    var conhecidos = metodos.filter(function(x){ return achados[x]>0; });
    var valores = null;
    if (conhecidos.length===metodos.length){
      var soma = 0; conhecidos.forEach(function(x){ soma += achados[x]; });
      if (Math.abs(soma-total)<=0.01) valores = metodos.map(function(x){ return Math.round(achados[x]*100)/100; });
    } else if (conhecidos.length===metodos.length-1){
      var soma2 = 0; conhecidos.forEach(function(x){ soma2 += achados[x]; });
      var resto = Math.round((total-soma2)*100)/100;
      if (resto>0.005) valores = metodos.map(function(x){ return achados[x]>0 ? Math.round(achados[x]*100)/100 : resto; });
    }
    var aproximado = false;
    if (!valores){
      aproximado = true;
      var cent = Math.round(total*100), base = Math.floor(cent/metodos.length);
      valores = metodos.map(function(x,i){ return (i===metodos.length-1 ? cent-base*(metodos.length-1) : base)/100; });
    }
    return {formaPagamento:"Múltiplo (até 4 formas)",
            pagamentosMultiplos: metodos.map(function(x,i){ return {metodo:x, valor:valores[i]}; }),
            aproximado: aproximado};
  }
  // converte uma linha da tabela antiga (lista de textos das células) numa venda do sistema novo
  function impConverterLinha(cells, mapa, detalheTxt, nomeArquivo){
    var v = {};
    mapa.forEach(function(campo, i){ if (campo) v[campo] = cells[i]===undefined ? "" : cells[i]; });
    var row = {
      id: uid(), quantidade: impInteiro(v.quantidade), medida:"", medidaId:"", medidaBaixa:0, servico:"",
      alinhamento: impDinheiro(v.alinhamento),
      qtdBicos: impInteiro(v.qtdBicos), valorBicos: impDinheiro(v.valorBicos),
      qtdCambagem: impInteiro(v.qtdCambagem), valorCambagem: impDinheiro(v.valorCambagem),
      qtdBalanceamento: impInteiro(v.qtdBalanceamento), valorBalanceamento: impDinheiro(v.valorBalanceamento),
      qtdRodas: impInteiro(v.qtdRodas), valorRodas: impDinheiro(v.valorRodas),
      outros: impDinheiro(v.maoDeObra), // a antiga "Mão de obra" hoje é o campo Serviço
      valorPecas: impDinheiro(v.valorPecas), maoDeObra:"", valorPneus: impDinheiro(v.valorPneus),
      formaPagamento:"Nenhum", pago: (impNorm(v.pago).indexOf("✅")>-1 ? "✅" : "❌"),
      carro:"Carro 1", vendedor: VENDEDORES[0], detalhes:"", clienteId:""
    };
    var notas = [];
    // coluna "Serviço" da tabela antiga: medida do pneu (225/55/18) ou só um rótulo (RODA, SERVIÇO)
    var serv = impNorm(v.servico);
    if (serv){
      if (/\d{2,3}\s*\/\s*\d{2}/.test(serv)) row.medida = serv;
      else if (!/^servi[cç]o$/i.test(serv)) notas.push("Serviço: "+serv);
    }
    // venda sem pneu: a quantidade antiga era só o valor padrão da célula
    if (!row.medida && !row.valorPneus) row.quantidade = "0";
    var car = impNorm(v.carro);
    if (/^carro\s*\d+$/i.test(car)) row.carro = "Carro "+car.replace(/\D/g,"");
    var vend = impNorm(v.vendedor);
    if (vend && !/^vendedor$/i.test(vend)){
      var achou = VENDEDORES.filter(function(x){ return x.toLowerCase()===vend.toLowerCase(); })[0];
      if (achou) row.vendedor = achou; else notas.push("Vendedor: "+vend);
    }
    var det = String(detalheTxt||"").replace(/\u00a0/g," ").trim();
    if (det) notas.push(det);
    row.detalhes = notas.join("\n");
    var total = computeValor(row);
    var pg = impPagamento(v.formaPagamento, total, det);
    row.formaPagamento = pg.formaPagamento;
    if (pg.pagamentosMultiplos) row.pagamentosMultiplos = pg.pagamentosMultiplos;
    row.importadoDe = nomeArquivo;
    var vazia = !(total>0) && !row.medida && !row.detalhes && parseNum(row.quantidade)===0 && !(parseNum(row.qtdBicos)>0);
    return {row: row, vazia: vazia, aproximado: !!pg.aproximado, valorAntigo: impNumero(impNorm(v.valorAntigo))};
  }
  // lê o texto de um arquivo .html antigo e devolve a data (do nome do arquivo) e as vendas já convertidas
  function impDataDoNome(nome){
    var m = /(\d{1,2})[-_.\/](\d{1,2})[-_.\/](\d{4})/.exec(nome), d, mo, y;
    if (m){ d = +m[1]; mo = +m[2]; y = +m[3]; }
    else { m = /(\d{4})[-_.](\d{1,2})[-_.](\d{1,2})/.exec(nome); if (m){ y = +m[1]; mo = +m[2]; d = +m[3]; } }
    if (!m) return "";
    var dt = new Date(y, mo-1, d);
    if (y<2000 || y>2100 || dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return "";
    return y+"-"+pad(mo)+"-"+pad(d);
  }
  // ---------- formato simples das tabelas mais antigas: Quantidade | Serviço | Valor | Forma de Pagamento | Vendedor ----------
  // cada linha é UM item (pneu, alinhamento, bicos, balanceamento, peça...). Aqui eles são lidos pelo que o texto do "Serviço" diz.
  function impFmtNum(n){ var r = Math.round(n*100)/100; return r===0 ? "" : (r%1===0 ? String(r) : r.toFixed(2)); }
  function impColunasSimples(tabela){
    var trs = [].slice.call(tabela.querySelectorAll("tr")), hi = -1, idx = null;
    for (var i=0;i<trs.length;i++){
      var cs = [].map.call(trs[i].querySelectorAll("th,td"), function(c){ return impSemAcento(c.textContent).replace(/[^a-z0-9]/g,""); });
      var si = cs.indexOf("servico"), vi = cs.indexOf("valor");
      if (si>-1 && vi>-1 && cs.length>=3){
        hi = i; idx = {q:cs.indexOf("quantidade"), s:si, v:vi, p:cs.indexOf("formadepagamento"), d:cs.indexOf("vendedor")};
        break;
      }
    }
    if (hi<0) return null;
    var linhas = [];
    for (var j=hi+1;j<trs.length;j++){
      var tds = trs[j].querySelectorAll("td");
      if (!tds.length) continue;
      var cells = [].map.call(tds, function(td){ return impNorm(td.textContent); });
      if (cells.length<3){ // linha solta: "Total: ..." (ignora) ou uma observação da linha de cima
        if (/^total/i.test(cells[0]||"")) continue;
        if (linhas.length && cells[0]) linhas[linhas.length-1].detalhe += (linhas[linhas.length-1].detalhe ? "\n" : "")+cells[0];
        continue;
      }
      linhas.push({q: idx.q>-1 ? cells[idx.q] : "1", s: cells[idx.s]||"", v: cells[idx.v]||"",
                   p: idx.p>-1 ? (cells[idx.p]||"") : "", d: idx.d>-1 ? (cells[idx.d]||"") : "", detalhe:""});
    }
    return linhas;
  }
  function impConverterSimples(linhas, nome, res){
    var grupos = [], juntadas = 0;
    function nova(){
      return {num:{}, notas:[], valorAntigo:0, pagto:"", forma:"", vendedor:"",
        row:{id: uid(), quantidade:"0", medida:"", medidaId:"", medidaBaixa:0, servico:"", alinhamento:"",
          qtdBicos:"0", valorBicos:"", qtdCambagem:"0", valorCambagem:"", qtdBalanceamento:"0", valorBalanceamento:"",
          qtdRodas:"0", valorRodas:"", outros:"", valorPecas:"", maoDeObra:"", valorPneus:"",
          formaPagamento:"Nenhum", pago:"✅", carro:"Carro 1", vendedor:VENDEDORES[0], detalhes:"", clienteId:""}};
    }
    function soma(g, campo, n){ g.num[campo] = (g.num[campo]||0) + n; }
    linhas.forEach(function(l){
      var texto = impNorm(l.s), t = impSemAcento(texto);
      var valor = impNumero(impNorm(l.v)); if (isNaN(valor)) valor = 0;
      if (!texto && !(valor>0)) return;
      var qtd = parseInt(impNorm(l.q), 10); if (isNaN(qtd) || qtd<0) qtd = 0;
      var ehPneu = /\d{2,3}\s*\/\s*\d{2}/.test(texto) || /^\d{2}\s*c$/i.test(texto);
      var pagto = impMetodo(l.p) || impSemAcento(l.p);
      var g = grupos.length ? grupos[grupos.length-1] : null;
      // pneu abre uma venda nova; serviço/peça com o mesmo pagamento da linha de cima entra na mesma venda
      if (ehPneu || !g || g.pagto!==pagto){ g = nova(); g.pagto = pagto; g.forma = l.p; grupos.push(g); }
      else juntadas++;
      g.valorAntigo += valor;
      if (ehPneu){
        g.row.medida = texto; g.row.quantidade = String(qtd||1); soma(g,"valorPneus",valor);
      } else if (/alinh/.test(t)){ soma(g,"alinhamento",valor);
      } else if (/bico/.test(t)){ soma(g,"qtdBicos",qtd||1); soma(g,"valorBicos",valor);
      } else if (/cambag/.test(t)){ soma(g,"qtdCambagem",qtd||1); soma(g,"valorCambagem",valor);
      } else if (/balan/.test(t)){ soma(g,"qtdBalanceamento",qtd||1); soma(g,"valorBalanceamento",valor);
      } else if (/roda|desempeno/.test(t)){ soma(g,"qtdRodas",qtd||1); soma(g,"valorRodas",valor);
      } else if (/porca|parafuso|prisioneiro|pec[ao]s?\b|valvula|capa|tampa|calota/.test(t)){
        soma(g,"valorPecas",valor); g.notas.push("Peça: "+texto+(qtd>1 ? " (x"+qtd+")" : ""));
      } else { soma(g,"outros",valor); g.notas.push("Serviço: "+texto+(qtd>1 ? " (x"+qtd+")" : "")); }
      var vend = impNorm(l.d);
      if (vend){
        var achou = VENDEDORES.filter(function(x){ return x.toLowerCase()===vend.toLowerCase(); })[0];
        if (achou){ if (!g.vendedor){ g.vendedor = achou; g.row.vendedor = achou; } }
        else g.notas.push("Vendedor: "+vend);
      }
      if (l.detalhe) g.notas.push(l.detalhe);
    });
    var out = grupos.map(function(g){
      var r = g.row;
      Object.keys(g.num).forEach(function(k){
        r[k] = /^qtd/.test(k) ? String(Math.round(g.num[k])) : impFmtNum(g.num[k]);
      });
      r.detalhes = g.notas.join("\n");
      var total = computeValor(r);
      var pg = impPagamento(g.forma, total, r.detalhes);
      r.formaPagamento = pg.formaPagamento;
      if (pg.pagamentosMultiplos) r.pagamentosMultiplos = pg.pagamentosMultiplos;
      r.importadoDe = nome;
      return {row:r, vazia:false, aproximado:!!pg.aproximado, valorAntigo:g.valorAntigo};
    });
    if (res){
      res.avisos.push("Tabela no formato simples (uma linha por item): li pelo texto do serviço.");
      if (juntadas) res.avisos.push(juntadas+" linha(s) de serviço/peça foram juntadas à venda de cima com o mesmo pagamento — confira se faz sentido.");
    }
    return out;
  }
  // ---------- medidas que não existem no estoque: cadastra com quantidade 0 ----------
  function impChaveMedida(m){
    var s = impNorm(m), nums = s.match(/\d+/g) || [];
    if (nums.length>=3) return nums.slice(0,3).join("/") + (/recap/i.test(s) ? "|recap" : "");
    return impSemAcento(s).replace(/[^a-z0-9]/g,"");
  }
  function impMedidasFaltando(rows){
    var tem = {}, vistas = {}, out = [];
    loadEstoque().forEach(function(i){ tem[impChaveMedida(i.medida)] = true; });
    (rows||[]).forEach(function(r){
      var m = impNorm(r && r.medida); if (!m) return;
      var k = impChaveMedida(m);
      if (!k || tem[k] || vistas[k]) return;
      vistas[k] = true; out.push(m);
    });
    return out;
  }
  function impCadastrarMedidas(rows){
    var faltam = impMedidasFaltando(rows);
    faltam.forEach(function(m){ addEstoqueItem({medida:m, marca:"", quantidade:0, preco:0, custo:0, minimo:0}); });
    return faltam.length;
  }
  function impLerHtml(texto, nome){
    var res = {nome:nome, date: impDataDoNome(nome), rows:[], avisos:[], erro:"", totalNovo:0, totalAntigo:0, totalArquivo:null, divergentes:0, aproximados:0};
    var doc;
    try{ doc = new DOMParser().parseFromString(texto, "text/html"); }catch(e){ res.erro = "Não consegui abrir este arquivo."; return res; }
    var tabela = doc.querySelector("table#minhaTabela") || doc.querySelector("table");
    if (!tabela){ res.erro = "Não encontrei nenhuma tabela neste arquivo."; return res; }
    if (!res.date){
      var mm = /Data(?: da Exporta[^:]*)?:\s*(\d{1,2}[-\/]\d{1,2}[-\/]\d{4})/i.exec(doc.body ? doc.body.textContent : "");
      var dd = mm ? impDataDoNome(mm[1]) : "";
      if (dd){ res.date = dd; res.avisos.push("A data não estava no nome do arquivo; usei a data escrita dentro da tabela."); }
    }
    if (!res.date){ res.erro = "Não achei a data no nome do arquivo (ex.: VENDAS_21-08-2026.html)."; return res; }
    var cab = [].map.call(tabela.querySelectorAll("thead th"), function(th){ return th.textContent; });
    if (!cab.length){ var thr = tabela.querySelector("tr"); if (thr) cab = [].map.call(thr.querySelectorAll("th"), function(th){ return th.textContent; }); }
    var mapa = impMapaColunas(cab);
    var reconhecidas = cab.filter(function(h){ return IMP_CAMPOS[impSemAcento(h).replace(/[^a-z0-9]/g,"")]; }).length;
    var simples = reconhecidas>=8 ? null : impColunasSimples(tabela);
    var linhas = [];
    [].forEach.call(tabela.querySelectorAll("tr"), function(tr){
      if (tr.parentNode && tr.parentNode.tagName==="THEAD") return;
      var tds = tr.querySelectorAll("td");
      if (!tds.length) return;
      if (tr.classList.contains("exibir-row") || (tds.length===1 && tds[0].colSpan>1)){
        if (linhas.length) linhas[linhas.length-1].detalhe = tds[0].textContent;
        return;
      }
      linhas.push({cells: [].map.call(tds, function(td){ return td.textContent; }), detalhe:""});
    });
    var convertidos = simples ? impConverterSimples(simples, nome, res)
      : linhas.map(function(l){ return impConverterLinha(l.cells, mapa, l.detalhe, nome); });
    convertidos.forEach(function(c){
      if (c.vazia) return;
      res.rows.push(c.row);
      var novo = computeValor(c.row);
      res.totalNovo += novo;
      if (!isNaN(c.valorAntigo)){
        res.totalAntigo += c.valorAntigo;
        if (Math.abs(c.valorAntigo-novo)>0.01) res.divergentes++;
      }
      if (c.aproximado) res.aproximados++;
    });
    if (!res.rows.length){ res.erro = "Nenhuma venda encontrada nesta tabela."; return res; }
    var tg = /Total(?:\s+Geral)?:\s*([\d.,]+)/i.exec(doc.body ? doc.body.textContent : "");
    if (tg){ var n = impNumero(tg[1]); if (!isNaN(n)) res.totalArquivo = n; }
    return res;
  }
  function impLerArquivo(file){
    return new Promise(function(resolve){
      var fr = new FileReader();
      fr.onload = function(){ resolve(impLerHtml(String(fr.result||""), file.name)); };
      fr.onerror = function(){ resolve({nome:file.name, erro:"Não consegui ler este arquivo.", rows:[]}); };
      fr.readAsText(file, "utf-8");
    });
  }
  function impDiaTemDados(rows){
    return (rows||[]).some(function(r){ return r && (computeSubtotal(r)>0 || parseNum(r.quantidade)>0 || r.medida); });
  }
  // define, para cada arquivo lido, o que fazer por padrão (nunca mexe em dia que já tem vendas sem você escolher)
  function impPrepararAcoes(itens){
    var vistas = {};
    itens.sort(function(a,b){ return (a.date||"").localeCompare(b.date||"") || a.nome.localeCompare(b.nome); });
    itens.forEach(function(it){
      if (it.erro){ it.acao = "skip"; return; }
      var atuais = lsGetJSON(K_ROWS+it.date, []);
      it.existentes = atuais.length;
      it.temDados = impDiaTemDados(atuais);
      it.jaImportado = atuais.some(function(r){ return r && r.importadoDe===it.nome; });
      it.dupLote = !!vistas[it.date];
      it.medidasNovas = impMedidasFaltando(it.rows);
      if (it.jaImportado || it.temDados || it.dupLote) it.acao = "skip"; else it.acao = "import";
      if (!it.erro) vistas[it.date] = true;
    });
    return itens;
  }
  function impExecutar(itens, cb){
    var res = {arquivos:0, vendas:0, pulados:0, medidasCriadas:0, linhas:[]};
    function aplicar(){
      var seq = Promise.resolve();
      itens.forEach(function(it){
        seq = seq.then(function(){
          if (it.erro || it.acao==="skip"){ res.pulados++; return; }
          var atuais = lsGetJSON(K_ROWS+it.date, []);
          var novas;
          if (it.acao==="merge" && impDiaTemDados(atuais)) novas = atuais.concat(it.rows);
          else {
            if (it.acao==="replace") atuais.forEach(function(r){ if (r && r.medidaId) releaseRowEstoque(r); }); // devolve ao estoque o que essas vendas tinham baixado
            novas = it.rows;
          }
          res.medidasCriadas += impCadastrarMedidas(it.rows);
          return saveRows(it.date, novas).then(function(){
            res.arquivos++; res.vendas += it.rows.length;
            res.linhas.push({nome:it.nome, date:it.date, vendas:it.rows.length, acao:it.acao});
          });
        });
      });
      return seq;
    }
    makeSnapshot("Antes de importar tabelas antigas", "pre-"+Date.now()).catch(function(){}).then(aplicar).then(function(){
      state.monthSummaryCache = {}; state.monthPartsCache = {};
      cb(null, res);
    }).catch(function(e){ cb(e, res); });
  }

  // ======================= MODAL: FECHAMENTO DO DIA =======================
  var FC_METODOS = ["Dinheiro","Débito","Crédito","Pix"];
  function fcNomeVenda(r, tipo){
    var cli = (r.clienteId && customerNameById(r.clienteId)) || r.cliente || "";
    var partes = [];
    if (tipo==="Novo") partes.push("Pneu novo");
    else if (r.carro) partes.push(r.carro);
    if (cli) partes.push(cli);
    if (r.medida) partes.push(r.medida);
    return partes.join(" · ") || "Venda sem identificação";
  }
  // procura vendas (1, 2 ou 3) cuja soma é exatamente a diferença encontrada; pool = [{i:índice, c:centavos}]
  function fcSubconjuntos(pool, alvo){
    var n = pool.length, out = [], a, b, c;
    if (!(alvo>0)) return out;
    for (a=0;a<n;a++) if (Math.abs(pool[a].c-alvo)<=1) out.push([pool[a].i]);
    if (out.length) return out.slice(0,5);
    for (a=0;a<n;a++) for (b=a+1;b<n;b++) if (Math.abs(pool[a].c+pool[b].c-alvo)<=1) out.push([pool[a].i,pool[b].i]);
    if (out.length) return out.slice(0,5);
    if (n<=40){
      for (a=0;a<n && out.length<5;a++) for (b=a+1;b<n && out.length<5;b++) for (c=b+1;c<n && out.length<5;c++){
        if (Math.abs(pool[a].c+pool[b].c+pool[c].c-alvo)<=1) out.push([pool[a].i,pool[b].i,pool[c].i]);
      }
    }
    return out.slice(0,5);
  }
  // compara o que foi lançado nas vendas do dia com o que o master diz que entrou em cada forma
  function fcComparar(d, contado, fundo){
    var lista = [];
    rowsOfDay(d).forEach(function(r){ lista.push({r:r, tipo:"Seminovo"}); });
    novosRowsDoDia(d).forEach(function(r){ lista.push({r:r, tipo:"Novo"}); });
    var vendas = [];
    lista.forEach(function(x){
      var v = computeValor(x.r);
      if (!(v>0.004)) return;
      var pb = paymentBreakdown(x.r), pago = 0;
      FC_METODOS.forEach(function(m){ pago += pb[m]; });
      var forma = x.r.formaPagamento || "Nenhum";
      var venda = {nome:fcNomeVenda(x.r, x.tipo), valor:v, pb:pb, sobra:Math.max(0, v-pago), forma:forma, flags:[], suspeitas:[]};
      if (x.r.pago!=="✅") venda.flags.push("Não está marcada como paga");
      var aviso = pagamentoAviso(x.r, v);
      if (aviso) venda.flags.push(aviso);
      else if (venda.sobra>0.005) venda.flags.push(forma==="Nenhum" ? "Sem forma de pagamento lançada" : "Falta lançar "+fmtCurrency(venda.sobra)+" na forma de pagamento");
      vendas.push(venda);
    });
    var metodos = FC_METODOS.map(function(m){
      var lanc = 0; vendas.forEach(function(v){ lanc += v.pb[m]; });
      var txt = (contado && contado[m]!==undefined && contado[m]!==null) ? String(contado[m]).trim() : "";
      var entrou = txt==="" ? null : parseNum(txt) - (m==="Dinheiro" ? fundo - saidasTotal(d) : 0);
      return {m:m, lanc:lanc, entrou:entrou, dif:(entrou===null ? null : entrou-lanc), notas:[]};
    });
    function pool(m, modo){
      var p = [];
      vendas.forEach(function(v,i){ var a = modo==="pago" ? v.pb[m] : v.sobra; if (a>0.004) p.push({i:i, c:Math.round(a*100)}); });
      return p;
    }
    function nomes(ids){ return ids.map(function(i){ return vendas[i].nome+" ("+fmtCurrency(vendas[i].valor)+")"; }).join(" + "); }
    var TOL = 0.005;
    // 1) forma de pagamento trocada: faltou em uma forma e sobrou na outra no mesmo valor
    metodos.forEach(function(mf){
      if (mf.dif===null || !(mf.dif<-TOL)) return;
      metodos.forEach(function(ms){
        if (ms===mf || ms.dif===null || !(ms.dif>TOL)) return;
        var alvo = Math.round(Math.min(-mf.dif, ms.dif)*100);
        fcSubconjuntos(pool(mf.m,"pago"), alvo).forEach(function(ids){
          mf.notas.push("Pode ter sido lançada em "+mf.m+" mas entrou em "+ms.m+": "+nomes(ids));
          ms.notas.push("Pode ser venda lançada em "+mf.m+": "+nomes(ids));
          ids.forEach(function(i){ vendas[i].suspeitas.push("Lançada em "+mf.m+", mas pode ter entrado em "+ms.m+" ("+fmtCurrency(alvo/100)+")"); });
        });
      });
    });
    // 2) entrou menos do que o lançado, ou mais
    metodos.forEach(function(mm){
      if (mm.dif===null) return;
      if (mm.dif<-TOL){
        var s1 = fcSubconjuntos(pool(mm.m,"pago"), Math.round(-mm.dif*100));
        s1.forEach(function(ids){
          mm.notas.push("Pode explicar a falta de "+fmtCurrency(-mm.dif)+": "+nomes(ids));
          ids.forEach(function(i){ vendas[i].suspeitas.push("Pode explicar a falta de "+fmtCurrency(-mm.dif)+" em "+mm.m); });
        });
        if (!s1.length && !mm.notas.length) mm.notas.push("Nenhuma venda isolada tem esse valor: pode ser mais de uma venda, valor digitado errado ou venda lançada em "+mm.m+" que não entrou.");
      } else if (mm.dif>TOL){
        var s2 = fcSubconjuntos(pool(mm.m,"sobra"), Math.round(mm.dif*100));
        s2.forEach(function(ids){
          mm.notas.push("Pode ter sido paga em "+mm.m+" mas está sem forma de pagamento: "+nomes(ids));
          ids.forEach(function(i){ vendas[i].suspeitas.push("Pode ter sido paga em "+mm.m+" ("+fmtCurrency(mm.dif)+")"); });
        });
        if (!s2.length && !mm.notas.length) mm.notas.push("Entrou mais do que o lançado: pode ser venda não lançada, valor lançado menor ou pagamento lançado em outra forma.");
      }
    });
    vendas.sort(function(x,y){ return (y.suspeitas.length*2+y.flags.length) - (x.suspeitas.length*2+x.flags.length); });
    return {metodos:metodos, vendas:vendas};
  }

  // ---------- conferência por extrato: cada pagamento do extrato x cada pagamento lançado nas vendas ----------
  var FC_EXT_METODOS = ["Débito","Crédito","Pix"];
  function fcValorBR(str){
    var v = String(str).replace(/\s/g,"");
    if (!v) return null;
    if (v.indexOf(",")>-1 && v.indexOf(".")>-1) v = v.replace(/\./g,"").replace(",",".");
    else if (v.indexOf(",")>-1) v = v.replace(",",".");
    else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,"");
    if (!/^\d+(\.\d+)?$/.test(v)) return null;
    var n = parseFloat(v);
    return isFinite(n) ? Math.round(n*100) : null;
  }
  // lê uma lista de valores (um por linha ou separados por ;) em centavos; linhas que não deu para entender vão em "ignoradas"
  function fcLerValores(texto){
    var valores = [], ignoradas = [];
    String(texto||"").split(/[\n;]+/).forEach(function(linha){
      var t = linha.replace(/R\$/gi,"").trim();
      if (!t) return;
      var c = fcValorBR(t);
      if (c===null){
        var toks = t.match(/\d{1,3}(?:\.\d{3})*,\d{2}(?!\d)|\d+\.\d{2}(?!\d)/g);
        if (toks && toks.length) c = fcValorBR(toks[toks.length-1]);
      }
      if (c===null || c<=0) ignoradas.push(t); else valores.push(c);
    });
    return {valores:valores, ignoradas:ignoradas};
  }
  function fcVendasBase(d){
    var lista = [];
    rowsOfDay(d).forEach(function(r){ lista.push({r:r, tipo:"Seminovo"}); });
    novosRowsDoDia(d).forEach(function(r){ lista.push({r:r, tipo:"Novo"}); });
    var vendas = [];
    lista.forEach(function(x){
      var v = computeValor(x.r);
      if (!(v>0.004)) return;
      var pb = paymentBreakdown(x.r), pago = 0;
      FC_METODOS.forEach(function(m){ pago += pb[m]; });
      vendas.push({nome:fcNomeVenda(x.r, x.tipo), valor:v, pb:pb, sobra:Math.max(0, v-pago), forma:x.r.formaPagamento||"Nenhum"});
    });
    return vendas;
  }
  function fcConferirExtrato(d, textos, tol){
    var vendas = fcVendasBase(d);
    var tolC = Math.round(Math.max(0, tol||0)*100);
    var ext = {}, sys = {}, info = {};
    FC_METODOS.forEach(function(m){
      sys[m] = [];
      vendas.forEach(function(v,i){ if (v.pb[m]>0.004) sys[m].push({i:i, c:Math.round(v.pb[m]*100), usado:false, par:null}); });
    });
    FC_EXT_METODOS.forEach(function(m){
      var txt = (textos && textos[m]) || "";
      var lidos = fcLerValores(txt);
      info[m] = {informado: String(txt).trim()!=="", ignoradas: lidos.ignoradas};
      ext[m] = lidos.valores.map(function(c){ return {c:c, usado:false, par:null}; });
    });
    // 1) valores iguais; 2) com a diferença aceita (taxa da maquininha, por exemplo)
    FC_EXT_METODOS.forEach(function(m){
      if (!info[m].informado) return;
      ext[m].forEach(function(e){
        for (var k=0;k<sys[m].length;k++){ var s1 = sys[m][k]; if (!s1.usado && s1.c===e.c){ s1.usado = true; e.usado = true; e.par = s1; s1.par = e; break; } }
      });
      if (tolC>0){
        ext[m].forEach(function(e){
          if (e.usado) return;
          var best = null;
          sys[m].forEach(function(s2){ if (!s2.usado && Math.abs(s2.c-e.c)<=tolC && (!best || Math.abs(s2.c-e.c)<Math.abs(best.c-e.c))) best = s2; });
          if (best){ best.usado = true; e.usado = true; e.par = best; best.par = e; }
        });
      }
    });
    function achaSys(c, exceto){
      var out = null;
      FC_METODOS.forEach(function(m2){
        if (m2===exceto || out) return;
        sys[m2].forEach(function(s3){ if (!out && !s3.usado && Math.abs(s3.c-c)<=tolC) out = {m:m2, s:s3}; });
      });
      return out;
    }
    function achaExt(c, exceto){
      var out = null;
      FC_EXT_METODOS.forEach(function(m2){
        if (m2===exceto || out || !info[m2].informado) return;
        ext[m2].forEach(function(e2){ if (!out && !e2.usado && Math.abs(e2.c-c)<=tolC) out = {m:m2, e:e2}; });
      });
      return out;
    }
    var metodos = [];
    FC_EXT_METODOS.forEach(function(m){
      var r = {m:m, informado:info[m].informado, ignoradas:info[m].ignoradas, bateram:0, soExtrato:[], soSistema:[], somaExt:0, somaSys:0, comDif:[]};
      sys[m].forEach(function(s4){ r.somaSys += s4.c; });
      if (!r.informado){ metodos.push(r); return; }
      ext[m].forEach(function(e){
        r.somaExt += e.c;
        if (e.usado){ r.bateram++; if (e.par && e.par.c!==e.c) r.comDif.push({nome:vendas[e.par.i].nome, extrato:e.c, sistema:e.par.c}); return; }
        var dica = "";
        var o = achaSys(e.c, m);
        if (o) dica = "Existe venda deste valor lançada em "+o.m+": "+vendas[o.s.i].nome;
        else {
          var sv = null;
          vendas.forEach(function(v){ if (!sv && Math.abs(Math.round(v.sobra*100)-e.c)<=tolC && v.sobra>0.004) sv = v; });
          if (sv) dica = "A venda "+sv.nome+" está sem forma de pagamento (ou pendente) com este valor";
          else {
            var tv = null;
            vendas.forEach(function(v){ if (!tv && Math.abs(Math.round(v.valor*100)-e.c)<=tolC && Math.abs(Math.round(v.pb[m]*100)-e.c)>tolC) tv = v; });
            dica = tv ? "Igual ao total da venda "+tv.nome+", que está lançada de outra forma ou dividida" : "Nenhuma venda lançada com este valor";
          }
        }
        r.soExtrato.push({c:e.c, dica:dica});
      });
      sys[m].forEach(function(s5){
        if (s5.usado) return;
        var o2 = achaExt(s5.c, m);
        r.soSistema.push({nome:vendas[s5.i].nome, c:s5.c, dica:(o2 ? "Este valor apareceu no extrato de "+o2.m : "Não apareceu no extrato")});
      });
      metodos.push(r);
    });
    return {metodos:metodos};
  }

  function lojaParaSemVendedor(){
    var alterou = false;
    listAllDates().forEach(function(d){
      if (d >= today) return;
      var rows = lsGetJSON(K_ROWS+d, []);
      if (!Array.isArray(rows)) return;
      var mudou = false;
      rows.forEach(function(r){
        if (r && (!r.vendedor || r.vendedor==="Nenhum") && !linhaApagadaVazia(r)){ r.vendedor = "Loja"; mudou = true; }
      });
      if (mudou){ saveRows(d, rows); alterou = true; }
    });
    var chaves = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf(K_NOVOS)===0 && k!==K_NOVOS_META) chaves.push(k.slice(K_NOVOS.length));
    }
    chaves.forEach(function(m){
      var lista = loadNovosMonth(m), mudou = false;
      lista.forEach(function(n){
        if (n && n.date && n.date<today && (!n.vendedor || n.vendedor==="Nenhum") && !isBlankNovo(n)){ n.vendedor = "Loja"; mudou = true; }
      });

    });

  // ---------- feriados nacionais (não trabalhamos aos domingos nem feriados) ----------
  var nationalHolidaysCache = {};
  function easterISO(year){
    // algoritmo de Meeus/Jones/Butcher
    var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return toISO(new Date(year, month-1, day));
  }
  function nationalHolidays(year){
    if (nationalHolidaysCache[year]) return nationalHolidaysCache[year];
    var easter = easterISO(year);
    var list = [
      year+"-01-01",              // confraternização universal
      addDays(easter, -48),       // carnaval (segunda)
      addDays(easter, -47),       // carnaval (terça)
      addDays(easter, -2),        // sexta-feira santa
      year+"-04-21",              // tiradentes
      year+"-05-01",              // dia do trabalho
      addDays(easter, 60),        // corpus christi
      year+"-09-07",              // independência
      year+"-10-12",              // n. sra. aparecida
      year+"-11-02",              // finados
      year+"-11-15",              // proclamação da república
      year+"-12-25"               // natal
    ];
    if (year>=2024) list.push(year+"-11-20"); // consciência negra (feriado nacional desde 2024)
    nationalHolidaysCache[year] = list;
    return list;
  }
  function isBusinessDay(iso){
    if (fromISO(iso).getDay()===0) return false; // domingo
    return nationalHolidays(parseInt(iso.slice(0,4),10)).indexOf(iso)===-1;
  }
  // conta dias úteis (sem domingo/feriado) de fromDay até o fim do mês
  function countBusinessDays(monthStr, fromDayInclusive){
    var nd = daysInMonth(monthStr);
    var count = 0;
    for (var day=fromDayInclusive; day<=nd; day++){
      if (isBusinessDay(monthStr+"-"+pad(day))) count++;
    }
    return count;
  }

  // ---------- encolhe a tabela para caber na largura da tela, sem scroll lateral ----------
  var fitRAF = null;
  function fitGridToWidth(){
    var wrap = document.querySelector(".grid-scroll");
    var inner = document.getElementById("gridInner");
    var headWrap = document.querySelector(".grid-scroll-head");
    var headRow = headWrap ? headWrap.querySelector(".grid-row.head") : null;
    if (!wrap || !inner) return;
    inner.style.transform = "none";
    wrap.style.height = "";
    if (headRow) headRow.style.transform = "none";
    if (headWrap) headWrap.style.height = "";

    var naturalWidth = Math.max(inner.scrollWidth, headRow ? headRow.scrollWidth : 0);
    var naturalHeight = inner.scrollHeight;
    var headNaturalHeight = headRow ? headRow.scrollHeight : 0;
    var available = wrap.clientWidth;
    var scale = available > 0 && naturalWidth > available ? (available / naturalWidth) : 1;
    if (scale < 1){
      inner.style.transform = "scale(" + scale + ")";
      wrap.style.height = Math.ceil(naturalHeight * scale) + "px";
      if (headRow){
        headRow.style.transform = "scale(" + scale + ")";
        headRow.style.transformOrigin = "top left";
        if (headWrap) headWrap.style.height = Math.ceil(headNaturalHeight * scale) + "px";
      }
    }
  }
  function scheduleFitGrid(){

      jobs.push(loadMonthParts(state.dashMonth).then(function(totals){ state.monthPartsCache[state.dashMonth]=totals; }));
    }
    if (jobs.length===0) return cb();
    Promise.all(jobs).then(cb);

  function loadMonthParts(month){

      allRows.forEach(function(rows){

          t.valorBicos += parseNum(r.valorBicos);
          t.qtdCambagem += parseNum(r.qtdCambagem);
          t.valorCambagem += parseNum(r.valorCambagem);
          t.qtdRodas += parseNum(r.qtdRodas);
          t.valorRodas += parseNum(r.valorRodas);
          var v = (r.vendedor && r.vendedor!=="Nenhum") ? r.vendedor : (linhaApagadaVazia(r) ? "" : "Loja");
          if (v && t.porVendedor[v]){

  function setupClientesSection(){
    var input = document.getElementById("dashCustSearch");

    if (!input || !area) return;
    var local = { query:"", selectedId:null };

    function draw(){
      if (local.selectedId) drawDetail(); else drawList();
    }

    function drawList(){
      var customers = loadCustomers();
      if (customers.length===0){
        area.innerHTML = '<div class="cust-empty">Nenhum cliente cadastrado ainda. Cadastre um cliente na hora de imprimir uma nota.</div>';
        return;
      }
      var q = local.query.trim().toLowerCase();
      var filtered = q ? customers.filter(function(c){
        return (c.nome||"").toLowerCase().indexOf(q)>-1 ||
               (customerDocInfo(c).documento||"").toLowerCase().indexOf(q)>-1 ||
               (c.telefone||"").toLowerCase().indexOf(q)>-1;
      }) : customers;
      if (filtered.length===0){
        area.innerHTML = '<div class="cust-empty">Nenhum cliente encontrado para "'+escHtml(local.query)+'".</div>';
        return;
      }
      var notas = loadNotas();
      area.innerHTML = '<div class="cust-list" style="max-height:320px;">'+
        filtered.map(function(c){
          var count = notas.filter(function(n){return n.customerId===c.id;}).length;
          var sub = [customerDocLabel(c), c.telefone].filter(Boolean).join(" · ");
          return '<button class="cust-item" data-cid="'+escAttr(c.id)+'">'+
            '<span class="cust-name">'+escHtml(c.nome)+'</span>'+
            '<span class="cust-sub">'+(sub?escHtml(sub)+' · ':'')+count+' nota(s)</span>'+
          '</button>';
        }).join("")+
      '</div>';
      area.querySelectorAll(".cust-item").forEach(function(btn){
        btn.addEventListener("click", function(){
          local.selectedId = btn.getAttribute("data-cid");
          draw();
        });
      });
    }

    function drawDetail(){
      var customers = loadCustomers();
      var customer = customers.filter(function(c){return c.id===local.selectedId;})[0];
      if (!customer){ local.selectedId=null; drawList(); return; }
      var notas = loadNotas().filter(function(n){return n.customerId===customer.id;})
        .sort(function(a,b){ return b.createdAt - a.createdAt; });
      var sub = [customerDocLabel(customer), customer.telefone, customer.email].filter(Boolean).join(" · ");
      var notasHtml = notas.length
        ? notas.map(function(n){
            return '<div class="arow">'+
              '<span class="d" data-nota="'+escAttr(n.id)+'" role="button" tabindex="0" style="cursor:pointer;">Venda #'+n.vendaNum+' · '+fmtDateBR(n.date)+'</span>'+
              '<span class="stats"><span><b>'+fmtCurrency(n.totalProdutos)+'</b></span><span>'+escHtml(n.formaPagamento||"")+'</span>'+
              '<button class="icon-btn" data-delnota="'+escAttr(n.id)+'" title="Apagar nota">✕</button></span>'+
            '</div>';
          }).join("")
        : '<div class="arow-empty">Nenhuma nota registrada para este cliente ainda.</div>';
      area.innerHTML =
        '<button class="backlink" id="custBack" style="padding:4px 0 10px;">‹ Voltar aos clientes</button>'+
        '<div style="margin-bottom:10px;">'+
          '<div class="cust-detail-name">'+escHtml(customer.nome)+'</div>'+
          (sub?'<div class="cust-detail-sub">'+escHtml(sub)+'</div>':'')+
          (customer.endereco?'<div class="cust-detail-sub">'+escHtml(customer.endereco)+'</div>':'')+
        '</div>'+
        '<div class="archive-list">'+notasHtml+'</div>';

      var backBtn = document.getElementById("custBack");
      if (backBtn) backBtn.onclick = function(){ local.selectedId=null; draw(); };

      area.querySelectorAll("[data-nota]").forEach(function(el){
        el.onclick = function(){
          var id = el.getAttribute("data-nota");
          var nota = loadNotas().filter(function(n){return n.id===id;})[0];

      area.querySelectorAll("[data-delnota]").forEach(function(btn){

          e.stopPropagation();

    input.oninput = function(){
      local.query = input.value;
      local.selectedId = null;
      draw();
    };

    draw();

  function buildChartSvg(points, selectedIso){
    if (points.every(function(p){return p.v===0;})){
      return '<div class="chart-empty">Sem lançamentos neste mês ainda.</div>';
    }
    var W = 720, H = 190, padL = 6, padR = 6, padT = 14, padB = 22;
    var maxV = Math.max.apply(null, points.map(function(p){return p.v;}));
    if (maxV<=0) maxV = 1;
    var stepX = (W-padL-padR) / Math.max(1, points.length-1);
    function xFor(i){ return padL + i*stepX; }
    function yFor(v){ return padT + (1 - v/maxV) * (H-padT-padB); }

    var linePts = points.map(function(p,i){ return xFor(i).toFixed(1)+","+yFor(p.v).toFixed(1); }).join(" ");
    var circles = points.map(function(p,i){
      var x=xFor(i).toFixed(1), y=yFor(p.v).toFixed(1);
      var sel = p.iso===selectedIso;
      var r = sel ? 5 : (p.v>0 ? 3.4 : 2);
      var fill = sel ? "var(--yellow)" : (p.v>0 ? "var(--teal)" : "var(--border)");
      return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'" data-iso="'+p.iso+'"'+(sel?' stroke="var(--yellow)" stroke-opacity=".35" stroke-width="6"':'')+'><title>Dia '+p.day+': '+fmtCurrency(p.v)+' — clique para ver detalhes</title></circle>';
    }).join("");
    var labelEvery = points.length>20 ? 5 : (points.length>10?2:1);
    var labels = points.map(function(p,i){
      if (p.day % labelEvery !== 0 && p.day!==1 && p.day!==points.length) return "";
      return '<text x="'+xFor(i).toFixed(1)+'" y="'+(H-6)+'" font-size="8.5" fill="var(--text-faint)" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+p.day+'</text>';
    }).join("");

    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--border-soft)" stroke-width="1"/>'+
      '<polyline points="'+linePts+'" fill="none" stroke="var(--teal)" stroke-width="1.6" opacity="0.85"/>'+
      circles + labels +
      '</svg>';
  }

  function buildYearChartSvg(points, selectedKey){

    if (maxV<=0) maxV = 1;
    var stepX = (W-padL-padR) / Math.max(1, points.length-1);
    function xFor(i){ return padL + i*stepX; }
    function yFor(v){ return padT + (1 - v/maxV) * (H-padT-padB); }
    var linePts = points.map(function(p,i){ return xFor(i).toFixed(1)+","+yFor(p.v).toFixed(1); }).join(" ");
    var circles = points.map(function(p,i){
      var x=xFor(i).toFixed(1), y=yFor(p.v).toFixed(1);
      var sel = p.key===selectedKey;

    }).join("");
    var labels = points.map(function(p,i){
      return '<text x="'+xFor(i).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="'+(p.key===selectedKey?'var(--yellow)':'var(--text-faint)')+'" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+MESES_ABREV[p.m-1]+'</text>';
    }).join("");
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--border-soft)" stroke-width="1"/>'+
      '<polyline points="'+linePts+'" fill="none" stroke="var(--teal)" stroke-width="1.6" opacity="0.85"/>'+
      circles + labels + '</svg>';
  }

  // ---------- detalhes de um dia (comparativos, vendedores, pagamentos, produtos, horários) ----------
  function rowsOfDay(iso){ return lsGetJSON(K_ROWS+iso, []); }
  function sumRows(rows){ var t=0; rows.forEach(function(r){ t += computeValor(r); }); return t; }
  // soma um mês inteiro a partir das datas salvas localmente
  function sumMonth(monthStr){
    var dates = listAllDates().filter(function(d){ return d.slice(0,7)===monthStr; });
    var total=0, count=0, days=0;
    dates.forEach(function(d){ var rr = rowsOfDay(d); if (rr.length){ days++; total += sumRows(rr); count += rr.length; } });
    return {total:total, count:count, days:days};
  }
  // soma um ano inteiro (e, se vier "corte" no formato MM-DD, também o acumulado até essa data do ano)
  function statsDoAno(ano, corte){
    var meses = [];
    for (var i=1;i<=12;i++) meses.push({m:i, total:0, count:0, days:0});
    var tot = {total:0, count:0, days:0}, ate = {total:0, count:0, days:0}, rows = [];
    listAllDates().forEach(function(d){
      if (d.slice(0,4)!==ano) return;
      var rr = rowsOfDay(d); if (!rr.length) return;
      var t = sumRows(rr), mi = parseInt(d.slice(5,7),10)-1;
      meses[mi].total += t; meses[mi].count += rr.length; meses[mi].days++;
      tot.total += t; tot.count += rr.length; tot.days++;
      rows = rows.concat(rr);
      if (!corte || d.slice(5)<=corte){ ate.total += t; ate.count += rr.length; ate.days++; }
    });
    return {key:ano, meses:meses, total:tot.total, count:tot.count, days:tot.days, ate:ate, rows:rows};
  }
  function novosDoAno(ano){
    var out = [];
    for (var m=1;m<=12;m++) out = out.concat(loadNovosMonth(ano+"-"+pad(m)).filter(function(n){ return !isBlankNovo(n); }));
    return out;
  }
  function nomeMes(m){
    var t = new Date(2000, m-1, 1).toLocaleDateString("pt-BR",{month:"long"});
    return t.charAt(0).toUpperCase()+t.slice(1);
  }
  function mudaAno(iso, delta){
    var y = parseInt(iso.slice(0,4),10)+delta, md = iso.slice(5);
    if (md==="02-29" && new Date(y,1,29).getMonth()!==1) md = "02-28";
    return y+"-"+md;
  }
  function dayDetails(iso){
    var rows = rowsOfDay(iso);
    var total = sumRows(rows);
    var count = rows.length;
    var pend = rows.filter(function(r){ return r.pago!=="✅" && computeValor(r)>0; });
    var pendTotal = sumRows(pend);

    // comparativos (dia)
    var prev = addDays(iso, -1);
    var prevRows = rowsOfDay(prev);
    var lastWeek = addDays(iso, -7);
    var lwRows = rowsOfDay(lastWeek);
    // mesmo dia do mês passado (se o mês passado não tem esse dia, ex.: 31, usa o último dia dele)
    var lmKey = addMonths(iso.slice(0,7), -1);
    var lmDia = Math.min(parseInt(iso.slice(8,10),10), daysInMonth(lmKey));
    var lastMonthIso = lmKey+"-"+pad(lmDia);
    var lmRows = rowsOfDay(lastMonthIso);
    var month = iso.slice(0,7);
    var monthDates = listAllDates().filter(function(d){ return d.slice(0,7)===month && d!==iso; })
      .filter(function(d){ return rowsOfDay(d).length>0; });
    var monthSum = 0, monthCount = 0;
    monthDates.forEach(function(d){ var rr = rowsOfDay(d); monthSum += sumRows(rr); monthCount += rr.length; });
    var avgDay = monthDates.length ? monthSum/monthDates.length : 0;
    var avgCount = monthDates.length ? monthCount/monthDates.length : 0;

    // comparativos (mês)
    var curM = sumMonth(month);
    var prevMKey = addMonths(month, -1);
    var prevM = sumMonth(prevMKey);
    var sameLYKey = addMonths(month, -12);
    var sameLY = sumMonth(sameLYKey);
    // meses do mesmo ano com vendas (exceto o mês atual) → média mensal
    var yearMonths = [];
    for (var m=1; m<=12; m++){
      var mk = month.slice(0,5)+pad(m);
      if (mk===month) continue;
      var sm = sumMonth(mk);
      if (sm.days>0) yearMonths.push({key:mk, total:sm.total, count:sm.count, days:sm.days});
    }
    var ySum=0, yCount=0;
    yearMonths.forEach(function(y){ ySum += y.total; yCount += y.count; });
    var avgMTotal = yearMonths.length ? ySum/yearMonths.length : 0;
    var avgMCount = yearMonths.length ? yCount/yearMonths.length : 0;

    var det = {iso:iso, rows:rows, total:total, count:count, ticket: count?total/count:0,
      pendCount:pend.length, pendTotal:pendTotal,
      prev:{iso:prev, total:sumRows(prevRows), count:prevRows.length},
      lastWeek:{iso:lastWeek, total:sumRows(lwRows), count:lwRows.length},
      lastMonthDay:{iso:lastMonthIso, total:sumRows(lmRows), count:lmRows.length},
      avg:{total:avgDay, count:avgCount, days:monthDates.length},
      month:{key:month, total:curM.total, count:curM.count, days:curM.days,
        prevMonth:{key:prevMKey, total:prevM.total, count:prevM.count, days:prevM.days},
        sameLastYear:{key:sameLYKey, total:sameLY.total, count:sameLY.count, days:sameLY.days},
        avg:{total:avgMTotal, count:avgMCount, months:yearMonths.length}}};

    // agregações (vendedores, pagamentos, produtos, horários) do dia e do mês inteiro
    det.dayAgg = aggregateRows(rows, novosRowsDoDia(iso));
    det.monthAgg = aggregateRows(rowsOfMonth(month), loadNovosMonth(month).filter(function(n){ return !isBlankNovo(n); }));
    if (state.cmpMode==="year"){
      var ano = iso.slice(0,4), anoAnt = String(parseInt(ano,10)-1);
      var corte = (ano===today.slice(0,4)) ? today.slice(5) : "12-31";
      var yc = statsDoAno(ano, corte), yp = statsDoAno(anoAnt, corte);
      function mediaMeses(y){
        var c = y.meses.filter(function(x){ return x.days>0; });
        var t = 0, q = 0; c.forEach(function(x){ t += x.total; q += x.count; });
        return {total: c.length ? t/c.length : 0, count: c.length ? q/c.length : 0, months: c.length};
      }
      var melhor = null;
      yc.meses.forEach(function(x){ if (x.total>0 && (!melhor || x.total>melhor.total)) melhor = x; });
      det.year = {key:ano, total:yc.total, count:yc.count, days:yc.days, meses:yc.meses, prevMeses:yp.meses,
        prevYear:{key:anoAnt, total:yp.total, count:yp.count, days:yp.days},
        samePeriod:{key:anoAnt, total:yp.ate.total, count:yp.ate.count, days:yp.ate.days, corte:corte},
        ytd:yc.ate, avg:mediaMeses(yc), prevAvg:mediaMeses(yp), best:melhor};
      det.yearAgg = aggregateRows(yc.rows, novosDoAno(ano));
    }
    det.vendedores = det.dayAgg.vendedores;
    det.pagamentos = det.dayAgg.pagamentos;
    det.produtos   = det.dayAgg.produtos;
    det.horas      = det.dayAgg.horas;
    det.semHora    = det.dayAgg.semHora;
    return det;
  }

  // todas as vendas de um mês (todos os dias com lançamento)
  function rowsOfMonth(monthStr){
    var out = [];
    listAllDates().filter(function(d){ return d.slice(0,7)===monthStr; })
      .forEach(function(d){ out = out.concat(rowsOfDay(d)); });
    return out;
  }

  // calcula os quadros (vendedores / pagamentos / produtos / horas) de qualquer conjunto de vendas
  function aggregateRows(rows, novosRows){
    novosRows = novosRows || [];
    var total = sumRows(rows);
    var count = rows.length;
    var pend = rows.filter(function(r){ return r.pago!=="✅" && computeValor(r)>0; });

    // vendedores
    var vend = {};
    rows.forEach(function(r){
      var v = vendedorEfetivo(r.vendedor);
      if (!vend[v]) vend[v] = {nome:v, count:0, total:0};
      vend[v].count += 1; vend[v].total += computeValor(r);
    });
    var vendList = Object.keys(vend).map(function(k){ return vend[k]; }).sort(function(a,b){ return b.total-a.total; });

    // formas de pagamento
    var pag = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    var semForma = 0;
    rows.forEach(function(r){
      var b = paymentBreakdown(r);
      var soma = 0;
      Object.keys(b).forEach(function(k){ pag[k] += b[k]; soma += b[k]; });
      var v = computeValor(r);
      if (v>0 && soma<v-0.005) semForma += (v-soma);
    });
    var pagList = Object.keys(pag).map(function(k){ return {nome:k, total:pag[k]}; });
    if (semForma>0) pagList.push({nome:"Sem forma definida", total:semForma});
    pagList = pagList.filter(function(p){ return p.total>0; }).sort(function(a,b){ return b.total-a.total; });

    // produtos e serviços: tabela normal + serviços dos pneus novos, com a mesma conta das tabelas
    // (a mão de obra dividida entra em Bicos / Cambagem / Rodas). Os pneus novos em si entram só pelo lucro na meta.
    function sumF(f){ var t=0; rows.forEach(function(r){ t+=parseNum(r[f]); }); return t; }
    var sv = servicosTotais(rows.concat(novosRows));
    var prod = [
      {nome:"Pneus",         total:sumF("valorPneus"),        qtd:sumF("quantidade")},
      {nome:"Alinhamento",   total:sv.alinhamento,            qtd:sv.qtdAlinhamento},
      {nome:"Bicos",         total:sv.totalBicos,             qtd:sv.qtdBicos},
      {nome:"Cambagem",      total:sv.totalCambagem,          qtd:sv.qtdCambagem},
      {nome:"Rodas",         total:sv.totalRodas,             qtd:sv.qtdRodas},
      {nome:"Peças",         total:sv.valorPecas,             qtd:0},
      {nome:"Mão de obra",   total:sv.maoDeObra,              qtd:0},
      {nome:"Serviço",        total:sv.outros,                 qtd:0}
    ].filter(function(p){ return p.total>0; }).sort(function(a,b){ return b.total-a.total; });

    // horários
    var horas = []; for (var h=0; h<24; h++) horas.push({h:h, count:0, total:0});
    var semHora = 0;
    rows.forEach(function(r){
      var d = r.criadoEm ? new Date(r.criadoEm) : null;
      if (!d || isNaN(d.getTime())){ semHora++; return; }
      horas[d.getHours()].count += 1; horas[d.getHours()].total += computeValor(r);
    });

    return {total:total, count:count, ticket: count?total/count:0,
      pendCount:pend.length, pendTotal:sumRows(pend),
      vendedores:vendList, pagamentos:pagList, produtos:prod, horas:horas, semHora:semHora};
  }

  function deltaBadge(cur, ref){
    if (state.hideValues) return '<span class="dd-delta">••</span>';
    if (!ref) return '<span class="dd-delta">—</span>';
    var pct = ((cur-ref)/ref)*100;
    var cls = pct>0.5 ? "up" : (pct<-0.5 ? "down" : "");
    return '<span class="dd-delta '+cls+'">'+(pct>0?"+":"")+pct.toFixed(0)+'%</span>';
  }

  function bindDayDetailEvents(){
    function setDay(iso){ state.dashDay = iso; state.dashMonth = iso.slice(0,7); render(); }
    root.querySelectorAll("[data-dd]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var w = btn.getAttribute("data-dd");
        var cur = state.dashDay && state.dashDay.slice(0,7)===state.dashMonth ? state.dashDay
          : (state.dashMonth===today.slice(0,7) ? today : state.dashMonth+"-"+pad(daysInMonth(state.dashMonth)));
        if (state.cmpMode==="year"){
          if (w==="prev") setDay(mudaAno(cur,-1));
          else if (w==="next") setDay(mudaAno(cur,1));
          else setDay(today);
        } else if (w==="prev") setDay(addDays(cur,-1));
        else if (w==="next") setDay(addDays(cur,1));
        else setDay(today);
      });
    });
    root.querySelectorAll(".chart-wrap circle[data-iso]").forEach(function(c){
      c.addEventListener("click", function(){ setDay(c.getAttribute("data-iso")); });
    });
    root.querySelectorAll(".chart-wrap circle[data-mon]").forEach(function(c){
      c.addEventListener("click", function(){ state.dashMonth = c.getAttribute("data-mon"); state.dashDay = null; state.cmpMode = "month"; render(); });
    });
  }

  // ---------- usuários: criar logins e alterar cargos (somente master) ----------
  var PAPEIS = ["vendedor","estoquista","montador","master"];
  function papelLabel(p){ return p==="master" ? "Master" : (p==="estoquista" ? "Estoquista" : (p==="montador" ? "Montador" : "Vendedor")); }

  // ---------- permissões: cada cargo tem um padrão; o master pode liberar a mais ou retirar por usuário ----------
  var PERMS = [
    {key:"vendas",     label:"Painel de vendas e tabelas do dia", short:"Vendas"},
    {key:"fechamento", label:"Fechamento de caixa",               short:"Fechamento"},
    {key:"estoque",    label:"Estoque",                           short:"Estoque"},
    {key:"clientes",   label:"Clientes",                          short:"Clientes"},
    {key:"notas",      label:"Notas e orçamentos",                short:"Notas"},
    {key:"novos",      label:"Pneus novos",                       short:"Pneus novos"},
    {key:"registro",   label:"Pneus do mês (registro mensal, fotos e PDF)", short:"Pneus do mês"},
    {key:"avisos",     label:"Avisos",                            short:"Avisos"},
    {key:"os",         label:"O.S. — ver carros em loja e lançar serviços", short:"O.S."},
    {key:"os_gerir",   label:"O.S. — abrir, editar e fechar",     short:"Gerir O.S."}
  ];
  var PERMS_PADRAO = {
    vendedor:   ["vendas","fechamento","estoque","clientes","notas","novos","registro","avisos","os","os_gerir"],
    estoquista: ["estoque"],
    montador:   ["os"]
  };
  function loadPerms(){ return lsGetJSON(K_PERMS, {}); }
  function savePerms(o){ return lsSetJSON(K_PERMS, o); }
  function permsEfetivas(cargo, ov){
    if (cargo==="master") return PERMS.map(function(x){ return x.key; });
    var base = (PERMS_PADRAO[cargo]||[]).slice();
    ov = ov || {};
    (ov.add||[]).forEach(function(k){ if (base.indexOf(k)<0) base.push(k); });
    return base.filter(function(k){ return (ov.remove||[]).indexOf(k)<0; });
  }
  function can(perm){
    if (!sb) return true; // sem login configurado, tudo liberado (como antes)
    return permsEfetivas(state.role, loadPerms()[state.userId]).indexOf(perm)>-1;
  }
  // cargo "montador" fica guardado nas permissões (o cargo-base no banco é "estoquista", o mais restrito)
  function cargoEfetivo(u){
    var o = loadPerms()[u.user_id];
    return (u.papel!=="master" && o && o.cargo==="montador") ? "montador" : u.papel;
  }
  function aplicarPermissoes(){
    if (!sb || !state.baseRole) return;
    var o = loadPerms()[state.userId];
    state.role = (state.baseRole!=="master" && o && o.cargo==="montador") ? "montador" : state.baseRole;
  }
  var VIEW_PERM = {dashboard:"vendas", table:"vendas", estoque:"estoque", clientes:"clientes", notas:"notas",
    orcamento:"notas", orcamentos:"notas", novos:"novos", regmes:"registro", avisos:"avisos", os:"os", conversor:"vendas"};
  function viewPermitida(v){ if (v==="admin") return state.role==="master"; var k = VIEW_PERM[v]; return !k || can(k); }
  // ---------- Área administrativa (só master): entradas, saídas e taxas das maquininhas ----------
  function adminDadosMes(month){
    var nd = daysInMonth(month);
    var novosMes = loadNovosMonth(month).filter(function(n){ return !isBlankNovo(n); });
    var tot = {entrou:0, porPag:{"Dinheiro":0,"Pix":0,"Débito":0,"Crédito":0}, taxaDeb:0, taxaCred:0, saidas:0, nSaidas:0, brutoDeb:0, brutoCred:0};
    var dias = [], saidasLista = [];
    for (var i=1;i<=nd;i++){
      var iso = month+"-"+pad(i);
      var d = {iso:iso, entrou:0, taxaDeb:0, taxaCred:0, saidas:0, movimento:false};
      function somar(r, novo){
        var pb = paymentBreakdown(r);
        Object.keys(tot.porPag).forEach(function(k){ tot.porPag[k] += pb[k]; });
        d.entrou += pb["Dinheiro"]+pb["Pix"]+pb["Débito"]+pb["Crédito"];
        var tx = taxaCartaoSplit(r, novo);
        d.taxaDeb += tx.deb; d.taxaCred += tx.cred;
      }
      rowsOfDay(iso).forEach(function(r){ somar(r, false); });
      novosMes.forEach(function(n){ if (n.date===iso) somar(n, true); });
      loadSaidas(iso).forEach(function(x){
        var v = Math.max(0, parseNum(x.valor));
        d.saidas += v; tot.nSaidas++;
        saidasLista.push({iso:iso, valor:v, motivo:x.motivo||"", por:x.por||"", em:x.em||""});
      });
      d.movimento = d.entrou>0.004 || d.saidas>0.004 || d.taxaDeb+d.taxaCred>0.004;
      tot.entrou += d.entrou; tot.taxaDeb += d.taxaDeb; tot.taxaCred += d.taxaCred; tot.saidas += d.saidas;
      dias.push(d);
    }
    return {tot:tot, dias:dias, saidas:saidasLista};
  }
  function renderAdmin(){
    if (state.role!=="master"){ state.view="dashboard"; return renderDashboard(); }
    root.classList.remove("wide");

  // ---------- Conversor TXT -> Excel (TXT do relógio de ponto) ----------
  var cv = {raw:"", name:"registro.txt", headers:[], rows:[], sep:"auto", conv:true, pasteTxt:"", msg:"", msgCls:""};
  var CV_DEFAULT = ["Tra. No.","Nome","Dept.","Data","Hora","Máquina No."];
  var CV_DT = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/, CV_TM = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/;
  var CV_DTX = /(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}:\d{2}(?::\d{2})?)/;
  function cvDecode(buf){
    var u = new Uint8Array(buf);
    if (u[0]===0xFF && u[1]===0xFE) return new TextDecoder("utf-16le").decode(buf);
    if (u[0]===0xFE && u[1]===0xFF) return new TextDecoder("utf-16be").decode(buf);
    try{ return new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(e){ return new TextDecoder("windows-1252").decode(buf); }
  }
  function cvExpand(t){
    var o = [];
    t.forEach(function(x){ var m = x.match(/^(\d{1,2}\/\d{1,2}\/\d{4})\s+(\d{1,2}:\d{2}(?::\d{2})?)$/); if (m) o.push(m[1], m[2]); else o.push(x); });
    return o;
  }
  function cvSplitLine(l, mode){
    var t;
    if (mode==="tab") t = l.split("\t");
    else if (mode==="semi") t = l.split(";");
    else if (mode==="comma") t = l.split(",");
    else t = l.split(/\t+|\s{2,}/).filter(function(x){ return x.trim()!==""; });
    t = cvExpand(t.map(function(x){ return x.trim(); }));
    if (mode==="auto" && t.length<5){
      var m = l.match(CV_DTX);
      if (m){
        var i = l.indexOf(m[0]);
        var a = l.slice(0,i).trim().split(/\s+/), b = l.slice(i+m[0].length).trim().split(/\s+/).filter(Boolean);
        var first = a.shift()||"", dept = a.length>1 ? a.pop() : "";
        t = [first, a.join(" "), dept, m[1], m[2]].concat(b);
      }
    }
    return t;
  }
  function cvParse(){
    var lines = cv.raw.split(/\r?\n/).filter(function(l){ return l.trim()!==""; });
    if (lines.length && !/\d{1,2}\/\d{1,2}\/\d{4}/.test(lines[0])) lines.shift();
    cv.rows = lines.map(function(l){ return cvSplitLine(l, cv.sep); });
    var n = cv.rows.reduce(function(m,r){ return Math.max(m, r.length); }, 0);
    cv.headers = n===6 ? CV_DEFAULT.slice() : Array.from({length:n}, function(_,i){ return "Coluna "+(i+1); });
    cv.msg = ""; cv.msgCls = "";
    cvAtualizar();
  }
  function cvAtualizar(){
    var res = document.getElementById("cvRes"); if (!res) return;
    res.hidden = !cv.raw;
    var meta = document.getElementById("cvMeta"), tbl = document.getElementById("cvTbl"), go = document.getElementById("cvGo"), msg = document.getElementById("cvMsg");
    msg.textContent = cv.msg; msg.className = "cv-msg"+(cv.msgCls ? " "+cv.msgCls : "");
    if (!cv.rows.length){ tbl.innerHTML = ""; meta.textContent = "Nenhuma linha reconhecida."; go.disabled = true; return; }
    go.disabled = false;
    meta.textContent = cv.rows.length+" linhas · "+cv.headers.length+" colunas"+(cv.rows.length>100 ? " (mostrando as 100 primeiras)" : "");
    var h = "<thead><tr>"+cv.headers.map(function(x){ return "<th>"+escHtml(x)+"</th>"; }).join("")+"</tr></thead><tbody>";
    cv.rows.slice(0,100).forEach(function(r){ h += "<tr>"+cv.headers.map(function(_,i){ return "<td>"+escHtml(r[i]||"")+"</td>"; }).join("")+"</tr>"; });
    tbl.innerHTML = h+"</tbody>";
  }
  function cvCell(v, conv){
    if (v==="") return "";
    var m;
    if (conv){
      if ((m = v.match(CV_DT))) return {t:"n", v:Date.UTC(+m[3], m[2]-1, +m[1])/864e5+25569, z:"dd/mm/yyyy"};
      if ((m = v.match(CV_TM))) return {t:"n", v:(+m[1]*3600 + +m[2]*60 + (+m[3]||0))/86400, z:"hh:mm:ss"};
    }
    if (/^-?\d+$/.test(v) && v.length<16 && !/^0\d/.test(v)) return {t:"n", v:+v};
    return v;
  }
  function cvBuildXlsx(){
    var aoa = [cv.headers].concat(cv.rows.map(function(r){ return cv.headers.map(function(_,i){ return cvCell(r[i]||"", cv.conv); }); }));
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = cv.headers.map(function(h,i){
      var w = h.length; cv.rows.forEach(function(r){ w = Math.max(w, (r[i]||"").length); });
      return {wch:Math.min(Math.max(w+2, 8), 40)};
    });
    ws["!autofilter"] = {ref:ws["!ref"]};
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Registro");
    return XLSX.write(wb, {bookType:"xlsx", type:"array"});
  }
  // a biblioteca do Excel só é baixada quando alguém usa o conversor (o resto do sistema não precisa dela)
  function cvCarregarXlsx(cb){
    if (window.XLSX) return cb(null);
    var sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    sc.onload = function(){ cb(null); };
    sc.onerror = function(){ cb("Não foi possível carregar a biblioteca do Excel (sem internet?). Tente de novo."); };
    document.head.appendChild(sc);
  }
  function cvBaixar(){
    var msg = document.getElementById("cvMsg"), go = document.getElementById("cvGo");
    go.disabled = true; msg.className = "cv-msg"; msg.textContent = "Gerando o Excel…";
    cvCarregarXlsx(function(err){
      go.disabled = false;
      if (err){ cv.msg = err; cv.msgCls = "err"; return cvAtualizar(); }
      try{
        var buf = cvBuildXlsx(), fname = cv.name.replace(/\.[^.]+$/, "")+".xlsx";
        var a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
        a.download = fname; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        cv.msg = "Excel gerado: "+fname; cv.msgCls = "ok";
      }catch(e){
        cv.msg = "Não foi possível gerar o arquivo"+(e && e.message ? ": "+e.message : "."); cv.msgCls = "err";
      }
      cvAtualizar();
    });
  }
  function cvCarregarArquivo(file){
    cv.name = file.name || "registro.txt";
    var r = new FileReader();
    r.onload = function(){ cv.raw = cvDecode(r.result); cv.pasteTxt = ""; var pt = document.getElementById("cvPaste"); if (pt) pt.value = ""; cvParse(); };
    r.readAsArrayBuffer(file);
  }

      '</div>'+

          '<label><input type="checkbox" id="cvConv"> Data/hora no formato do Excel</label>'+
        '</div>'+
        '<div class="cv-meta" id="cvMeta"></div>'+
        '<div class="cv-wrap"><table id="cvTbl"></table></div>'+
        '<div class="cv-row" style="margin-top:14px;">'+
          '<button class="btn primary" id="cvGo">⬇ Baixar Excel (.xlsx)</button>'+
          '<button class="btn ghost" id="cvClr">Limpar</button>'+
        '</div>'+
        '<div class="cv-msg" id="cvMsg"></div>'+

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });
    bindBackupControls();
    var $ = function(id){ return document.getElementById(id); };
    $("cvSep").value = cv.sep; $("cvConv").checked = cv.conv; $("cvPaste").value = cv.pasteTxt;
    var drop = $("cvDrop"), inp = $("cvFile");

    cvAtualizar();
  }

    });

    if (createBtn){
      createBtn.addEventListener("click", function(){
        var errEl = document.getElementById("nuErr");
        var email = document.getElementById("nuEmail").value.trim();
        var senha = document.getElementById("nuSenha").value;
        var papel = document.getElementById("nuPapel").value;
        errEl.textContent = "";
        if (!email || !senha){ errEl.textContent = "Preencha e-mail e senha."; return; }
        if (senha.length < 6){ errEl.textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
        var temp = getTempClient();
        if (!temp){ errEl.textContent = "Não foi possível criar login agora."; return; }
        createBtn.disabled = true; createBtn.textContent = "Criando...";
        var metaEmail = {data:{email_real:email}};
        temp.auth.signUp({email:email, password:senha, options:metaEmail}).then(function(res){
          // e-mail recusado pelo Supabase (domínio sem MX etc.) → cria com o e-mail-apelido interno
          if (res.error && (res.error.code==="email_address_invalid" || /invalid/i.test(res.error.message||""))){
            return temp.auth.signUp({email:aliasAuthEmail(email), password:senha, options:metaEmail});
          }
          return res;
        }).then(function(res){
          if (res.error){
            errEl.textContent = (/rate limit/i.test(res.error.message||"") || res.error.code==="over_email_send_rate_limit")
              ? "O Supabase bloqueou por excesso de e-mails de confirmação. Desligue \"Confirm email\" em Authentication → Providers → Email (ou espere cerca de 1 hora) e tente de novo."
              : (res.error.message || "Erro ao criar login.");
            createBtn.disabled = false; createBtn.textContent = "Criar login";
            return;
          }
          var novo = res.data && res.data.user;
          if (!novo){
            errEl.textContent = "Login criado, mas não foi possível concluir o cadastro do cargo.";
            createBtn.disabled = false; createBtn.textContent = "Criar login";
            return;
          }
          sb.from("perfis").upsert({user_id:novo.id, email:email, papel:(papel==="montador"?"estoquista":papel)}).then(function(r2){
            createBtn.disabled = false; createBtn.textContent = "Criar login";
            if (r2.error){
              errEl.textContent = "Login criado, mas não foi possível salvar o cargo: "+r2.error.message;
            } else {
              if (papel==="montador"){ var pm0 = loadPerms(); pm0[novo.id] = {cargo:"montador", add:[], remove:[]}; savePerms(pm0); }
              state.usuariosList = null;
              render();
            }
          });
        });
      });
    }

    root.querySelectorAll("[data-savepapel]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var usrId = btn.getAttribute("data-savepapel");
        var sel = root.querySelector('select[data-uid="'+usrId+'"]');
        var novoPapel = sel ? sel.value : null;
        if (!novoPapel) return;
        var antes = (state.usuariosList||[]).filter(function(x){ return x.user_id===usrId; })[0];
        var cargoAntes = antes ? cargoEfetivo(antes) : null;
        var basePapel = novoPapel==="montador" ? "estoquista" : novoPapel;
        btn.disabled = true; btn.textContent = "Salvando...";
        sb.from("perfis").update({papel:basePapel}).eq("user_id", usrId).then(function(r){
          btn.disabled = false; btn.textContent = "Salvar";
          if (r.error){ alert("Não foi possível salvar o cargo: "+r.error.message); return; }
          var pm = loadPerms(), o = pm[usrId] || {};
          if (novoPapel==="montador") o.cargo = "montador"; else delete o.cargo;
          if (cargoAntes!==novoPapel){ o.add = []; o.remove = []; } // cargo novo: volta ao padrão dele
          pm[usrId] = o; savePerms(pm);
          state.usuariosList = null; render();
        });
      });
    });

    root.querySelectorAll("[data-permopen]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var usrId = btn.getAttribute("data-permopen");
        state.usuariosPermOpen = (state.usuariosPermOpen===usrId) ? null : usrId;
        render();
      });
    });
    root.querySelectorAll("[data-saveperms]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var usrId = btn.getAttribute("data-saveperms");
        var u = (state.usuariosList||[]).filter(function(x){ return x.user_id===usrId; })[0];
        if (!u) return;
        var cargo = cargoEfetivo(u), padrao = permsEfetivas(cargo, null);
        var box = btn.closest(".perm-box"), add = [], remove = [];
        box.querySelectorAll("input[data-perm]").forEach(function(cb){
          var k = cb.getAttribute("data-perm"), isPad = padrao.indexOf(k)>-1;
          if (cb.checked && !isPad) add.push(k);
          if (!cb.checked && isPad) remove.push(k);
        });
        var pm = loadPerms(), o = pm[usrId] || {};
        o.add = add; o.remove = remove; pm[usrId] = o; savePerms(pm);
        if (window.uiToast) window.uiToast("Permissões salvas.", "ok");
        render();
      });
    });
    root.querySelectorAll("[data-resetperms]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var usrId = btn.getAttribute("data-resetperms");
        var pm = loadPerms(), o = pm[usrId];
        if (o){ o.add = []; o.remove = []; pm[usrId] = o; savePerms(pm); }
        render();
      });
    });
  }

  // abre/fecha o menu de opções (hambúrguer) — um único listener, fora do render
  if (!window.__topMenuBound){
    window.__topMenuBound = true;
    function closeTopMenus(except){
      document.querySelectorAll(".top-menu.open").forEach(function(z){
        if (z===except) return;
        z.classList.remove("open");
        var b = z.querySelector("[data-menu-toggle]"); if (b) b.setAttribute("aria-expanded","false");
      });
    }
    document.addEventListener("click", function(e){
      var t = e.target;
      var tg = t.closest ? t.closest("[data-menu-toggle]") : null;
      var zone = t.closest ? t.closest(".top-menu") : null;
      if (tg && zone){
        var open = !zone.classList.contains("open");
        closeTopMenus(zone);
        zone.classList.toggle("open", open);
        tg.setAttribute("aria-expanded", open ? "true" : "false");
        return;
      }
      if (zone){
        // clicou numa opção do menu: fecha (o botão de Importar abre o seletor de arquivo, então fica)
        var item = t.closest(".menu-panel [data-act]");
        if (item) closeTopMenus(null);
        return;
      }
      closeTopMenus(null);
    });
    document.addEventListener("keydown", function(e){
      if (e.key==="Escape") closeTopMenus(null);
    });
  }

  // ---------- calendário do Dashboard: abre ao clicar no nome do mês; clicar num dia mostra os detalhes daquele dia ----------
  function fecharCalendario(){
    var o = document.getElementById("calPop"); if (o) o.remove();
    document.removeEventListener("keydown", calTecla);
  }
  function calTecla(e){ if (e.key==="Escape") fecharCalendario(); }
  function diaTemVendas(iso){
    try{ if (impDiaTemDados(rowsOfDay(iso))) return true; }catch(e){}
    try{ if ((novosRowsDoDia(iso)||[]).some(function(r){ return computeValor(r)>0; })) return true; }catch(e){}
    return false;
  }
  function abrirCalendario(anchor){
    fecharCalendario();
    var vis = state.dashMonth;
    var sel = (state.dashDay && state.dashDay.slice(0,7)===state.dashMonth) ? state.dashDay : "";
    var back = document.createElement("div");
    back.className = "cal-back"; back.id = "calPop";
    var box = document.createElement("div");
    box.className = "cal-box";
    back.appendChild(box);
    document.body.appendChild(back);
    function posicionar(){
      var r = anchor.getBoundingClientRect(), w = box.offsetWidth || 312;
      var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
      var top = r.bottom + 8;
      if (top + box.offsetHeight > window.innerHeight - 8) top = Math.max(8, window.innerHeight - box.offsetHeight - 8);
      box.style.left = left+"px"; box.style.top = top+"px";
    }
    function desenhar(){
      var y = parseInt(vis.slice(0,4),10), mo = parseInt(vis.slice(5,7),10);
      var inicio = new Date(y, mo-1, 1).getDay();
      var nd = daysInMonth(vis), ant = addMonths(vis,-1), prox = addMonths(vis,1), nAnt = daysInMonth(ant);
      var h = '<div class="cal-head"><b>'+escHtml(monthLabel(vis))+'</b>'+
        '<div class="cal-navs"><button type="button" data-cal="prev" title="Mês anterior">▲</button><button type="button" data-cal="next" title="Próximo mês">▼</button></div></div>'+
        '<div class="cal-grid">'+["D","S","T","Q","Q","S","S"].map(function(l){ return '<div class="wd">'+l+'</div>'; }).join("");
      for (var i=0;i<42;i++){
        var d = i - inicio + 1, iso, fora = false;
        if (d<1){ d = nAnt + d; iso = ant+"-"+pad(d); fora = true; }
        else if (d>nd){ d = d - nd; iso = prox+"-"+pad(d); fora = true; }
        else iso = vis+"-"+pad(d);
        var cls = (fora?" out":"")+(iso===today?" hoje":"")+(iso===sel?" sel":"")+(diaTemVendas(iso)?" tem":"");
        h += '<button type="button" class="'+cls.trim()+'" data-iso="'+iso+'">'+d+'</button>';
      }
      h += '</div><div class="cal-foot"><span>● dia com vendas</span><button type="button" data-cal="hoje">Hoje</button></div>';
      box.innerHTML = h;
      box.querySelectorAll("[data-cal]").forEach(function(b){
        b.addEventListener("click", function(){
          var w = b.getAttribute("data-cal");
          if (w==="prev"){ vis = addMonths(vis,-1); desenhar(); }
          else if (w==="next"){ vis = addMonths(vis,1); desenhar(); }
          else escolher(today);
        });
      });
      box.querySelectorAll("[data-iso]").forEach(function(b){
        b.addEventListener("click", function(){ escolher(b.getAttribute("data-iso")); });
      });
    }
    function escolher(iso){
      fecharCalendario();
      state.dashDay = iso; state.dashMonth = iso.slice(0,7); state.cmpMode = "day";
      render();
    }
    back.addEventListener("click", function(e){ if (e.target===back) fecharCalendario(); });
    document.addEventListener("keydown", calTecla);
    desenhar(); posicionar();
  }

  function handleAction(act, node){
    if (act==="opencal"){ abrirCalendario(node); return; }
    if (act==="prevmonth"){ state.dashMonth = addMonths(state.dashMonth,-1); render(); }
    else if (act==="nextmonth"){ state.dashMonth = addMonths(state.dashMonth,1); render(); }
    else if (act==="opentoday"){ openDate(today); }
    else if (act==="login"){ state.modal = {type:"auth", error:""}; render(); }
    else if (act==="logout"){ state.authed=false; sessionStorage.removeItem("vf_auth"); render(); }
    else if (act==="evodia"){ state.evoMode="day"; try{ localStorage.setItem("vo_evo_mode","day"); }catch(e){} render(); }
    else if (act==="evoano"){ state.evoMode="year"; try{ localStorage.setItem("vo_evo_mode","year"); }catch(e){} render(); }
    else if (act==="cmpday"){ state.cmpMode="day"; render(); }
    else if (act==="cmpmonth"){ state.cmpMode="month"; render(); }
    else if (act==="cmpyear"){ state.cmpMode="year"; render(); }
    else if (act==="back"){ state.view="dashboard"; render(); }
    else if (act==="addrow"){ addRow(); }
    else if (act==="opentaxas"){ if (state.role==="master"){ state.modal = {type:"taxasCartao"}; render(); } }
    else if (act==="openferramentas"){ if (state.role==="master"){ state.modal = {type:"ferramentas"}; render(); } }
    else if (act==="opensaidas"){ if (podeSaidas()){ state.modal = {type:"saidas", date:tblDate()}; render(); } }
    else if (act==="openfechamento"){ if (state.role==="master" || state.role==="vendedor"){ state.modal = {type:"fechamento", date:tblDate()}; render(); } }

      var dd = act==="prevday" ? -1 : 1;
      if (isNovosTbl()){ flushNovos(); state.novosDate = addDays(tblDate(),dd); state.novosRows = null; state.openDetails = {}; render(); }

      var n = pushAllLocalToCloud();
      alert(n>0 ? "Enviando "+n+" registro(s) deste navegador para a nuvem…" : "Não há dados salvos neste navegador para enviar.");

      if (sb) sb.auth.signOut().then(function(){ location.reload(); });

      sessionStorage.setItem("vf_hide", state.hideValues?"1":"0");

      state.hideTableTotals = !state.hideTableTotals;
      sessionStorage.setItem("vf_hide_table", state.hideTableTotals?"1":"0");
      render();
    }
    else if (act==="pecas"){
      state.modal = {type:"pecasForm", rowId: node.getAttribute("data-id")};
      render();
    }
    else if (act==="outrosdesc"){
      state.modal = {type:"outrosForm", rowId: node.getAttribute("data-id")};
      render();
    }
    else if (act==="maodeobra"){
      state.modal = {type:"maoDeObraForm", rowId: node.getAttribute("data-id")};
      render();
    }
    else if (act==="rowos"){
      var roId = node.getAttribute("data-id"), roRow = findTblRow(roId), roOs = roRow ? osDaLinha(roRow) : null;
      state.modal = roOs ? {type:"osLinha", osId:roOs.id, rowId:roId, novos:isNovosTbl()} : {type:"osForm", osId:null, rowId:roId, origem:"tabela", novos:isNovosTbl(), dia:isNovosTbl()?tblDate():undefined};
      render();

      render();
    }
    else if (act==="linksales"){
      state.modal = {type:"linkSales", rowId: node.getAttribute("data-id")};
      render();
    }
