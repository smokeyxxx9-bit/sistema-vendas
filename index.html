<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ---- estoque ---- */
  .est-zero{color:#e2554c;}
  .medida-btn{
    width:100%;height:100%;background:transparent;border:none;color:inherit;
    text-align:left;font-size:12.5px;padding:0 8px;color:#647079;
  }
  .medida-btn.has{color:#eef1f3;}
  .medida-btn:hover:not(:disabled){color:#f5b700;}
  .medida-btn:disabled{cursor:default;}
  .est-actions{display:flex;gap:4px;align-items:center;}
  .est-custo-btn{background:transparent;border:1px dashed var(--border,#555);border-radius:6px;color:var(--text-dim);font-size:11.5px;padding:2px 8px;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .est-custo-btn:hover{border-color:var(--accent,#c9a227);color:var(--text);}
  .est-custo-btn.vazio{color:var(--text-faint);}
  .est-margem{color:#3fae6a;} .est-margem.neg{color:#e2554c;}
  /* ---- pneus do mês (registro mensal) ---- */
  .rm-wrap{overflow-x:auto;}
  .rm-table{width:100%;border-collapse:collapse;min-width:680px;}
  .rm-table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);font-weight:500;}
  .rm-table td{padding:4px;border-bottom:1px solid var(--border-soft);}
  .rm-n{width:34px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:center;}
  .rm-in{width:100%;background:var(--panel-alt);border:1px solid var(--border-soft);border-radius:3px;color:var(--text);padding:8px 9px;font-size:14px;min-height:38px;}
  .rm-in:focus{outline:none;border-color:var(--yellow);}
  .rm-num{text-align:right;font-family:'IBM Plex Mono',monospace;}
  .rm-month{width:auto;color-scheme:dark;}
  html[data-theme="light"] .rm-month{color-scheme:light;}
  .rm-vazio{padding:22px 10px;text-align:center;color:var(--text-dim);font-size:13px;}
  .rm-chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;}
  .rm-chip{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px;text-align:left;display:flex;flex-direction:column;gap:2px;}
  .rm-chip small{color:var(--text-dim);font-size:11px;}
  .rm-chip.on{border-color:var(--yellow);color:var(--yellow);}
  .rm-busy{font-size:12.5px;color:var(--yellow);}
  .rm-fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px;}
  .rm-foto{position:relative;aspect-ratio:1/1;border:1px solid var(--border-soft);border-radius:6px;overflow:hidden;background:var(--panel-alt);cursor:zoom-in;}
  .rm-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .rm-foto button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1;}
  .rm-lightbox{position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out;}
  .rm-lightbox img{max-width:100%;max-height:100%;border-radius:4px;}
  :root{
    --bg:#14181c;
    --panel:#1c2227;
    --panel-alt:#232a30;
    --border:#333d46;
    --border-soft:#2a323a;
    --text:#eef1f3;
    --text-dim:#98a3ad;
    --text-faint:#647079;
    --yellow:#f5b700;
    --yellow-dim:#8a6a12;
    --teal:#3ac7c1;
    --red:#e2554c;
    --green:#4fae6c;
    --radius-card:8px;
  }
  html[data-theme="light"]{
    --bg:#eef1f4;
    --panel:#ffffff;
    --panel-alt:#f4f6f8;
    --border:#c9d1d8;
    --border-soft:#dbe1e6;
    --text:#1c2227;
    --text-dim:#4a555e;
    --text-faint:#6c7681;
    --yellow:#c98f00;
    --yellow-dim:#e7c473;
    --teal:#0f8f89;
    --red:#c8433b;
    --green:#2f8c4f;
  }
  html[data-theme="light"] .brand .mark{background:var(--yellow);}
  html[data-theme="light"] ::selection{background:var(--yellow);color:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--yellow);color:#1c1c1c;}
  /* ---- padronização de raio/contraste (cards, botões desativados, texto secundário) ---- */
  .card, .dt-card, .parts-card, .archive-row, .cust-row, .est-row, .hero, .dd-card, .modal, .nota-row, .aviso-card, .aviso-row{
    border-radius:var(--radius-card) !important;
  }
  .btn:disabled, button:disabled{ opacity:.55; color:var(--text-dim); }
  .text-secondary, .dt-sub, .dd-note, .tag, .k, .hint{ color:var(--text-dim); }

  #app{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}
  #app.wide{max-width:none;padding-left:16px;padding-right:16px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:24px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    width:11px;height:11px;background:var(--yellow);
    display:inline-block;transform:rotate(45deg);
  }
  .brand h1{font-size:22px;color:var(--text);}
  .brand span.tag{color:var(--text-faint);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .sync-badge{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border-soft);color:var(--text-faint);margin-left:10px;letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .sync-badge.on{color:var(--green);border-color:var(--green);}
  .sync-badge.connecting{color:var(--yellow);border-color:var(--yellow);}
  .sync-badge.error{color:var(--red);border-color:var(--red);}
  .auth-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .pill{
    font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:3px;
    color:var(--text-dim);display:flex;align-items:center;gap:6px;
  }
  .pill.on{border-color:var(--green);color:var(--green);}
  .btn{
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);
    padding:8px 14px;border-radius:3px;font-size:13.5px;font-weight:500;
    transition:border-color .15s, background .15s;cursor:pointer;display:inline-flex;align-items:center;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1a1500;font-weight:600;}
  .btn.primary:hover{background:#ffc61f;}
  .btn.ghost{background:transparent;}
  .btn.danger{border-color:var(--red);color:var(--red);background:transparent;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- dashboard hero ---- */
  .hero{
    display:grid;grid-template-columns:1.1fr 1.4fr;gap:0;
    border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:18px;
  }
  @media(max-width:820px){.hero{grid-template-columns:1fr;}}
  .hero-left{
    background:var(--panel);padding:26px 28px;display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--border-soft);
  }
  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;font-size:14px;line-height:1;
  }
  .month-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .month-nav button.hide-vals-btn{
    width:auto;height:auto;margin-left:4px;padding:5px 10px;font-size:12px;line-height:1.2;
  }
  .month-nav .label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-dim);text-transform:capitalize;}
  .month-nav .label.cal-open{cursor:pointer;padding:7px 12px;border:1px solid var(--border);border-radius:4px;background:var(--panel-alt);color:var(--text);user-select:none;}
  .month-nav .label.cal-open:hover{border-color:var(--yellow);color:var(--yellow);}
  .month-nav .label.cal-open::after{content:" ▾";font-size:10px;}
  /* calendário do Dashboard (abre ao clicar no mês) */
  .cal-back{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.35);}
  .cal-box{position:absolute;width:312px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--border);border-top:3px solid var(--yellow);border-radius:6px;padding:14px 14px 12px;box-shadow:0 14px 44px rgba(0,0,0,.5);color:var(--text);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-head b{font-family:'IBM Plex Mono',monospace;font-size:13px;text-transform:capitalize;letter-spacing:.02em;}
  .cal-head .cal-navs{display:flex;gap:6px;}
  .cal-head button{width:30px;height:30px;border:1px solid var(--border);background:var(--panel-alt);color:var(--text);border-radius:4px;cursor:pointer;font-size:11px;}
  .cal-head button:hover{border-color:var(--yellow);color:var(--yellow);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .cal-grid .wd{font-size:11px;color:var(--text-faint);padding:4px 0;font-family:'IBM Plex Mono',monospace;}
  .cal-grid button{position:relative;aspect-ratio:1/1;width:100%;border:1px solid transparent;border-radius:50%;background:none;color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;padding:0;}
  .cal-grid button.out{color:var(--text-faint);}
  .cal-grid button:hover{background:var(--panel-alt);border-color:var(--yellow);}
  .cal-grid button.hoje{border-color:var(--yellow);color:var(--yellow);font-weight:700;}
  .cal-grid button.sel{background:var(--yellow);border-color:var(--yellow);color:#14181c;font-weight:700;}
  .cal-grid button.tem::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--teal);}
  .cal-grid button.sel.tem::after{background:#14181c;}
  .cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
  .cal-foot button{border:1px solid var(--border);background:var(--panel-alt);color:var(--text);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:12px;}
  .cal-foot button:hover{border-color:var(--yellow);color:var(--yellow);}
  .big-total{font-size:44px;color:var(--text);line-height:1;margin-bottom:6px;}
  .big-total .cents{font-size:24px;color:var(--text-faint);}
  .hero-left .sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
  .goal-row{margin-bottom:14px;}
  .goal-row:last-child{margin-bottom:0;}
  .goal-row .goal-label{
    display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;
  }
  .goal-label b{color:var(--text);font-weight:600;}
  .goal-track{height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:99px;background:var(--teal);transition:width .5s ease;}
  .goal-fill.reached{background:var(--green);}

  .hero-right{background:var(--panel-alt);padding:22px 26px 14px;}
  .hero-right h2{font-size:13px;color:var(--text-dim);font-weight:500;text-transform:none;margin-bottom:14px;font-family:'IBM Plex Sans',sans-serif;}
  .chart-wrap{width:100%;}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible;}
  .chart-empty{color:var(--text-faint);font-size:13px;padding:40px 0;text-align:center;}

  /* ---- secondary row ---- */
  .daily-target-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .daily-target{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  @media(max-width:600px){.daily-target{grid-template-columns:1fr;}}
  .dt-card{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--teal);
    border-radius:6px;padding:16px 18px;
  }
  .dt-card:nth-child(2){border-left-color:var(--yellow);}
  .dt-card.dt-done{border-left-color:var(--green);}
  .dt-card.dt-closed{border-left-color:var(--text-faint);}
  .dt-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px;}
  .dt-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .dt-percent{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .dt-value{font-size:23px;color:var(--teal);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .dt-card:nth-child(2) .dt-value{color:var(--yellow);}
  .dt-value .dt-unit{font-size:13px;color:var(--text-faint);margin-left:5px;font-family:'IBM Plex Sans',sans-serif;}
  .dt-card.dt-done .dt-value{color:var(--green);font-size:19px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .dt-card.dt-closed .dt-value{color:var(--text-dim);}
  .dt-sub{font-size:12px;color:var(--text-dim);margin-top:8px;}

  .parts-visor-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .parts-visor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:820px){.parts-visor{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.parts-visor{grid-template-columns:1fr;}}
  .parts-card{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--border-soft);
    border-radius:6px;padding:16px 18px;
  }
  .parts-card.pc-teal{border-left-color:var(--teal);}
  .parts-card.pc-yellow{border-left-color:var(--yellow);}
  .parts-card.pc-green{border-left-color:var(--green);}
  .parts-card.pc-red{border-left-color:var(--red);}
  .parts-card .pc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
  .parts-card .pc-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .parts-card .pc-qty{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .parts-card .pc-value{font-size:23px;color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .parts-card.pc-teal .pc-value{color:var(--teal);}
  .parts-card.pc-yellow .pc-value{color:var(--yellow);}
  .parts-card.pc-green .pc-value{color:var(--green);}
  .parts-card.pc-red .pc-value{color:var(--red);}
  .cellval.lucro-cell{font-weight:700;text-align:right;opacity:1;-webkit-text-fill-color:currentColor;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:820px){.row2{grid-template-columns:1fr;}}
  .card{border:1px solid var(--border-soft);border-radius:4px;background:var(--panel);padding:20px 22px;}
  .card h3{font-size:13px;color:var(--text-dim);font-weight:500;margin-bottom:12px;font-family:'IBM Plex Sans',sans-serif;}
  .yesterday-total{font-size:26px;color:var(--text);margin-bottom:2px;}
  .yesterday-meta{font-size:12.5px;color:var(--text-faint);margin-bottom:14px;}
  .today-card{display:flex;flex-direction:column;justify-content:space-between;}
  .today-card .date-big{font-size:26px;color:var(--text);text-transform:capitalize;margin-bottom:2px;}
  .today-card .date-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:16px;}

  /* ---- archive ---- */
  .archive-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;}
  .archive-head h2{font-size:15px;color:var(--text);}
  .archive-head .hint{font-size:12px;color:var(--text-faint);}
  .archive-list{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;max-height:360px;overflow-y:auto;}
  .arow{
    display:flex;align-items:center;justify-content:space-between;padding:11px 16px;
    border-bottom:1px solid var(--border-soft);background:var(--panel);font-size:13.5px;
  }
  .arow:last-child{border-bottom:none;}
  .arow:hover{background:var(--panel-alt);}
  .arow .d{color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-width:90px;}
  .arow .stats{display:flex;gap:18px;color:var(--text-dim);font-size:12.5px;}
  .arow .stats b{color:var(--text);}
  .arow-empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* ---- table screen ---- */
  .tbl-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .tbl-head-left{display:flex;align-items:center;gap:12px;}
  .day-nav{display:flex;align-items:center;gap:6px;}
  .day-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;
  }
  .day-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .tbl-head h2{font-size:19px;text-transform:capitalize;}
  .save-flag{font-size:11.5px;color:var(--green);opacity:0;transition:opacity .3s;font-family:'IBM Plex Mono',monospace;}
  .save-flag.show{opacity:1;}

  .totals-bar{
    display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border-soft);border-radius:4px;
    background:var(--panel);margin-bottom:14px;overflow:hidden;
  }
  .tstat{padding:12px 18px;border-right:1px solid var(--border-soft);min-width:120px;}
  .tstat:last-child{border-right:none;}
  .tstat .k{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
  .tstat .v{font-size:15px;color:var(--text);font-family:'IBM Plex Mono',monospace;}
  .tstat .v.accent{color:var(--yellow);}

  .sticky-head-block{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px;}

  /* ---- orçamento ---- */
  .orc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .orc-field label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em;}
  .orc-field input,.orc-field select,.orc-field textarea{
    width:100%;background:var(--panel-alt);border:1px solid var(--border-soft);color:var(--text);
    border-radius:4px;padding:9px 10px;font-size:13.5px;font-family:inherit;
  }
  .orc-field textarea{min-height:64px;resize:vertical;}
  .orc-field input:focus,.orc-field select:focus,.orc-field textarea:focus{outline:none;border-color:var(--yellow);}
  .orc-items{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:12px;}
  .orc-item{display:grid;grid-template-columns:1fr 80px 120px 120px 36px;gap:8px;align-items:center;
    padding:8px 10px;border-bottom:1px solid var(--border-soft);}
  .orc-item:last-child{border-bottom:none;}
  .orc-item.head{background:var(--panel-alt);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);}
  .orc-item input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    border-radius:3px;padding:6px 6px;font-size:13.5px;font-family:inherit;}
  .orc-item input:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .orc-item .tot{font-size:13.5px;text-align:right;color:var(--text-dim);}
  .orc-total{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;margin:6px 2px 18px;}
  .orc-total .lbl{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .orc-total .val{font-size:22px;font-weight:bold;color:var(--yellow);}
  @media (max-width:760px){
    .orc-grid{grid-template-columns:1fr;}
    .orc-item{grid-template-columns:1fr 60px 92px 36px;}
    .orc-item .tot{display:none;}
  }

  .dd-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}

  .dd-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}

  @media(max-width:520px){.dd-row .lbl{flex:0 0 110px;} .dd-row .pct{display:none;}}
  .dd-row .lbl small{display:block;color:var(--text-faint);font-size:11px;}

  .chart-wrap circle[data-iso],.chart-wrap circle[data-mon]{cursor:pointer;}
  .sticky-head-block .tbl-head{margin-bottom:12px;}
  .sticky-head-block .tbl-toolbar{margin:0 0 10px;}
  .grid-scroll-head{border:1px solid var(--border-soft);border-radius:4px 4px 0 0;border-bottom:none;overflow:hidden;background:var(--panel-alt);}

  .grid-scroll{border:1px solid var(--border-soft);border-radius:0 0 4px 4px;overflow:hidden;background:var(--panel);}

  }

  /* carro pronto (marcado pelo montador na O.S.): contorno verde na linha da tabela de vendas */
  .grid-row.data.carro-pronto{outline:2px solid #22c55e;outline-offset:-2px;border-radius:6px;box-shadow:0 0 10px rgba(34,197,94,.35);position:relative;}
  .grid-row .cell{
    padding:6px 8px;border-right:1px solid var(--border-soft);display:flex;align-items:center;
  }

  .grid-row.head .head-actions-cell{padding:6px 8px;justify-content:center;}

  .cellval{
    width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    font-size:13px;padding:6px 6px;border-radius:3px;
  }
  .cellval:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .cellval:disabled{color:var(--text-dim);}
  select.cellval{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2398a3ad'/></svg>");background-repeat:no-repeat;background-position:right 6px center;padding-right:18px;}
  select.cellval:disabled{background-image:none;}

  .rowactions{display:flex;align-items:center;justify-content:center;gap:4px;}
  .icon-btn{
    width:24px;height:24px;border-radius:3px;border:1px solid var(--border);background:transparent;
    color:var(--text-faint);font-size:13px;display:flex;align-items:center;justify-content:center;
  }

  .icon-btn.cli-btn.has{border-color:var(--teal);color:var(--teal);}
  .icon-btn.cli-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.drag-btn{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;font-size:14px;letter-spacing:-1px;}
  .icon-btn.drag-btn:hover{border-color:var(--yellow);color:var(--yellow);}
  .icon-btn.drag-btn:active{cursor:grabbing;}
  /* a linha (venda) e o toggle/detalhe dela viajam juntos como um único bloco
     durante o arraste, pra não ter mais aquele "descolamento" visual entre
     a linha principal e os detalhes abertos abaixo dela */
  .row-group{position:relative;}
  /* o bloco arrastado fica "levantado" e gruda no cursor/dedo, igual a aba de
     navegador; as outras linhas abrem espaço deslizando em tempo real */
  .row-group.row-dragging{
    z-index:30;
    background:var(--panel-alt);
    border-radius:4px;
    box-shadow:0 0 0 1px var(--yellow), 0 12px 26px rgba(0,0,0,.5);
    will-change:transform;

  .row-group.row-dragging .grid-row{background:transparent;border-bottom-color:transparent;}
  .row-group.row-dragging .grid-row.data{border-bottom:none;}
  /* deslizar das linhas que abrem espaço + encaixe final do bloco arrastado */
  .row-group.row-shifting{transition:transform .17s cubic-bezier(.2,.8,.2,1);}
  body.grid-dragging{cursor:grabbing;}
  body.grid-dragging .grid-row.data:hover{background:transparent;}

  /* linha com quantidade x valor que não bate (ex: 3 bicos mas R$ 0,00) */
  .cell.cell-warn{box-shadow:inset 0 0 0 1.5px var(--yellow);background:rgba(245,183,0,.08);border-radius:3px;}

    font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);

  .detail-toggle-row{grid-column:1/-1;padding:0;background:var(--panel-alt);}

    color:var(--text);padding:8px 10px;font-size:13px;resize:vertical;
  }
  .detail-box textarea:focus{outline:none;border-color:var(--yellow);}

  .tbl-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}

  .overlay{
    position:fixed;inset:0;background:rgba(10,12,14,.7);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:24px 26px;width:100%;max-width:340px;
  }
  .modal.wide{max-width:440px;}
  .modal h3{font-size:15px;margin-bottom:6px;}
  .modal p{font-size:12.5px;color:var(--text-dim);margin:0 0 16px;line-height:1.5;}
  .modal input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:10px 12px;font-size:14px;margin-bottom:10px;letter-spacing:2px;
  }
  .modal .field-group input{letter-spacing:normal;margin-bottom:12px;}
  .modal input.search-input{letter-spacing:normal;}
  .modal .field-group label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;}
  .modal input:focus{outline:none;border-color:var(--yellow);}
  .modal .err{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .cust-list{max-height:280px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:4px;margin-bottom:4px;}
  .cust-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    background:transparent;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);
    padding:10px 12px;font-size:13px;
  }
  .cust-item:last-child{border-bottom:none;}
  .cust-item:hover{background:var(--panel-alt);}

  .dash-cust-search{

    padding:9px 12px;font-size:13px;margin-bottom:10px;

  .dash-cust-search:focus{outline:none;border-color:var(--yellow);}
  .cust-detail-name{font-size:14px;color:var(--text);font-weight:500;}

  .backlink{color:var(--text-dim);font-size:13px;display:flex;align-items:center;gap:6px;border:none;background:transparent;padding:6px 0;}

  /* ---- login de acesso ao site ---- */
  .login-screen{min-height:82vh;display:flex;align-items:center;justify-content:center;}

  .backlink:hover{color:var(--yellow);}

  /* ==========================================================================
     AJUSTES SOMENTE PARA TELA DE CELULAR — não afeta a versão de computador
     ========================================================================== */
  @media(max-width:700px){
    #app, #app.wide{padding:12px 10px 60px;}

    /* topo: deixa quebrar linha em vez de espremer tudo numa fileira só */

<style id="oficina-redesign">
:root{

button,.btn,input,select,textarea{border-radius:4px!important}
.btn{min-height:38px;font-weight:600;transition:border-color .16s ease,background .16s ease,color .16s ease,transform .16s ease}
.btn:active{transform:translateY(1px)}
.btn.primary{box-shadow:0 5px 14px rgba(255,196,0,.12)}
.dash-hero{border-color:var(--border);background:linear-gradient(135deg,var(--panel) 0%,var(--panel-alt) 100%);overflow:hidden;position:relative}
.dash-hero:after{content:"";position:absolute;right:-50px;top:-70px;width:170px;height:170px;border:18px solid rgba(255,196,0,.045);border-radius:50%;pointer-events:none}
.big-number,.hero-value,.dd-total{font-variant-numeric:tabular-nums}.progress-fill,.bar-fill{background:var(--yellow)!important}
.parts-card,.seller-card,.daily-target-card,.stat-card{border-top:2px solid var(--yellow)!important;background:var(--panel)!important}
.table-wrap,.estoque-table-wrap{border:1px solid var(--border);border-radius:6px;background:var(--panel);box-shadow:0 14px 35px rgba(0,0,0,.2)}
thead th{background:#10161a!important;color:var(--text-dim)!important;text-transform:uppercase;letter-spacing:.06em;font-size:10px!important}
tbody tr:hover{background:rgba(255,196,0,.035)}

<script>
/* Armazenamento grande: troca o localStorage (limite ~5 MB) por um espaço no IndexedDB (centenas de MB),
   sem mudar o resto do sistema. Nada é apagado: os dados antigos do localStorage são COPIADOS uma vez
   e continuam lá. Se o navegador não suportar, tudo segue como antes. */
window.__voReady = new Promise(function(resolve){
  var done = false; function fim(){ if(!done){ done = true; resolve(); } }
  try{
    var real = window.localStorage, DB = "vo_store", ST = "kv";
    var req = indexedDB.open(DB, 1);
    req.onupgradeneeded = function(){ req.result.createObjectStore(ST); };
    req.onerror = req.onblocked = fim;
    req.onsuccess = function(){
      try{
        var db = req.result, mem = Object.create(null), keys = [];
        var tx = db.transaction(ST, "readonly"), os = tx.objectStore(ST), c = os.openCursor();
        c.onsuccess = function(){
          var cur = c.result;
          if (cur){ mem[cur.key] = cur.value; cur.continue(); return; }
          // fim da leitura: primeira vez? copia o que já existia no localStorage (sem apagar de lá)
          var migrar = (mem["__vo_migrado"] !== "1");
          var novos = {};
          if (migrar){
            try{
              for (var i=0;i<real.length;i++){ var k = real.key(i); if (k!=null && !(k in mem)) novos[k] = real.getItem(k); }
            }catch(e){}
            for (var k in novos) mem[k] = novos[k];
            mem["__vo_migrado"] = "1"; novos["__vo_migrado"] = "1";
          }
          function grava(k, v){
            try{ var t = db.transaction(ST, "readwrite"); if (v===null) t.objectStore(ST).delete(k); else t.objectStore(ST).put(v, k); }
            catch(e){ console.error("IndexedDB", e); }
          }
          for (var kk in novos) grava(kk, novos[kk]);
          var shim = {
            getItem: function(k){ k = String(k); return (k in mem && k!=="__vo_migrado") ? mem[k] : null; },
            setItem: function(k, v){ k = String(k); v = String(v); mem[k] = v; grava(k, v); },
            removeItem: function(k){ k = String(k); if (k in mem){ delete mem[k]; grava(k, null); } },
            key: function(i){ var a = Object.keys(mem).filter(function(x){ return x!=="__vo_migrado"; }); return i < a.length ? a[i] : null; },
            clear: function(){ Object.keys(mem).forEach(function(k){ if (k!=="__vo_migrado"){ delete mem[k]; grava(k, null); } }); }
          };
          Object.defineProperty(shim, "length", { get: function(){ return Object.keys(mem).filter(function(x){ return x!=="__vo_migrado"; }).length; } });
          try{ Object.defineProperty(window, "localStorage", { value: shim, configurable: true, writable: true }); }catch(e){}
          try{ if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
          fim();
        };
        c.onerror = fim;
      }catch(e){ fim(); }
    };
    setTimeout(fim, 8000);
  }catch(e){ fim(); }
});
</script>

  // envia uma chave (já salva localmente) para a tabela kv_store no Supabase
  function cloudPush(key, value){
    if (!sb) return;
    sb.from("kv_store").upsert({key:key, value:value, updated_at:new Date().toISOString()})
      .then(function(res){
        if (res && res.error){ cloudStatus = "error"; console.error("Erro ao sincronizar", key, res.error); }
        else {
          // esta alteração vai voltar pra nós mesmos pelo canal em tempo real daqui a pouco;
          // marcamos que esperamos esse "eco" pra não tratá-lo como mudança de outro aparelho
          pendingEchoKeys[key] = (pendingEchoKeys[key]||0) + 1;
          if (cloudStatus!=="on"){ cloudStatus = "on"; refreshSyncBadge(); }
        }
      });
  }

  // baixa tudo da nuvem e grava no localStorage (usado ao abrir o app)
  // cb recebe true se a nuvem já tinha dados, false se estava vazia
  function cloudPullAll(cb){
    if (!sb) return cb(false);
    // O Supabase devolve no máximo 1000 linhas por consulta: sem paginar, o que passa disso (vendas de
    // vários dias/meses) simplesmente não é baixado e "some" da tela. Por isso baixamos em páginas.
    var PAGINA = 500, todas = [];
    function falhou(err){
      cloudStatus = "error"; console.error("Erro ao baixar dados da nuvem", err);
      // true de propósito: com a nuvem falhando NÃO devemos subir os dados locais por cima dela
      cb(true);
    }
    function pagina(de){
      sb.from("kv_store").select("key,value").not("key","like",K_BKP+"%").not("key","like",K_FOTOMES+"%").not("key","like",K_ARQ+"%").order("key",{ascending:true}).range(de, de+PAGINA-1).then(function(res){
        if (!res || res.error || !res.data){ return falhou(res && res.error); }
        todas = todas.concat(res.data);
        if (res.data.length === PAGINA) return pagina(de+PAGINA);
        todas.forEach(function(row){
          if (row.key.indexOf(K_ARQ)===0) return; // arquivo morto fica só na nuvem (não ocupa espaço do navegador)
          try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        });
        cloudStatus = "on";
        cb(todas.length>0);
      }).catch(falhou);
    }
    pagina(0);
  }

  // envia TUDO que já está salvo neste navegador pra nuvem de uma vez
  // (usado na primeira ativação, e também pelo botão manual "Enviar pra nuvem")
  function pushAllLocalToCloud(){
    if (!sb) return 0;
    var n = 0;
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (!k || k.indexOf("vo_")!==0 || k===K_AUTOBACKUP) continue;
      try{
        var val = JSON.parse(localStorage.getItem(k));
        cloudPush(k, val);
        n++;
      }catch(e){ /* ignora chave que não seja JSON válido */ }
    }
    return n;
  }

  // escuta mudanças feitas em OUTROS aparelhos e atualiza a tela na hora
  function initCloudSync(onRemoteChange){
    if (!sb) return;
    sb.channel("kv_store_changes")
      .on("postgres_changes", {event:"*", schema:"public", table:"kv_store"}, function(payload){
        var row = payload.new;
        if (!row || !row.key) return;
        if (row.key.indexOf(K_ARQ)===0 || row.key.indexOf(K_BKP)===0 || row.key.indexOf(K_FOTOMES)===0) return; // arquivo morto, backups e fotos: só nuvem
        try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        if (pendingEchoKeys[row.key] > 0){
          // é só o eco da nossa própria digitação/salvamento — os dados já estão certos localmente,
          // então não precisamos redesenhar a tela (isso é o que tirava o foco de quem estava digitando)
          pendingEchoKeys[row.key]--;
          return;
        }
        onRemoteChange(row.key);
      })
      .subscribe(function(status){
        if (status==="SUBSCRIBED"){ cloudStatus = "on"; refreshSyncBadge(); }
      });
  }

  // ---------- espaço do navegador (localStorage tem ~5 MB) ----------
  // só os históricos (edições, linhas apagadas, movimentos de estoque, logins) são enxugados; vendas, notas e clientes nunca
  function lsUso(){
    var total = 0, itens = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i), v = localStorage.getItem(k) || "";
      var b = (k.length+v.length)*2; total += b; itens.push({k:k, bytes:b});
    }
    itens.sort(function(a,b){ return b.bytes-a.bytes; });
    return {total:total, itens:itens};
  }
  function lsMB(b){ return (b/1048576).toFixed(2).replace(".",",")+" MB"; }
  function lsLiberarEspaco(nivel){
    var manter = nivel>=2 ? 30 : (nivel===1 ? 100 : 200), liberado = 0;
    [K_EDICOES_LOG, K_LINHAS_APAGADAS, K_ESTOQUE_LOG, K_LOGIN_LOG, K_OS_LOG].forEach(function(k){
      var raw = localStorage.getItem(k); if (!raw) return;
      try{
        var lista = JSON.parse(raw);
        if (!Array.isArray(lista) || lista.length<=manter) return;
        var corte = lista.slice(0, lista.length-manter);
        // nada é apagado: o trecho antigo vai inteiro para a nuvem antes de sair do navegador
        if (sb && corte.length){
          cloudPush(K_ARQ+k+":"+Date.now(), {origem:k, enviadoEm:new Date().toISOString(), itens:corte});
        } else if (!sb){
          return; // sem nuvem configurada, não corta nada (evita perder histórico)
        }
        var novo = JSON.stringify(lista.slice(lista.length-manter));
        localStorage.setItem(k, novo); liberado += (raw.length-novo.length)*2;
      }catch(e){}
    });
    return liberado;
  }

  // total e nº de vendas de cada dia do mês, recalculados direto das vendas lançadas (assim o gráfico
  // "Evolução diária" nunca fica defasado por causa de um resumo salvo antigo ou de um dia salvo por outro caminho)
  function getSummary(month){
    var summary = {};
    listAllDates().forEach(function(d){
      if (d.slice(0,7)!==month) return;
      var rows = lsGetJSON(K_ROWS+d, []);
      if (!Array.isArray(rows)) rows = [];

  function computeSubtotal(row){
    return parseNum(row.alinhamento)+parseNum(row.valorBicos)+parseNum(row.valorCambagem)+
           parseNum(row.valorBalanceamento)+parseNum(row.valorRodas)+parseNum(row.outros)+
           parseNum(row.valorPecas)+parseNum(row.maoDeObra)+parseNum(row.valorPneus);
  }
  // lista de descontos da venda: aceita o formato novo (row.descontos = [{origem, valor}, ...])
  // e o antigo (row.desconto = {origem, valor}) das vendas já salvas
  function descontosList(row){
    var out = [];
    if (!row) return out;
    if (Array.isArray(row.descontos)){
      row.descontos.forEach(function(d){
        if (d && parseNum(d.valor)>0) out.push({origem:d.origem||"", valor:Math.max(0,parseNum(d.valor))});
      });
    } else if (row.desconto && parseNum(row.desconto.valor)>0){
      out.push({origem:row.desconto.origem||"", valor:Math.max(0,parseNum(row.desconto.valor))});
    }
    return out;
  }
  function descontoValor(row){
    var t = 0;
    descontosList(row).forEach(function(d){ t += d.valor; });
    return t;
  }
  // descontos de uma nota já emitida (notas antigas guardam um só: nota.desconto + nota.descontoOrigem)
  function notaDescontosList(nota){
    if (Array.isArray(nota.descontos) && nota.descontos.length) return nota.descontos;
    if (nota.desconto>0) return [{origem:nota.descontoOrigem||"", valor:nota.desconto}];
    return [];
  }
  function notaDescontoLabel(d, comCarro){
    var partes = [];
    if (comCarro && d.carro) partes.push(d.carro);
    if (d.origem) partes.push(descontoOrigemLabel(d.origem));
    return 'Desconto' + (partes.length ? ' ('+partes.join(' — ')+')' : '');
  }
  function computeValor(row){
    return Math.max(0, computeSubtotal(row) - descontoValor(row));
  }
  // divide o valor da linha entre as formas de pagamento reais (Dinheiro/Pix/Débito/Crédito).
  // quando a forma escolhida é combinada (ex: "Débito/Crédito"), usa o valor manual definido
  // em row.splitValor pra primeira forma listada; se não foi definido, divide meio a meio.
  function paymentBreakdown(row){
    var buckets = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    var fp = row.formaPagamento;
    var total = computeValor(row);
    if (!fp || fp==="Nenhum" || total===0) return buckets;
    if (fp.indexOf("Múltiplo")===0){
      var lista = Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos : [];
      lista.forEach(function(p){
        if (p && p.metodo && buckets.hasOwnProperty(p.metodo)){
          buckets[p.metodo] += Math.max(0, parseNum(p.valor));
        }
      });
      return buckets;
    }
    if (fp.indexOf("/")===-1){
      if (buckets.hasOwnProperty(fp)) buckets[fp] = total;
      return buckets;
    }
    var parts = fp.split("/");
    var first = parts[0], second = parts[1];
    var firstVal = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="")
      ? Math.max(0, Math.min(parseNum(row.splitValor), total))
      : total/2;
    var secondVal = total - firstVal;
    if (buckets.hasOwnProperty(first)) buckets[first] += firstVal;
    if (buckets.hasOwnProperty(second)) buckets[second] += secondVal;
    return buckets;
  }
  // ---------- crédito: maquininha + parcelas (o master define o juros de cada parcela) ----------
  var PARCELAS_MAX = 12;
  function taxasCfg(){
    var c = lsGetJSON(K_TAXAS, null);

    if (!c.taxas) c.taxas = {};

  // o master escolhe, por tabela, se as taxas das maquininhas são descontadas (padrão: sim)
  function descontaTaxas(novo){ return taxasCfg().descontar[novo ? "novos" : "normais"] !== false; }
  function taxaDebitoPct(maqId){ return Math.max(0, parseNum(taxasCfg().debito[maqId])); }
  function pctMaq(maqId, metodo, parcelas){ return metodo==="Débito" ? taxaDebitoPct(maqId) : taxaPct(maqId, parcelas); }
  function maqNome(id){ var m = taxasCfg().maquininhas.filter(function(x){ return x.id===id; })[0]; return m ? m.nome : ""; }
  function taxaPct(maqId, parcelas){ var t = taxasCfg().taxas[maqId]; return t ? Math.max(0, parseNum(t[String(parcelas||1)])) : 0; }
  function creditoResumo(c){
    if (!c || !c.maquininha) return "";
    if (c.formaPagamento==="Débito") return "Débito · "+(maqNome(c.maquininha)||"?");
    return (parseInt(c.parcelas,10)||1)+"x · "+(maqNome(c.maquininha)||"?");
  }
  // desconto da maquininha sobre o valor pago no crédito; usa a taxa gravada na venda (não muda se o master alterar o juros depois)
  function taxaCartaoItem(c, valor, metodo){
    if (!c || !c.maquininha || !(valor>0)) return 0;
    var pct = (c.taxaPct!==undefined && c.taxaPct!==null && c.taxaPct!=="") ? parseNum(c.taxaPct) : pctMaq(c.maquininha, metodo, c.parcelas);
    return Math.round(valor*pct)/100;
  }
  // novo = true quando a linha é da tabela de pneus novos; se o master desligou o desconto daquela tabela, não há taxa
  function taxaCartaoSplit(row, novo){
    var r = {deb:0, cred:0};
    if (!descontaTaxas(novo)) return r;
    var fp = row.formaPagamento;
    if (fp==="Crédito") r.cred = taxaCartaoItem(row, computeValor(row), fp);
    else if (fp==="Débito") r.deb = taxaCartaoItem(row, computeValor(row), fp);
    else if (fp && fp.indexOf("Múltiplo")===0 && Array.isArray(row.pagamentosMultiplos)){
      row.pagamentosMultiplos.forEach(function(p){
        if (!p) return;
        if (p.metodo==="Crédito") r.cred += taxaCartaoItem(p, Math.max(0, parseNum(p.valor)), p.metodo);
        else if (p.metodo==="Débito") r.deb += taxaCartaoItem(p, Math.max(0, parseNum(p.valor)), p.metodo);
      });
    }
    return r;
  }
  function taxaCartao(row, novo){ var r = taxaCartaoSplit(row, novo); return r.deb + r.cred; }
  function taxaNoteTxt(row, valor){ var tx = taxaCartao(row, isNovosTbl()); return tx>0 ? "taxa -"+fmtCurrency(tx)+" · líq. "+fmtCurrency(Math.max(0, valor-tx)) : ""; }
  function snapshotTaxa(c, metodo){ c.taxaPct = c.maquininha ? pctMaq(c.maquininha, metodo || c.formaPagamento || "Crédito", c.parcelas) : 0; }

  // ---------- máscaras de CPF, CNPJ e telefone (formatam enquanto digita) ----------
  function soDigitos(v){ return String(v===undefined||v===null ? "" : v).replace(/\D/g, ""); }
  function mascaraCpf(d){
    d = d.slice(0,11);
    var o = d.slice(0,3);
    if (d.length>3) o += "." + d.slice(3,6);
    if (d.length>6) o += "." + d.slice(6,9);
    if (d.length>9) o += "-" + d.slice(9,11);
    return o;
  }
  function mascaraCnpj(d){
    d = d.slice(0,14);
    var o = d.slice(0,2);
    if (d.length>2) o += "." + d.slice(2,5);
    if (d.length>5) o += "." + d.slice(5,8);
    if (d.length>8) o += "/" + d.slice(8,12);
    if (d.length>12) o += "-" + d.slice(12,14);
    return o;
  }
  // telefone sempre com DDD: (47) 99999-9999 (celular, com o 9 a mais) ou (47) 3333-3333 (8 dígitos).
  // "final" = campo terminado (ao sair do campo/salvar): celular antigo de 8 dígitos começando com 9 vira 4-4.
  function mascaraTelefone(d, final){
    if (d.length>11 && d.slice(0,2)==="55") d = d.slice(2); // colou com +55
    if (d.length>2 && d.charAt(2)!=="9") d = d.slice(0,10);  // não começa com 9: número de 8 dígitos
    d = d.slice(0,11);
    if (!d.length) return "";
    var ddd = d.slice(0,2), n = d.slice(2);
    if (d.length<=2) return "(" + ddd;
    var corte = (n.charAt(0)==="9" && !(final && n.length===8)) ? 5 : 4;
    var o = "(" + ddd + ") " + n.slice(0,corte);
    if (n.length>corte) o += "-" + n.slice(corte);
    return o;
  }
  // valor já salvo/final: só formata se os dígitos couberem na máscara (senão deixa como está)
  function formatarDocumento(tipo, valor){
    var d = soDigitos(valor), max = tipo==="cnpj" ? 14 : 11;
    if (!d.length || d.length>max) return String(valor||"").trim();
    return tipo==="cnpj" ? mascaraCnpj(d) : mascaraCpf(d);
  }
  function formatarTelefone(valor){
    var d = soDigitos(valor);
    if (!d.length) return "";
    if (d.length>13 || (d.length>11 && d.slice(0,2)!=="55")) return String(valor||"").trim();
    return mascaraTelefone(d, true);
  }
  // liga a máscara num <input>: refaz a formatação a cada tecla e mantém o cursor no lugar certo
  function aplicarMascaraInput(inp, fmt, fmtFinal){
    var ultimo = soDigitos(inp.value).length;
    inp.addEventListener("input", function(e){
      var v = inp.value;
      var pos = (inp.selectionStart===null || inp.selectionStart===undefined) ? v.length : inp.selectionStart;
      var dig = soDigitos(v);
      var antes = soDigitos(v.slice(0,pos)).length;
      // apagou só um símbolo (parêntese, espaço, ponto, traço)? então apaga o número que vem antes dele
      if (e && e.inputType==="deleteContentBackward" && dig.length===ultimo && antes>0){
        dig = dig.slice(0,antes-1) + dig.slice(antes); antes--;
      }
      var novo = fmt(dig);
      inp.value = novo;
      var n = 0, i = 0;
      if (antes>0){
        for (i=0; i<novo.length; i++){
          if (/\d/.test(novo.charAt(i))){ n++; if (n===antes){ i++; break; } }
        }
      }
      try{ inp.setSelectionRange(i, i); }catch(x){}
      ultimo = soDigitos(novo).length;
    });
    if (fmtFinal){
      inp.addEventListener("blur", function(){ inp.value = fmtFinal(inp.value); ultimo = soDigitos(inp.value).length; });
    }
  }

  // movimenta o estoque de um item: delta positivo entra, negativo sai.
  // nunca deixa negativo — se faltar, para no 0. devolve quanto realmente mexeu.
  function moveEstoque(id, delta){
    if (!id || !delta) return 0;
    var list = loadEstoque();
    var moved = 0;
    for (var i=0;i<list.length;i++){
      if (list[i].id===id){
        var atual = Math.max(0, parseNum(list[i].quantidade));
        var novo = atual + delta;
        if (novo < 0) novo = 0;
        moved = novo - atual;
        list[i].quantidade = novo;
        break;
      }
    }
    if (moved !== 0) saveEstoque(list);
    return moved;
  }
  // acerta a baixa de estoque de uma linha de venda conforme a medida e a quantidade escolhidas
  function syncRowEstoque(row){
    var desejada = row.medidaId ? Math.max(0, parseNum(row.quantidade)) : 0;
    var jaBaixado = Math.max(0, parseNum(row.medidaBaixa));
    var delta = desejada - jaBaixado;
    if (delta === 0) return;
    var moved = moveEstoque(row.medidaId, -delta);
    // saiu estoque de verdade por causa da venda: registra no histórico como "venda" (nunca como "ajuste")
    if (moved < 0){
      var item = estoqueItem(row.medidaId);
      addEstoqueLog("venda", estoqueLabel(item) || row.medida || "", Math.abs(moved));
    }
    row.medidaBaixa = jaBaixado - moved; // moved vem negativo quando saiu do estoque
  }
  // mudou a quantidade de pneus de uma linha com medida do estoque: recalcula o valor dos pneus (e o custo, nos novos).
  // Mantém o valor unitário que já estava na linha (se foi negociado, continua negociado); se o campo estava vazio, usa o do estoque.
  function reprecificaPorQuantidade(row, qtdAntiga){
    var item = row.medidaId ? estoqueItem(row.medidaId) : null;
    var q = parseNum(row.quantidade);
    if (!item || q<=0) return;
    function novo(atual, unitEstoque){
      var a = parseNum(atual);
      if (a>0 && qtdAntiga>0) return (a/qtdAntiga*q).toFixed(2);
      if (!(a>0) && unitEstoque>0) return (unitEstoque*q).toFixed(2);
      return atual;
    }
    row.valorPneus = novo(row.valorPneus, parseNum(item.preco));
    if (isNovosTbl()) row.custoPneus = novo(row.custoPneus, parseNum(item.custo));
  }

  var AUDIT_CAMPOS = ["quantidade","medida","marca","cliente","alinhamento","qtdBicos","valorBicos","qtdCambagem","valorCambagem",
    "qtdBalanceamento","valorBalanceamento","qtdRodas","valorRodas","outros","valorPecas","maoDeObra","valorPneus","custoPneus",
    "formaPagamento","pago","vendedor"];
  var AUDIT_MOEDA = {alinhamento:1, valorBicos:1, valorCambagem:1, valorBalanceamento:1, valorRodas:1, outros:1, valorPecas:1, maoDeObra:1, valorPneus:1, custoPneus:1};

  // chamada a cada gravação das tabelas de vendas; registra só mudanças em vendas que já existiam
  function auditarVendas(key, nova){
    var tabela, dia = "";
    if (key.indexOf(K_ROWS)===0){ tabela = "Seminovos"; dia = key.slice(K_ROWS.length); }
    else if (key.indexOf(K_NOVOS)===0){ tabela = "Pneus novos"; }
    else return;
    if (!Array.isArray(nova)) return;
    var antigaTxt = localStorage.getItem(key);
    if (!antigaTxt) return;
    var antiga = JSON.parse(antigaTxt);
    if (!Array.isArray(antiga)) return;
    var porId = {};
    antiga.forEach(function(r){ if (r && r.id) porId[r.id] = r; });
    var log = null;
    var agora = Date.now(), email = state.userEmail || "(desconhecido)";
    nova.forEach(function(r){
      var o = (r && r.id) ? porId[r.id] : null;
      if (!o || linhaApagadaVazia(o)) return;            // venda nova ou ainda em branco: não é alteração
      var diaVenda = dia || o.date || r.date || "";
      var criado = o.criadoEm ? Date.parse(o.criadoEm) : NaN;
      if (!isNaN(criado) && (agora - criado) < 10*60*1000 && (!diaVenda || diaVenda===today)) return; // ainda sendo preenchida
      var difs = [];
      AUDIT_CAMPOS.forEach(function(k){
        var a = o[k], b = r[k];
        if (AUDIT_MOEDA[k]){
          if (parseNum(a)!==parseNum(b)) difs.push({k:k, de:parseNum(a), para:parseNum(b), moeda:true});
        } else {
          var sa = String(a===undefined||a===null ? "" : a).trim(), sb = String(b===undefined||b===null ? "" : b).trim();
          if (sa!==sb) difs.push({k:k, de:sa, para:sb});
        }
      });
      var da = descontoValor(o), db = descontoValor(r);
      if (da!==db) difs.push({k:"desconto", label:"Desconto", de:da, para:db, moeda:true});
      if (JSON.stringify(o.pagamentosMultiplos||[])!==JSON.stringify(r.pagamentosMultiplos||[]))
        difs.push({k:"pagamentosMultiplos", label:"Pagamentos (múltiplo)", de:auditMultiTxt(o.pagamentosMultiplos), para:auditMultiTxt(r.pagamentosMultiplos)});
      if (!difs.length) return;
      if (!log) log = loadEdicoesLog();
      difs.forEach(function(d){
        var campo = d.label || auditLabel(d.k), idx = -1;
        // digitar "4", "40", "400" seguidos vira uma alteração só (mantém o valor original)
        for (var i=log.length-1; i>=0 && log.length-i<=80; i--){
          var x = log[i];
          if (x.rowId===r.id && x.campo===campo && x.email===email && (agora - Date.parse(x.ts))<120000){ idx = i; break; }
        }
        if (idx>-1){
          log[idx].para = d.para; log[idx].ts = new Date().toISOString();
          if (String(log[idx].de)===String(log[idx].para)) log.splice(idx,1);
        } else {
          log.push({id:uid(), ts:new Date().toISOString(), email:email, tabela:tabela, data:diaVenda, rowId:r.id,
                    cliente:(r.cliente||r.medida||""), campo:campo, moeda:!!d.moeda, de:d.de, para:d.para});
        }
      });
    });
    if (log){
      if (log.length > 1000) log = log.slice(log.length - 1000);
      saveEdicoesLog(log);
    }
  }

  // devolve uma linha apagada pra tabela do dia em que ela estava (só master). O registro fica, marcado como restaurado.
  function restaurarLinhaApagada(entryId){
    if (state.role!=="master") return;
    var log = loadLinhasApagadas();
    var e = log.filter(function(x){ return x.id===entryId; })[0];
    if (!e || e.restauradaEm) return;
    var novos = e.tabela==="Pneus novos";
    var date = e.data || (e.linha && e.linha.date) || today;
    var l0 = e.linha || {};
    var quem = (l0.cliente || l0.medida || "sem cliente");
    if (!confirm("Restaurar esta venda ("+quem+") na tabela de "+e.tabela+" do dia "+fmtDateBR(date)+"?")) return;
    var row = JSON.parse(JSON.stringify(l0));
    row.medidaBaixa = 0; // ao apagar, o estoque foi devolvido; aqui a baixa é feita de novo
    var month = date.slice(0,7);
    function finalizar(){
      e.restauradaEm = new Date().toISOString();
      e.restauradaPor = state.userEmail || "(desconhecido)";
      saveLinhasApagadas(log);
      delete state.monthSummaryCache[month];
      delete state.monthPartsCache[month];
      render();
    }
    if (novos){
      row.date = date;
      var lista = loadNovosMonth(month);
      if (lista.some(function(x){ return x.id===row.id; })){ alert("Essa venda já está na tabela de pneus novos."); return finalizar(); }
      syncRowEstoque(row);
      lista.push(row);
      if (!saveNovosMonth(month, lista)){ alert("Não foi possível salvar — armazenamento do navegador cheio ou bloqueado."); return; }
      finalizar();
    } else {
      var rows = rowsOfDay(date);
      if (rows.some(function(x){ return x.id===row.id; })){ alert("Essa venda já está na tabela de seminovos."); return finalizar(); }
      syncRowEstoque(row);
      rows.push(row);
      saveRows(date, rows).then(function(){
        if (state.date===date) state.rows = rows;
        finalizar();
      }).catch(function(err){ alert((err && err.message) || "Não foi possível salvar."); });
    }
  }

  function buildNotaItems(row){
    var items = [];
    function addItem(desc, qty, total){
      qty = parseNum(qty); total = parseNum(total);
      if (total<=0) return;
      if (qty<=0) qty = 1;
      var unit = total/qty;
      items.push({desc:desc, qty:qty, unit:unit, total:total});
    }
    addItem(row.medida ? "Pneus — "+row.medida : "Pneus", row.quantidade, row.valorPneus);
    addItem("Bico/Válvulas", row.qtdBicos, row.valorBicos);
    addItem("Alinhamento", 1, row.alinhamento);
    addItem("Cambagem", row.qtdCambagem, row.valorCambagem);
    addItem("Desempeno de roda", row.qtdRodas, row.valorRodas);
    addItem("Mão de obra", 1, row.maoDeObra);
    // peças: uma linha por peça informada (o que sobrar do valor total vai como "Peças")
    var pecasTotal = parseNum(row.valorPecas);
    var listaPecas = Array.isArray(row.pecasLista) ? row.pecasLista.filter(function(p){ return parseNum(p.valor)>0; }) : [];
    var somaPecas = listaPecas.reduce(function(sm,p){ return sm+parseNum(p.valor); }, 0);
    if (listaPecas.length && somaPecas<=pecasTotal+0.005){
      listaPecas.forEach(function(p){ addItem(p.nome && String(p.nome).trim() ? "Peça — "+String(p.nome).trim() : "Peça", 1, p.valor); });
      if (pecasTotal-somaPecas>0.005) addItem("Peças (outras)", 1, pecasTotal-somaPecas);
    } else {
      addItem("Peças", 1, row.valorPecas);
    }
    // outros: uma linha por item informado (o que sobrar do valor total vai como "Outros (restante)")
    var outrosTotal = parseNum(row.outros);
    var listaOutros = Array.isArray(row.outrosLista) ? row.outrosLista.filter(function(o){ return parseNum(o.valor)>0; }) : [];
    var somaOutros = listaOutros.reduce(function(sm,o){ return sm+parseNum(o.valor); }, 0);
    if (listaOutros.length && somaOutros<=outrosTotal+0.005){
      listaOutros.forEach(function(o){ addItem(o.nome && String(o.nome).trim() ? "Serviço — "+String(o.nome).trim() : "Serviço", 1, o.valor); });
      if (outrosTotal-somaOutros>0.005) addItem("Serviço (restante)", 1, outrosTotal-somaOutros);
    } else {
      var outrosDesc = row.outrosDescricao ? String(row.outrosDescricao).trim() : "";
      addItem(outrosDesc ? "Serviço — "+outrosDesc : "Serviço", 1, row.outros);
    }
    return items;
  }

  function canvasToPdfBlob(canvas){
    var imgData = canvas.toDataURL("image/jpeg", 0.92);
    var pdf = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var imgWidth = pageWidth;
    var imgHeight = canvas.height * (imgWidth/canvas.width);
    var heightLeft = imgHeight;
    var position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    return pdf.output("blob");
  }

  // ======================= SENHA DE EDIÇÃO (só o hash fica no código) =======================
  var pwErros = 0, pwBloqueadoAte = 0;
  var SHA_K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  function sha256Bytes(msg){
    function ror(x,n){ return (x>>>n)|(x<<(32-n)); }
    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var l = msg.length, padLen = ((l+9+63)>>6)<<6;
    var buf = new Uint8Array(padLen); buf.set(msg); buf[l] = 0x80;
    var bits = l*8; buf[padLen-4] = (bits>>>24)&255; buf[padLen-3] = (bits>>>16)&255; buf[padLen-2] = (bits>>>8)&255; buf[padLen-1] = bits&255;
    var w = new Int32Array(64), i, off;
    for (off=0; off<padLen; off+=64){
      for (i=0;i<16;i++) w[i] = (buf[off+4*i]<<24)|(buf[off+4*i+1]<<16)|(buf[off+4*i+2]<<8)|buf[off+4*i+3];
      for (i=16;i<64;i++){
        var s0 = ror(w[i-15],7)^ror(w[i-15],18)^(w[i-15]>>>3);
        var s1 = ror(w[i-2],17)^ror(w[i-2],19)^(w[i-2]>>>10);
        w[i] = (w[i-16]+s0+w[i-7]+s1)|0;
      }
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for (i=0;i<64;i++){
        var S1 = ror(e,6)^ror(e,11)^ror(e,25), ch = (e&f)^(~e&g);
        var t1 = (h+S1+ch+SHA_K[i]+w[i])|0;
        var S0 = ror(a,2)^ror(a,13)^ror(a,22), mj = (a&b)^(a&c)^(b&c);
        var t2 = (S0+mj)|0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
    }
    var out = new Uint8Array(32);
    for (i=0;i<8;i++){ out[4*i]=(H[i]>>>24)&255; out[4*i+1]=(H[i]>>>16)&255; out[4*i+2]=(H[i]>>>8)&255; out[4*i+3]=H[i]&255; }
    return out;
  }
  function hashSenhaEdicao(pw){
    var txt = unescape(encodeURIComponent(PW_SALT+":"+pw)), bytes = new Uint8Array(txt.length);
    for (var i=0;i<txt.length;i++) bytes[i] = txt.charCodeAt(i);
    var h = sha256Bytes(bytes);
    for (var n=1;n<PW_ITER;n++) h = sha256Bytes(h);
    var hex = ""; for (var j=0;j<h.length;j++) hex += (h[j]<16?"0":"")+h[j].toString(16);
    return hex;
  }
  function senhaEdicaoConfere(pw){ return hashSenhaEdicao(String(pw||"")) === PW_HASH; }

  // ======================= BACKUPS AUTOMÁTICOS (um por dia, guardados no navegador) =======================
  var idbPromise = null;
  function idbDb(){
    if (idbPromise) return idbPromise;
    idbPromise = new Promise(function(res, rej){
      if (!window.indexedDB) return rej(new Error("Este navegador não permite guardar backups automáticos."));
      var rq = indexedDB.open("vo_backup_db", 1);
      rq.onupgradeneeded = function(){
        var db = rq.result;
        if (!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", {keyPath:"id"});
        if (!db.objectStoreNames.contains("snaps")) db.createObjectStore("snaps", {keyPath:"id"});
      };
      rq.onsuccess = function(){ res(rq.result); };
      rq.onerror = function(){ rej(rq.error); };
    });
    return idbPromise;
  }
  function idbReq(store, mode, op){
    return idbDb().then(function(db){
      return new Promise(function(res, rej){
        var tx = db.transaction(store, mode), rq = op(tx.objectStore(store));
        tx.oncomplete = function(){ res(rq ? rq.result : undefined); };
        tx.onerror = tx.onabort = function(){ rej(tx.error); };
      });
    });
  }
  function dadosParaSnapshot(){
    var data = {};
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && k.indexOf("vo_")===0 && k!==K_AUTOBACKUP) data[k] = localStorage.getItem(k);
    }
    return data;
  }
  function pruneSnapshots(){
    return idbReq("meta","readonly",function(s){ return s.getAll(); }).then(function(list){
      list.sort(function(a,b){ return b.ts-a.ts; });
      var dias = 0, outros = 0, apagar = [];
      list.forEach(function(m){
        if (m.id.indexOf("dia-")===0){ dias++; if (dias>14) apagar.push(m.id); }
        else { outros++; if (outros>10) apagar.push(m.id); }
      });
      return Promise.all(apagar.map(function(id){
        return idbReq("snaps","readwrite",function(s){ return s.delete(id); }).then(function(){
          return idbReq("meta","readwrite",function(s){ return s.delete(id); });
        });
      }));
    });
  }
  function makeSnapshot(motivo, id){
    var data = dadosParaSnapshot();
    var meta = {id:id, ts:Date.now(), motivo:motivo, bytes:JSON.stringify(data).length, chaves:Object.keys(data).length};
    return idbReq("snaps","readwrite",function(s){ return s.put({id:id, data:data}); })
      .then(function(){ return idbReq("meta","readwrite",function(s){ return s.put(meta); }); })
      .then(function(){ return pruneSnapshots(); })
      .then(function(){ return meta; });
  }
  function dailySnapshot(){
    var id = "dia-"+toISO(new Date());
    return idbReq("meta","readonly",function(s){ return s.get(id); }).then(function(ex){
      if (ex) return null;

      return makeSnapshot("Backup automático do dia", id);
    }).catch(function(){ /* sem IndexedDB: o backup manual continua funcionando */ });
  }
  function listSnapshots(){
    return idbReq("meta","readonly",function(s){ return s.getAll(); }).then(function(l){ return l.sort(function(a,b){ return b.ts-a.ts; }); });
  }
  function restoreSnapshot(id){
    return makeSnapshot("Antes de restaurar um backup", "pre-"+Date.now()).then(function(){
      return idbReq("snaps","readonly",function(s){ return s.get(id); });
    }).then(function(rec){
      if (!rec) throw new Error("Backup não encontrado.");
      var n = 0;
      Object.keys(rec.data).forEach(function(k){
        try{ localStorage.setItem(k, rec.data[k]); cloudPush(k, JSON.parse(rec.data[k])); n++; }catch(e){}
      });
      state.monthSummaryCache = {}; state.monthPartsCache = {};
      return n;
    });

  // ======================= BACKUP NA NUVEM (Supabase): a cada 30 min, guarda os 10 mais recentes =======================
  // Cada backup é uma linha da tabela kv_store com chave "bkp:<hora>". Quando entra o 11º, o mais antigo é apagado.
  var K_BKP_SIG = "bkpnuvem_sig"; // (sem "vo_": não entra no backup e não sobe para a nuvem)
  var BKP_INTERVALO = 30*60*1000, BKP_MAX = 10;
  var bkpPronto = false, bkpEmAndamento = false;
  function bkpPodeRodar(){ return !!sb && !!state.userId && bkpPronto && (state.role==="master" || can("vendas")); }
  function bkpChave(ts){ return K_BKP + String(ts).padStart(13,"0"); }
  function hashTexto(t){ var h = 5381; for (var i=0;i<t.length;i++){ h = ((h<<5)+h+t.charCodeAt(i))|0; } return (h>>>0).toString(36); }
  // compacta o backup (gzip + base64) para o envio ser leve; sem suporte do navegador, vai em texto puro
  function gzipB64(txt){
    if (!window.CompressionStream) return Promise.resolve({enc:"raw", d:txt});
    var stream = new Blob([txt]).stream().pipeThrough(new CompressionStream("gzip"));
    return new Response(stream).arrayBuffer().then(function(buf){
      var bytes = new Uint8Array(buf), bin = "", CH = 0x8000;
      for (var i=0;i<bytes.length;i+=CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
      return {enc:"gzip-b64", d:btoa(bin)};
    });
  }
  function gunzipB64(v){
    if (!v || v.enc!=="gzip-b64") return Promise.resolve(v && v.d);
    var bin = atob(v.d), bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    return new Response(stream).text();
  }
  function listarBackupsNuvem(){
    return sb.from("kv_store").select("key,ts:value->>ts,motivo:value->>motivo,bytes:value->>bytes,chaves:value->>chaves")
      .like("key", K_BKP+"%").order("key",{ascending:true}).then(function(res){
        if (!res || res.error) throw new Error((res && res.error && res.error.message) || "Falha ao listar os backups da nuvem.");
        return (res.data||[]).map(function(r){
          return {key:r.key, ts:parseInt(r.ts,10)||0, motivo:r.motivo||"", bytes:parseInt(r.bytes,10)||0, chaves:parseInt(r.chaves,10)||0};
        });
      });
  }
  // mantém só os BKP_MAX mais recentes: o que passar disso (o mais antigo) é apagado
  function podarBackupsNuvem(){
    return listarBackupsNuvem().then(function(lista){
      var excesso = lista.length - BKP_MAX;
      if (excesso<=0) return 0;
      var apagar = lista.slice(0, excesso).map(function(b){ return b.key; });
      return sb.from("kv_store").delete().in("key", apagar).select("key").then(function(res){
        if (res && res.error) throw new Error("Backup guardado, mas não consegui apagar o mais antigo: "+res.error.message);
        var n = (res && res.data) ? res.data.length : 0;
        if (n < apagar.length) throw new Error("Backup guardado, mas o Supabase não deixou apagar o mais antigo (falta permissão de DELETE na tabela kv_store).");
        return n;
      });
    });
  }
  // manual=true ignora as travas "já fez há pouco" e "nada mudou"
  function backupNuvemAgora(manual){
    if (!sb || !state.userId) return Promise.reject(new Error("Entre na sua conta para guardar backups na nuvem."));
    if (bkpEmAndamento) return Promise.resolve({pulou:"andamento"});
    bkpEmAndamento = true;
    var agora = Date.now(), txt = "", sig = "";
    return listarBackupsNuvem().then(function(lista){
      var ult = lista.length ? lista[lista.length-1].ts : 0;
      // outro aparelho aberto pode ter acabado de fazer: não duplica
      if (!manual && agora-ult < BKP_INTERVALO-60000) return {pulou:"recente"};
      var data = dadosParaSnapshot(), chaves = Object.keys(data).length;
      if (!chaves) return {pulou:"vazio"};
      txt = JSON.stringify(data); sig = txt.length+":"+hashTexto(txt);
      var sigAnt = ""; try{ sigAnt = localStorage.getItem(K_BKP_SIG) || ""; }catch(e){}
      // sem nenhuma alteração desde o último backup: não gasta uma das 10 vagas com uma cópia igual
      if (!manual && sig===sigAnt && lista.length) return {pulou:"semmudanca"};
      return gzipB64(txt).then(function(z){
        var valor = {ts:agora, motivo:manual ? "Manual" : "Automático (30 min)", chaves:chaves, bytes:txt.length, enc:z.enc, d:z.d};
        return sb.from("kv_store").upsert({key:bkpChave(agora), value:valor, updated_at:new Date().toISOString()}).then(function(res){
          if (res && res.error) throw new Error(res.error.message || "A nuvem recusou o backup.");
          try{ localStorage.setItem(K_BKP_SIG, sig); }catch(e){}
          state.bkpUltimo = agora; state.bkpErro = "";
          return podarBackupsNuvem().then(function(apagados){ return {ok:true, ts:agora, apagados:apagados}; });
        });
      });
    }).then(function(r){ bkpEmAndamento = false; return r; },
            function(e){ bkpEmAndamento = false; state.bkpErro = (e && e.message) || String(e); throw e; });
  }
  function restaurarBackupNuvem(chave){
    return makeSnapshot("Antes de restaurar backup da nuvem", "pre-"+Date.now()).catch(function(){}).then(function(){
      return sb.from("kv_store").select("value").eq("key", chave).limit(1);
    }).then(function(res){
      var row = res && res.data && res.data[0];
      if (!row || !row.value) throw new Error("Backup não encontrado na nuvem.");
      return gunzipB64(row.value);
    }).then(function(txt){
      var data = JSON.parse(txt), n = 0;
      Object.keys(data).forEach(function(k){
        try{ localStorage.setItem(k, data[k]); cloudPush(k, JSON.parse(data[k])); n++; }catch(e){}
      });
      state.monthSummaryCache = {}; state.monthPartsCache = {};
      return n;
    });
  }

  // ======================= MIGRAÇÃO: Mão de obra → Serviço =======================
  function fmtCampoNum(n){ return n>0 ? n.toFixed(2).replace(".",",") : ""; }
  function migrarLinhaMaoDeObra(row){
    var mo = parseNum(row.maoDeObra);
    var partesMo = Array.isArray(row.maoDeObraSplit) ? row.maoDeObraSplit.filter(function(q){ return parseNum(q.valor)>0 && MAODEOBRA_PESSOAS.indexOf(q.pessoa)>-1; }).map(function(q){ return {pessoa:q.pessoa, valor:parseNum(q.valor)}; }) : [];
    if (!(mo>0) && !partesMo.length){
      if (row.maoDeObra!=="" && row.maoDeObra!==undefined && !(mo>0)){ row.maoDeObra = ""; }
      if (row.maoDeObraSplit){ delete row.maoDeObraSplit; return true; }
      return false;
    }
    var totalAntigo = parseNum(row.outros), lista;
    if (Array.isArray(row.outrosLista) && row.outrosLista.length){
      lista = row.outrosLista.slice();
    } else {
      lista = [];
      var desc = row.outrosDescricao ? String(row.outrosDescricao).trim() : "";
      if (Array.isArray(row.outrosSplit) && row.outrosSplit.length){
        var pp = row.outrosSplit.filter(function(q){ return parseNum(q.valor)>0; }).map(function(q){ return {pessoa:q.pessoa, valor:parseNum(q.valor)}; });
        var sp = pp.reduce(function(a,q){ return a+q.valor; }, 0);
        if (pp.length) lista.push({nome:desc, valor:sp, pessoa:"", split:pp});
        if (totalAntigo-sp>0.005) lista.push({nome:"", valor:totalAntigo-sp, pessoa:""});
      } else if (totalAntigo>0 || desc){
        lista.push({nome:desc, valor:totalAntigo, pessoa:""});
      }
    }
    var somaPartes = partesMo.reduce(function(a,q){ return a+q.valor; }, 0);
    var totalMo = Math.max(mo, somaPartes);
    if (partesMo.length){
      lista.push({nome:"Mão de obra", valor:somaPartes, pessoa:"", split:partesMo});
      if (totalMo-somaPartes>0.005) lista.push({nome:"Mão de obra", valor:totalMo-somaPartes, pessoa:""});
    } else {
      lista.push({nome:"Mão de obra", valor:totalMo, pessoa:""});
    }
    row.outrosLista = lista;
    row.outros = fmtCampoNum(totalAntigo + totalMo);
    var nomes = lista.map(function(o){ return o.nome; }).filter(Boolean);
    if (nomes.length) row.outrosDescricao = nomes.join(", "); else delete row.outrosDescricao;
    delete row.outrosSplit;
    row.maoDeObra = "";
    delete row.maoDeObraSplit;
    return true;
  }
  function chavesDeVendas(){
    var keys = [];
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && (k.indexOf(K_ROWS)===0 || k.indexOf(K_NOVOS)===0) && k!==K_NOVOS_META) keys.push(k);
    }
    return keys;
  }
  function contarMaoDeObra(){
    var vendas = 0, valor = 0;
    chavesDeVendas().forEach(function(k){
      var rows = lsGetJSON(k, []);
      if (!Array.isArray(rows)) return;
      rows.forEach(function(r){
        var mo = parseNum(r && r.maoDeObra);
        if (mo>0 || (r && Array.isArray(r.maoDeObraSplit) && r.maoDeObraSplit.length)){ vendas++; valor += mo; }
      });
    });
    return {vendas:vendas, valor:valor};
  }
  function migrarMaoDeObraParaServico(){
    var vendas = 0, dias = 0;
    chavesDeVendas().forEach(function(k){
      var rows = lsGetJSON(k, []);
      if (!Array.isArray(rows)) return;
      var mudou = false;
      rows.forEach(function(r){ if (r && migrarLinhaMaoDeObra(r)){ mudou = true; vendas++; } });
      if (mudou){
        dias++;
        // grava direto (sem passar pela auditoria, para não lotar o histórico de edições) e envia para a nuvem
        localStorage.setItem(k, JSON.stringify(rows));
        try{ cloudPush(k, rows); }catch(e){}
      }
    });
    state.monthSummaryCache = {}; state.monthPartsCache = {};
    return {vendas:vendas, dias:dias};
  }


  // ======================= MIGRAÇÃO: Balanceamento → Serviço =======================
  function migrarLinhaBalanceamento(row){
    var v = parseNum(row.valorBalanceamento), q = parseNum(row.qtdBalanceamento);
    var mudou = false;
    // descontos que apontavam para o valor do balanceamento passam a apontar para Serviço
    if (Array.isArray(row.descontos)){
      row.descontos.forEach(function(d){ if (d && d.origem==="valorBalanceamento"){ d.origem = "outros"; mudou = true; } });
    }
    if (row.desconto && row.desconto.origem==="valorBalanceamento"){ row.desconto.origem = "outros"; mudou = true; }
    if (!(v>0) && !(q>0) && !mudou) return false;
    if (v>0){
      var totalAntigo = parseNum(row.outros), lista;
      if (Array.isArray(row.outrosLista) && row.outrosLista.length){
        lista = row.outrosLista.slice();
      } else {
        lista = [];
        var desc = row.outrosDescricao ? String(row.outrosDescricao).trim() : "";
        if (Array.isArray(row.outrosSplit) && row.outrosSplit.length){
          var pp = row.outrosSplit.filter(function(x){ return parseNum(x.valor)>0; }).map(function(x){ return {pessoa:x.pessoa, valor:parseNum(x.valor)}; });
          var sp = pp.reduce(function(a,x){ return a+x.valor; }, 0);
          if (pp.length) lista.push({nome:desc, valor:sp, pessoa:"", split:pp});
          if (totalAntigo-sp>0.005) lista.push({nome:"", valor:totalAntigo-sp, pessoa:""});
        } else if (totalAntigo>0 || desc){
          lista.push({nome:desc, valor:totalAntigo, pessoa:""});
        }
      }
      lista.push({nome: q>1 ? "Balanceamento ("+q+")" : "Balanceamento", valor:v, pessoa:""});
      row.outrosLista = lista;
      row.outros = fmtCampoNum(totalAntigo + v);
      var nomes = lista.map(function(o){ return o.nome; }).filter(Boolean);
      if (nomes.length) row.outrosDescricao = nomes.join(", "); else delete row.outrosDescricao;
      delete row.outrosSplit;
    }
    row.valorBalanceamento = "";
    row.qtdBalanceamento = "0";
    return true;
  }
  function contarBalanceamento(){
    var vendas = 0, valor = 0;
    chavesDeVendas().forEach(function(k){
      var rows = lsGetJSON(k, []);
      if (!Array.isArray(rows)) return;
      rows.forEach(function(r){
        if (r && (parseNum(r.valorBalanceamento)>0 || parseNum(r.qtdBalanceamento)>0)){ vendas++; valor += parseNum(r.valorBalanceamento); }
      });
    });
    return {vendas:vendas, valor:valor};
  }
  function migrarBalanceamentoParaServico(){
    var vendas = 0, dias = 0;
    chavesDeVendas().forEach(function(k){
      var rows = lsGetJSON(k, []);
      if (!Array.isArray(rows)) return;
      var mudou = false;
      rows.forEach(function(r){ if (r && migrarLinhaBalanceamento(r)){ mudou = true; vendas++; } });
      if (mudou){
        dias++;
        localStorage.setItem(k, JSON.stringify(rows));
        try{ cloudPush(k, rows); }catch(e){}
      }
    });
    state.monthSummaryCache = {}; state.monthPartsCache = {};
    return {vendas:vendas, dias:dias};
  }
  // roda sozinho ao abrir o app: se sobrou algo em Balanceamento, guarda um backup e leva para Serviço
  function migrarBalanceamentoAuto(done){
    var c;
    try{ c = contarBalanceamento(); }catch(e){ done(); return; }
    if (!c.vendas){ done(); return; }
    var fim = function(){
      try{ migrarBalanceamentoParaServico(); }catch(e){}
      done();
    };
    try{ makeSnapshot("Antes de migrar Balanceamento para Serviço", "pre-bal-"+Date.now()).catch(function(){}).then(fim); }
    catch(e){ fim(); }
  }

  // ======================= RELATÓRIO DO MÊS (por pessoa e por tipo de serviço) =======================
  function itensServicoDe(r){
    // devolve [{pessoa, valor}] com tudo que foi lançado como serviço/mão de obra nesta venda
    var out = [];
    var lista = Array.isArray(r.outrosLista) && r.outrosLista.length ? r.outrosLista : (Array.isArray(r.outrosSplit) ? r.outrosSplit : []);
    lista.forEach(function(o){
      var partes = Array.isArray(o.split) && o.split.length ? o.split : [o];
      partes.forEach(function(q){ var v = parseNum(q.valor); if (v>0) out.push({pessoa:q.pessoa||"", valor:v}); });
    });
    if (Array.isArray(r.maoDeObraSplit)) r.maoDeObraSplit.forEach(function(q){ var v = parseNum(q.valor); if (v>0) out.push({pessoa:q.pessoa||"", valor:v}); });
    return out;
  }
  function vendasDoMes(month){
    var semi = [];
    listAllDates().forEach(function(d){
      if (d.slice(0,7)!==month) return;
      rowsOfDay(d).forEach(function(r){ semi.push({date:d, r:r}); });
    });
    semi.sort(function(a,b){ return a.date<b.date ? -1 : (a.date>b.date ? 1 : 0); });
    var novos = [];
    try{ novos = loadNovosMonth(month).filter(function(n){ return !isBlankNovo(n); }); }catch(e){}
    return {semi:semi, novos:novos};
  }
  function relatorioDoMes(month){
    var v = vendasDoMes(month);
    var todas = v.semi.map(function(x){ return x.r; }).concat(v.novos);
    var sv = servicosTotais(todas);
    var pessoas = {}; MAODEOBRA_PESSOAS.forEach(function(p){ pessoas[p] = {valor:0, itens:0}; });
    var semPessoa = 0, totalServ = 0;
    todas.forEach(function(r){
      totalServ += parseNum(r.outros) + parseNum(r.maoDeObra);
      var atribuido = 0;
      itensServicoDe(r).forEach(function(it){
        if (pessoas[it.pessoa]){ pessoas[it.pessoa].valor += it.valor; pessoas[it.pessoa].itens++; atribuido += it.valor; }
      });
    });
    var somaPessoas = 0; MAODEOBRA_PESSOAS.forEach(function(p){ somaPessoas += pessoas[p].valor; });
    semPessoa = Math.max(0, totalServ - somaPessoas);
    var totalSemi = 0; v.semi.forEach(function(x){ totalSemi += computeValor(x.r); });
    return {v:v, sv:sv, pessoas:pessoas, semPessoa:semPessoa, totalServ:totalServ, totalSemi:totalSemi, qtdSemi:v.semi.length, qtdNovos:v.novos.length};
  }

  function n2(v){ return (v||0).toFixed(2).replace(".",","); }
  function exportarMesCSV(month){
    var rel = relatorioDoMes(month);
    var cab = ["Data","Carro","Cliente","Medida","Qtd. pneus","Alinhamento","Bicos","Cambagem","Rodas","Peças","Serviço","Serviço Renan","Serviço João","Serviço Wesley","Valor dos pneus","Desconto","Total","Forma de pagamento","Pago","Vendedor"];

        n2(parseNum(r.valorPneus)), n2(descontoValor(r)), n2(computeValor(r)), r.formaPagamento||"", (r.pago==="✅"?"Pago":"Pendente"),

    linhas.push("");

     ["Cambagem (com serviço do Renan)",sv.qtdCambagem,sv.totalCambagem],["Rodas (com serviço do João)",sv.qtdRodas,sv.totalRodas],["Peças","",sv.valorPecas]]
      .forEach(function(x){ linhas.push([x[0], x[1], n2(x[2])].map(csvEscape).join(";")); });
    downloadTextFile("vendas-"+month+".csv", linhas.join("\r\n"));
  }

  // ======================= AVISO DE PAGAMENTO / ENTER =======================
  function pagamentoAviso(row, valor){
    if (!(valor>0)) return "";
    var fp = row.formaPagamento || "Nenhum";
    if (row.pago==="✅" && (fp==="Nenhum" || fp==="")) return "Venda marcada como paga, mas sem forma de pagamento.";
    if (fp.indexOf("Múltiplo")===0){
      var soma = 0;
      (Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos : []).forEach(function(p){ if (p) soma += Math.max(0, parseNum(p.valor)); });
      if (Math.abs(soma-valor)>0.005) return "Os pagamentos múltiplos somam "+fmtCurrency(soma)+", mas a venda vale "+fmtCurrency(valor)+".";
    }
    return "";
  }
