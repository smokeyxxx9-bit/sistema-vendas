<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Oficina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  /* ---- estoque ---- */
  .est-zero{color:#e2554c;}
  .medida-btn{
    width:100%;height:100%;background:transparent;border:none;color:inherit;
    text-align:left;font-size:12.5px;padding:0 8px;color:#647079;
  }
  .medida-btn.has{color:#eef1f3;}
  .medida-btn:hover:not(:disabled){color:#f5b700;}
  .medida-btn:disabled{cursor:default;}
  .est-actions{display:flex;gap:4px;align-items:center;}
  :root{
    --bg:#14181c;
    --panel:#1c2227;
    --panel-alt:#232a30;
    --border:#333d46;
    --border-soft:#2a323a;
    --text:#eef1f3;
    --text-dim:#98a3ad;
    --text-faint:#647079;
    --yellow:#f5b700;
    --yellow-dim:#8a6a12;
    --teal:#3ac7c1;
    --red:#e2554c;
    --green:#4fae6c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  ::selection{background:var(--yellow);color:#1c1c1c;}

  #app{max-width:1180px;margin:0 auto;padding:20px 20px 80px;}
  #app.wide{max-width:none;padding-left:16px;padding-right:16px;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 2px 22px;border-bottom:1px solid var(--border-soft);margin-bottom:24px;
  }
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand .mark{
    width:11px;height:11px;background:var(--yellow);
    display:inline-block;transform:rotate(45deg);
  }
  .brand h1{font-size:22px;color:var(--text);}
  .brand span.tag{color:var(--text-faint);font-size:12.5px;font-family:'IBM Plex Mono',monospace;}
  .sync-badge{font-size:10px;padding:3px 9px;border-radius:20px;border:1px solid var(--border-soft);color:var(--text-faint);margin-left:10px;letter-spacing:.03em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;}
  .sync-badge.on{color:var(--green);border-color:var(--green);}
  .sync-badge.connecting{color:var(--yellow);border-color:var(--yellow);}
  .sync-badge.error{color:var(--red);border-color:var(--red);}
  .auth-zone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;}
  .pill{
    font-size:12.5px;padding:6px 12px;border:1px solid var(--border);border-radius:3px;
    color:var(--text-dim);display:flex;align-items:center;gap:6px;
  }
  .pill.on{border-color:var(--green);color:var(--green);}
  .btn{
    border:1px solid var(--border);background:var(--panel-alt);color:var(--text);
    padding:8px 14px;border-radius:3px;font-size:13.5px;font-weight:500;
    transition:border-color .15s, background .15s;cursor:pointer;display:inline-flex;align-items:center;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1a1500;font-weight:600;}
  .btn.primary:hover{background:#ffc61f;}
  .btn.ghost{background:transparent;}
  .btn.danger{border-color:var(--red);color:var(--red);background:transparent;}
  .btn.small{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---- dashboard hero ---- */
  .hero{
    display:grid;grid-template-columns:1.1fr 1.4fr;gap:0;
    border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:18px;
  }
  @media(max-width:820px){.hero{grid-template-columns:1fr;}}
  .hero-left{
    background:var(--panel);padding:26px 28px;display:flex;flex-direction:column;justify-content:center;
    border-right:1px solid var(--border-soft);
  }
  .month-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .month-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;font-size:14px;line-height:1;
  }
  .month-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .month-nav button.hide-vals-btn{
    width:auto;height:auto;margin-left:4px;padding:5px 10px;font-size:12px;line-height:1.2;
  }
  .month-nav .label{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--text-dim);text-transform:capitalize;}
  .big-total{font-size:44px;color:var(--text);line-height:1;margin-bottom:6px;}
  .big-total .cents{font-size:24px;color:var(--text-faint);}
  .hero-left .sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
  .goal-row{margin-bottom:14px;}
  .goal-row:last-child{margin-bottom:0;}
  .goal-row .goal-label{
    display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:5px;
  }
  .goal-label b{color:var(--text);font-weight:600;}
  .goal-track{height:7px;background:var(--border-soft);border-radius:99px;overflow:hidden;}
  .goal-fill{height:100%;border-radius:99px;background:var(--teal);transition:width .5s ease;}
  .goal-fill.reached{background:var(--green);}

  .hero-right{background:var(--panel-alt);padding:22px 26px 14px;}
  .hero-right h2{font-size:13px;color:var(--text-dim);font-weight:500;text-transform:none;margin-bottom:14px;font-family:'IBM Plex Sans',sans-serif;}
  .chart-wrap{width:100%;}
  .chart-wrap svg{width:100%;height:auto;display:block;overflow:visible;}
  .chart-empty{color:var(--text-faint);font-size:13px;padding:40px 0;text-align:center;}

  /* ---- secondary row ---- */
  .daily-target-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .daily-target{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  @media(max-width:600px){.daily-target{grid-template-columns:1fr;}}
  .dt-card{
    background:linear-gradient(180deg,var(--panel-alt),var(--panel));
    border:1px solid var(--border-soft);border-left:3px solid var(--yellow);border-radius:6px;
    padding:16px 18px;
  }
  .dt-card.dt-done{border-left-color:var(--green);}
  .dt-card.dt-closed{border-left-color:var(--text-faint);}
  .dt-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;}
  .dt-value{font-size:25px;color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .dt-value .dt-unit{font-size:13px;color:var(--text-faint);margin-left:5px;font-family:'IBM Plex Sans',sans-serif;}
  .dt-card.dt-done .dt-value{color:var(--green);font-size:19px;font-family:'IBM Plex Sans',sans-serif;font-weight:600;}
  .dt-sub{font-size:12px;color:var(--text-dim);margin-top:8px;}

  .parts-visor-head{margin:0 2px 8px;font-size:13px;color:var(--text-dim);}
  .parts-visor{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
  @media(max-width:820px){.parts-visor{grid-template-columns:1fr 1fr;}}
  @media(max-width:520px){.parts-visor{grid-template-columns:1fr;}}
  .parts-card{
    background:var(--panel);border:1px solid var(--border-soft);border-left:3px solid var(--border-soft);
    border-radius:6px;padding:16px 18px;
  }
  .parts-card.pc-teal{border-left-color:var(--teal);}
  .parts-card.pc-yellow{border-left-color:var(--yellow);}
  .parts-card.pc-green{border-left-color:var(--green);}
  .parts-card .pc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px;}
  .parts-card .pc-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
  .parts-card .pc-qty{font-size:11.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  .parts-card .pc-value{font-size:23px;color:var(--text);font-family:'IBM Plex Mono',monospace;line-height:1;}
  .parts-card.pc-teal .pc-value{color:var(--teal);}
  .parts-card.pc-yellow .pc-value{color:var(--yellow);}
  .parts-card.pc-green .pc-value{color:var(--green);}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  @media(max-width:820px){.row2{grid-template-columns:1fr;}}
  .card{border:1px solid var(--border-soft);border-radius:4px;background:var(--panel);padding:20px 22px;}
  .card h3{font-size:13px;color:var(--text-dim);font-weight:500;margin-bottom:12px;font-family:'IBM Plex Sans',sans-serif;}
  .yesterday-total{font-size:26px;color:var(--text);margin-bottom:2px;}
  .yesterday-meta{font-size:12.5px;color:var(--text-faint);margin-bottom:14px;}
  .today-card{display:flex;flex-direction:column;justify-content:space-between;}
  .today-card .date-big{font-size:26px;color:var(--text);text-transform:capitalize;margin-bottom:2px;}
  .today-card .date-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:16px;}

  /* ---- archive ---- */
  .archive-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 10px;}
  .archive-head h2{font-size:15px;color:var(--text);}
  .archive-head .hint{font-size:12px;color:var(--text-faint);}
  .archive-list{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;max-height:360px;overflow-y:auto;}
  .arow{
    display:flex;align-items:center;justify-content:space-between;padding:11px 16px;
    border-bottom:1px solid var(--border-soft);background:var(--panel);font-size:13.5px;
  }
  .arow:last-child{border-bottom:none;}
  .arow:hover{background:var(--panel-alt);}
  .arow .d{color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:12.5px;min-width:90px;}
  .arow .stats{display:flex;gap:18px;color:var(--text-dim);font-size:12.5px;}
  .arow .stats b{color:var(--text);}
  .arow-empty{padding:26px;text-align:center;color:var(--text-faint);font-size:13px;}

  /* ---- table screen ---- */
  .tbl-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .tbl-head-left{display:flex;align-items:center;gap:12px;}
  .day-nav{display:flex;align-items:center;gap:6px;}
  .day-nav button{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    width:26px;height:26px;border-radius:3px;
  }
  .day-nav button:hover{border-color:var(--yellow);color:var(--yellow);}
  .tbl-head h2{font-size:19px;text-transform:capitalize;}
  .save-flag{font-size:11.5px;color:var(--green);opacity:0;transition:opacity .3s;font-family:'IBM Plex Mono',monospace;}
  .save-flag.show{opacity:1;}

  .totals-bar{
    display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border-soft);border-radius:4px;
    background:var(--panel);margin-bottom:14px;overflow:hidden;
  }
  .tstat{padding:12px 18px;border-right:1px solid var(--border-soft);min-width:120px;}
  .tstat:last-child{border-right:none;}
  .tstat .k{font-size:10.5px;color:var(--text-faint);margin-bottom:4px;}
  .tstat .v{font-size:15px;color:var(--text);font-family:'IBM Plex Mono',monospace;}
  .tstat .v.accent{color:var(--yellow);}

  .sticky-head-block{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:6px;}

  /* ---- orçamento ---- */
  .orc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .orc-field label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em;}
  .orc-field input,.orc-field select,.orc-field textarea{
    width:100%;background:var(--panel-alt);border:1px solid var(--border-soft);color:var(--text);
    border-radius:4px;padding:9px 10px;font-size:13.5px;font-family:inherit;
  }
  .orc-field textarea{min-height:64px;resize:vertical;}
  .orc-field input:focus,.orc-field select:focus,.orc-field textarea:focus{outline:none;border-color:var(--yellow);}
  .orc-items{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;margin-bottom:12px;}
  .orc-item{display:grid;grid-template-columns:1fr 80px 120px 120px 36px;gap:8px;align-items:center;
    padding:8px 10px;border-bottom:1px solid var(--border-soft);}
  .orc-item:last-child{border-bottom:none;}
  .orc-item.head{background:var(--panel-alt);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);}
  .orc-item input{width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    border-radius:3px;padding:6px 6px;font-size:13.5px;font-family:inherit;}
  .orc-item input:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .orc-item .tot{font-size:13.5px;text-align:right;color:var(--text-dim);}
  .orc-total{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;margin:6px 2px 18px;}
  .orc-total .lbl{font-size:12px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.04em;}
  .orc-total .val{font-size:22px;font-weight:bold;color:var(--yellow);}
  @media (max-width:760px){
    .orc-grid{grid-template-columns:1fr;}
    .orc-item{grid-template-columns:1fr 60px 92px 36px;}
    .orc-item .tot{display:none;}
  }
  .sticky-head-block .tbl-head{margin-bottom:12px;}
  .sticky-head-block .tbl-toolbar{margin:0 0 10px;}
  .grid-scroll-head{border:1px solid var(--border-soft);border-radius:4px 4px 0 0;border-bottom:none;overflow:hidden;background:var(--panel-alt);}
  .grid-scroll-head .grid-row.head{border-bottom:none;}

  .grid-scroll{border:1px solid var(--border-soft);border-radius:0 0 4px 4px;overflow:hidden;background:var(--panel);}
  #gridInner{transform-origin:top left;}
  .grid-row{display:grid;align-items:stretch;}
  .grid-row.head{
    background:var(--panel-alt);
    border-bottom:1px solid var(--border);
  }
  .grid-row.head .cell{
    font-size:10.5px;color:var(--text-dim);font-weight:500;padding:10px 8px;
    border-right:1px solid var(--border-soft);display:flex;align-items:center;line-height:1.25;
  }
  .grid-row.data{border-bottom:1px solid var(--border-soft);}
  .grid-row.data:hover{background:rgba(255,255,255,.015);}
  .grid-row .cell{
    padding:6px 8px;border-right:1px solid var(--border-soft);display:flex;align-items:center;
  }
  .grid-row .cell:last-child, .grid-row.head .cell:last-child{border-right:none;}
  .grid-row.head .head-actions-cell{padding:6px 8px;justify-content:center;}
  .head-actions-cell .btn{width:100%;justify-content:center;white-space:nowrap;}
  .cellval{
    width:100%;background:transparent;border:1px solid transparent;color:var(--text);
    font-size:13px;padding:6px 6px;border-radius:3px;
  }
  .cellval:focus{outline:none;border-color:var(--yellow);background:var(--panel-alt);}
  .cellval:disabled{color:var(--text-dim);}
  select.cellval{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2398a3ad'/></svg>");background-repeat:no-repeat;background-position:right 6px center;padding-right:18px;}
  select.cellval:disabled{background-image:none;}
  .cellval.computed{color:var(--yellow);font-family:'IBM Plex Mono',monospace;font-weight:500;background:transparent;border-color:transparent;}
  .rowactions{display:flex;align-items:center;justify-content:center;gap:4px;}
  .icon-btn{
    width:24px;height:24px;border-radius:3px;border:1px solid var(--border);background:transparent;
    color:var(--text-faint);font-size:13px;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .icon-btn.print-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.wa-btn:hover{border-color:var(--green);color:var(--green);}
  .icon-btn.cli-btn.has{border-color:var(--teal);color:var(--teal);}
  .icon-btn.cli-btn:hover{border-color:var(--teal);color:var(--teal);}
  .icon-btn.dup-btn:hover{border-color:var(--yellow);color:var(--yellow);}

  /* linha com quantidade x valor que não bate (ex: 3 bicos mas R$ 0,00) */
  .cell.cell-warn{box-shadow:inset 0 0 0 1.5px var(--yellow);background:rgba(245,183,0,.08);border-radius:3px;}

  /* barra com os filtros/atalhos acima da tabela do dia */
  .tbl-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:-6px 0 14px;}
  .count-badge{display:inline-block;background:rgba(0,0,0,.25);border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px;}

  /* toast de "linha apagada — desfazer" */
  .undo-toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;
    background:#20262c;border:1px solid var(--border);color:var(--text);
    padding:10px 10px 10px 16px;border-radius:8px;display:flex;align-items:center;gap:14px;
    font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  .undo-toast .undo-btn{
    background:var(--yellow);color:#1a1500;border:none;border-radius:5px;
    padding:6px 12px;font-size:12.5px;font-weight:600;
  }

  .detail-toggle-row{grid-column:1/-1;padding:0;background:var(--panel-alt);}
  .detail-toggle{
    width:100%;background:transparent;border:none;border-top:1px solid var(--border-soft);
    color:var(--text-faint);font-size:11px;padding:4px 12px;text-align:left;
    display:flex;align-items:center;gap:6px;
  }
  .detail-toggle:hover{color:var(--yellow);}
  .detail-toggle .car{transition:transform .15s;display:inline-block;}
  .detail-toggle.open .car{transform:rotate(90deg);}
  .detail-box{grid-column:1/-1;padding:12px 16px 16px;background:var(--panel-alt);border-top:1px solid var(--border-soft);}
  .detail-box label{display:block;font-size:11px;color:var(--text-faint);margin-bottom:6px;}
  .detail-box textarea{
    width:100%;min-height:64px;background:var(--panel);border:1px solid var(--border);border-radius:3px;
    color:var(--text);padding:8px 10px;font-size:13px;resize:vertical;
  }
  .detail-box textarea:focus{outline:none;border-color:var(--yellow);}

  .tbl-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .empty-state{padding:44px 20px;text-align:center;color:var(--text-faint);}
  .empty-state p{margin-bottom:14px;font-size:13.5px;}

  /* ---- modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(10,12,14,.7);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal{
    background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:24px 26px;width:100%;max-width:340px;
  }
  .modal.wide{max-width:440px;}
  .modal h3{font-size:15px;margin-bottom:6px;}
  .modal p{font-size:12.5px;color:var(--text-dim);margin:0 0 16px;line-height:1.5;}
  .modal input{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);border-radius:3px;color:var(--text);
    padding:10px 12px;font-size:14px;margin-bottom:10px;letter-spacing:2px;
  }
  .modal .field-group input{letter-spacing:normal;margin-bottom:12px;}
  .modal input.search-input{letter-spacing:normal;}
  .modal .field-group label{display:block;font-size:11.5px;color:var(--text-faint);margin:0 0 5px;}
  .modal input:focus{outline:none;border-color:var(--yellow);}
  .modal .err{color:var(--red);font-size:12px;margin:-4px 0 10px;min-height:14px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .cust-list{max-height:280px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:4px;margin-bottom:4px;}
  .cust-item{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    background:transparent;border:none;border-bottom:1px solid var(--border-soft);color:var(--text);
    padding:10px 12px;font-size:13px;
  }
  .cust-item:last-child{border-bottom:none;}
  .cust-item:hover{background:var(--panel-alt);}
  .cust-item.sel{background:var(--panel-alt);border-left:3px solid var(--yellow);padding-left:9px;}
  .cust-name{color:var(--text);font-weight:500;}

  // envia uma chave (já salva localmente) para a tabela kv_store no Supabase
  function cloudPush(key, value){
    if (!sb) return;
    sb.from("kv_store").upsert({key:key, value:value, updated_at:new Date().toISOString()})
      .then(function(res){
        if (res && res.error){ cloudStatus = "error"; console.error("Erro ao sincronizar", key, res.error); }
        else {
          // esta alteração vai voltar pra nós mesmos pelo canal em tempo real daqui a pouco;
          // marcamos que esperamos esse "eco" pra não tratá-lo como mudança de outro aparelho
          pendingEchoKeys[key] = (pendingEchoKeys[key]||0) + 1;
          if (cloudStatus!=="on"){ cloudStatus = "on"; refreshSyncBadge(); }
        }
      });
  }

  // baixa tudo da nuvem e grava no localStorage (usado ao abrir o app)
  // cb recebe true se a nuvem já tinha dados, false se estava vazia
  function cloudPullAll(cb){
    if (!sb) return cb(false);
    sb.from("kv_store").select("key,value").then(function(res){
      var hadData = false;
      if (res && !res.error && res.data){
        hadData = res.data.length>0;
        res.data.forEach(function(row){
          try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        });
        cloudStatus = "on";
      } else {
        cloudStatus = "error";
        if (res && res.error) console.error("Erro ao baixar dados da nuvem", res.error);
      }
      cb(hadData);
    }).catch(function(err){ cloudStatus = "error"; console.error(err); cb(false); });
  }

  // envia TUDO que já está salvo neste navegador pra nuvem de uma vez
  // (usado na primeira ativação, e também pelo botão manual "Enviar pra nuvem")
  function pushAllLocalToCloud(){
    if (!sb) return 0;
    var n = 0;
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (!k || k.indexOf("vo_")!==0 || k===K_AUTOBACKUP) continue;
      try{
        var val = JSON.parse(localStorage.getItem(k));
        cloudPush(k, val);
        n++;
      }catch(e){ /* ignora chave que não seja JSON válido */ }
    }
    return n;
  }

  // escuta mudanças feitas em OUTROS aparelhos e atualiza a tela na hora
  function initCloudSync(onRemoteChange){
    if (!sb) return;
    sb.channel("kv_store_changes")
      .on("postgres_changes", {event:"*", schema:"public", table:"kv_store"}, function(payload){
        var row = payload.new;
        if (!row || !row.key) return;
        try{ localStorage.setItem(row.key, JSON.stringify(row.value)); }catch(e){}
        if (pendingEchoKeys[row.key] > 0){
          // é só o eco da nossa própria digitação/salvamento — os dados já estão certos localmente,
          // então não precisamos redesenhar a tela (isso é o que tirava o foco de quem estava digitando)
          pendingEchoKeys[row.key]--;
          return;
        }
        onRemoteChange(row.key);
      })
      .subscribe(function(status){
        if (status==="SUBSCRIBED"){ cloudStatus = "on"; refreshSyncBadge(); }
      });
  }

  }

  function computeValor(row){
    return parseNum(row.alinhamento)+parseNum(row.valorBicos)+parseNum(row.valorCambagem)+
           parseNum(row.valorBalanceamento)+parseNum(row.valorRodas)+parseNum(row.outros)+
           parseNum(row.valorPecas)+parseNum(row.maoDeObra)+parseNum(row.valorPneus);
  }
  // divide o valor da linha entre as formas de pagamento reais (Dinheiro/Pix/Débito/Crédito).
  // quando a forma escolhida é combinada (ex: "Débito/Crédito"), usa o valor manual definido
  // em row.splitValor pra primeira forma listada; se não foi definido, divide meio a meio.
  function paymentBreakdown(row){
    var buckets = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    var fp = row.formaPagamento;
    var total = computeValor(row);
    if (!fp || fp==="Nenhum" || total===0) return buckets;
    if (fp.indexOf("Múltiplo")===0){
      var lista = Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos : [];
      lista.forEach(function(p){
        if (p && p.metodo && buckets.hasOwnProperty(p.metodo)){
          buckets[p.metodo] += Math.max(0, parseNum(p.valor));
        }
      });
      return buckets;
    }
    if (fp.indexOf("/")===-1){
      if (buckets.hasOwnProperty(fp)) buckets[fp] = total;
      return buckets;
    }
    var parts = fp.split("/");
    var first = parts[0], second = parts[1];
    var firstVal = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="")
      ? Math.max(0, Math.min(parseNum(row.splitValor), total))
      : total/2;
    var secondVal = total - firstVal;
    if (buckets.hasOwnProperty(first)) buckets[first] += firstVal;
    if (buckets.hasOwnProperty(second)) buckets[second] += secondVal;
    return buckets;
  }
  function saveRows(date, rows){
    var ok1 = lsSetJSON(K_ROWS+date, rows);
    var month = date.slice(0,7);
    var summary = lsGetJSON(K_SUMMARY+month, {});
    var total = 0;
    for (var i=0;i<rows.length;i++) total += computeValor(rows[i]);
    summary[date] = {total: total, count: rows.length};
    var ok2 = lsSetJSON(K_SUMMARY+month, summary);
    if (!ok1 || !ok2){
      return Promise.reject(new Error("Não foi possível salvar — armazenamento do navegador cheio ou bloqueado."));
    }
    return Promise.resolve();
  }

      list2.splice(Math.min(idx,list2.length), 0, item);
      saveEstoque(list2);
      onDone();
    });
  }
  // movimenta o estoque de um item: delta positivo entra, negativo sai.
  // nunca deixa negativo — se faltar, para no 0. devolve quanto realmente mexeu.
  function moveEstoque(id, delta){
    if (!id || !delta) return 0;
    var list = loadEstoque();
    var moved = 0;
    for (var i=0;i<list.length;i++){
      if (list[i].id===id){
        var atual = Math.max(0, parseNum(list[i].quantidade));
        var novo = atual + delta;
        if (novo < 0) novo = 0;
        moved = novo - atual;
        list[i].quantidade = novo;
        break;
      }
    }
    if (moved !== 0) saveEstoque(list);
    return moved;
  }
  // acerta a baixa de estoque de uma linha de venda conforme a medida e a quantidade escolhidas
  function syncRowEstoque(row){
    var desejada = row.medidaId ? Math.max(0, parseNum(row.quantidade)) : 0;
    var jaBaixado = Math.max(0, parseNum(row.medidaBaixa));
    var delta = desejada - jaBaixado;
    if (delta === 0) return;
    var moved = moveEstoque(row.medidaId, -delta);
    row.medidaBaixa = jaBaixado - moved; // moved vem negativo quando saiu do estoque
  }
  // devolve pro estoque tudo que essa linha já havia baixado
  function releaseRowEstoque(row){
    var jaBaixado = Math.max(0, parseNum(row.medidaBaixa));
    if (row.medidaId && jaBaixado>0) moveEstoque(row.medidaId, jaBaixado);
    row.medidaBaixa = 0;
  }

  // ---------- gerar o PDF da nota (mesmo layout da impressão) ----------
  function renderNotaToCanvas(nota, cb){
    var full = buildNotaHtml(nota);
    var styleMatch = full.match(/<style>[\s\S]*?<\/style>/);
    var bodyMatch = full.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    var container = document.createElement("div");
    container.style.position = "fixed";
    container.style.left = "-10000px";
    container.style.top = "0";
    container.style.width = "780px";
    container.style.background = "#ffffff";
    container.innerHTML = (styleMatch?styleMatch[0]:"") + (bodyMatch?bodyMatch[1]:full);
    document.body.appendChild(container);
    window.html2canvas(container, {scale:2, backgroundColor:"#ffffff"}).then(function(canvas){
      document.body.removeChild(container);
      cb(canvas);
    }).catch(function(err){
      document.body.removeChild(container);
      console.error("Erro ao gerar PDF", err);
      cb(null);
    });
  }
  function canvasToPdfBlob(canvas){
    var imgData = canvas.toDataURL("image/jpeg", 0.92);
    var pdf = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
    var pageWidth = pdf.internal.pageSize.getWidth();
    var pageHeight = pdf.internal.pageSize.getHeight();
    var imgWidth = pageWidth;
    var imgHeight = canvas.height * (imgWidth/canvas.width);
    var heightLeft = imgHeight;
    var position = 0;
    pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "JPEG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    return pdf.output("blob");
  }

  // ---------- enviar o PDF da nota por WhatsApp ----------
  function sendNotaPdfWhatsapp(row, customer){
    if (!window.html2canvas || !window.jspdf){
      alert("As bibliotecas de PDF ainda estão carregando (ou não carregaram por falta de internet). Tente novamente em alguns segundos.");
      return;
    }
    var vendaNum = nextVendaNumber();
    var nota = {
      id: uid(), vendaNum: vendaNum, date: state.date, rowId: row.id, customerId: customer.id,
      customer: {
        nome: customer.nome||"", tipoDocumento: (customer.tipoDocumento||"cpf"), documento: (customer.documento||customer.cpf||""), email: customer.email||"",
        telefone: customer.telefone||"", endereco: customer.endereco||""
      },
      items: buildNotaItems(row),
      totalProdutos: computeValor(row),
      formaPagamento: row.formaPagamento||"",
      pagamentosMultiplos: Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos : null,
      splitValor: (row.splitValor!==undefined ? row.splitValor : null),
      pago: row.pago||"",
      createdAt: Date.now()
    };
    addNota(nota);

    renderNotaToCanvas(nota, function(canvas){
      if (!canvas){ alert("Não foi possível gerar o PDF da nota."); return; }
      var blob = canvasToPdfBlob(canvas);
      var fileName = "nota-venda-"+nota.vendaNum+".pdf";
      var caption = "Olá"+(customer.nome?" "+customer.nome:"")+"! Segue em anexo a nota da sua compra na "+EMPRESA.nome+".";
      var phoneDigits = String(customer.telefone||"").replace(/\D/g,"");
      var phone = phoneDigits ? (phoneDigits.length<=11 ? "55"+phoneDigits : phoneDigits) : "";

      var file;
      try{ file = new File([blob], fileName, {type:"application/pdf"}); }catch(e){ file = null; }

      if (file && navigator.canShare && navigator.canShare({files:[file]})){
        // celular/navegador com suporte: abre a folha de compartilhar nativa,
        // já com o PDF anexado — o usuário só escolhe o WhatsApp na lista.
        navigator.share({files:[file], title:fileName, text:caption}).catch(function(){ /* usuário cancelou — sem problema */ });
      } else {
        // fallback (principalmente desktop): baixa o PDF e abre o WhatsApp
        // com a mensagem, pedindo pra anexar o arquivo que acabou de baixar.
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = fileName;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        var waMsg = caption + " (o PDF foi baixado agora — é só anexar aqui no chat)";
        var waUrl = phone
          ? "https://wa.me/"+phone+"?text="+encodeURIComponent(waMsg)
          : "https://wa.me/?text="+encodeURIComponent(waMsg);
        window.open(waUrl, "_blank");
      }
    });
  }

  // ---------- backup / restauração ----------
  function exportBackup(auto){
    var data = {};
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && (k.indexOf(K_ROWS)===0 || k.indexOf(K_SUMMARY)===0 || k===K_CUSTOMERS || k===K_NOTAS)) data[k] = localStorage.getItem(k);
    }
    var now = new Date();
    var stamp = today+"-"+pad(now.getHours())+"h"+pad(now.getMinutes());
    var blob = new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "backup-vendas-"+stamp+(auto?"-auto":"")+".json";

  function autoBackupToStorage(){
    // backup silencioso: salva uma cópia dos dados dentro do próprio navegador,
    // sem baixar arquivo nenhum (evita o navegador pedindo permissão de download).
    var data = {};
    for (var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if (k && (k.indexOf(K_ROWS)===0 || k.indexOf(K_SUMMARY)===0 || k===K_CUSTOMERS || k===K_NOTAS)) data[k] = localStorage.getItem(k);
    }
    try{
      localStorage.setItem(K_AUTOBACKUP, JSON.stringify({ts:Date.now(), data:data}));
    }catch(e){ /* sem espaço — não é crítico, backup manual continua funcionando */ }
  }
  function importBackupFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        var n = 0;
        Object.keys(data).forEach(function(k){
          if (k.indexOf(K_ROWS)===0 || k.indexOf(K_SUMMARY)===0 || k===K_CUSTOMERS || k===K_NOTAS){ localStorage.setItem(k, data[k]); n++; }

        state.monthSummaryCache = {};
        state.monthPartsCache = {};
        alert(n+" registro(s) importado(s) com sucesso.");
        render();
      }catch(e){
        alert("Não foi possível ler esse arquivo de backup.");
      }
    };
    reader.readAsText(file);
  }

  // ---------- utils ----------
  function parseNum(v){
    if (v===undefined||v===null||v==="") return 0;
    var n = parseFloat(String(v).replace(",", "."));
    return isNaN(n) ? 0 : n;
  }
  function fmtCurrency(n){
    return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function fromISO(s){ var p=s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function fmtDateBR(iso){ var p=iso.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function fmtDateTimeBR(isoDateTime){
    var d = new Date(isoDateTime);
    if (isNaN(d.getTime())) return "—";
    var dd = String(d.getDate()).padStart(2,"0");
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var yy = d.getFullYear();
    var hh = String(d.getHours()).padStart(2,"0");
    var mi = String(d.getMinutes()).padStart(2,"0");
    return dd+"/"+mm+"/"+yy+" às "+hh+":"+mi;
  }
  function daysInMonth(monthStr){ var p=monthStr.split("-"); return new Date(parseInt(p[0]), parseInt(p[1]), 0).getDate(); }
  function monthLabel(monthStr){
    var p=monthStr.split("-"); var d=new Date(parseInt(p[0]), parseInt(p[1])-1, 1);
    return d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  }
  function weekdayLabel(iso){
    return fromISO(iso).toLocaleDateString("pt-BR",{weekday:"long", day:"2-digit", month:"long"});
  }
  function addMonths(monthStr, delta){
    var p=monthStr.split("-"); var d=new Date(parseInt(p[0]), parseInt(p[1])-1+delta, 1);
    return d.getFullYear()+"-"+pad(d.getMonth()+1);
  }
  function addDays(iso, delta){
    var d=fromISO(iso); d.setDate(d.getDate()+delta); return toISO(d);
  }

  // ---------- feriados nacionais (não trabalhamos aos domingos nem feriados) ----------
  var nationalHolidaysCache = {};
  function easterISO(year){
    // algoritmo de Meeus/Jones/Butcher
    var a=year%19, b=Math.floor(year/100), c=year%100, d=Math.floor(b/4), e=b%4,
        f=Math.floor((b+8)/25), g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30,
        i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7, m=Math.floor((a+11*h+22*l)/451),
        month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1;
    return toISO(new Date(year, month-1, day));
  }
  function nationalHolidays(year){
    if (nationalHolidaysCache[year]) return nationalHolidaysCache[year];
    var easter = easterISO(year);
    var list = [
      year+"-01-01",              // confraternização universal
      addDays(easter, -48),       // carnaval (segunda)
      addDays(easter, -47),       // carnaval (terça)
      addDays(easter, -2),        // sexta-feira santa
      year+"-04-21",              // tiradentes
      year+"-05-01",              // dia do trabalho
      addDays(easter, 60),        // corpus christi
      year+"-09-07",              // independência
      year+"-10-12",              // n. sra. aparecida
      year+"-11-02",              // finados
      year+"-11-15",              // proclamação da república
      year+"-12-25"               // natal
    ];
    if (year>=2024) list.push(year+"-11-20"); // consciência negra (feriado nacional desde 2024)
    nationalHolidaysCache[year] = list;
    return list;
  }
  function isBusinessDay(iso){
    if (fromISO(iso).getDay()===0) return false; // domingo
    return nationalHolidays(parseInt(iso.slice(0,4),10)).indexOf(iso)===-1;
  }
  // conta dias úteis (sem domingo/feriado) de fromDay até o fim do mês
  function countBusinessDays(monthStr, fromDayInclusive){
    var nd = daysInMonth(monthStr);
    var count = 0;
    for (var day=fromDayInclusive; day<=nd; day++){
      if (isBusinessDay(monthStr+"-"+pad(day))) count++;
    }
    return count;
  }

  // ---------- encolhe a tabela para caber na largura da tela, sem scroll lateral ----------
  var fitRAF = null;
  function fitGridToWidth(){
    var wrap = document.querySelector(".grid-scroll");
    var inner = document.getElementById("gridInner");
    var headWrap = document.querySelector(".grid-scroll-head");
    var headRow = headWrap ? headWrap.querySelector(".grid-row.head") : null;
    if (!wrap || !inner) return;
    inner.style.transform = "none";
    wrap.style.height = "";
    if (headRow) headRow.style.transform = "none";
    if (headWrap) headWrap.style.height = "";

    var naturalWidth = Math.max(inner.scrollWidth, headRow ? headRow.scrollWidth : 0);
    var naturalHeight = inner.scrollHeight;
    var headNaturalHeight = headRow ? headRow.scrollHeight : 0;
    var available = wrap.clientWidth;
    var scale = available > 0 && naturalWidth > available ? (available / naturalWidth) : 1;
    if (scale < 1){
      inner.style.transform = "scale(" + scale + ")";
      wrap.style.height = Math.ceil(naturalHeight * scale) + "px";
      if (headRow){
        headRow.style.transform = "scale(" + scale + ")";
        headRow.style.transformOrigin = "top left";
        if (headWrap) headWrap.style.height = Math.ceil(headNaturalHeight * scale) + "px";
      }
    }
  }
  function scheduleFitGrid(){
    if (fitRAF) cancelAnimationFrame(fitRAF);
    fitRAF = requestAnimationFrame(fitGridToWidth);
  }

  // ---------- dashboard ----------
  function loadDashboardData(cb){
    var need = [];
    if (!state.monthSummaryCache[state.dashMonth]) need.push(state.dashMonth);
    var ym = yesterday.slice(0,7);
    if (!state.monthSummaryCache[ym]) need.push(ym);
    var jobs = need.map(function(m){ return getSummary(m).then(function(s){ state.monthSummaryCache[m]=s; }); });
    if (!state.monthPartsCache[state.dashMonth]){
      jobs.push(loadMonthParts(state.dashMonth).then(function(totals){ state.monthPartsCache[state.dashMonth]=totals; }));
    }
    if (jobs.length===0) return cb();
    Promise.all(jobs).then(cb);
  }

  // soma qtd./valor de bicos, cambagens e rodas em todos os dias lançados no mês
  function loadMonthParts(month){
    var dates = listAllDates().filter(function(d){ return d.slice(0,7)===month; });
    return Promise.all(dates.map(function(d){ return getRows(d); })).then(function(allRows){
      var t = {qtdBicos:0, valorBicos:0, qtdCambagem:0, valorCambagem:0, qtdRodas:0, valorRodas:0, porVendedor:{}};
      VENDEDORES.forEach(function(v){ if (v!=="Nenhum") t.porVendedor[v] = {count:0, total:0}; });
      allRows.forEach(function(rows){
        rows.forEach(function(r){
          t.qtdBicos += parseNum(r.qtdBicos);
          t.valorBicos += parseNum(r.valorBicos);
          t.qtdCambagem += parseNum(r.qtdCambagem);
          t.valorCambagem += parseNum(r.valorCambagem);
          t.qtdRodas += parseNum(r.qtdRodas);
          t.valorRodas += parseNum(r.valorRodas);
          var v = r.vendedor;
          if (v && t.porVendedor[v]){
            t.porVendedor[v].count += 1;
            t.porVendedor[v].total += computeValor(r);
          }
        });
      });
      return t;
    });
  }

      return getSummary(m).then(function(s){ state.monthSummaryCache[m]=s; });

  function buildChartSvg(points){
    if (points.every(function(p){return p.v===0;})){
      return '<div class="chart-empty">Sem lançamentos neste mês ainda.</div>';
    }
    var W = 720, H = 190, padL = 6, padR = 6, padT = 14, padB = 22;
    var maxV = Math.max.apply(null, points.map(function(p){return p.v;}));
    if (maxV<=0) maxV = 1;
    var stepX = (W-padL-padR) / Math.max(1, points.length-1);
    function xFor(i){ return padL + i*stepX; }
    function yFor(v){ return padT + (1 - v/maxV) * (H-padT-padB); }

    var linePts = points.map(function(p,i){ return xFor(i).toFixed(1)+","+yFor(p.v).toFixed(1); }).join(" ");
    var circles = points.map(function(p,i){
      var x=xFor(i).toFixed(1), y=yFor(p.v).toFixed(1);
      var r = p.v>0 ? 3.4 : 2;
      var fill = p.v>0 ? "var(--teal)" : "var(--border)";
      return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+fill+'"><title>Dia '+p.day+': '+fmtCurrency(p.v)+'</title></circle>';
    }).join("");
    var labelEvery = points.length>20 ? 5 : (points.length>10?2:1);
    var labels = points.map(function(p,i){
      if (p.day % labelEvery !== 0 && p.day!==1 && p.day!==points.length) return "";
      return '<text x="'+xFor(i).toFixed(1)+'" y="'+(H-6)+'" font-size="8.5" fill="var(--text-faint)" text-anchor="middle" font-family="IBM Plex Mono, monospace">'+p.day+'</text>';
    }).join("");

    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+(W-padR)+'" y2="'+(H-padB)+'" stroke="var(--border-soft)" stroke-width="1"/>'+
      '<polyline points="'+linePts+'" fill="none" stroke="var(--teal)" stroke-width="1.6" opacity="0.85"/>'+
      circles + labels +
      '</svg>';
  }

          if (r.error){ alert("Não foi possível salvar o cargo: "+r.error.message); }
          else { state.usuariosList = null; render(); }
        });
      });

    else if (act==="nextmonth"){ state.dashMonth = addMonths(state.dashMonth,1); render(); }
    else if (act==="opentoday"){ openDate(today); }
    else if (act==="login"){ state.modal = {type:"auth", error:""}; render(); }
    else if (act==="logout"){ state.authed=false; sessionStorage.removeItem("vf_auth"); render(); }
    else if (act==="back"){ state.view="dashboard"; render(); }
    else if (act==="addrow"){ addRow(); }
    else if (act==="prevday"){ openDate(addDays(state.date,-1)); }
    else if (act==="nextday"){ openDate(addDays(state.date,1)); }
    else if (act==="exportbackup"){ exportBackup(); }

      var n = pushAllLocalToCloud();
      alert(n>0 ? "Enviando "+n+" registro(s) deste navegador para a nuvem…" : "Não há dados salvos neste navegador para enviar.");
    }
    else if (act==="accountlogout"){
      if (sb) sb.auth.signOut().then(function(){ location.reload(); });
    }
    else if (act==="togglehide"){
      state.hideValues = !state.hideValues;
      sessionStorage.setItem("vf_hide", state.hideValues?"1":"0");
      render();
    }
    else if (act==="printnote"){
      state.modal = {type:"selectCustomer", rowId: node.getAttribute("data-id"), purpose:"print"};
      render();
    }
    else if (act==="sendwhatsapp"){
      state.modal = {type:"selectCustomer", rowId: node.getAttribute("data-id"), purpose:"whatsapp"};

    else if (act==="openestoque"){ state.view="estoque"; render(); }

    else if (act==="clientedit"){ state.modal = {type:"customerForm", customerId: node.getAttribute("data-id"), error:""}; renderModal(); }

              (pendentesCount>0 ? ' <span class="count-badge">'+pendentesCount+'</span>' : '')+
            '</button>'+
            '<button class="btn small ghost" data-act="togglemorefields" title="'+(state.showAdvancedCols?'Esconder os campos usados com menos frequência':'Mostrar todos os campos, incluindo os usados com menos frequência')+'">'+
              (state.showAdvancedCols ? "▲ Mostrar menos campos" : "▼ Mostrar mais campos ("+hiddenColsCount+")")+
            '</button>'+
          '</div>'
        )+

        '<div class="totals-bar">'+
          tstat("Valor", fmtCurrency(t.valor), true)+
          tstat("Qtd. bicos", t.qtdBicos)+
          tstat("Bicos", fmtCurrency(t.valorBicos))+
          tstat("Qtd. cambagem", t.qtdCambagem)+
          tstat("Cambagem", fmtCurrency(t.valorCambagem))+
          tstat("Qtd. rodas", t.qtdRodas)+
          tstat("Rodas", fmtCurrency(t.valorRodas))+
          tstat("Valor das peças", fmtCurrency(t.valorPecas))+
          tstat("Mão de obra", fmtCurrency(t.maoDeObra))+
        '</div>'+

        '<div class="totals-bar" style="margin-top:8px;">'+
          tstat("💵 Dinheiro", fmtCurrency(t.porPagamento["Dinheiro"]))+
          tstat("📲 Pix", fmtCurrency(t.porPagamento["Pix"]))+
          tstat("💳 Débito", fmtCurrency(t.porPagamento["Débito"]))+
          tstat("💳 Crédito", fmtCurrency(t.porPagamento["Crédito"]))+
        '</div>'+

        (state.rows.length===0 ? '' : '<div class="grid-scroll-head">'+gridHeadHtml(colTemplate, editable, cols)+'</div>')+
      '</div>'+

      (state.rows.length===0
        ? emptyStateHtml(editable)
        : (displayRows.length===0
            ? '<div class="empty-state"><p>Nenhuma venda pendente — tudo pago por aqui. 🎉</p>'+
                '<button class="btn ghost small" data-act="togglepending">Mostrar todas as vendas</button></div>'
            : '<div class="grid-scroll"><div id="gridInner">'+
                displayRows.map(function(r){ return rowHtml(r, colTemplate, editable, cols); }).join("")+
              '</div></div>'
          )
      )+

      '<div class="tbl-footer">'+
        (editable && state.rows.length>0 ? '<button class="btn ghost small" data-act="addrow">+ Adicionar linha</button>' : '<span></span>')+
        '<span></span>'+
      '</div>';

    attachTableEvents();
    bindBackupControls();
    scheduleFitGrid();
    syncHeadScroll();
  }

  // no celular a tabela permite arrastar de lado; isso mantém o cabeçalho
  // (Quantidade, Medida, Serviço...) alinhado com as colunas enquanto arrasta
  function syncHeadScroll(){
    var headWrap = document.querySelector(".grid-scroll-head");
    var rowsWrap = document.querySelector(".grid-scroll");
    if (!headWrap || !rowsWrap) return;
    rowsWrap.addEventListener("scroll", function(){ headWrap.scrollLeft = rowsWrap.scrollLeft; });
    headWrap.addEventListener("scroll", function(){ rowsWrap.scrollLeft = headWrap.scrollLeft; });
  }

  function tstat(label, val, accent){
    return '<div class="tstat"><div class="k">'+escHtml(label)+'</div><div class="v'+(accent?' accent':'')+'">'+val+'</div></div>';
  }

  function emptyStateHtml(editable){
    return '<div class="empty-state">'+
      '<p>'+(editable ? "Nenhuma venda registrada nesta data ainda." : "Nenhuma venda registrada nesta data.")+'</p>'+
      (editable ? '<button class="btn primary" data-act="addrow">+ Adicionar primeira linha</button>' : '')+
      '</div>';
  }

  function gridHeadHtml(colTemplate, editable, cols){
    var cells = (cols||visibleColumns()).map(function(c){ return '<div class="cell">'+escHtml(c.label)+'</div>'; }).join("");
    cells += '<div class="cell head-actions-cell">'+
      '<button class="btn small ghost" data-act="garantia" title="Dar baixa no estoque por troca em garantia (sem gerar venda)">🛡️ Garantia</button>'+
    '</div>';
    return '<div class="grid-row head" style="grid-template-columns:'+colTemplate+'">'+cells+'</div>';
  }

  // nome do cliente vinculado direto à linha (ligado sem precisar imprimir a nota)
  function customerNameById(id){
    if (!id) return "";
    var c = loadCustomers().filter(function(x){ return x.id===id; })[0];
    return c ? c.nome : "";
  }

  function rowHtml(row, colTemplate, editable, cols){
    var valor = computeValor(row);
    var cells = (cols||visibleColumns()).map(function(c){ return cellHtml(row, c, editable, valor); }).join("");
    var custName = customerNameById(row.clienteId);
    cells += '<div class="cell rowactions">'+
      '<button class="icon-btn cli-btn'+(custName?' has':'')+'" data-act="linkcustomer" data-id="'+row.id+'" title="'+(custName?('Cliente: '+escAttr(custName)+' — clique para ver os dados'):'Vincular cliente a esta linha')+'">👤</button>'+
      '<button class="icon-btn print-btn" data-act="printnote" data-id="'+row.id+'" title="Imprimir nota">🖨</button>'+
      '<button class="icon-btn wa-btn" data-act="sendwhatsapp" data-id="'+row.id+'" title="Enviar por WhatsApp">💬</button>'+
      (editable ? '<button class="icon-btn dup-btn" data-act="duplicaterow" data-id="'+row.id+'" title="Duplicar linha (repete os dados, menos a medida do pneu)">⧉</button>' : '')+
      (editable ? '<button class="icon-btn" data-act="delrow" data-id="'+row.id+'" title="Remover linha">✕</button>' : '')+
      '</div>';
    var open = !!state.openDetails[row.id];
    var mainRow = '<div class="grid-row data" style="grid-template-columns:'+colTemplate+'" data-row="'+row.id+'">'+cells+'</div>';
    var toggleRow = '<div class="grid-row" style="grid-template-columns:'+colTemplate+'">'+
      '<div class="detail-toggle-row"><button class="detail-toggle'+(open?' open':'')+'" data-act="toggledetail" data-id="'+row.id+'"><span class="car">▸</span> detalhes da venda</button></div>'+
      '</div>';
    var detailRow = "";
    if (open){
      detailRow = '<div class="grid-row" style="grid-template-columns:'+colTemplate+'">'+
        '<div class="detail-box"><label>Observações / detalhes extras</label>'+
        '<textarea data-field="detalhes" data-id="'+row.id+'" '+(editable?"":"disabled")+' placeholder="'+(editable?'Ex: cliente pediu retorno em 30 dias, garantia, observações...':'')+'">'+escHtml(row.detalhes||"")+'</textarea>'+
        '</div></div>';
    }
    return mainRow + toggleRow + detailRow;
  }

  function cellHtml(row, col, editable, computedValor){
    var val = row[col.key];
    var mismatch = pairMismatch(row, col.key);
    var cellClass = "cell"+(mismatch?" cell-warn":"");
    var warnTitle = mismatch ? ' title="Confira: a quantidade e o valor deste grupo não batem"' : '';
    if (col.type==="computed"){
      return '<div class="'+cellClass+'"><input class="cellval computed" value="'+escAttr(fmtCurrency(computedValor))+'" disabled></div>';
    }
    if (col.type==="medida"){
      return '<div class="'+cellClass+'"><button class="medida-btn'+(row.medida?' has':'')+'" data-act="selectmedida" data-id="'+row.id+'" '+(editable?"":"disabled")+' title="Escolher a medida do pneu">'+
        escHtml(row.medida || "Escolher medida")+'</button></div>';
    }
    if (col.type==="select"){
      var opts = col.options.map(function(o){
        return '<option value="'+escAttr(o)+'"'+(o===val?" selected":"")+'>'+escHtml(o)+'</option>';
      }).join("");
      var selectHtml = '<select class="cellval" data-field="'+col.key+'" data-id="'+row.id+'" '+(editable?"":"disabled")+'>'+opts+'</select>';
      if (col.key==="formaPagamento" && val && val.indexOf("/")>-1){
        var selectHtmlNarrow = '<select class="cellval" data-field="'+col.key+'" data-id="'+row.id+'" '+(editable?"":"disabled")+' style="flex:1;min-width:0;">'+opts+'</select>';
        return '<div class="'+cellClass+'" style="display:flex;gap:4px;align-items:center;">'+selectHtmlNarrow+
          '<button class="icon-btn" data-act="splitpag" data-id="'+row.id+'" title="Definir quanto foi em cada forma de pagamento" style="flex:0 0 auto;">÷</button>'+
        '</div>';
      }
      if (col.key==="formaPagamento" && val && val.indexOf("Múltiplo")===0){
        var selectHtmlNarrow2 = '<select class="cellval" data-field="'+col.key+'" data-id="'+row.id+'" '+(editable?"":"disabled")+' style="flex:1;min-width:0;">'+opts+'</select>';
        return '<div class="'+cellClass+'" style="display:flex;gap:4px;align-items:center;">'+selectHtmlNarrow2+
          '<button class="icon-btn" data-act="multipag" data-id="'+row.id+'" title="Dividir entre até 4 formas de pagamento" style="flex:0 0 auto;">⚙</button>'+
        '</div>';
      }
      return '<div class="'+cellClass+'"'+warnTitle+'>'+selectHtml+'</div>';
    }
    if (col.type==="number"){
      return '<div class="'+cellClass+'"><input class="cellval" type="text" inputmode="numeric" data-field="'+col.key+'" data-id="'+row.id+'" value="'+escAttr(val)+'" '+(editable?"":"disabled")+' placeholder="0"></div>';
    }
    // currency free text
    return '<div class="'+cellClass+'"'+warnTitle+'><input class="cellval" type="text" inputmode="decimal" data-field="'+col.key+'" data-id="'+row.id+'" value="'+escAttr(val)+'" '+(editable?"":"disabled")+' placeholder="R$ 0,00"></div>';
  }

  function computeTotals(){
    var t = {valor:0, qtdBicos:0, valorBicos:0, qtdCambagem:0, valorCambagem:0, qtdRodas:0, valorRodas:0, valorPecas:0, maoDeObra:0,
              porPagamento:{"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0}};
    state.rows.forEach(function(r){
      t.valor += computeValor(r);
      t.qtdBicos += parseNum(r.qtdBicos);
      t.valorBicos += parseNum(r.valorBicos);
      t.qtdCambagem += parseNum(r.qtdCambagem);
      t.valorCambagem += parseNum(r.valorCambagem);
      t.qtdRodas += parseNum(r.qtdRodas);
      t.valorRodas += parseNum(r.valorRodas);
      t.valorPecas += parseNum(r.valorPecas);
      t.maoDeObra += parseNum(r.maoDeObra);
      var pb = paymentBreakdown(r);
      t.porPagamento["Dinheiro"] += pb["Dinheiro"];
      t.porPagamento["Pix"] += pb["Pix"];
      t.porPagamento["Débito"] += pb["Débito"];
      t.porPagamento["Crédito"] += pb["Crédito"];
    });
    t.qtdBicos = t.qtdBicos.toFixed(0);
    t.qtdCambagem = t.qtdCambagem.toFixed(0);
    t.qtdRodas = t.qtdRodas.toFixed(0);
    return t;
  }

  // colunas realmente exibidas na tabela agora (algumas ficam escondidas por padrão)
  function visibleColumns(){
    return COLUMNS.filter(function(c){ return !c.advanced || state.showAdvancedCols; });
  }
  // detecta quantidade e valor de um mesmo grupo (bicos, cambagem, balanceamento, rodas) que não batem
  function pairMismatch(row, key){
    for (var i=0;i<QTY_VALUE_PAIRS.length;i++){
      var qtyKey = QTY_VALUE_PAIRS[i][0], valKey = QTY_VALUE_PAIRS[i][1];
      if (key!==qtyKey && key!==valKey) continue;
      var qty = parseNum(row[qtyKey]);
      var val = parseNum(row[valKey]);
      return (qty>0 && val===0) || (qty===0 && val>0);
    }
    return false;
  }
  // duplica uma linha (mesmo serviço, carro, forma de pagamento etc.) — a medida do pneu
  // não é copiada, pra não confundir o controle de estoque com uma baixa que nunca aconteceu
  function duplicateRow(id){
    var row = state.rows.filter(function(r){ return r.id===id; })[0];
    if (!row) return;
    var copy = {};
    Object.keys(row).forEach(function(k){ copy[k] = row[k]; });
    copy.id = uid();
    copy.medida = ""; copy.medidaId = ""; copy.medidaBaixa = 0;
    var idx = state.rows.indexOf(row);
    state.rows.splice(idx+1, 0, copy);
    renderTable();
    scheduleSave();
  }
  // ---------- toast de "desfazer" (usado ao apagar uma linha) ----------
  var undoState = null; // {timer, node}
  function dismissUndoToast(){
    if (!undoState) return;
    clearTimeout(undoState.timer);
    if (undoState.node && undoState.node.parentNode) undoState.node.parentNode.removeChild(undoState.node);
    undoState = null;
  }
  function showUndoToast(message, onUndo){
    dismissUndoToast(); // só um toast de cada vez — o anterior vira definitivo
    var node = document.createElement("div");
    node.className = "undo-toast";
    node.innerHTML = '<span>'+escHtml(message)+'</span><button type="button" class="undo-btn">Desfazer</button>';
    document.body.appendChild(node);
    var timer = setTimeout(function(){ dismissUndoToast(); }, 5000);
    undoState = {timer:timer, node:node};
    node.querySelector(".undo-btn").addEventListener("click", function(){
      dismissUndoToast();
      onUndo();
    });
  }

  function attachTableEvents(){
    root.querySelectorAll("[data-act]").forEach(function(node){
      var act = node.getAttribute("data-act");
      if (act==="delrow" || act==="toggledetail" || act==="splitpag" || act==="multipag") return;
      node.addEventListener("click", function(){ handleAction(act, node); });
    });
    root.querySelectorAll("[data-act=delrow]").forEach(function(node){
      node.addEventListener("click", function(){ delRow(node.getAttribute("data-id")); });
    });
    root.querySelectorAll("[data-act=toggledetail]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        state.openDetails[id] = !state.openDetails[id];
        renderTable();
      });
    });
    root.querySelectorAll("[data-act=splitpag]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        var row = state.rows.filter(function(r){return r.id===id;})[0];
        if (!row) return;
        var fp = row.formaPagamento || "";
        var parts = fp.split("/");
        if (parts.length!==2) return;
        var total = computeValor(row);
        var atual = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="") ? parseNum(row.splitValor) : total/2;
        var resp = window.prompt(
          "Total da venda: "+fmtCurrency(total)+"\nQuanto foi pago em "+parts[0]+"? (o restante vai automaticamente para "+parts[1]+")",
          atual.toFixed(2).replace(".", ",")
        );
        if (resp===null) return; // cancelou
        var n = parseNum(resp);
        if (isNaN(n)) return;
        n = Math.max(0, Math.min(n, total));
        row.splitValor = n;
        updateLiveDisplays();
        scheduleSave();
      });
    });
    root.querySelectorAll("[data-act=multipag]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        state.modal = {type:"multiPag", rowId: id};
        renderModal();
      });
    });
    root.querySelectorAll("[data-field]").forEach(function(node){
      var handler = function(){
        var id = node.getAttribute("data-id");
        var field = node.getAttribute("data-field");
        var row = state.rows.filter(function(r){return r.id===id;})[0];
        if (!row) return;
        if (field==="formaPagamento") { delete row.splitValor; delete row.pagamentosMultiplos; } // forma mudou: descarta divisões manuais antigas
        row[field] = node.value;
        // mudou a quantidade de uma linha que já tem medida escolhida: acerta a baixa no estoque
        if (field==="quantidade" && row.medidaId) syncRowEstoque(row);
        if (field==="formaPagamento"){
          // precisa redesenhar a linha pra mostrar (ou esconder) na hora o botão "÷"/"⚙" de dividir o pagamento
          scheduleSave();
          renderTable();
          if (row.formaPagamento && row.formaPagamento.indexOf("Múltiplo")===0){
            // já abre a divisão, já que aqui não existe um "meio a meio" padrão como nas combinações de 2 formas
            state.modal = {type:"multiPag", rowId: row.id};
            renderModal();
          }
          return;
        }
        if (field!=="detalhes"){
          // live-update totals & computed valor without full re-render jank: simplest is re-render totals bar + this row's computed cell
          updateLiveDisplays();
        }
        scheduleSave();
      };
      if (node.tagName==="SELECT"){
        node.addEventListener("change", handler);
      } else if (node.tagName==="TEXTAREA"){
        node.addEventListener("input", handler);
      } else {
        node.addEventListener("input", handler);
      }
    });
  }

  function updateLiveDisplays(){
    var t = computeTotals();
    var bars = document.querySelectorAll(".totals-bar");
    var bar = bars[0], payBar = bars[1];
    if (bar){
      bar.innerHTML =
        tstat("Valor", fmtCurrency(t.valor), true)+
        tstat("Qtd. bicos", t.qtdBicos)+
        tstat("Bicos", fmtCurrency(t.valorBicos))+
        tstat("Qtd. cambagem", t.qtdCambagem)+
        tstat("Cambagem", fmtCurrency(t.valorCambagem))+
        tstat("Qtd. rodas", t.qtdRodas)+
        tstat("Rodas", fmtCurrency(t.valorRodas))+
        tstat("Valor das peças", fmtCurrency(t.valorPecas))+
        tstat("Mão de obra", fmtCurrency(t.maoDeObra));
    }
    if (payBar){
      payBar.innerHTML =
        tstat("💵 Dinheiro", fmtCurrency(t.porPagamento["Dinheiro"]))+
        tstat("📲 Pix", fmtCurrency(t.porPagamento["Pix"]))+
        tstat("💳 Débito", fmtCurrency(t.porPagamento["Débito"]))+
        tstat("💳 Crédito", fmtCurrency(t.porPagamento["Crédito"]));
    }
    state.rows.forEach(function(r){
      var rowNode = document.querySelector('.grid-row[data-row="'+r.id+'"]');
      if (!rowNode) return;
      var computedInput = rowNode.querySelector('input.computed');
      if (computedInput) computedInput.value = fmtCurrency(computeValor(r));
    });
  }

  function addRow(){
    state.rows.push(newRow());
    renderTable();
    scheduleSave();
  }
  function delRow(id){
    var idx = -1;
    for (var i=0;i<state.rows.length;i++){ if (state.rows[i].id===id){ idx=i; break; } }
    if (idx===-1) return;
    var row = state.rows[idx];
    releaseRowEstoque(row); // devolve pro estoque o que essa linha havia baixado
    state.rows.splice(idx, 1);
    delete state.openDetails[id];
    renderTable();
    scheduleSave();
    showUndoToast("Linha apagada", function(){
      state.rows.splice(idx, 0, row);
      syncRowEstoque(row); // baixa de novo o estoque que tinha sido devolvido
      renderTable();
      scheduleSave();
    });
  }

  function scheduleSave(){
    state.saving = true;
    clearTimeout(saveTimer);
    clearTimeout(autoBackupTimer);
    autoBackupTimer = setTimeout(function(){ autoBackupToStorage(); }, AUTO_BACKUP_IDLE_MS);
    saveTimer = setTimeout(function(){
      saveRows(state.date, state.rows).then(function(){
        state.saving = false;
        var flag = document.getElementById("saveFlag");
        if (flag){
          flag.textContent = "salvo ✓";
          flag.classList.add("show");
          setTimeout(function(){ flag.classList.remove("show"); }, 1400);
        }
        // invalidate cached month summary so dashboard reflects new totals next visit
        delete state.monthSummaryCache[state.date.slice(0,7)];
        delete state.monthPartsCache[state.date.slice(0,7)];
      }).catch(function(err){
        state.saving = false;
        var flag = document.getElementById("saveFlag");
        if (flag){
          flag.style.color = "var(--red)";
          flag.textContent = "erro ao salvar";
          flag.classList.add("show");
        }
        alert("Não foi possível salvar as alterações. " + (err && err.message ? err.message : "Verifique o espaço de armazenamento do navegador."));
      });
    }, 550);
  }

  // ---------- auth modal ----------
  function renderModal(){
    var ex = document.querySelector(".overlay");
    if (ex) ex.remove();
    if (!state.modal) return;
    if (state.modal.type==="selectCustomer") renderSelectCustomerModal();
    else if (state.modal.type==="customerLinked") renderCustomerLinkedModal();
    else if (state.modal.type==="customerForm") renderCustomerFormModal();
    else if (state.modal.type==="selectMedida") renderSelectMedidaModal();
    else if (state.modal.type==="estoqueForm") renderEstoqueFormModal();
    else if (state.modal.type==="garantiaForm") renderGarantiaFormModal();
    else if (state.modal.type==="multiPag") renderMultiPagModal();
    else renderAuthModal();
  }

  function renderAuthModal(){
    var div = document.createElement("div");
    div.className = "overlay";
    div.innerHTML =
      '<div class="modal">'+
        '<h3>Entrar em modo edição</h3>'+
        '<p>Informe a senha para editar tabelas de dias anteriores. A tabela de hoje pode ser editada sem senha.</p>'+
        '<input type="password" id="pwInput" placeholder="Senha" autocomplete="off">'+
        '<div class="err">'+(state.modal.error||"")+'</div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="pwCancel">Cancelar</button>'+
          '<button class="btn primary small" id="pwOk">Entrar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);
    var input = document.getElementById("pwInput");
    input.focus();
    function tryAuth(){
      if (input.value === PASSWORD){
        state.authed = true;
        sessionStorage.setItem("vf_auth","1");
        state.modal = null;
        render();
      } else {
        state.modal.error = "Senha incorreta.";
        render();
      }
    }
    document.getElementById("pwOk").addEventListener("click", tryAuth);
    document.getElementById("pwCancel").addEventListener("click", function(){ state.modal=null; render(); });
    input.addEventListener("keydown", function(e){ if (e.key==="Enter") tryAuth(); });
    div.addEventListener("click", function(e){ if (e.target===div){ state.modal=null; render(); } });
  }

  // ---------- modal: cliente já vinculado (mostra os dados, não a lista) ----------
  function renderCustomerLinkedModal(){
    var rowId = state.modal.rowId;
    var row = state.rows.filter(function(r){return r.id===rowId;})[0];
    var customer = row ? loadCustomers().filter(function(c){return c.id===row.clienteId;})[0] : null;
    if (!customer){ // vínculo quebrado: cai de volta na escolha
      state.modal = {type:"selectCustomer", rowId: rowId, purpose:"link"};
      return renderSelectCustomerModal();
    }
    var docLabel = customerDocLabel(customer);
    function linha(rot, val){
      if (!val) return "";
      return '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-soft);font-size:13px;">'+
        '<span style="min-width:104px;color:var(--text-faint);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding-top:1px;">'+rot+'</span>'+
        '<span style="flex:1;">'+escHtml(val)+'</span>'+
      '</div>';
    }
    var notasCount = loadNotas().filter(function(n){ return n.customerId===customer.id || (n.customer && n.customer.id===customer.id); }).length;

    var div = document.createElement("div");
    div.className = "overlay";
    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>Cliente vinculado a esta linha</h3>'+

        email: document.getElementById("cfEmail").value.trim(),
        telefone: document.getElementById("cfTelefone").value.trim(),
        endereco: document.getElementById("cfEndereco").value.trim()
      };
      var saved;

        saved = addCustomer(dados);

        render();

  // ---------- tela de estoque ----------
  function estoqueSorted(){
    return loadEstoque().slice().sort(function(a,b){
      return String(a.medida||"").localeCompare(String(b.medida||""), "pt-BR", {numeric:true});
    });
  }

  function estoqueRowHtml(i){
    var qtd = Math.max(0, parseNum(i.quantidade));
    return '<div class="arow">'+
      '<span class="d">'+escHtml(i.medida||"—")+(i.marca?' <span style="color:var(--text-faint);">· '+escHtml(i.marca)+'</span>':'')+'</span>'+
      '<span class="stats">'+
        '<span><b'+(qtd<=0?' class="est-zero"':'')+'>'+qtd+' un.</b></span>'+
        '<span>'+fmtCurrency(parseNum(i.preco))+'</span>'+
        '<span class="est-actions">'+
          '<button class="icon-btn" data-est-out="'+escAttr(i.id)+'" title="Retirar do estoque">−</button>'+
          '<button class="icon-btn" data-est-in="'+escAttr(i.id)+'" title="Adicionar ao estoque">+</button>'+
          '<button class="icon-btn" data-est-edit="'+escAttr(i.id)+'" title="Editar medida, marca ou preço">✎</button>'+
          '<button class="icon-btn" data-est-del="'+escAttr(i.id)+'" title="Apagar item">✕</button>'+
        '</span>'+
      '</span>'+
    '</div>';
  }

  function renderEstoque(){
    var estoquista = state.role==="estoquista";
    var list = estoqueSorted();
    var q = (state.estoqueQuery||"").trim().toLowerCase();
    var filtered = q ? list.filter(function(i){
      return ((i.medida||"")+" "+(i.marca||"")).toLowerCase().indexOf(q)>-1;
    }) : list;
    var totalUnidades = 0, totalValor = 0, zerados = 0;
    list.forEach(function(i){
      var qt = Math.max(0, parseNum(i.quantidade));
      totalUnidades += qt;
      totalValor += qt * parseNum(i.preco);
      if (qt<=0) zerados++;
    });

    root.innerHTML =
      '<div class="topbar">'+
        '<div class="brand"><span class="mark"></span><h1>Estoque</h1><span class="tag">MEDIDA · MARCA · QUANTIDADE · PREÇO</span>'+syncBadgeHtml()+'</div>'+
        '<div class="auth-zone">'+
          (estoquista ? '' : '<button class="btn ghost small" data-act="back">‹ Painel de vendas</button>')+
          '<button class="btn ghost small" data-act="openclientes" title="Cadastrar e editar clientes">👥 Clientes</button>'+
          (state.role==="master" ? '<button class="btn ghost small" data-act="openhistorico" title="Ver logins e movimentações de estoque">🕘 Histórico</button>' : '')+
          (state.role==="master" ? '<button class="btn ghost small" data-act="openusuarios" title="Criar logins e alterar cargos">👤 Usuários</button>' : '')+
          (sb ? '<button class="btn ghost small" data-act="accountlogout" title="Sair da sua conta">Sair da conta</button>' : '')+
        '</div>'+
      '</div>'+

      '<div class="totals-bar">'+
        tstat("Medidas cadastradas", list.length, true)+
        tstat("Unidades em estoque", totalUnidades)+
        tstat("Medidas zeradas", zerados)+
        (estoquista ? '' : tstat("Valor do estoque", fmtCurrency(totalValor)))+
      '</div>'+

      '<div class="tbl-head">'+
        '<div class="tbl-head-left"><h2>Itens em estoque</h2><span class="save-flag" id="saveFlag">salvo</span></div>'+
        '<span style="display:flex;gap:8px;">'+
          '<button class="btn ghost" data-act="printestoque" title="Imprimir relatório do estoque">🖨 Imprimir relatório</button>'+
          '<button class="btn primary" data-act="estoquenew">+ Cadastrar medida</button>'+
        '</span>'+
      '</div>'+

      '<div class="card" style="padding:14px 16px;">'+
        '<input type="text" id="estSearch" class="dash-cust-search" placeholder="Buscar por medida ou marca..." value="'+escAttr(state.estoqueQuery||"")+'">'+
        '<div class="archive-list">'+
          (filtered.length
            ? filtered.map(estoqueRowHtml).join("")
            : '<div class="arow-empty">'+(list.length ? 'Nenhum item encontrado.' : 'Nenhuma medida cadastrada ainda. Use o botão “+ Cadastrar medida”.')+'</div>')+
        '</div>'+
      '</div>';

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });

    var search = document.getElementById("estSearch");
    if (search){
      search.addEventListener("input", function(){
        state.estoqueQuery = search.value;
        var pos = search.selectionStart;
        renderEstoque();
        var again = document.getElementById("estSearch");
        if (again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
      });
    }

    function askQtd(mensagem){
      var v = window.prompt(mensagem, "1");
      if (v===null) return 0;
      var n = Math.floor(parseNum(v));
      return n>0 ? n : 0;
    }

    root.querySelectorAll("[data-est-in]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-in");
        var item = estoqueItem(id);
        if (!item) return;
        var n = askQtd("Quantas unidades ENTRARAM de "+estoqueLabel(item)+"?");
        if (n>0){
          var moved = moveEstoque(id, n);
          if (moved>0) addEstoqueLog("entrada", estoqueLabel(item), moved);
          renderEstoque();
        }
      });
    });
    root.querySelectorAll("[data-est-out]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-out");
        var item = estoqueItem(id);
        if (!item) return;
        var n = askQtd("Quantas unidades SAÍRAM de "+estoqueLabel(item)+"?");
        if (n>0){
          var moved = moveEstoque(id, -n);
          if (moved<0) addEstoqueLog("saida", estoqueLabel(item), Math.abs(moved));
          renderEstoque();
        }
      });
    });
    root.querySelectorAll("[data-est-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        state.modal = {type:"estoqueForm", itemId: btn.getAttribute("data-est-edit"), error:""};
        renderModal();
      });
    });
    root.querySelectorAll("[data-est-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-est-del");
        var item = estoqueItem(id);
        if (!item) return;
        deleteEstoqueItemWithUndo(id, function(){ renderEstoque(); });
      });
    });
  }

  function loadOrcamentoDraft(){
    var o = lsGetJSON(K_ORCAMENTO, null);
    if (!o || !Array.isArray(o.items) || !o.items.length) return novoOrcamento();
    return o;

  function saveOrcamentoDraft(){

  function nextOrcNumber(){
    var n = parseInt(localStorage.getItem(K_ORC_SEQ)||"0",10);
    if (isNaN(n)) n = 0;
    var next = n+1;
    try{ localStorage.setItem(K_ORC_SEQ, String(next)); }catch(e){}
    cloudPush(K_ORC_SEQ, next);
    return next;
  }
  function orcItemTotal(it){ return Math.max(0, parseNum(it.qty)) * parseNum(it.unit); }
  function orcTotals(o){
    var sub = 0;
    (o.items||[]).forEach(function(it){ sub += orcItemTotal(it); });
    var desc = parseNum(o.desconto);
    return {subtotal: sub, desconto: desc, total: Math.max(0, sub - desc)};
  }

        '<div class="orc-total">'+
          '<span class="lbl">Subtotal <b id="orcSub" style="color:var(--text);">'+fmtCurrency(t.subtotal)+'</b></span>'+
          '<span class="lbl">Total</span><span class="val" id="orcTotal">'+fmtCurrency(t.total)+'</span>'+
        '</div>'+

        '<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;">'+
          '<button class="btn ghost small" id="orcLimpar">Limpar orçamento</button>'+
          '<button class="btn primary" id="orcImprimir">🖨 Imprimir orçamento</button>'+
        '</div>'+
      '</div>';

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });

    function refreshTotals(){
      var tt = orcTotals(state.orcamento);
      state.orcamento.items.forEach(function(it){
        var el = root.querySelector('[data-otot="'+it.id+'"]');
        if (el) el.textContent = fmtCurrency(orcItemTotal(it));
      });
      var sub = document.getElementById("orcSub");
      var tot = document.getElementById("orcTotal");
      if (sub) sub.textContent = fmtCurrency(tt.subtotal);
      if (tot) tot.textContent = fmtCurrency(tt.total);
    }

    root.querySelectorAll("[data-orc]").forEach(function(inp){
      inp.addEventListener("input", function(){
        state.orcamento[inp.getAttribute("data-orc")] = inp.value;
        saveOrcamentoDraft();
        refreshTotals();
      });
    });

    root.querySelectorAll("[data-ofield]").forEach(function(inp){
      inp.addEventListener("input", function(){
        var id = inp.getAttribute("data-oid");
        var f = inp.getAttribute("data-ofield");
        var item = state.orcamento.items.filter(function(x){return x.id===id;})[0];
        if (!item) return;
        item[f] = inp.value;
        saveOrcamentoDraft();
        refreshTotals();
      });
    });

    root.querySelectorAll("[data-odel]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-odel");
        state.orcamento.items = state.orcamento.items.filter(function(x){return x.id!==id;});
        if (!state.orcamento.items.length) state.orcamento.items.push(novoOrcItem());
        saveOrcamentoDraft();
        renderOrcamento();
      });
    });

    document.getElementById("orcAddItem").addEventListener("click", function(){
      state.orcamento.items.push(novoOrcItem());
      saveOrcamentoDraft();
      renderOrcamento();
    });

    var selCli = document.getElementById("orcCliente");
    if (selCli){
      selCli.addEventListener("change", function(){
        state.orcamento.clienteId = selCli.value;
        saveOrcamentoDraft();
        renderOrcamento();
      });
    }

    document.getElementById("orcLimpar").addEventListener("click", function(){
      if (!confirm("Limpar este orçamento e começar um novo?")) return;
      state.orcamento = novoOrcamento();
      saveOrcamentoDraft();
      renderOrcamento();
    });

    document.getElementById("orcImprimir").addEventListener("click", function(){
      var itensValidos = state.orcamento.items.filter(function(it){
        return (it.desc||"").trim() !== "" || orcItemTotal(it) > 0;
      });
      if (!itensValidos.length){
        alert("Adicione ao menos um item com descrição ou valor antes de imprimir.");
        return;
      }
      var cliente = state.orcamento.clienteId
        ? loadCustomers().filter(function(c){return c.id===state.orcamento.clienteId;})[0]
        : {nome: state.orcamento.clienteNome, telefone: state.orcamento.clienteTelefone};
      openPrintWindow(buildOrcamentoHtml(state.orcamento, itensValidos, cliente || {}, nextOrcNumber()));
    });
  }
