      render();
    }
    else if (act==="openestoque"){ state.view="estoque"; render(); }
    else if (act==="openclientes"){ state.clientesDetailId = null; state.view="clientes"; render(); }
    else if (act==="opennotas"){ state.view="notas"; render(); }
    else if (act==="opennovos"){ state.view="novos"; render(); }
    else if (act==="openregmes"){ if (can("registro")){ state.view="regmes"; render(); } }
    else if (act==="openadmin"){ if (state.role==="master"){ state.view="admin"; if (!state.adminMonth) state.adminMonth = today.slice(0,7); render(); } }
    else if (act==="adminprev"){ if (state.role==="master"){ state.adminMonth = addMonths(state.adminMonth || today.slice(0,7), -1); render(); } }
    else if (act==="adminnext"){ if (state.role==="master"){ state.adminMonth = addMonths(state.adminMonth || today.slice(0,7), 1); render(); } }
    else if (act==="adminhoje"){ if (state.role==="master"){ state.adminMonth = today.slice(0,7); render(); } }
    else if (act==="opennovostable"){ state.view="novos"; state.novosTab="vendas"; state.novosRows=null; render(); }
    else if (act==="openavisos"){ state.view="avisos"; render(); }
    else if (act==="avisostab"){ state.avisosTab = node.getAttribute("data-tab"); render(); }
    else if (act==="clientenew"){ state.modal = {type:"customerForm", error:""}; renderModal(); }
    else if (act==="clientedit"){ state.modal = {type:"customerForm", customerId: node.getAttribute("data-id"), error:""}; renderModal(); }
    else if (act==="openhistorico"){ if (state.role==="master"){ try{ localStorage.setItem("vf_hist_visto", String(Date.now())); }catch(e){} state.view="historico"; state.historicoTab = state.historicoTab || "logins"; render(); } }
    else if (act==="restaurarapagada"){ restaurarLinhaApagada(node.getAttribute("data-id")); }
    else if (act==="historicotab"){ state.historicoTab = node.getAttribute("data-tab"); state.historicoQuery = ""; render(); }
    else if (act==="openconversor"){ if (can("vendas")){ state.view="conversor"; render(); } }
    else if (act==="openusuarios"){ if (state.role==="master"){ state.view="usuarios"; render(); } }
    else if (act==="selectmedida"){
      state.modal = {type:"selectMedida", rowId: node.getAttribute("data-id")};
      render();
    }
    else if (act==="printestoque"){
      openPrintWindow(buildEstoqueReportHtml(estoqueSorted(), state.role==="estoquista"));
    }
    else if (act==="estoquenew"){
      state.modal = {type:"estoqueForm", itemId:null, error:""};
      render();
    }
    else if (act==="togglepending"){
      if (isNovosTbl()) state.novosOnlyPending = !state.novosOnlyPending;
      else state.onlyPending = !state.onlyPending;
      renderTable();
    }
    else if (act==="togglemorefields"){
      state.showAdvancedCols = !state.showAdvancedCols;
      try{ localStorage.setItem("vo_show_advanced", state.showAdvancedCols?"1":"0"); }catch(e){}
      renderTable();
    }
    else if (act==="linkcustomer"){
      var lcId = node.getAttribute("data-id");
      var lcRow = findTblRow(lcId);
      // já tem cliente vinculado? mostra a ficha dele em vez da lista de escolha
      if (lcRow && lcRow.clienteId && customerNameById(lcRow.clienteId)){
        state.modal = {type:"customerLinked", rowId: lcId};
      } else {
        state.modal = {type:"selectCustomer", rowId: lcId, purpose:"link"};
      }
      render();
    }
    else if (act==="openorcamento"){ state.orcReturn = state.view; state.view="orcamento"; render(); }
    else if (act==="orcback"){ state.view = state.orcReturn || "table"; render(); }
    else if (act==="openorcamentos"){ state.view="orcamentos"; render(); }
    else if (act==="orcnovo"){ state.orcamento = novoOrcamento(); saveOrcamentoDraft(); state.orcReturn = "orcamentos"; state.view="orcamento"; render(); }
    else if (act==="garantia"){
      state.modal = {type:"garantiaForm", medidaId:"", qtd:"", error:""};
      render();
    }
  }

  function openDate(iso){
    state.date = iso;
    state.view = "table";
    state.openDetails = {};
    getRows(iso).then(function(rows){
      state.rows = rows;
      render();
    });
  }

  // ---------- table view ----------
  function isEditable(dateIso){
    return dateIso === today || state.authed;
  }

  // ---------- a mesma tabela serve pros pneus usados (dia) e pros pneus novos (dia dentro do mês) ----------
  function isNovosTbl(){ return state.view==="novos" && state.novosTab==="vendas"; }
  function tblDate(){ return isNovosTbl() ? (state.novosDate||today) : state.date; }
  function tblRows(){ return isNovosTbl() ? (state.novosRows||[]) : state.rows; }
  function findTblRow(id){ return tblRows().filter(function(r){ return r.id===id; })[0]; }
  // carrega as vendas de novos do dia aberto (mesmos objetos que serão editados e gravados)
  function novosLoadDay(){
    var date = state.novosDate || today;
    state.novosDate = date;
    state.novosRows = loadNovosMonth(date.slice(0,7)).filter(function(n){ return n.date===date; });
    state.novosRowsDate = date;
  }
  // grava o dia inteiro dentro da lista do mês (mantém as vendas dos outros dias como estão)
  function novosCommit(){
    osAgendarSyncPago();
    var date = state.novosDate || today, month = date.slice(0,7);
    var rest = loadNovosMonth(month).filter(function(n){ return n.date!==date; });
    novosSaveLater(month, rest.concat(state.novosRows||[]));
  }

  function exportDiaCSV(){
    if (isNovosTbl()){ exportNovosCSV(tblRows(), tblDate()); return; }
    var header = ["Quantidade","Medida","Valor","Forma de pagamento","Pago","Carro","Vendedor"];
    var lines = [header.map(csvEscape).join(";")];
    state.rows.forEach(function(r){
      lines.push([
        r.quantidade||0, r.medida||"", computeValor(r).toFixed(2).replace(".",","),
        r.formaPagamento||"", (r.pago==="✅"?"Pago":"Pendente"), r.carro||"", r.vendedor||""
      ].map(csvEscape).join(";"));
    });
    downloadTextFile("vendas-"+state.date+".csv", lines.join("\r\n"));
  }

        '<div class="tbl-head">'+

            '<div class="day-nav"><button data-act="prevday">‹</button><button data-act="nextday">›</button></div>'+

  // ---- celular: atalhos para pular direto para um grupo de colunas (a tabela é larga e rola de lado) ----
  var JUMP_CHIPS = [
    {key:"medida", label:"Medida"}, {key:"qtdBicos", label:"Bicos"}, {key:"qtdCambagem", label:"Cambagem"},
    {key:"qtdRodas", label:"Rodas"}, {key:"valorPecas", label:"Peças"}, {key:"valor", label:"Valor"},
    {key:"lucro", label:"Lucro"}, {key:"formaPagamento", label:"Pagamento"}, {key:"vendedor", label:"Vendedor"},
    {key:"__acoes", label:"Ações"}
  ];
  function jumpChipsHtml(cols){
    var keys = cols.map(function(c){ return c.key; });
    return '<div class="mob-jump">'+JUMP_CHIPS.filter(function(j){ return j.key==="__acoes" || keys.indexOf(j.key)>-1; })
      .map(function(j){ return '<button type="button" class="jump-chip" data-jump="'+j.key+'">'+j.label+'</button>'; }).join("")+'</div>';
  }
  function bindJumpChips(cols){
    var rowsWrap = document.querySelector(".grid-scroll");
    var chips = document.querySelectorAll(".mob-jump .jump-chip");
    if (!rowsWrap || !chips.length) return;
    chips.forEach(function(btn){
      btn.addEventListener("click", function(){
        var key = btn.getAttribute("data-jump"), left = 0, i;
        if (key==="__acoes"){ left = rowsWrap.scrollWidth; }
        else {
          for (i=0;i<cols.length;i++){ if (cols[i].key===key) break; left += parseInt(cols[i].w,10)||0; }
        }
        // deixa a coluna um pouco à esquerda para dar contexto
        var alvo = Math.max(0, left - 6);
        if (rowsWrap.scrollTo) rowsWrap.scrollTo({left: alvo, behavior:"smooth"}); else rowsWrap.scrollLeft = alvo;
      });
    });
  }

  // no celular a tabela permite arrastar de lado; isso mantém o cabeçalho
  // (Quantidade, Medida, Serviço...) alinhado com as colunas enquanto arrasta
  function syncHeadScroll(){
    var headWrap = document.querySelector(".grid-scroll-head");
    var rowsWrap = document.querySelector(".grid-scroll");
    if (!headWrap || !rowsWrap) return;
    rowsWrap.addEventListener("scroll", function(){ headWrap.scrollLeft = rowsWrap.scrollLeft; });
    headWrap.addEventListener("scroll", function(){ rowsWrap.scrollLeft = headWrap.scrollLeft; });
  }

  // resumo do dia (cards de totais e formas de pagamento), tudo numa linha só;
  // "Ocultar totais" (state.hideTableTotals) esconde só o valor total do dia e as somas das formas de pagamento
  function pcard(label, color, right, val, tip){
    return '<div class="parts-card pc-'+color+'"'+(tip?' title="'+escAttr(tip)+'"':'')+'><div class="pc-top"><span class="pc-label">'+escHtml(label)+'</span><span class="pc-qty">'+right+'</span></div><div class="pc-value">'+val+'</div></div>';
  }
  function tableTotalsHtml(t){
    var hv = state.hideTableTotals;
    var out = "";
    out += pcard("Valor total do dia", "yellow", "", hv?'••••':fmtCurrency(t.valor));
    if (isNovosTbl()) out += pcard("💰 Lucro do dia", t.lucro>=0?"green":"red", t.semCusto>0 ? t.semCusto+" sem custo" : "", hv?'••••':fmtCurrency(t.lucro));
    out += pcard("Bicos", "teal", t.qtdBicos+" un.", fmtCurrency(t.totalBicos));
    out += pcard("Cambagem", "teal", t.qtdCambagem+" un.", fmtCurrency(t.totalCambagem));
    out += pcard("Rodas", "teal", t.qtdRodas+" un.", fmtCurrency(t.totalRodas));
    out += pcard("Valor das peças", "teal", "", fmtCurrency(t.valorPecas));
    out += pcard("Serviço", "teal", "", fmtCurrency((t.outros||0) + t.maoDeObra));
    out += pcard("💰 Total que entrou", "green", t.semForma>0.005 ? "⚠ sem forma pgto." : "", hv?'••••':fmtCurrency(t.entrouTotal),
      "Fechamento de caixa — Seminovos: "+fmtCurrency(t.entrouSemi)+" + Pneus novos: "+fmtCurrency(t.entrouNovos)+
      " (soma das formas de pagamento das duas tabelas, já com os descontos)"+
      (t.semForma>0.005 ? ". Atenção: "+fmtCurrency(t.semForma)+" em vendas sem forma de pagamento definida, que não entram neste total." : ""));
    out += pcard("💵 Dinheiro", "yellow", "", hv?'••••':fmtCurrency(t.porPagamento["Dinheiro"]), "Seminovos + pneus novos do dia");
    out += pcard("📲 Pix", "yellow", "", hv?'••••':fmtCurrency(t.porPagamento["Pix"]), "Seminovos + pneus novos do dia");
    out += pcard("💳 Débito", "yellow", "", hv?'••••':fmtCurrency(t.porPagamento["Débito"]), "Seminovos + pneus novos do dia (valor bruto, antes da taxa da maquininha)");
    out += pcard("💳 Crédito", "yellow", "", hv?'••••':fmtCurrency(t.porPagamento["Crédito"]), "Seminovos + pneus novos do dia (valor bruto, antes da taxa da maquininha)");
    if (t.taxasCartao>0.004) out += pcard("🧾 Taxa das maquininhas", "yellow", "", hv?'••••':'-'+fmtCurrency(t.taxasCartao), "Desconto das maquininhas no débito e no crédito (seminovos + pneus novos do dia, conforme o que o master liberou em 💳 Taxas)");
    return out;
  }
  function tstat(label, val, accent){
    return '<div class="tstat"><div class="k">'+escHtml(label)+'</div><div class="v'+(accent?' accent':'')+'">'+val+'</div></div>';
  }

  function emptyStateHtml(editable){
    return '<div class="empty-state">'+
      '<p>'+(editable ? "Nenhuma venda registrada nesta data ainda." : "Nenhuma venda registrada nesta data.")+'</p>'+
      (editable ? '<button class="btn primary" data-act="addrow">+ Adicionar primeira linha</button>' : '')+
      '</div>';
  }

  function gridHeadHtml(colTemplate, editable, cols){
    var cells = (cols||visibleColumns()).map(function(c){ return '<div class="cell">'+escHtml(c.label)+'</div>'; }).join("");
    cells += '<div class="cell head-actions-cell">'+
      '<button class="btn small ghost" data-act="garantia" title="Dar baixa no estoque por troca em garantia (sem gerar venda)">🛡️ Garantia</button>'+
    '</div>';
    return '<div class="grid-row head" style="grid-template-columns:'+colTemplate+'">'+cells+'</div>';

  // nome do cliente vinculado direto à linha (ligado sem precisar imprimir a nota)
  // vendas vinculadas entre si (mesmo grupoId, mesma tabela/dia): imprimem numa nota única
  function groupRows(row){
    if (!row || !row.grupoId) return row ? [row] : [];
    var g = tblRows().filter(function(r){ return r.grupoId===row.grupoId; });
    return g.length>1 ? g : [row];
  }
  function rowResumo(r){
    return (r.carro||"Carro") + (r.medida ? " — "+(parseNum(r.quantidade)>0?parseNum(r.quantidade)+"x ":"")+r.medida : "");

  function customerNameById(id){
    if (!id) return "";
    var c = loadCustomers().filter(function(x){ return x.id===id; })[0];
    return c ? c.nome : "";
  }

  function rowHtml(row, colTemplate, editable, cols){
    var valor = computeValor(row);
    var cells = (cols||visibleColumns()).map(function(c){ return cellHtml(row, c, editable, valor); }).join("");
    var custName = customerNameById(row.clienteId);
    var hasDesc = descontoValor(row)>0;
    cells += '<div class="cell rowactions">'+
      '<button class="icon-btn cli-btn'+(custName?' has':'')+'" data-act="linkcustomer" data-id="'+row.id+'" title="'+(custName?('Cliente: '+escAttr(custName)+' — clique para ver os dados'):'Vincular cliente a esta linha')+'">👤</button>'+
      '<button class="icon-btn'+(hasDesc?' has':'')+'" data-act="desconto" data-id="'+row.id+'" title="'+(hasDesc?('Descontos ('+descontosList(row).length+'): -'+escAttr(fmtCurrency(descontoValor(row)))):'Dar desconto nesta venda')+'">🏷</button>'+
      '<button class="icon-btn'+(groupRows(row).length>1?' has':'')+'" data-act="linksales" data-id="'+row.id+'" title="'+(groupRows(row).length>1?('Vinculada a mais '+(groupRows(row).length-1)+' venda(s) — imprime numa nota só. Clique para alterar'):'Vincular a outra venda do mesmo cliente (nota e garantia únicas)')+'">🔗</button>'+
      (can("os_gerir") ? '<button class="icon-btn'+(osDaLinha(row)?' has':'')+'" data-act="rowos" data-id="'+row.id+'" title="'+(osDaLinha(row)?('O.S. #'+osDaLinha(row).num+' desta linha — clique para editar'):'Abrir O.S. para esta linha')+'">🔧</button>' : '')+

      (editable ? '<button class="icon-btn" data-act="delrow" data-id="'+row.id+'" title="Remover linha">✕</button>' : '')+
      (editable ? '<button class="icon-btn drag-btn" data-drag="'+row.id+'" title="Segure e arraste para mover a venda para cima ou para baixo">⣿</button>' : '')+
      '</div>';
    var open = !!state.openDetails[row.id];
    var osProntaLinha = osDaLinha(row);
    var mainRow = '<div class="grid-row data'+((osProntaLinha && osProntaLinha.pronto) ? ' carro-pronto' : '')+'"'+((osProntaLinha && osProntaLinha.pronto) ? ' title="✅ Carro pronto (O.S. #'+osProntaLinha.num+')"' : '')+' style="grid-template-columns:'+colTemplate+'" data-row="'+row.id+'">'+cells+'</div>';
    var toggleRow = '<div class="grid-row" style="grid-template-columns:'+colTemplate+'">'+
      '<div class="detail-toggle-row"><button class="detail-toggle'+(open?' open':'')+'" data-act="toggledetail" data-id="'+row.id+'"><span class="car">▸</span> detalhes da venda</button>'+'</div>'+
      '</div>';
    var detailRow = "";
    if (open){
      detailRow = '<div class="grid-row" style="grid-template-columns:'+colTemplate+'">'+
        '<div class="detail-box"><label>Observações / detalhes extras</label>'+
        '<textarea data-field="detalhes" data-id="'+row.id+'" '+(editable?"":"disabled")+' placeholder="'+(editable?'Ex: cliente pediu retorno em 30 dias, garantia, observações...':'')+'">'+escHtml(row.detalhes||"")+'</textarea>'+
        '</div></div>';
    }
    // a linha + o toggle de detalhes + o detalhe aberto formam um único bloco
    // (data-row-group) pra arrastar tudo junto sem "descolar" visualmente
    return '<div class="row-group" data-row-group="'+row.id+'">'+mainRow + toggleRow + detailRow+'</div>';
  }

  function cellHtml(row, col, editable, computedValor){
    var val = row[col.key];
    var pagAviso = col.key==="formaPagamento" ? pagamentoAviso(row, computedValor) : "";
    var mismatch = pairMismatch(row, col.key) || !!pagAviso;
    var cellClass = "cell"+(mismatch?" cell-warn":"");
    var warnTitle = pagAviso ? ' title="⚠ '+escAttr(pagAviso)+'"' : (mismatch ? ' title="Confira: a quantidade e o valor deste grupo não batem"' : '');
    if (col.type==="computed"){
      var descv = descontoValor(row);
      var txNote = '<div class="taxa-note" style="font-size:9px;color:var(--red);line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+escHtml(taxaNoteTxt(row, computedValor))+'</div>';
      var descNote = descv>0 ? '<div style="font-size:9px;color:var(--yellow);line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">-'+fmtCurrency(descv)+' desc.</div>' : '';
      return '<div class="'+cellClass+'"><div style="display:flex;flex-direction:column;width:100%;min-width:0;"><input class="cellval computed" value="'+escAttr(fmtCurrency(computedValor))+'" disabled>'+descNote+txNote+'</div></div>';
    }

  }

  // soma bicos, cambagem, rodas, peças e mão de obra de qualquer conjunto de vendas (tabela normal e/ou novos).
  // A mão de obra dividida (⚙) entra em Bicos (Wesley), Cambagem (Renan) e Rodas (João).
  // É a MESMA conta usada nas duas tabelas e no Dashboard principal, pra os valores sempre baterem.
  function servicosTotais(rows){
    var t = {qtdBicos:0, valorBicos:0, qtdCambagem:0, valorCambagem:0, qtdRodas:0, valorRodas:0,
             qtdBalanceamento:0, valorBalanceamento:0, alinhamento:0, qtdAlinhamento:0, outros:0,
             valorPecas:0, maoDeObra:0, moBicos:0, moCambagem:0, moRodas:0, porPessoaMaoObra:{}};
    MAODEOBRA_PESSOAS.forEach(function(p){ t.porPessoaMaoObra[p] = 0; });
    rows.forEach(function(r){
      t.qtdBicos += parseNum(r.qtdBicos);           t.valorBicos += parseNum(r.valorBicos);
      t.qtdCambagem += parseNum(r.qtdCambagem);     t.valorCambagem += parseNum(r.valorCambagem);
      t.qtdRodas += parseNum(r.qtdRodas);           t.valorRodas += parseNum(r.valorRodas);
      t.qtdBalanceamento += parseNum(r.qtdBalanceamento); t.valorBalanceamento += parseNum(r.valorBalanceamento);
      var al = parseNum(r.alinhamento); t.alinhamento += al; if (al>0) t.qtdAlinhamento++;
      t.outros += parseNum(r.outros);
      t.valorPecas += parseNum(r.valorPecas);
      t.maoDeObra += parseNum(r.maoDeObra);
      if (Array.isArray(r.maoDeObraSplit)){
        r.maoDeObraSplit.forEach(function(p){
          if (!t.porPessoaMaoObra.hasOwnProperty(p.pessoa)) return;
          var v = parseNum(p.valor);
          t.porPessoaMaoObra[p.pessoa] += v;
          if (p.pessoa==="Wesley") t.moBicos += v;
          else if (p.pessoa==="Renan") t.moCambagem += v;
          else if (p.pessoa==="João") t.moRodas += v;
        });
      }
      // "Outros" (⚙): cada item com pessoa soma no card dela — Wesley→Bicos, Renan→Cambagem, João→Rodas
      var itensOutros = Array.isArray(r.outrosLista) && r.outrosLista.length ? r.outrosLista : (Array.isArray(r.outrosSplit) ? r.outrosSplit : []);
      itensOutros.forEach(function(p){
        // item dividido entre pessoas: cada uma soma o seu pedaço; senão vale a pessoa única do item
        var partes = Array.isArray(p.split) && p.split.length ? p.split : [p];
        partes.forEach(function(q){
          var v = parseNum(q.valor);
          if (q.pessoa==="Wesley") t.moBicos += v;
          else if (q.pessoa==="Renan") t.moCambagem += v;
          else if (q.pessoa==="João") t.moRodas += v;
        });
      });
    });
    t.totalBicos = t.valorBicos + t.moBicos;
    t.totalCambagem = t.valorCambagem + t.moCambagem;
    t.totalRodas = t.valorRodas + t.moRodas;
    return t;
  }
  // vendas de pneus novos de um dia (sem as linhas em branco)
  function novosRowsDoDia(iso){ return novosOfDay(iso).filter(function(n){ return !isBlankNovo(n); }); }

  function computeTotals(){
    var nv = isNovosTbl();
    var t = {valor:0, descontos:0,
              porPagamento:{"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0}};
    tblRows().forEach(function(r){
      t.valor += computeValor(r);
      t.descontos += descontoValor(r);
      var pb = paymentBreakdown(r);
      t.porPagamento["Dinheiro"] += pb["Dinheiro"];
      t.porPagamento["Pix"] += pb["Pix"];
      t.porPagamento["Débito"] += pb["Débito"];
      t.porPagamento["Crédito"] += pb["Crédito"];
    });
    t.lucro = 0; t.semCusto = 0;
    if (nv) tblRows().forEach(function(r){ if (novoTemCusto(r)) t.lucro += novoLucro(r); else if (parseNum(r.valorPneus)>0) t.semCusto++; });
    // bicos/cambagem/rodas/peças/mão de obra: soma da tabela normal + pneus novos do mesmo dia,
    // então as duas tabelas mostram o mesmo valor (a que está aberta usa as linhas ao vivo)
    var d = tblDate();
    var normais = nv ? rowsOfDay(d) : state.rows;
    var novos = nv ? tblRows() : novosRowsDoDia(d);
    // total que entrou no dia (seminovos + pneus novos), pelas formas de pagamento: serve pro fechamento de caixa
    function entrouDe(list){
      var e = 0, sf = 0;
      (list||[]).forEach(function(r){
        var pb = paymentBreakdown(r), pago = pb["Dinheiro"]+pb["Pix"]+pb["Débito"]+pb["Crédito"];
        e += pago;
        sf += Math.max(0, computeValor(r) - pago);
      });
      return {entrou:e, semForma:sf};
    }
    // formas de pagamento: soma das duas tabelas (seminovos + pneus novos) do dia, pro fechamento de caixa
    t.porPagamento = {"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0};
    (normais||[]).concat(novos||[]).forEach(function(r){
      var pb = paymentBreakdown(r);
      Object.keys(t.porPagamento).forEach(function(k){ t.porPagamento[k] += pb[k]; });
    });
    var eS = entrouDe(normais), eN = entrouDe(novos);
    t.taxasCartao = 0;
    (normais||[]).forEach(function(r){ t.taxasCartao += taxaCartao(r, false); });
    (novos||[]).forEach(function(r){ t.taxasCartao += taxaCartao(r, true); });
    t.entrouSemi = eS.entrou; t.entrouNovos = eN.entrou;
    t.entrouTotal = eS.entrou + eN.entrou;
    t.semForma = eS.semForma + eN.semForma;
    var sv = servicosTotais((normais||[]).concat(novos||[]));
    Object.keys(sv).forEach(function(k){ t[k] = sv[k]; });
    t.qtdBicos = t.qtdBicos.toFixed(0);
    t.qtdCambagem = t.qtdCambagem.toFixed(0);
    t.qtdRodas = t.qtdRodas.toFixed(0);
    return t;
  }

  // colunas realmente exibidas na tabela agora (algumas ficam escondidas por padrão)
  function visibleColumns(){
    var linhasVis = [];
    try{ linhasVis = (isNovosTbl() ? state.novosRows : state.rows) || []; }catch(e){}
    return (isNovosTbl() ? NV_COLUMNS : COLUMNS).filter(function(c){
      if (!c.advanced || state.showAdvancedCols) return true;
      // coluna "avançada" com valor lançado (ex.: Alinhamento vindo da O.S.) nunca fica escondida
      return linhasVis.some(function(r){ return r && parseNum(r[c.key])>0; });
    });
  }
  // detecta quantidade e valor de um mesmo grupo (bicos, cambagem, balanceamento, rodas) que não batem
  function pairMismatch(row, key){
    for (var i=0;i<QTY_VALUE_PAIRS.length;i++){
      var qtyKey = QTY_VALUE_PAIRS[i][0], valKey = QTY_VALUE_PAIRS[i][1];
      if (key!==qtyKey && key!==valKey) continue;
      var qty = parseNum(row[qtyKey]);
      var val = parseNum(row[valKey]);
      return (qty>0 && val===0) || (qty===0 && val>0);
    }
    return false;
  }
  // ---------- toast de "desfazer" (usado ao apagar uma linha) ----------
  var undoState = null; // {timer, node}
  function dismissUndoToast(){
    if (!undoState) return;
    clearTimeout(undoState.timer);
    if (undoState.node && undoState.node.parentNode) undoState.node.parentNode.removeChild(undoState.node);
    undoState = null;
  }
  function showUndoToast(message, onUndo){
    dismissUndoToast(); // só um toast de cada vez — o anterior vira definitivo
    var node = document.createElement("div");
    node.className = "undo-toast";
    node.innerHTML = '<span>'+escHtml(message)+'</span><button type="button" class="undo-btn">Desfazer</button>';
    document.body.appendChild(node);
    var timer = setTimeout(function(){ dismissUndoToast(); }, 5000);
    undoState = {timer:timer, node:node};
    node.querySelector(".undo-btn").addEventListener("click", function(){
      dismissUndoToast();
      onUndo();
    });
  }

  // ---------- arrastar linha para cima/baixo ----------
  // a unidade de arraste é o ".row-group" inteiro (linha + toggle "detalhes da
  // venda" + o detalhe aberto, se houver) — isso evita o bug visual de a linha
  // se mover sozinha enquanto o toggle/detalhe dela fica "para trás"
  var dragState = null;
  var dragScrollRAF = null;

  function groupSibling(el, dir){
    var n = dir>0 ? el.nextElementSibling : el.previousElementSibling;
    while (n && !n.classList.contains("row-group")) n = dir>0 ? n.nextElementSibling : n.previousElementSibling;
    return n;
  }

  // os eventos de mover/soltar ficam no documento (e não no botãozinho de
  // arrastar): quando a linha troca de lugar no DOM, o navegador pode soltar o
  // "pointer capture" do botão — se dependêssemos dele, o arraste terminaria
  // sozinho a cada linha pulada. Assim o bloco fica preso ao mouse/dedo e dá
  // pra subir ou descer várias linhas de uma vez só.
  function onDragPointerMove(e){
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    e.preventDefault();
    dragState.pointerY = e.clientY;
    dragState.moved = true;
    positionDraggedRow();
    reflowRowsDuringDrag();
  }

  function onDragPointerUp(e){
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    endRowDrag();
  }

  function addDragListeners(){
    document.addEventListener("pointermove", onDragPointerMove, {passive:false});
    document.addEventListener("pointerup", onDragPointerUp);
    document.addEventListener("pointercancel", onDragPointerUp);
  }

  function removeDragListeners(){
    document.removeEventListener("pointermove", onDragPointerMove, {passive:false});
    document.removeEventListener("pointerup", onDragPointerUp);
    document.removeEventListener("pointercancel", onDragPointerUp);
  }

  function bindRowDrag(){
    root.querySelectorAll("[data-drag]").forEach(function(handle){
      handle.addEventListener("pointerdown", function(e){
        if (dragState) return;
        e.preventDefault();
        var id = handle.getAttribute("data-drag");
        var srcEl = root.querySelector('.row-group[data-row-group="'+id+'"]');
        if (!srcEl || !srcEl.parentNode) return;
        var prev = groupSibling(srcEl, -1);
        dragState = {
          id:id, srcEl:srcEl, handle:handle, pointerId:e.pointerId,
          scale: currentGridScale() || 1,
          startPageY: e.clientY + window.scrollY,
          baseTop: srcEl.getBoundingClientRect().top + window.scrollY,
          startPrevId: prev ? prev.getAttribute("data-row-group") : null,
          offset: 0,
          pointerY: e.clientY,
          moved: false
        };
        srcEl.classList.remove("row-shifting");
        srcEl.classList.add("row-dragging");
        srcEl.style.transition = "none";
        srcEl.style.transform = "translateY(0px)";
        document.body.classList.add("grid-dragging");
        addDragListeners();
        startDragAutoScroll();
      });
    });
  }

  // mantém o bloco exatamente debaixo do cursor/dedo, mesmo depois que as
  // linhas vizinhas trocam de lugar (a posição "natural" dele muda a cada troca)
  function positionDraggedRow(){
    var st = dragState;
    if (!st) return;
    var rect = st.srcEl.getBoundingClientRect();
    var natural = rect.top + window.scrollY - st.offset * st.scale;
    var desired = st.baseTop + (st.pointerY + window.scrollY - st.startPageY);
    // não deixa o bloco sair da área da tabela (senão ele seria cortado)
    var box = st.srcEl.parentNode.getBoundingClientRect();
    var minTop = box.top + window.scrollY;
    var maxTop = box.bottom + window.scrollY - rect.height;
    if (maxTop > minTop) desired = Math.max(minTop, Math.min(maxTop, desired));
    st.offset = (desired - natural) / st.scale;
    st.srcEl.style.transform = "translateY("+st.offset+"px)";
  }

  // FLIP: move o vizinho no DOM e deixa ele deslizar da posição antiga pra nova
  function slideGroup(el, doMove){
    var scale = dragState ? dragState.scale : (currentGridScale() || 1);
    var before = el.getBoundingClientRect().top;
    doMove();
    el.classList.remove("row-shifting");
    el.style.transition = "none";
    el.style.transform = "";
    var after = el.getBoundingClientRect().top;
    var delta = (before - after) / scale;
    if (Math.abs(delta) < 0.5){ el.style.transition = ""; return; }
    el.style.transform = "translateY("+delta+"px)";
    el.getBoundingClientRect(); // força o navegador a aplicar antes de animar
    requestAnimationFrame(function(){
      el.style.transition = "";
      el.classList.add("row-shifting");
      el.style.transform = "";
    });
  }

  // enquanto arrasta: assim que o bloco passa do meio de um vizinho, os dois
  // trocam de lugar na hora (a reordenação acontece ao vivo, não só ao soltar)
  function reflowRowsDuringDrag(){
    var st = dragState;
    if (!st) return;
    var parent = st.srcEl.parentNode;
    if (!parent) return;
    var guard = 0;
    while (guard++ < 60){
      var rect = st.srcEl.getBoundingClientRect();
      var center = rect.top + rect.height/2;
      var moved = false;
      var next = groupSibling(st.srcEl, 1);
      if (next){
        var nr = next.getBoundingClientRect();
        if (center > nr.top + nr.height/2){
          slideGroup(next, function(){ parent.insertBefore(st.srcEl, next.nextSibling); });
          moved = true;
        }
      }
      if (!moved){
        var prev = groupSibling(st.srcEl, -1);
        if (prev){
          var pr = prev.getBoundingClientRect();
          if (center < pr.top + pr.height/2){
            slideGroup(prev, function(){ parent.insertBefore(st.srcEl, prev); });
            moved = true;
          }
        }
      }
      if (!moved) break;
      positionDraggedRow();
    }
  }

  // rola a tela sozinho quando o bloco chega perto da borda de cima/de baixo
  function startDragAutoScroll(){
    if (dragScrollRAF) return;
    var step = function(){
      if (!dragState){ dragScrollRAF = null; return; }
      var y = dragState.pointerY, sp = 0;
      if (y < 90) sp = -Math.min(20, (90 - y)/3);
      else if (y > window.innerHeight - 80) sp = Math.min(20, (y - (window.innerHeight - 80))/3);
      // só rola se ainda existir tabela pra fora da tela naquele sentido —
      // assim a tela não fica se mexendo à toa quando a lista já está toda visível
      var box = dragState.srcEl.parentNode ? dragState.srcEl.parentNode.getBoundingClientRect() : null;
      if (box){
        if (sp < 0 && box.top >= 0) sp = 0;
        if (sp > 0 && box.bottom <= window.innerHeight) sp = 0;
      }
      if (sp){
        window.scrollBy(0, sp);
        positionDraggedRow();
        reflowRowsDuringDrag();
      }
      dragScrollRAF = requestAnimationFrame(step);
    };
    dragScrollRAF = requestAnimationFrame(step);
  }

  function clearDragStyles(el){
    if (!el) return;
    el.classList.remove("row-shifting","row-dragging");
    el.style.transition = "";
    el.style.transform = "";
  }

  // ao soltar: o bloco "encaixa" no espaço aberto e só então o estado é salvo
  function endRowDrag(){
    var st = dragState;
    dragState = null;
    if (dragScrollRAF){ cancelAnimationFrame(dragScrollRAF); dragScrollRAF = null; }
    document.body.classList.remove("grid-dragging");
    removeDragListeners();
    var el = st.srcEl;

    var commit = function(){
      clearDragStyles(el);
      commitDragOrder(st);
    };

    if (!st.moved || Math.abs(st.offset) < 1){ commit(); return; }
    el.style.transition = "transform .17s cubic-bezier(.2,.8,.2,1)";
    el.style.transform = "translateY(0px)";
    var done = false;
    var fin = function(){
      if (done) return;
      done = true;
      el.removeEventListener("transitionend", fin);
      commit();
    };
    el.addEventListener("transitionend", fin);
    setTimeout(fin, 280);
  }

  // o DOM já está na ordem final; aqui só espelhamos isso no estado/salvamento
  function commitDragOrder(st){
    var el = root.querySelector('.row-group[data-row-group="'+st.id+'"]');
    if (!el) return;
    var prev = groupSibling(el, -1);
    var prevId = prev ? prev.getAttribute("data-row-group") : null;
    if (prevId === st.startPrevId) return; // não mudou de lugar: nada a salvar
    var next = groupSibling(el, 1);
    if (prevId) applyRowOrder(st.id, prevId, "after");
    else if (next) applyRowOrder(st.id, next.getAttribute("data-row-group"), "before");
  }

  function applyRowOrder(srcId, targetId, where){
    var rws = tblRows();
    var from = -1, i;
    for (i=0;i<rws.length;i++){ if (rws[i].id===srcId){ from=i; break; } }
    if (from===-1) return;
    var row = rws.splice(from,1)[0];
    var to = -1;
    for (i=0;i<rws.length;i++){ if (rws[i].id===targetId){ to=i; break; } }
    if (to===-1){ rws.splice(from,0,row); return; }
    rws.splice(where==="after" ? to+1 : to, 0, row);
    // o DOM já está na ordem certa (foi reordenado ao vivo durante o arraste),
    // então NÃO redesenha a tabela aqui — redesenhar faria a área piscar e
    // atrapalharia quem está olhando; só salva a nova ordem
    scheduleSave();
  }

  // quando a tabela é reduzida automaticamente pra caber na largura da tela
  // (fitGridToWidth), o próprio #gridInner já tem um scale aplicado; sem
  // compensar esse fator aqui, o bloco arrastado andaria mais (ou menos) que o
  // cursor
  function currentGridScale(){
    var inner = document.getElementById("gridInner");
    if (!inner) return 1;
    var t = getComputedStyle(inner).transform;
    if (!t || t === "none") return 1;
    var m = t.match(/^matrix\(([^,]+),/);
    return m ? (parseFloat(m[1]) || 1) : 1;
  }

  function attachTableEvents(){
    root.querySelectorAll("[data-act]").forEach(function(node){
      var act = node.getAttribute("data-act");
      if (act==="delrow" || act==="toggledetail" || act==="splitpag" || act==="multipag") return;
      node.addEventListener("click", function(){ handleAction(act, node); });
    });
    var vendFiltro = document.getElementById("vendFiltro");
    if (vendFiltro){
      vendFiltro.addEventListener("change", function(){
        if (isNovosTbl()) state.novosVend = vendFiltro.value; else state.vendedorFiltro = vendFiltro.value;
        renderTable();
      });
    }
    root.querySelectorAll("[data-act=delrow]").forEach(function(node){
      node.addEventListener("click", function(){ delRow(node.getAttribute("data-id")); });
    });
    root.querySelectorAll("[data-act=toggledetail]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        state.openDetails[id] = !state.openDetails[id];
        renderTable();
      });
    });
    root.querySelectorAll("[data-act=splitpag]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        var row = findTblRow(id);
        if (!row) return;
        var fp = row.formaPagamento || "";
        var parts = fp.split("/");
        if (parts.length!==2) return;
        var total = computeValor(row);
        var atual = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="") ? parseNum(row.splitValor) : total/2;
        var resp = window.prompt(
          "Total da venda: "+fmtCurrency(total)+"\nQuanto foi pago em "+parts[0]+"? (o restante vai automaticamente para "+parts[1]+")",
          atual.toFixed(2).replace(".", ",")
        );
        if (resp===null) return; // cancelou
        var n = parseNum(resp);
        if (isNaN(n)) return;
        n = Math.max(0, Math.min(n, total));
        row.splitValor = n;
        updateLiveDisplays();
        scheduleSave();
      });
    });
    root.querySelectorAll("[data-act=credito]").forEach(function(node){
      node.addEventListener("click", function(){
        state.modal = {type:"credito", rowId: node.getAttribute("data-id")};
        renderModal();
      });
    });
    root.querySelectorAll("[data-act=multipag]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        state.modal = {type:"multiPag", rowId: id};
        renderModal();
      });
    });
    root.querySelectorAll("[data-field]").forEach(function(node){
      var handler = function(){
        var id = node.getAttribute("data-id");
        var field = node.getAttribute("data-field");
        var row = findTblRow(id);
        if (!row) return;
        if (field==="formaPagamento") { delete row.splitValor; delete row.pagamentosMultiplos; delete row.maquininha; delete row.parcelas; delete row.taxaPct; } // forma mudou: descarta divisões manuais antigas
        var qtdAntiga = parseNum(row.quantidade);
        row[field] = node.value;
        // mudou a quantidade de uma linha que já tem medida escolhida: acerta a baixa no estoque e o valor dos pneus
        if (field==="quantidade" && row.medidaId){
          syncRowEstoque(row);
          reprecificaPorQuantidade(row, qtdAntiga);
          ["valorPneus","custoPneus"].forEach(function(f){
            var inp = document.querySelector('[data-field="'+f+'"][data-id="'+row.id+'"]');
            if (inp && inp!==node) inp.value = row[f]===undefined ? "" : row[f];
          });
        }
        if (field==="formaPagamento"){
          // precisa redesenhar a linha pra mostrar (ou esconder) na hora o botão "÷"/"⚙" de dividir o pagamento
          scheduleSave();
          renderTable();
          if (row.formaPagamento==="Crédito" || row.formaPagamento==="Débito"){ state.modal = {type:"credito", rowId: row.id}; renderModal(); return; }
          if (row.formaPagamento && row.formaPagamento.indexOf("Múltiplo")===0){
            // já abre a divisão, já que aqui não existe um "meio a meio" padrão como nas combinações de 2 formas
            state.modal = {type:"multiPag", rowId: row.id};
            renderModal();
          }
          return;
        }
        if (field!=="detalhes"){
          // live-update totals & computed valor without full re-render jank: simplest is re-render totals bar + this row's computed cell
          updateLiveDisplays();
        }
        scheduleSave();
      };
      if (node.tagName==="SELECT"){
        node.addEventListener("change", handler);
      } else if (node.tagName==="TEXTAREA"){
        node.addEventListener("input", handler);
      } else {
        node.addEventListener("input", handler);
      }
    });
  }

  function updateLiveDisplays(){
    var t = computeTotals();
    var grid = document.querySelector(".totals-strip[data-role=tabletotals]");
    if (grid){
      grid.innerHTML = tableTotalsHtml(t);
    }
    tblRows().forEach(function(r){
      var rowNode = document.querySelector('.grid-row[data-row="'+r.id+'"]');
      if (!rowNode) return;
      var computedInput = rowNode.querySelector('input.computed');
      if (computedInput) computedInput.value = fmtCurrency(computeValor(r));
      var taxaNode = rowNode.querySelector('.taxa-note'); if (taxaNode) taxaNode.textContent = taxaNoteTxt(r, computeValor(r));
      var lcInput = rowNode.querySelector('input.lucro-cell');
      if (lcInput){ var lInfo = lucroCellInfo(r); lcInput.value = lInfo.text; lcInput.style.color = lInfo.color; }
    });
  }

  // o "Carro N" da nova linha continua a contagem da linha anterior (Carro 7 -> Carro 8),
  // mas segue sendo um select normal, então dá pra trocar na mão quando precisar
  function nextCarroLabel(){
    var col = COLUMNS.filter(function(c){ return c.key==="carro"; })[0];
    var opts = (col && col.options) || [];
    var d = tblDate(), novos = isNovosTbl();
    // as duas tabelas (seminovos e pneus novos) do mesmo dia dividem a mesma contagem de carros
    var semi = novos ? rowsOfDay(d) : state.rows;
    var nov = novos ? (state.novosRows||[]) : novosOfDay(d);
    var maxN = 0, maxLabel = "";
    (semi||[]).concat(nov||[]).forEach(function(r){
      var m = /(\d+)\s*$/.exec((r && r.carro) || "");
      if (m && parseInt(m[1],10) >= maxN){ maxN = parseInt(m[1],10); maxLabel = r.carro; }
    });
    if (!maxN) return opts[0] || "Carro 1";
    var cand = maxLabel.replace(/(\d+)\s*$/, String(maxN+1));
    return opts.indexOf(cand) > -1 ? cand : maxLabel; // chegou no último carro da lista: repete o atual
  }

  function addRow(){
    var r = newRow();
    if (isNovosTbl()){
      var d = tblDate();
      if (!novoEditable(d)){ state.modal = {type:"auth", error:""}; render(); return; }
      if (!state.novosRows) novosLoadDay();
      r.date = d; r.quantidade = "1"; r.cliente = "";
    }
    r.carro = nextCarroLabel();
    tblRows().push(r);
    renderTable();
    scheduleSave();
  }
  function delRow(id){
    var idx = -1, rws = tblRows();
    for (var i=0;i<rws.length;i++){ if (rws[i].id===id){ idx=i; break; } }
    if (idx===-1) return;
    var row = rws[idx];
    var logId = addLinhaApagada(isNovosTbl() ? "Pneus novos" : "Seminovos", row, tblDate()); // registra antes de mexer na linha
    releaseRowEstoque(row); // devolve pro estoque o que essa linha havia baixado
    rws.splice(idx, 1);
    delete state.openDetails[id];
    renderTable();
    scheduleSave();
    showUndoToast("Linha apagada", function(){
      desfazLinhaApagada(logId);
      tblRows().splice(idx, 0, row);
      syncRowEstoque(row); // baixa de novo o estoque que tinha sido devolvido
      renderTable();
      scheduleSave();
    });
  }

  function scheduleSave(){
    osAgendarSyncPago();
    if (isNovosTbl()){ novosCommit(); return; }
    state.saving = true;
    clearTimeout(saveTimer);
    clearTimeout(autoBackupTimer);
    autoBackupTimer = setTimeout(function(){ autoBackupToStorage(); }, AUTO_BACKUP_IDLE_MS);
    saveTimer = setTimeout(function(){
      saveRows(state.date, state.rows).then(function(){
        state.saving = false;
        var flag = document.getElementById("saveFlag");
        if (flag){
          flag.textContent = "salvo ✓";
          flag.classList.add("show");
          setTimeout(function(){ flag.classList.remove("show"); }, 1400);
        }
        // invalidate cached month summary so dashboard reflects new totals next visit
        delete state.monthSummaryCache[state.date.slice(0,7)];
        delete state.monthPartsCache[state.date.slice(0,7)];
        // se um serviço da O.S. chegou enquanto a tabela estava salvando, devolve ele pra tabela
        try{ var antes = JSON.stringify(state.rows); osConferirQtds(state.date); if (JSON.stringify(state.rows)!==antes) render(); }catch(e){}
      }).catch(function(err){
        state.saving = false;
        var flag = document.getElementById("saveFlag");
        if (flag){
          flag.style.color = "var(--red)";
          flag.textContent = "erro ao salvar";
          flag.classList.add("show");
        }
        alert("Não foi possível salvar as alterações. " + (err && err.message ? err.message : "Verifique o espaço de armazenamento do navegador."));
      });
    }, 550);
  }

  // ---------- busca global (Ctrl/Cmd+K): clientes, estoque e notas de uma vez ----------
  function globalSearchResults(query){
    var q = (query||"").trim().toLowerCase();
    if (!q) return [];
    var out = [];
    loadCustomers().forEach(function(c){
      var hay = ((c.nome||"")+" "+(customerDocInfo(c).documento||"")+" "+(c.telefone||"")).toLowerCase();
      if (hay.indexOf(q)>-1) out.push({tag:"Cliente", title:c.nome||"(sem nome)", sub:[customerDocLabel(c), c.telefone].filter(Boolean).join(" · "), action:function(){
        state.modal=null; state.view="clientes"; state.clientesDetailId=c.id; render();
      }});
    });
    loadEstoque().forEach(function(i){
      var hay = ((i.medida||"")+" "+(i.marca||"")).toLowerCase();
      if (hay.indexOf(q)>-1) out.push({tag:"Estoque", title:(i.medida||"—")+(i.marca?" · "+i.marca:""), sub:Math.max(0,parseNum(i.quantidade))+" un. em estoque", action:function(){
        state.modal=null; state.view="estoque"; state.estoqueQuery=i.medida; render();
      }});
    });
    loadNotas().forEach(function(n){
      var hay = (String(n.vendaNum)+" "+((n.customer&&n.customer.nome)||"")).toLowerCase();
      if (hay.indexOf(q)>-1) out.push({tag:"Nota", title:"Nota #"+n.vendaNum+" — "+((n.customer&&n.customer.nome)||"sem cliente"), sub:fmtCurrency(n.totalProdutos)+" · "+fmtDateBR(n.date), action:function(){
        state.modal=null; state.view="notas"; state.notasQuery=String(n.vendaNum); render();
      }});
    });
    return out.slice(0,30);
  }
  function renderGlobalSearchModal(){
    var div = document.createElement("div");
    div.className = "overlay gsearch-overlay";
    var query = state.modal.query || "";
    function draw(){
      var results = globalSearchResults(query);
      div.innerHTML =
        '<div class="gsearch-box">'+
          '<input type="text" class="gsearch-input" id="gsInput" placeholder="Buscar cliente, medida do pneu ou número da nota..." value="'+escAttr(query)+'">'+
          '<div class="gsearch-results">'+
            (query.trim()==="" ? '<div class="gsearch-empty">Digite para buscar em clientes, estoque e notas.</div>'
              : (results.length ? results.map(function(r,i){
                  return '<div class="gsearch-item" data-gsidx="'+i+'">'+
                    '<div><div class="gs-title">'+escHtml(r.title)+'</div><div class="gs-sub">'+escHtml(r.sub||"")+'</div></div>'+
                    '<span class="gs-tag">'+escHtml(r.tag)+'</span>'+
                  '</div>';
                }).join("") : '<div class="gsearch-empty">Nada encontrado para "'+escHtml(query)+'".</div>'))+
          '</div>'+
          '<div class="gsearch-hint">Esc para fechar</div>'+
        '</div>';
      var input = document.getElementById("gsInput");
      input.focus();
      input.setSelectionRange(query.length, query.length);
      input.addEventListener("input", function(){ query = input.value; state.modal.query = query; draw(); });
      div.querySelectorAll("[data-gsidx]").forEach(function(el){
        el.addEventListener("click", function(){ results[parseInt(el.getAttribute("data-gsidx"),10)].action(); });
      });
    }
    div.addEventListener("click", function(e){ if (e.target===div){ state.modal=null; renderModal(); } });
    document.body.appendChild(div);
    draw();
  }

  // ---------- O.S.: carros em loja (montadores veem só as abertas e lançam serviços pelo celular) ----------
  var OS_SERVICOS = ["Bicos","Cambagem","Alinhamento","Conserto de rodas"];
  function loadOS(){ return lsGetJSON(K_OS, []); }
  function saveOS(l){ return lsSetJSON(K_OS, l); }
  function osHa(ts){
    var m = Math.max(0, Math.round((Date.now()-ts)/60000));
    if (m<2) return "agora";
    if (m<60) return "há "+m+" min";
    var h = Math.round(m/60);
    if (h<24) return "há "+h+" h";
    var d = Math.round(h/24);
    return d===1 ? "ontem" : "há "+d+" dias";
  }
  // O.S. aberta ligada a uma linha da tabela (a linha guarda o id da O.S. em row.osId)
  function osDaLinha(row){
    if (!row || !row.osId) return null;
    return loadOS().filter(function(o){ return o.id===row.osId && o.status==="aberta"; })[0] || null;
  }
  // liga a O.S. à linha: os serviços lançados depois somam NESSA linha (e não numa linha nova)
  function osVincularLinha(dia, rowId, os, origemTabela){
    var rows = (origemTabela && dia===state.date) ? state.rows : lsGetJSON(K_ROWS+dia, []);
    if (!Array.isArray(rows)) rows = [];
    var r = rows.filter(function(x){ return x && x.id===rowId; })[0];
    if (!r) return;
    r.osId = os.id; r.osNum = os.num;
    if (origemTabela && dia===state.date){ scheduleSave(); }
    else { saveRows(dia, rows).catch(function(){}); if (dia===state.date) state.rows = rows; }
  }
  // ---- histórico das O.S. (aba "O.S." do Histórico, só o master): quem abriu, lançou, removeu, editou e encerrou
  function loadOsLog(){ return lsGetJSON(K_OS_LOG, []); }
  function addOsLog(acao, os, extra){
    try{
      var list = loadOsLog();
      var e = {id:uid(), ts:new Date().toISOString(), email:state.userEmail||"(desconhecido)", nome:userDisplayName(),
               cargo:state.role||"", osId:os.id, osNum:os.num, carro:os.carro||"", acao:acao};
      if (extra){ for (var k in extra){ if (Object.prototype.hasOwnProperty.call(extra,k)) e[k] = extra[k]; } }
      list.push(e);
      if (list.length>1000) list = list.slice(list.length-1000);
      if (!sb){ lsSetJSON(K_OS_LOG, list); return; }
      // com nuvem: o registro vai por uma função do servidor (supabase-os-historico.sql), que funciona também
      // para o montador (ele não grava direto na nuvem). Aqui só guarda uma cópia no aparelho.
      try{ localStorage.setItem(K_OS_LOG, JSON.stringify(list)); }catch(e1){}
      function viaAntigo(){ lsSetJSON(K_OS_LOG, list); } // sem a função no servidor: grava o jeito antigo
      try{
        sb.rpc("os_registrar_evento", {p_evento:e}).then(function(r){
          if (r && r.error){ console.error("os_registrar_evento:", r.error); viaAntigo(); }
        }, function(err){ console.error("os_registrar_evento:", err); viaAntigo(); });
      }catch(e2){ viaAntigo(); }
    }catch(err){ /* o histórico nunca pode impedir o trabalho */ }
  }
  function osHora(ts){ var d = new Date(ts); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }


  // ---------- O.S. → tabela do dia: cada serviço lançado soma na linha da O.S. (uma linha por O.S. por dia) ----------
  var OS_CAMPOS = {"Bicos":{q:"qtdBicos",v:"valorBicos"}, "Cambagem":{q:"qtdCambagem",v:"valorCambagem"},
                   "Conserto de rodas":{q:"qtdRodas",v:"valorRodas"}, "Alinhamento":{q:null,v:"alinhamento"}};
  function osFmtNum(n){ n = Math.round(n*100)/100; return String(n).replace(".", ","); }
  // "Carro N" da linha nova continua a contagem da última linha do dia (igual ao botão de nova linha)
  function osProximoCarro(rows){
    var last = rows.length ? String(rows[rows.length-1].carro||"") : "";
    if (!last) return "Carro 1";
    var m = /(\d+)\s*$/.exec(last);
    if (!m) return last;
    var n = parseInt(m[1],10)+1;
    return n<=19 ? last.replace(/(\d+)\s*$/, String(n)) : last;
  }
  // O.S. aberta a partir da tabela de pneus novos: os serviços da O.S. somam na linha de pneus novos que guarda o osId.
  // A linha guarda quais serviços já foram somados (row.osAplicados), então rodar de novo nunca soma em dobro e
  // serviços lançados/removidos pelo montador (cujo servidor só mexe na tabela de seminovos) são acertados aqui.
  function osReconciliarNovos(){
    try{
      if (!can("vendas")) return;
      var todasOS = loadOS(), osMudou = false;
      var lista = todasOS.filter(function(o){ return o && o.tabela==="novos" && o.dia; });
      if (!lista.length) return;
      lista.forEach(function(o){
        var month = String(o.dia).slice(0,7);
        var doEstado = !!(state.novosRows && state.novosDate && String(state.novosDate).slice(0,7)===month);
        var fonte = doEstado ? state.novosRows : loadNovosMonth(month);
        var row = fonte.filter(function(r){ return r && r.osId===o.id; })[0];
        if (!row) return;
        var ap = row.osAplicados || {}, mudou = false;
        var servs = o.servicos || [];
        servs.forEach(function(sv){
          if (!sv || !sv.id || ap[sv.id]) return;
          var f = OS_CAMPOS[sv.tipo]; if (!f) return;
          if (f.q) row[f.q] = String(Math.max(0, (parseInt(row[f.q],10)||0) + (parseInt(sv.qtd,10)||1)));
          var v = Math.max(0, parseNum(row[f.v]) + (Number(sv.valor)||0));
          row[f.v] = v>0 ? osFmtNum(v) : "";
          ap[sv.id] = {tipo:sv.tipo, qtd:sv.qtd, valor:sv.valor}; mudou = true;
        });
        Object.keys(ap).forEach(function(id){
          if (servs.some(function(sv){ return sv && sv.id===id; })) return;
          var a = ap[id], f = OS_CAMPOS[a.tipo];
          if (f){
            if (f.q) row[f.q] = String(Math.max(0, (parseInt(row[f.q],10)||0) - (parseInt(a.qtd,10)||1)));
            var v = Math.max(0, parseNum(row[f.v]) - (Number(a.valor)||0));
            row[f.v] = v>0 ? osFmtNum(v) : "";
          }
          delete ap[id]; mudou = true;
        });
        if (mudou){
          row.osAplicados = ap;
          if (doEstado) novosCommit(); else saveNovosMonth(month, fonte);
        }
        // serviço de O.S. dos pneus novos NÃO pode ir para a tabela principal: tira qualquer linha/serviço que tenha caído lá
        if (osLimparSeminovosDeNovos(o)) osMudou = true;
      });
      if (osMudou) saveOS(todasOS);
    }catch(e){ /* a conferência nunca pode impedir o trabalho */ }
  }
  // soma (sinal=1) ou tira (sinal=-1) um serviço de O.S. nos campos de uma linha
  function osSomarCampos(row, tipo, qtd, valor, sinal){
    var f = OS_CAMPOS[tipo]; if (!f) return;
    if (f.q) row[f.q] = String(Math.max(0, (parseInt(row[f.q],10)||0) + sinal*(parseInt(qtd,10)||1)));
    var v = Math.max(0, parseNum(row[f.v]) + sinal*(Number(valor)||0));
    row[f.v] = v>0 ? osFmtNum(v) : "";
  }
  // O.S. aberta a partir da tabela de pneus novos: o serviço fica SÓ na tabela de pneus novos.
  // Esta função desfaz o que antes ia (duplicado) para a tabela principal: serviços "espelhados" por versões antigas
  // e a linha que o servidor (os_lancar_servico, quando é o montador que lança) cria na tabela principal.
  // Roda sem efeito se não houver nada a limpar. Devolve true só quando marca uma O.S. já encerrada como limpa
  // (quem chama grava a lista de O.S.).
  function osLimparSeminovosDeNovos(o){
    var dia = o.dia; if (!dia) return false;
    var aberta = (o.status==="aberta");
    if (!aberta && o.espelhoLimpo) return false;
    var usaEstado = (dia===state.date && Array.isArray(state.rows));
    var rows = usaEstado ? state.rows : lsGetJSON(K_ROWS+dia, []);
    if (!Array.isArray(rows)) rows = [];
    var servs = (o.servicos||[]).filter(function(sv){ return sv && sv.id && OS_CAMPOS[sv.tipo]; });
    var ids = {}; servs.forEach(function(sv){ ids[sv.id] = 1; });
    var mudou = false;
    function vazia(r){
      return computeSubtotal(r)===0 && !(parseInt(r.qtdBicos,10)>0) && !(parseInt(r.qtdCambagem,10)>0) && !(parseInt(r.qtdRodas,10)>0) &&
             !r.medida && !r.marca && !r.cliente && !r.clienteId && !(parseNum(r.quantidade)>0);
    }
    rows = rows.filter(function(r){
      if (!r) return true;
      var feito = false;
      // serviços espelhados por versões antigas (podem estar numa linha "Carro N" que já existia)
      if (r.osEspelhados){
        Object.keys(r.osEspelhados).forEach(function(id){
          if (!ids[id]) return;
          var a = r.osEspelhados[id];
          osSomarCampos(r, a.tipo, a.qtd, a.valor, -1);
          delete r.osEspelhados[id]; feito = true;
        });
        if (feito && !Object.keys(r.osEspelhados).length) delete r.osEspelhados;
      }
      // linha ligada a esta O.S. na tabela principal (criada pelo espelhamento antigo ou pelo servidor)
      if (r.osId===o.id){
        if (!feito) servs.forEach(function(sv){ osSomarCampos(r, sv.tipo, sv.qtd, sv.valor, -1); });
        feito = true;
        if (vazia(r)){ mudou = true; return false; }
        delete r.osId; delete r.osNum; delete r.osEspelhados;
      }
      if (feito) mudou = true;
      return true;
    });
    if (mudou){
      if (usaEstado) state.rows = rows;
      saveRows(dia, rows).catch(function(){});
    }
    if (!aberta){ o.espelhoLimpo = true; return true; }
    return false;
  }
  function osEhNovos(osId){ var o = loadOS().filter(function(x){ return x.id===osId; })[0]; return !!(o && o.tabela==="novos"); }
  // soma (sinal=1) ou tira (sinal=-1) um serviço na linha da O.S. do dia; devolve o array de linhas novo
  function osAplicarNaLinha(rows, os, serv, sinal){
    rows = Array.isArray(rows) ? rows : [];
    var f = OS_CAMPOS[serv.tipo]; if (!f) return rows;
    var row = rows.filter(function(r){ return r && r.osId===os.id; })[0];
    if (!row){
      if (sinal<0) return rows;
      row = newRow();
      row.osId = os.id; row.osNum = os.num;
      row.detalhes = "O.S. #"+os.num+" · "+(os.carro||"")+(os.placa?" · "+String(os.placa).toUpperCase():"");
      row.vendedor = VENDEDORES[0];
      row.carro = osProximoCarro(rows);
      rows.push(row);
    }
    if (f.q) row[f.q] = String(Math.max(0, (parseInt(row[f.q],10)||0) + sinal*(parseInt(serv.qtd,10)||1)));
    var novoV = Math.max(0, parseNum(row[f.v]) + sinal*(Number(serv.valor)||0));
    row[f.v] = novoV>0 ? osFmtNum(novoV) : "";
    if (sinal<0 && computeSubtotal(row)===0 && !(parseInt(row.qtdBicos,10)>0) && !(parseInt(row.qtdCambagem,10)>0) && !(parseInt(row.qtdRodas,10)>0)){
      rows = rows.filter(function(r){ return r!==row; });
    }
    return rows;
  }
  // grava no navegador o que o servidor devolveu (sem reenviar pra nuvem: o servidor já gravou)
  function osGuardarLocal(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
  function osFinalizar(res){
    if (res && res.os) osGuardarLocal(K_OS, res.os);
    if (res && res.dia && res.rows){
      osGuardarLocal(K_ROWS+res.dia, res.rows);
      if (res.dia===state.date && !state.saving && Array.isArray(res.rows)) state.rows = res.rows;
      var m = res.dia.slice(0,7);
      try{ delete state.monthSummaryCache[m]; delete state.monthPartsCache[m]; }catch(e){}
    }
  }
  function osErroRpcAusente(err){
    var m = String((err && (err.message||err.code)) || "");
    return /PGRST202|42883|Could not find the function|does not exist/i.test(m);
  }
  // lança um serviço: pelo servidor (seguro: o montador não escreve direto nas vendas) ou, sem o script, localmente
  function osLancarServico(osId, serv, cb){
    var cbOrig = cb;
    cb = function(err){
      if (!err){
        var o1 = loadOS().filter(function(x){ return x.id===osId; })[0];
        if (o1) addOsLog("lancou", o1, {servId:serv.id, tipo:serv.tipo, qtd:serv.qtd, valor:serv.valor});
      }
      cbOrig(err);
    };
    function local(){
      var lista = loadOS(), o = lista.filter(function(x){ return x.id===osId; })[0];
      if (!o || o.status!=="aberta") return cb("Esta O.S. já foi fechada.");
      o.servicos = o.servicos || []; o.servicos.push(serv);
      var dia = serv.data;
      if (can("vendas")){
        if (o.tabela!=="novos"){
          var base = (dia===state.date && Array.isArray(state.rows)) ? state.rows : lsGetJSON(K_ROWS+dia, []);
          var rows = osAplicarNaLinha(base, o, serv, 1);
          if (dia===state.date) state.rows = rows;
          saveRows(dia, rows).catch(function(){});
        }
      }
      saveOS(lista); osReconciliarNovos(); cb(null);
    }
    if (!sb || (can("vendas") && osEhNovos(osId))) return local();
    sb.rpc("os_lancar_servico", {p_os_id:osId, p_servico:serv}).then(function(r){
      if (r.error){ if (osErroRpcAusente(r.error)) return local(); return cb(r.error.message||"Não foi possível lançar."); }
      osFinalizar(r.data); osReconciliarNovos(); osConferirQtds(serv.data); cb(null);
    }).catch(function(){ cb("Sem conexão. Tente de novo."); });
  }
  function osRemoverServico(osId, servId, cb){
    var o0 = loadOS().filter(function(x){ return x.id===osId; })[0];
    var sv0 = o0 ? (o0.servicos||[]).filter(function(x){ return x.id===servId; })[0] : null;
    var cbOrig = cb;
    cb = function(err){
      if (!err && o0 && sv0) addOsLog("removeu", o0, {servId:servId, tipo:sv0.tipo, qtd:sv0.qtd, valor:sv0.valor, lancadoPor:sv0.por||""});
      cbOrig(err);
    };
    function local(){
      var lista = loadOS(), o = lista.filter(function(x){ return x.id===osId; })[0];
      if (!o) return cb(null);
      var sv = (o.servicos||[]).filter(function(x){ return x.id===servId; })[0];
      o.servicos = (o.servicos||[]).filter(function(x){ return x.id!==servId; });
      if (sv && sv.data && can("vendas")){
        if (o.tabela!=="novos"){
          var base2 = (sv.data===state.date && Array.isArray(state.rows)) ? state.rows : lsGetJSON(K_ROWS+sv.data, []);
          var rows2 = osAplicarNaLinha(base2, o, sv, -1);
          if (sv.data===state.date) state.rows = rows2;
          saveRows(sv.data, rows2).catch(function(){});
        }
      }
      saveOS(lista); osReconciliarNovos(); cb(null);
    }
    if (!sb || (can("vendas") && osEhNovos(osId))) return local();
    sb.rpc("os_remover_servico", {p_os_id:osId, p_serv_id:servId}).then(function(r){
      if (r.error){ if (osErroRpcAusente(r.error)) return local(); return cb(r.error.message||"Não foi possível remover."); }
      osFinalizar(r.data); cb(null);
    }).catch(function(){ cb("Sem conexão. Tente de novo."); });
  }

  // ---- carro pronto: o montador marca na O.S. e a linha do carro fica com contorno verde na tabela de vendas
  function osMarcarPronto(osId, pronto, cb){
    var cbOrig = cb;
    cb = function(err){
      if (!err){
        var o1 = loadOS().filter(function(x){ return x.id===osId; })[0];
        if (o1) addOsLog(pronto ? "pronto" : "desfez_pronto", o1);
      }
      cbOrig(err);
    };
    function aplicar(){
      var lista = loadOS(), o = lista.filter(function(x){ return x.id===osId; })[0];
      if (!o || o.status!=="aberta") return "Esta O.S. já foi fechada.";
      if (pronto){ o.pronto = true; o.prontoEm = Date.now(); o.prontoPor = userDisplayName(); }
      else { delete o.pronto; delete o.prontoEm; delete o.prontoPor; }
      saveOS(lista); return null;
    }
    function local(){ cb(aplicar()); }
    if (!sb) return local();
    sb.rpc("os_marcar_pronto", {p_os_id:osId, p_pronto:!!pronto, p_por:userDisplayName()}).then(function(r){
      if (r.error){ if (osErroRpcAusente(r.error)) return local(); return cb(r.error.message||"Não foi possível marcar."); }
      if (r.data && r.data.os){ osGuardarLocal(K_OS, r.data.os); cb(null); } else local();
    }).catch(function(){ cb("Sem conexão. Tente de novo."); });
  }

  // ---- conferência: garante que a quantidade lançada na O.S. (ex.: 4 bicos) chegou inteira na linha da tabela
  // (se o servidor somou só 1, completa aqui). Só sobe a quantidade — nunca apaga o que alguém ajustou à mão.
  function osConferirQtds(dia){
    try{
      if (!dia || !can("vendas")) return;
      var rows = lsGetJSON(K_ROWS+dia, []);
      if (!Array.isArray(rows)) rows = [];
      var lista = loadOS(), mudou = false, apagadas = null;
      lista.forEach(function(o){
        if (!o || o.tabela==="novos") return;
        var servsDia = (o.servicos||[]).filter(function(sv){ return sv && sv.data===dia && OS_CAMPOS[sv.tipo]; });
        if (!servsDia.length) return;
        var row = rows.filter(function(r){ return r && r.osId===o.id; })[0];
        if (!row){
          // a linha da O.S. não está na tabela do dia (ex.: foi sobrescrita por uma gravação antiga ou o servidor não criou):
          // recria com os serviços lançados — só se a O.S. está aberta, o lançamento é recente e a linha não foi apagada de propósito
          if (o.status!=="aberta") return;
          if (apagadas===null) apagadas = loadLinhasApagadas();
          if (apagadas.some(function(a){ return a && a.linha && a.linha.osId===o.id && a.data===dia; })) return;
          var recentes = servsDia.filter(function(sv){ return !sv.ts || (Date.now()-sv.ts) < 48*3600*1000; });
          recentes.forEach(function(sv){ rows = osAplicarNaLinha(rows, o, sv, 1); });
          if (recentes.length) mudou = true;
          return;
        }
        var soma = {}, somaV = {};
        servsDia.forEach(function(sv){
          var f = OS_CAMPOS[sv.tipo];
          if (f.q) soma[f.q] = (soma[f.q]||0) + (parseInt(sv.qtd,10)||1);
          somaV[f.v] = (somaV[f.v]||0) + (Number(sv.valor)||0);
        });
        for (var campo in soma){
          if (!Object.prototype.hasOwnProperty.call(soma, campo)) continue;
          if ((parseInt(row[campo],10)||0) < soma[campo]){ row[campo] = String(soma[campo]); mudou = true; }
        }
        // valor (inclui Alinhamento, que não tem quantidade): só preenche se estiver vazio — nunca mexe no que alguém ajustou à mão
        for (var cv in somaV){
          if (!Object.prototype.hasOwnProperty.call(somaV, cv)) continue;
          if (somaV[cv]>0 && !(parseNum(row[cv])>0)){ row[cv] = osFmtNum(somaV[cv]); mudou = true; }
        }
      });
      if (!mudou) return;
      if (dia===state.date) state.rows = rows;
      saveRows(dia, rows).catch(function(){});
    }catch(e){ /* a conferência nunca pode impedir o trabalho */ }
  }

  // ---------- O.S.: pagamento visível pro montador + encerramento automático ----------
  var OS_AUTO_FECHAR_MIN = 15; // minutos depois do "carro pronto" até a O.S. se encerrar sozinha
  function osVencida(o){
    return !!(o && o.status==="aberta" && o.pronto && o.prontoEm && (Date.now()-o.prontoEm) >= OS_AUTO_FECHAR_MIN*60000);
  }
  function osMinRestantes(o){
    if (!o || !o.pronto || !o.prontoEm) return null;
    return Math.max(0, Math.ceil((o.prontoEm + OS_AUTO_FECHAR_MIN*60000 - Date.now())/60000));
  }
  // quem pode gravar (vendas / gerir O.S.) fecha de verdade; o montador só deixa de ver (renderOS esconde as vencidas)
  function osFecharVencidas(){
    try{
      if (!(can("vendas") || can("os_gerir"))) return false;
      var l = loadOS(), mudou = false;
      l.forEach(function(o){
        if (!osVencida(o)) return;
        o.status = "fechada"; o.fechadaEm = Date.now(); o.fechadaPor = "Automático ("+OS_AUTO_FECHAR_MIN+" min após carro pronto)"; o.fechadaAuto = true;
        addOsLog("encerrou", o, {auto:true, nome:"Sistema (automático)", cargo:""});
        mudou = true;
      });
      if (mudou) saveOS(l);
      return mudou;
    }catch(e){ return false; }
  }
  // linha da venda ligada à O.S. (tabela principal ou pneus novos)
  function osLinhaDaVenda(o){
    if (!o || !o.dia) return null;
    function acha(arr){
      if (!Array.isArray(arr)) return null;
      return arr.filter(function(r){ return r && (r.osId===o.id || (o.rowId && r.id===o.rowId)); })[0] || null;
    }
    if (o.tabela==="novos"){
      return acha(state.novosRows) || acha(loadNovosMonth(String(o.dia).slice(0,7)));
    }
    return acha((o.dia===state.date && Array.isArray(state.rows)) ? state.rows : lsGetJSON(K_ROWS+o.dia, []));
  }
  // guarda na própria O.S. se a venda está paga (o montador lê a O.S., não a tabela de vendas)
  function osSincronizarPago(){
    try{
      if (!can("vendas")) return;
      var l = loadOS(), mudou = false;
      l.forEach(function(o){
        if (!o || o.status!=="aberta" || !o.dia) return;
        var r = osLinhaDaVenda(o); if (!r) return;
        var pago = (r.pago==="✅");
        if (!!o.pago !== pago){ o.pago = pago; if (pago) o.pagoEm = Date.now(); else delete o.pagoEm; mudou = true; }
      });
      if (mudou) saveOS(l);
    }catch(e){ /* nunca pode impedir o trabalho */ }
  }
  var osPagoTimer = null;
  function osAgendarSyncPago(){ clearTimeout(osPagoTimer); osPagoTimer = setTimeout(osSincronizarPago, 1200); }
  var osUltimaAssinatura = "";
  function osAssinatura(){
    return JSON.stringify(loadOS().filter(function(o){ return o.status==="aberta" && !osVencida(o); })
      .map(function(o){ return [o.id, !!o.pronto, !!o.pago, osMinRestantes(o), (o.servicos||[]).length]; }));
  }
  // a cada 30 s: fecha as vencidas e atualiza a tela de O.S. (contagem de minutos / sumiço do card) se algo mudou
  setInterval(function(){
    try{
      osFecharVencidas();
      if (state.view==="os" && !state.modal && osAssinatura()!==osUltimaAssinatura) render();
    }catch(e){}
  }, 30000);

  function osCardHtml(o){

      var meu = x.porId && x.porId===state.userId;
      return '<div class="os-serv"><span class="os-serv-t"><b>'+escHtml(x.tipo)+'</b>'+((x.qtd||1)>1?' ×'+x.qtd:'')+

        ((gerir||meu) ? '<button class="icon-btn" data-os="'+escAttr(o.id)+'" data-delserv="'+escAttr(x.id)+'" title="Remover este lançamento">✕</button>' : '')+

      (minR!==null ? '<span class="os-chip dim">⏱ fecha em '+minR+' min</span>' : '')+(o.linhaCarro ? '<span class="os-chip">📌 '+escHtml(o.linhaCarro)+'</span>' : '')+'<span class="os-chip">🛞 '+(parseInt(o.qtdPneus,10)||0)+' pneu(s)</span>'+
      (o.medida ? '<span class="os-chip">'+escHtml(o.medida)+'</span>' : '')+

        (gerir ? '<button class="btn ghost small" data-os-edit="'+escAttr(o.id)+'">Editar</button><button class="btn ghost small" data-os-close="'+escAttr(o.id)+'">Fechar O.S.</button>' : '')+

  function renderOS(){

    osUltimaAssinatura = osAssinatura();

    root.innerHTML =
      '<div class="topbar">'+

    });

    if (nova) nova.addEventListener("click", function(){ state.modal = {type:"osPickRow"}; render(); });
    root.querySelectorAll("[data-os-add]").forEach(function(b){
      b.addEventListener("click", function(){ state.modal = {type:"osServico", osId:b.getAttribute("data-os-add")}; render(); });

    root.querySelectorAll("[data-os-pronto]").forEach(function(b){

        var id = b.getAttribute("data-os-pronto");

    function tryAuth(){
      var agora = Date.now();
      if (agora < pwBloqueadoAte){
        state.modal.error = "Muitas tentativas erradas. Aguarde "+Math.ceil((pwBloqueadoAte-agora)/1000)+"s.";
        render(); return;
      }
      if (senhaEdicaoConfere(input.value)){
        pwErros = 0;
        state.authed = true;
        sessionStorage.setItem("vf_auth","1");
        state.modal = null;
        render();
      } else {
        pwErros++;
        if (pwErros >= 5){ pwBloqueadoAte = Date.now()+60000; pwErros = 0; state.modal.error = "Senha incorreta. Muitas tentativas: aguarde 60s para tentar de novo."; }
        else state.modal.error = "Senha incorreta.";
        render();
      }
    }
    document.getElementById("pwOk").addEventListener("click", tryAuth);
    document.getElementById("pwCancel").addEventListener("click", function(){ state.modal=null; render(); });
    input.addEventListener("keydown", function(e){ if (e.key==="Enter") tryAuth(); });
    div.addEventListener("click", function(e){ if (e.target===div){ state.modal=null; render(); } });
  }
