      });
      return;
    }

    if (!state.usuariosList && !state.usuariosLoading){
      state.usuariosLoading = true;
      sb.from("perfis").select("user_id,email,papel").then(function(res){
        state.usuariosLoading = false;
        state.usuariosList = (res && res.data) || [];
        render();
      }).catch(function(){
        state.usuariosLoading = false;
        state.usuariosList = [];
        render();
      });
    }

    var list = state.usuariosList || [];
    var rowsHtml = list.length
      ? list.map(function(u){
          return '<div class="arow">'+
            '<span class="d">'+escHtml(u.email || u.user_id)+'</span>'+
            '<span class="stats" style="gap:8px;">'+
              '<select class="sel-papel" data-uid="'+escAttr(u.user_id)+'" style="background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:12.5px;">'+
                PAPEIS.map(function(p){ return '<option value="'+p+'"'+(u.papel===p?' selected':'')+'>'+papelLabel(p)+'</option>'; }).join("")+
              '</select>'+
              '<button class="btn small primary" data-savepapel="'+escAttr(u.user_id)+'">Salvar</button>'+
            '</span>'+
          '</div>';
        }).join("")
      : (state.usuariosLoading ? '<div class="arow-empty">Carregando usuários...</div>' : '<div class="arow-empty">Nenhum usuário cadastrado ainda.</div>');

    root.innerHTML =
      '<div class="topbar">'+
        '<div class="brand"><span class="mark"></span><h1>Usuários</h1><span class="tag">LOGINS E CARGOS</span>'+syncBadgeHtml()+'</div>'+
        '<div class="auth-zone">'+
          '<button class="btn ghost small" data-act="back">‹ Painel de vendas</button>'+
          '<button class="btn ghost small" data-act="openestoque">📦 Estoque</button>'+
          '<button class="btn ghost small" data-act="openclientes">👥 Clientes</button>'+
          '<button class="btn ghost small" data-act="openhistorico">🕘 Histórico</button>'+
        '</div>'+
      '</div>'+

      '<div class="card" style="padding:14px 16px;margin-bottom:16px;">'+
        '<h2 style="margin:0 0 12px;font-size:14px;color:var(--text);">Criar novo login</h2>'+
        '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">'+
          '<div><label style="display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">E-mail</label>'+
            '<input type="email" id="nuEmail" placeholder="email@exemplo.com" style="min-width:220px;"></div>'+
          '<div><label style="display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Senha</label>'+
            '<input type="password" id="nuSenha" placeholder="Senha (mín. 6 caracteres)"></div>'+
          '<div><label style="display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:4px;">Cargo</label>'+
            '<select id="nuPapel" style="background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:9px 8px;font-size:13px;">'+
              PAPEIS.map(function(p){ return '<option value="'+p+'">'+papelLabel(p)+'</option>'; }).join("")+
            '</select></div>'+
          '<button class="btn primary small" id="nuCreate">Criar login</button>'+
        '</div>'+
        '<div class="err" id="nuErr" style="margin-top:8px;"></div>'+
      '</div>'+

      '<div class="tbl-head">'+
        '<div class="tbl-head-left"><h2>Usuários cadastrados</h2></div>'+
      '</div>'+
      '<div class="card" style="padding:14px 16px;">'+
        '<div class="archive-list">'+rowsHtml+'</div>'+
      '</div>';

    root.querySelectorAll("[data-act]").forEach(function(node){
      node.addEventListener("click", function(){ handleAction(node.getAttribute("data-act"), node); });
    });

    var createBtn = document.getElementById("nuCreate");
    if (createBtn){
      createBtn.addEventListener("click", function(){
        var errEl = document.getElementById("nuErr");
        var email = document.getElementById("nuEmail").value.trim();
        var senha = document.getElementById("nuSenha").value;
        var papel = document.getElementById("nuPapel").value;
        errEl.textContent = "";
        if (!email || !senha){ errEl.textContent = "Preencha e-mail e senha."; return; }
        if (senha.length < 6){ errEl.textContent = "A senha precisa ter pelo menos 6 caracteres."; return; }
        var temp = getTempClient();
        if (!temp){ errEl.textContent = "Não foi possível criar login agora."; return; }
        createBtn.disabled = true; createBtn.textContent = "Criando...";
        temp.auth.signUp({email:email, password:senha}).then(function(res){
          if (res.error){
            errEl.textContent = res.error.message || "Erro ao criar login.";
            createBtn.disabled = false; createBtn.textContent = "Criar login";
            return;
          }
          var novo = res.data && res.data.user;
          if (!novo){
            errEl.textContent = "Login criado, mas não foi possível concluir o cadastro do cargo.";
            createBtn.disabled = false; createBtn.textContent = "Criar login";
            return;
          }
          sb.from("perfis").upsert({user_id:novo.id, email:email, papel:papel}).then(function(r2){
            createBtn.disabled = false; createBtn.textContent = "Criar login";
            if (r2.error){
              errEl.textContent = "Login criado, mas não foi possível salvar o cargo: "+r2.error.message;
            } else {
              state.usuariosList = null;
              render();
            }
          });
        });
      });
    }

    root.querySelectorAll("[data-savepapel]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var uid = btn.getAttribute("data-savepapel");
        var sel = root.querySelector('select[data-uid="'+uid+'"]');
        var novoPapel = sel ? sel.value : null;
        if (!novoPapel) return;
        btn.disabled = true; btn.textContent = "Salvando...";
        sb.from("perfis").update({papel:novoPapel}).eq("user_id", uid).then(function(r){
          btn.disabled = false; btn.textContent = "Salvar";
          if (r.error){ alert("Não foi possível salvar o cargo: "+r.error.message); }
          else { state.usuariosList = null; render(); }
        });
      });
    });
  }

  function attachDashboardEvents(){
    root.querySelectorAll("[data-act]").forEach(function(node){
      var act = node.getAttribute("data-act");
      if (act==="opendate") return; // handled after list render for archive rows; hero uses same attr though
      node.addEventListener("click", function(){ handleAction(act, node); });
    });
    // hero-level opendate buttons (yesterday card) need explicit binding too since selector above skips 'opendate'
    root.querySelectorAll("[data-act=opendate][data-date]").forEach(function(node){
      if (node.getAttribute("data-bound")==="1") return;
      node.setAttribute("data-bound","1");
      node.addEventListener("click", function(){ openDate(node.getAttribute("data-date")); });
    });

  function handleAction(act, node){
    if (act==="prevmonth"){ state.dashMonth = addMonths(state.dashMonth,-1); render(); }
    else if (act==="nextmonth"){ state.dashMonth = addMonths(state.dashMonth,1); render(); }
    else if (act==="opentoday"){ openDate(today); }
    else if (act==="login"){ state.modal = {type:"auth", error:""}; render(); }
    else if (act==="logout"){ state.authed=false; sessionStorage.removeItem("vf_auth"); render(); }
    else if (act==="cmpday"){ state.cmpMode="day"; render(); }
    else if (act==="cmpmonth"){ state.cmpMode="month"; render(); }
    else if (act==="back"){ state.view="dashboard"; render(); }
    else if (act==="addrow"){ addRow(); }
    else if (act==="prevday"){ openDate(addDays(state.date,-1)); }
    else if (act==="nextday"){ openDate(addDays(state.date,1)); }
    else if (act==="exportbackup"){ exportBackup(); }
    else if (act==="exportdiacsv"){ exportDiaCSV(); }
    else if (act==="pushcloud"){
      var n = pushAllLocalToCloud();
      alert(n>0 ? "Enviando "+n+" registro(s) deste navegador para a nuvem…" : "Não há dados salvos neste navegador para enviar.");
    }
    else if (act==="accountlogout"){
      if (sb) sb.auth.signOut().then(function(){ location.reload(); });
    }
    else if (act==="togglehide"){
      state.hideValues = !state.hideValues;
      sessionStorage.setItem("vf_hide", state.hideValues?"1":"0");
      render();
    }
    else if (act==="printnote"){
      state.modal = {type:"selectCustomer", rowId: node.getAttribute("data-id"), purpose:"print"};
      render();
    }
    else if (act==="openestoque"){ state.view="estoque"; render(); }
    else if (act==="openclientes"){ state.clientesDetailId = null; state.view="clientes"; render(); }
    else if (act==="opennotas"){ state.view="notas"; render(); }
    else if (act==="openavisos"){ state.view="avisos"; render(); }
    else if (act==="avisostab"){ state.avisosTab = node.getAttribute("data-tab"); render(); }
    else if (act==="clientenew"){ state.modal = {type:"customerForm", error:""}; renderModal(); }
    else if (act==="clientedit"){ state.modal = {type:"customerForm", customerId: node.getAttribute("data-id"), error:""}; renderModal(); }
    else if (act==="openhistorico"){ if (state.role==="master"){ state.view="historico"; state.historicoTab = state.historicoTab || "logins"; render(); } }
    else if (act==="historicotab"){ state.historicoTab = node.getAttribute("data-tab"); render(); }
    else if (act==="openusuarios"){ if (state.role==="master"){ state.view="usuarios"; render(); } }
    else if (act==="selectmedida"){
      state.modal = {type:"selectMedida", rowId: node.getAttribute("data-id")};
      render();
    }
    else if (act==="printestoque"){
      openPrintWindow(buildEstoqueReportHtml(estoqueSorted(), state.role==="estoquista"));
    }
    else if (act==="estoquenew"){
      state.modal = {type:"estoqueForm", itemId:null, error:""};
      render();
    }
    else if (act==="togglepending"){
      state.onlyPending = !state.onlyPending;
      renderTable();
    }
    else if (act==="togglemorefields"){
      state.showAdvancedCols = !state.showAdvancedCols;
      try{ localStorage.setItem("vo_show_advanced", state.showAdvancedCols?"1":"0"); }catch(e){}
      renderTable();
    }
    else if (act==="linkcustomer"){
      var lcId = node.getAttribute("data-id");
      var lcRow = state.rows.filter(function(r){return r.id===lcId;})[0];
      // já tem cliente vinculado? mostra a ficha dele em vez da lista de escolha
      if (lcRow && lcRow.clienteId && customerNameById(lcRow.clienteId)){
        state.modal = {type:"customerLinked", rowId: lcId};
      } else {
        state.modal = {type:"selectCustomer", rowId: lcId, purpose:"link"};
      }
      render();
    }
    else if (act==="openorcamento"){ state.view="orcamento"; render(); }
    else if (act==="orcback"){ state.view="table"; render(); }
    else if (act==="garantia"){
      state.modal = {type:"garantiaForm", medidaId:"", qtd:"", error:""};
      render();
    }
  }

  function exportDiaCSV(){
    var header = ["Quantidade","Medida","Valor","Forma de pagamento","Pago","Carro","Vendedor"];
    var lines = [header.map(csvEscape).join(";")];
    state.rows.forEach(function(r){
      lines.push([
        r.quantidade||0, r.medida||"", computeValor(r).toFixed(2).replace(".",","),
        r.formaPagamento||"", (r.pago==="✅"?"Pago":"Pendente"), r.carro||"", r.vendedor||""
      ].map(csvEscape).join(";"));
    });
    downloadTextFile("vendas-"+state.date+".csv", lines.join("\r\n"));
  }

  function rowHtml(row, colTemplate, editable, cols){

  function cellHtml(row, col, editable, computedValor){
    var val = row[col.key];
    var mismatch = pairMismatch(row, col.key);
    var cellClass = "cell"+(mismatch?" cell-warn":"");
    var warnTitle = mismatch ? ' title="Confira: a quantidade e o valor deste grupo não batem"' : '';
    if (col.type==="computed"){
      return '<div class="'+cellClass+'"><input class="cellval computed" value="'+escAttr(fmtCurrency(computedValor))+'" disabled></div>';
    }
    if (col.type==="medida"){
      return '<div class="'+cellClass+'"><button class="medida-btn'+(row.medida?' has':'')+'" data-act="selectmedida" data-id="'+row.id+'" '+(editable?"":"disabled")+' title="Escolher a medida do pneu">'+
        escHtml(row.medida || "Escolher medida")+'</button></div>';
    }
    if (col.type==="select"){
      var opts = col.options.map(function(o){
        return '<option value="'+escAttr(o)+'"'+(o===val?" selected":"")+'>'+escHtml(o)+'</option>';
      }).join("");
      var selectHtml = '<select class="cellval" data-field="'+col.key+'" data-id="'+row.id+'" '+(editable?"":"disabled")+'>'+opts+'</select>';
      if (col.key==="formaPagamento" && val && val.indexOf("/")>-1){
        var selectHtmlNarrow = '<select class="cellval" data-field="'+col.key+'" data-id="'+row.id+'" '+(editable?"":"disabled")+' style="flex:1;min-width:0;">'+opts+'</select>';
        return '<div class="'+cellClass+'" style="display:flex;gap:4px;align-items:center;">'+selectHtmlNarrow+
          '<button class="icon-btn" data-act="splitpag" data-id="'+row.id+'" title="Definir quanto foi em cada forma de pagamento" style="flex:0 0 auto;">÷</button>'+
        '</div>';
      }
      if (col.key==="formaPagamento" && val && val.indexOf("Múltiplo")===0){
        var selectHtmlNarrow2 = '<select class="cellval" data-field="'+col.key+'" data-id="'+row.id+'" '+(editable?"":"disabled")+' style="flex:1;min-width:0;">'+opts+'</select>';
        return '<div class="'+cellClass+'" style="display:flex;gap:4px;align-items:center;">'+selectHtmlNarrow2+
          '<button class="icon-btn" data-act="multipag" data-id="'+row.id+'" title="Dividir entre até 4 formas de pagamento" style="flex:0 0 auto;">⚙</button>'+
        '</div>';
      }
      return '<div class="'+cellClass+'"'+warnTitle+'>'+selectHtml+'</div>';
    }
    if (col.type==="number"){
      return '<div class="'+cellClass+'"><input class="cellval" type="text" inputmode="numeric" data-field="'+col.key+'" data-id="'+row.id+'" value="'+escAttr(val)+'" '+(editable?"":"disabled")+' placeholder="0"></div>';
    }
    // currency free text
    return '<div class="'+cellClass+'"'+warnTitle+'><input class="cellval" type="text" inputmode="decimal" data-field="'+col.key+'" data-id="'+row.id+'" value="'+escAttr(val)+'" '+(editable?"":"disabled")+' placeholder="R$ 0,00"></div>';
  }

  function computeTotals(){
    var t = {valor:0, qtdBicos:0, valorBicos:0, qtdCambagem:0, valorCambagem:0, qtdRodas:0, valorRodas:0, valorPecas:0, maoDeObra:0,
              porPagamento:{"Dinheiro":0, "Pix":0, "Débito":0, "Crédito":0}};
    state.rows.forEach(function(r){
      t.valor += computeValor(r);
      t.qtdBicos += parseNum(r.qtdBicos);
      t.valorBicos += parseNum(r.valorBicos);
      t.qtdCambagem += parseNum(r.qtdCambagem);
      t.valorCambagem += parseNum(r.valorCambagem);
      t.qtdRodas += parseNum(r.qtdRodas);
      t.valorRodas += parseNum(r.valorRodas);
      t.valorPecas += parseNum(r.valorPecas);
      t.maoDeObra += parseNum(r.maoDeObra);
      var pb = paymentBreakdown(r);
      t.porPagamento["Dinheiro"] += pb["Dinheiro"];
      t.porPagamento["Pix"] += pb["Pix"];
      t.porPagamento["Débito"] += pb["Débito"];
      t.porPagamento["Crédito"] += pb["Crédito"];
    });
    t.qtdBicos = t.qtdBicos.toFixed(0);
    t.qtdCambagem = t.qtdCambagem.toFixed(0);
    t.qtdRodas = t.qtdRodas.toFixed(0);
    return t;
  }

  // colunas realmente exibidas na tabela agora (algumas ficam escondidas por padrão)
  function visibleColumns(){
    return COLUMNS.filter(function(c){ return !c.advanced || state.showAdvancedCols; });
  }
  // detecta quantidade e valor de um mesmo grupo (bicos, cambagem, balanceamento, rodas) que não batem
  function pairMismatch(row, key){
    for (var i=0;i<QTY_VALUE_PAIRS.length;i++){
      var qtyKey = QTY_VALUE_PAIRS[i][0], valKey = QTY_VALUE_PAIRS[i][1];
      if (key!==qtyKey && key!==valKey) continue;
      var qty = parseNum(row[qtyKey]);
      var val = parseNum(row[valKey]);
      return (qty>0 && val===0) || (qty===0 && val>0);
    }
    return false;
  }
  // ---------- toast de "desfazer" (usado ao apagar uma linha) ----------
  var undoState = null; // {timer, node}
  function dismissUndoToast(){
    if (!undoState) return;
    clearTimeout(undoState.timer);
    if (undoState.node && undoState.node.parentNode) undoState.node.parentNode.removeChild(undoState.node);
    undoState = null;
  }
  function showUndoToast(message, onUndo){
    dismissUndoToast(); // só um toast de cada vez — o anterior vira definitivo
    var node = document.createElement("div");
    node.className = "undo-toast";
    node.innerHTML = '<span>'+escHtml(message)+'</span><button type="button" class="undo-btn">Desfazer</button>';
    document.body.appendChild(node);
    var timer = setTimeout(function(){ dismissUndoToast(); }, 5000);
    undoState = {timer:timer, node:node};
    node.querySelector(".undo-btn").addEventListener("click", function(){
      dismissUndoToast();
      onUndo();
    });
  }

  // ---------- arrastar linha para cima/baixo ----------
  // a unidade de arraste é o ".row-group" inteiro (linha + toggle "detalhes da
  // venda" + o detalhe aberto, se houver) — isso evita o bug visual de a linha
  // se mover sozinha enquanto o toggle/detalhe dela fica "para trás"
  var dragState = null;
  var dragScrollRAF = null;

  function groupSibling(el, dir){
    var n = dir>0 ? el.nextElementSibling : el.previousElementSibling;
    while (n && !n.classList.contains("row-group")) n = dir>0 ? n.nextElementSibling : n.previousElementSibling;
    return n;
  }

  // os eventos de mover/soltar ficam no documento (e não no botãozinho de
  // arrastar): quando a linha troca de lugar no DOM, o navegador pode soltar o
  // "pointer capture" do botão — se dependêssemos dele, o arraste terminaria
  // sozinho a cada linha pulada. Assim o bloco fica preso ao mouse/dedo e dá
  // pra subir ou descer várias linhas de uma vez só.
  function onDragPointerMove(e){
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    e.preventDefault();
    dragState.pointerY = e.clientY;
    dragState.moved = true;
    positionDraggedRow();
    reflowRowsDuringDrag();
  }

  function onDragPointerUp(e){
    if (!dragState || e.pointerId !== dragState.pointerId) return;
    endRowDrag();
  }

  function addDragListeners(){
    document.addEventListener("pointermove", onDragPointerMove, {passive:false});
    document.addEventListener("pointerup", onDragPointerUp);
    document.addEventListener("pointercancel", onDragPointerUp);
  }

  function removeDragListeners(){
    document.removeEventListener("pointermove", onDragPointerMove, {passive:false});
    document.removeEventListener("pointerup", onDragPointerUp);
    document.removeEventListener("pointercancel", onDragPointerUp);
  }

  function bindRowDrag(){
    root.querySelectorAll("[data-drag]").forEach(function(handle){
      handle.addEventListener("pointerdown", function(e){
        if (dragState) return;
        e.preventDefault();
        var id = handle.getAttribute("data-drag");
        var srcEl = root.querySelector('.row-group[data-row-group="'+id+'"]');
        if (!srcEl || !srcEl.parentNode) return;
        var prev = groupSibling(srcEl, -1);
        dragState = {
          id:id, srcEl:srcEl, handle:handle, pointerId:e.pointerId,
          scale: currentGridScale() || 1,
          startPageY: e.clientY + window.scrollY,
          baseTop: srcEl.getBoundingClientRect().top + window.scrollY,
          startPrevId: prev ? prev.getAttribute("data-row-group") : null,
          offset: 0,
          pointerY: e.clientY,
          moved: false
        };
        srcEl.classList.remove("row-shifting");
        srcEl.classList.add("row-dragging");
        srcEl.style.transition = "none";
        srcEl.style.transform = "translateY(0px)";
        document.body.classList.add("grid-dragging");
        addDragListeners();
        startDragAutoScroll();
      });
    });
  }

  // mantém o bloco exatamente debaixo do cursor/dedo, mesmo depois que as
  // linhas vizinhas trocam de lugar (a posição "natural" dele muda a cada troca)
  function positionDraggedRow(){
    var st = dragState;
    if (!st) return;
    var rect = st.srcEl.getBoundingClientRect();
    var natural = rect.top + window.scrollY - st.offset * st.scale;
    var desired = st.baseTop + (st.pointerY + window.scrollY - st.startPageY);
    // não deixa o bloco sair da área da tabela (senão ele seria cortado)
    var box = st.srcEl.parentNode.getBoundingClientRect();
    var minTop = box.top + window.scrollY;
    var maxTop = box.bottom + window.scrollY - rect.height;
    if (maxTop > minTop) desired = Math.max(minTop, Math.min(maxTop, desired));
    st.offset = (desired - natural) / st.scale;
    st.srcEl.style.transform = "translateY("+st.offset+"px)";
  }

  // FLIP: move o vizinho no DOM e deixa ele deslizar da posição antiga pra nova
  function slideGroup(el, doMove){
    var scale = dragState ? dragState.scale : (currentGridScale() || 1);
    var before = el.getBoundingClientRect().top;
    doMove();
    el.classList.remove("row-shifting");
    el.style.transition = "none";
    el.style.transform = "";
    var after = el.getBoundingClientRect().top;
    var delta = (before - after) / scale;
    if (Math.abs(delta) < 0.5){ el.style.transition = ""; return; }
    el.style.transform = "translateY("+delta+"px)";
    el.getBoundingClientRect(); // força o navegador a aplicar antes de animar
    requestAnimationFrame(function(){
      el.style.transition = "";
      el.classList.add("row-shifting");
      el.style.transform = "";
    });
  }

  // enquanto arrasta: assim que o bloco passa do meio de um vizinho, os dois
  // trocam de lugar na hora (a reordenação acontece ao vivo, não só ao soltar)
  function reflowRowsDuringDrag(){
    var st = dragState;
    if (!st) return;
    var parent = st.srcEl.parentNode;
    if (!parent) return;
    var guard = 0;
    while (guard++ < 60){
      var rect = st.srcEl.getBoundingClientRect();
      var center = rect.top + rect.height/2;
      var moved = false;
      var next = groupSibling(st.srcEl, 1);
      if (next){
        var nr = next.getBoundingClientRect();
        if (center > nr.top + nr.height/2){
          slideGroup(next, function(){ parent.insertBefore(st.srcEl, next.nextSibling); });
          moved = true;
        }
      }
      if (!moved){
        var prev = groupSibling(st.srcEl, -1);
        if (prev){
          var pr = prev.getBoundingClientRect();
          if (center < pr.top + pr.height/2){
            slideGroup(prev, function(){ parent.insertBefore(st.srcEl, prev); });
            moved = true;
          }
        }
      }
      if (!moved) break;
      positionDraggedRow();
    }
  }

  // rola a tela sozinho quando o bloco chega perto da borda de cima/de baixo
  function startDragAutoScroll(){
    if (dragScrollRAF) return;
    var step = function(){
      if (!dragState){ dragScrollRAF = null; return; }
      var y = dragState.pointerY, sp = 0;
      if (y < 90) sp = -Math.min(20, (90 - y)/3);
      else if (y > window.innerHeight - 80) sp = Math.min(20, (y - (window.innerHeight - 80))/3);
      // só rola se ainda existir tabela pra fora da tela naquele sentido —
      // assim a tela não fica se mexendo à toa quando a lista já está toda visível
      var box = dragState.srcEl.parentNode ? dragState.srcEl.parentNode.getBoundingClientRect() : null;
      if (box){
        if (sp < 0 && box.top >= 0) sp = 0;
        if (sp > 0 && box.bottom <= window.innerHeight) sp = 0;
      }
      if (sp){
        window.scrollBy(0, sp);
        positionDraggedRow();
        reflowRowsDuringDrag();
      }
      dragScrollRAF = requestAnimationFrame(step);
    };
    dragScrollRAF = requestAnimationFrame(step);
  }

  function clearDragStyles(el){
    if (!el) return;
    el.classList.remove("row-shifting","row-dragging");
    el.style.transition = "";
    el.style.transform = "";
  }

  // ao soltar: o bloco "encaixa" no espaço aberto e só então o estado é salvo
  function endRowDrag(){
    var st = dragState;
    dragState = null;
    if (dragScrollRAF){ cancelAnimationFrame(dragScrollRAF); dragScrollRAF = null; }
    document.body.classList.remove("grid-dragging");
    removeDragListeners();
    var el = st.srcEl;

    var commit = function(){
      clearDragStyles(el);
      commitDragOrder(st);
    };

    if (!st.moved || Math.abs(st.offset) < 1){ commit(); return; }
    el.style.transition = "transform .17s cubic-bezier(.2,.8,.2,1)";
    el.style.transform = "translateY(0px)";
    var done = false;
    var fin = function(){
      if (done) return;
      done = true;
      el.removeEventListener("transitionend", fin);
      commit();
    };
    el.addEventListener("transitionend", fin);
    setTimeout(fin, 280);
  }

  // o DOM já está na ordem final; aqui só espelhamos isso no estado/salvamento
  function commitDragOrder(st){
    var el = root.querySelector('.row-group[data-row-group="'+st.id+'"]');
    if (!el) return;
    var prev = groupSibling(el, -1);
    var prevId = prev ? prev.getAttribute("data-row-group") : null;
    if (prevId === st.startPrevId) return; // não mudou de lugar: nada a salvar
    var next = groupSibling(el, 1);
    if (prevId) applyRowOrder(st.id, prevId, "after");
    else if (next) applyRowOrder(st.id, next.getAttribute("data-row-group"), "before");
  }

  function applyRowOrder(srcId, targetId, where){
    var from = -1, i;
    for (i=0;i<state.rows.length;i++){ if (state.rows[i].id===srcId){ from=i; break; } }
    if (from===-1) return;
    var row = state.rows.splice(from,1)[0];
    var to = -1;
    for (i=0;i<state.rows.length;i++){ if (state.rows[i].id===targetId){ to=i; break; } }
    if (to===-1){ state.rows.splice(from,0,row); return; }
    state.rows.splice(where==="after" ? to+1 : to, 0, row);
    // o DOM já está na ordem certa (foi reordenado ao vivo durante o arraste),
    // então NÃO redesenha a tabela aqui — redesenhar faria a área piscar e
    // atrapalharia quem está olhando; só salva a nova ordem
    scheduleSave();
  }

  // quando a tabela é reduzida automaticamente pra caber na largura da tela
  // (fitGridToWidth), o próprio #gridInner já tem um scale aplicado; sem
  // compensar esse fator aqui, o bloco arrastado andaria mais (ou menos) que o
  // cursor
  function currentGridScale(){
    var inner = document.getElementById("gridInner");
    if (!inner) return 1;
    var t = getComputedStyle(inner).transform;
    if (!t || t === "none") return 1;
    var m = t.match(/^matrix\(([^,]+),/);
    return m ? (parseFloat(m[1]) || 1) : 1;
  }

  function attachTableEvents(){
    root.querySelectorAll("[data-act]").forEach(function(node){
      var act = node.getAttribute("data-act");
      if (act==="delrow" || act==="toggledetail" || act==="splitpag" || act==="multipag") return;
      node.addEventListener("click", function(){ handleAction(act, node); });
    });
    var vendFiltro = document.getElementById("vendFiltro");
    if (vendFiltro){
      vendFiltro.addEventListener("change", function(){
        state.vendedorFiltro = vendFiltro.value;
        renderTable();
      });
    }
    root.querySelectorAll("[data-act=delrow]").forEach(function(node){
      node.addEventListener("click", function(){ delRow(node.getAttribute("data-id")); });
    });
    root.querySelectorAll("[data-act=toggledetail]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        state.openDetails[id] = !state.openDetails[id];
        renderTable();
      });
    });
    root.querySelectorAll("[data-act=splitpag]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        var row = state.rows.filter(function(r){return r.id===id;})[0];
        if (!row) return;
        var fp = row.formaPagamento || "";
        var parts = fp.split("/");
        if (parts.length!==2) return;
        var total = computeValor(row);
        var atual = (row.splitValor!==undefined && row.splitValor!==null && row.splitValor!=="") ? parseNum(row.splitValor) : total/2;
        var resp = window.prompt(
          "Total da venda: "+fmtCurrency(total)+"\nQuanto foi pago em "+parts[0]+"? (o restante vai automaticamente para "+parts[1]+")",
          atual.toFixed(2).replace(".", ",")
        );
        if (resp===null) return; // cancelou
        var n = parseNum(resp);
        if (isNaN(n)) return;
        n = Math.max(0, Math.min(n, total));
        row.splitValor = n;
        updateLiveDisplays();
        scheduleSave();
      });
    });
    root.querySelectorAll("[data-act=multipag]").forEach(function(node){
      node.addEventListener("click", function(){
        var id = node.getAttribute("data-id");
        state.modal = {type:"multiPag", rowId: id};
        renderModal();
      });
    });
    root.querySelectorAll("[data-field]").forEach(function(node){
      var handler = function(){
        var id = node.getAttribute("data-id");
        var field = node.getAttribute("data-field");
        var row = state.rows.filter(function(r){return r.id===id;})[0];
        if (!row) return;
        if (field==="formaPagamento") { delete row.splitValor; delete row.pagamentosMultiplos; } // forma mudou: descarta divisões manuais antigas
        row[field] = node.value;
        // mudou a quantidade de uma linha que já tem medida escolhida: acerta a baixa no estoque
        if (field==="quantidade" && row.medidaId) syncRowEstoque(row);
        if (field==="formaPagamento"){
          // precisa redesenhar a linha pra mostrar (ou esconder) na hora o botão "÷"/"⚙" de dividir o pagamento
          scheduleSave();
          renderTable();
          if (row.formaPagamento && row.formaPagamento.indexOf("Múltiplo")===0){
            // já abre a divisão, já que aqui não existe um "meio a meio" padrão como nas combinações de 2 formas
            state.modal = {type:"multiPag", rowId: row.id};
            renderModal();
          }
          return;
        }
        if (field!=="detalhes"){
          // live-update totals & computed valor without full re-render jank: simplest is re-render totals bar + this row's computed cell
          updateLiveDisplays();
        }
        scheduleSave();
      };
      if (node.tagName==="SELECT"){
        node.addEventListener("change", handler);
      } else if (node.tagName==="TEXTAREA"){
        node.addEventListener("input", handler);
      } else {
        node.addEventListener("input", handler);
      }
    });
  }

  function updateLiveDisplays(){
    var t = computeTotals();
    var bars = document.querySelectorAll(".totals-bar");
    var bar = bars[0], payBar = bars[1];
    if (bar){
      bar.innerHTML = totalsBarInner(t);
    }
    if (payBar){
      payBar.innerHTML = payBarInner(t);
    }
    state.rows.forEach(function(r){
      var rowNode = document.querySelector('.grid-row[data-row="'+r.id+'"]');
      if (!rowNode) return;
      var computedInput = rowNode.querySelector('input.computed');
      if (computedInput) computedInput.value = fmtCurrency(computeValor(r));
    });
  }

  // o "Carro N" da nova linha continua a contagem da linha anterior (Carro 7 -> Carro 8),
  // mas segue sendo um select normal, então dá pra trocar na mão quando precisar
  function nextCarroLabel(){
    var col = COLUMNS.filter(function(c){ return c.key==="carro"; })[0];
    var opts = (col && col.options) || [];
    if (!state.rows.length) return opts[0] || "Carro 1";
    var last = state.rows[state.rows.length-1].carro || "";
    var m = /(\d+)\s*$/.exec(last);
    if (!m) return last || opts[0] || "Carro 1";
    var cand = last.replace(/(\d+)\s*$/, String(parseInt(m[1],10)+1));
    return opts.indexOf(cand) > -1 ? cand : last; // chegou no último carro da lista: repete o atual
  }

  function addRow(){
    var r = newRow();
    r.carro = nextCarroLabel();
    state.rows.push(r);
    renderTable();
    scheduleSave();
  }
  function delRow(id){
    var idx = -1;
    for (var i=0;i<state.rows.length;i++){ if (state.rows[i].id===id){ idx=i; break; } }
    if (idx===-1) return;
    var row = state.rows[idx];
    releaseRowEstoque(row); // devolve pro estoque o que essa linha havia baixado
    state.rows.splice(idx, 1);
    delete state.openDetails[id];
    renderTable();
    scheduleSave();
    showUndoToast("Linha apagada", function(){
      state.rows.splice(idx, 0, row);
      syncRowEstoque(row); // baixa de novo o estoque que tinha sido devolvido
      renderTable();
      scheduleSave();
    });
  }

  function scheduleSave(){
    state.saving = true;
    clearTimeout(saveTimer);
    clearTimeout(autoBackupTimer);
    autoBackupTimer = setTimeout(function(){ autoBackupToStorage(); }, AUTO_BACKUP_IDLE_MS);
    saveTimer = setTimeout(function(){
      saveRows(state.date, state.rows).then(function(){
        state.saving = false;
        var flag = document.getElementById("saveFlag");
        if (flag){
          flag.textContent = "salvo ✓";
          flag.classList.add("show");
          setTimeout(function(){ flag.classList.remove("show"); }, 1400);
        }
        // invalidate cached month summary so dashboard reflects new totals next visit
        delete state.monthSummaryCache[state.date.slice(0,7)];
        delete state.monthPartsCache[state.date.slice(0,7)];
      }).catch(function(err){
        state.saving = false;
        var flag = document.getElementById("saveFlag");
        if (flag){
          flag.style.color = "var(--red)";
          flag.textContent = "erro ao salvar";
          flag.classList.add("show");
        }
        alert("Não foi possível salvar as alterações. " + (err && err.message ? err.message : "Verifique o espaço de armazenamento do navegador."));
      });
    }, 550);
  }

  // ---------- auth modal ----------
  function renderModal(){
    var ex = document.querySelector(".overlay");
    if (ex) ex.remove();
    if (!state.modal) return;
    if (state.modal.type==="selectCustomer") renderSelectCustomerModal();
    else if (state.modal.type==="customerLinked") renderCustomerLinkedModal();
    else if (state.modal.type==="customerForm") renderCustomerFormModal();
    else if (state.modal.type==="selectMedida") renderSelectMedidaModal();
    else if (state.modal.type==="estoqueForm") renderEstoqueFormModal();
    else if (state.modal.type==="garantiaForm") renderGarantiaFormModal();
    else if (state.modal.type==="multiPag") renderMultiPagModal();
    else if (state.modal.type==="globalSearch") renderGlobalSearchModal();
    else renderAuthModal();
  }

  // ---------- busca global (Ctrl/Cmd+K): clientes, estoque e notas de uma vez ----------
  function globalSearchResults(query){
    var q = (query||"").trim().toLowerCase();
    if (!q) return [];
    var out = [];
    loadCustomers().forEach(function(c){
      var hay = ((c.nome||"")+" "+(customerDocInfo(c).documento||"")+" "+(c.telefone||"")).toLowerCase();
      if (hay.indexOf(q)>-1) out.push({tag:"Cliente", title:c.nome||"(sem nome)", sub:[customerDocLabel(c), c.telefone].filter(Boolean).join(" · "), action:function(){
        state.modal=null; state.view="clientes"; state.clientesDetailId=c.id; render();
      }});
    });
    loadEstoque().forEach(function(i){
      var hay = ((i.medida||"")+" "+(i.marca||"")).toLowerCase();
      if (hay.indexOf(q)>-1) out.push({tag:"Estoque", title:(i.medida||"—")+(i.marca?" · "+i.marca:""), sub:Math.max(0,parseNum(i.quantidade))+" un. em estoque", action:function(){
        state.modal=null; state.view="estoque"; state.estoqueQuery=i.medida; render();
      }});
    });
    loadNotas().forEach(function(n){
      var hay = (String(n.vendaNum)+" "+((n.customer&&n.customer.nome)||"")).toLowerCase();
      if (hay.indexOf(q)>-1) out.push({tag:"Nota", title:"Nota #"+n.vendaNum+" — "+((n.customer&&n.customer.nome)||"sem cliente"), sub:fmtCurrency(n.totalProdutos)+" · "+fmtDateBR(n.date), action:function(){
        state.modal=null; state.view="notas"; state.notasQuery=String(n.vendaNum); render();
      }});
    });
    return out.slice(0,30);
  }
  function renderGlobalSearchModal(){
    var div = document.createElement("div");
    div.className = "overlay gsearch-overlay";
    var query = state.modal.query || "";
    function draw(){
      var results = globalSearchResults(query);
      div.innerHTML =
        '<div class="gsearch-box">'+
          '<input type="text" class="gsearch-input" id="gsInput" placeholder="Buscar cliente, medida do pneu ou número da nota..." value="'+escAttr(query)+'">'+
          '<div class="gsearch-results">'+
            (query.trim()==="" ? '<div class="gsearch-empty">Digite para buscar em clientes, estoque e notas.</div>'
              : (results.length ? results.map(function(r,i){
                  return '<div class="gsearch-item" data-gsidx="'+i+'">'+
                    '<div><div class="gs-title">'+escHtml(r.title)+'</div><div class="gs-sub">'+escHtml(r.sub||"")+'</div></div>'+
                    '<span class="gs-tag">'+escHtml(r.tag)+'</span>'+
                  '</div>';
                }).join("") : '<div class="gsearch-empty">Nada encontrado para "'+escHtml(query)+'".</div>'))+
          '</div>'+
          '<div class="gsearch-hint">Esc para fechar</div>'+
        '</div>';
      var input = document.getElementById("gsInput");
      input.focus();
      input.setSelectionRange(query.length, query.length);
      input.addEventListener("input", function(){ query = input.value; state.modal.query = query; draw(); });
      div.querySelectorAll("[data-gsidx]").forEach(function(el){
        el.addEventListener("click", function(){ results[parseInt(el.getAttribute("data-gsidx"),10)].action(); });
      });
    }
    div.addEventListener("click", function(e){ if (e.target===div){ state.modal=null; renderModal(); } });
    document.body.appendChild(div);

        email: document.getElementById("cfEmail").value.trim(),
        telefone: document.getElementById("cfTelefone").value.trim(),
        endereco: document.getElementById("cfEndereco").value.trim()
      };
      var saved;
      if (customer){
        updateCustomer(customer.id, dados);
        saved = loadCustomers().filter(function(c){return c.id===customer.id;})[0];
      } else {
        saved = addCustomer(dados);
      }
      var rowId = state.modal.rowId;
      var returnTo = state.modal.returnTo;
      var purpose = state.modal.purpose||"print";
      state.modal = null;
      if (returnTo==="orcamento"){
        if (!state.orcamento) state.orcamento = loadOrcamentoDraft();
        state.orcamento.clienteId = saved.id;
        state.orcamento.clienteNome = ""; state.orcamento.clienteTelefone = "";
        saveOrcamentoDraft();
        render();
      } else if (returnTo==="selectCustomer" && rowId){
        var row = state.rows.filter(function(r){return r.id===rowId;})[0];
        if (row){
          row.clienteId = saved.id; // já liga o cliente recém-cadastrado a esta linha
          scheduleSave();
        }
        render();
        if (row && purpose!=="link"){
          printNota(row, saved);
        }
      } else {
        render();
      }
    });
  }

  // ---------- tela de estoque ----------
  // extrai os números da medida (ex: "175/70 R14" -> largura 175, perfil 70, aro 14)
  function medidaNums(medida){
    var nums = String(medida||"").match(/\d+/g) || [];
    return {
      largura: nums[0]!==undefined ? parseInt(nums[0],10) : null,
      perfil:  nums[1]!==undefined ? parseInt(nums[1],10) : null,
      aro:     nums[2]!==undefined ? parseInt(nums[2],10) : null
    };
  }
  // compara dois números que podem ser nulos (sem número identificado vai pro final da lista)
  function cmpNullableNum(x,y){
    if (x===null && y===null) return 0;
    if (x===null) return 1;
    if (y===null) return -1;
    return x-y;
  }
  // ordem: aro (1°), depois perfil (2°), depois largura (3°) — e por fim o texto completo, se empatar
  function estoqueSorted(){
    return loadEstoque().slice().sort(function(a,b){
      var ma = medidaNums(a.medida), mb = medidaNums(b.medida);
      var cmp = cmpNullableNum(ma.aro, mb.aro);
      if (cmp) return cmp;
      cmp = cmpNullableNum(ma.perfil, mb.perfil);
      if (cmp) return cmp;
      cmp = cmpNullableNum(ma.largura, mb.largura);
      if (cmp) return cmp;
      return String(a.medida||"").localeCompare(String(b.medida||""), "pt-BR", {numeric:true});
    });
  }

    var qtd = Math.max(0, parseNum(i.quantidade));
    var min = Math.max(0, parseNum(i.minimo));
    var baixo = min>0 && qtd<min;
    return '<div class="arow">'+
      '<span class="d">'+escHtml(i.medida||"—")+(i.marca?' <span style="color:var(--text-faint);">· '+escHtml(i.marca)+'</span>':'')+
        (baixo?' <span class="est-baixo-badge" title="Abaixo do mínimo configurado ('+min+' un.)">⚠ estoque baixo</span>':'')+'</span>'+
      '<span class="stats">'+
        '<span><b'+(qtd<=0?' class="est-zero"':'')+'>'+qtd+' un.</b></span>'+
        '<span>'+fmtCurrency(parseNum(i.preco))+'</span>'+
        '<span class="est-actions">'+
          '<button class="icon-btn" data-est-out="'+escAttr(i.id)+'" title="Retirar do estoque">−</button>'+
          '<button class="icon-btn" data-est-in="'+escAttr(i.id)+'" title="Adicionar ao estoque">+</button>'+
          '<button class="icon-btn" data-est-edit="'+escAttr(i.id)+'" title="Editar medida, marca ou preço">✎</button>'+
          '<button class="icon-btn" data-est-del="'+escAttr(i.id)+'" title="Apagar item">✕</button>'+
        '</span>'+

    '</div>';
  }

    return o;

  function nextOrcNumber(){
    var n = parseInt(localStorage.getItem(K_ORC_SEQ)||"0",10);
    if (isNaN(n)) n = 0;
    var next = n+1;
    try{ localStorage.setItem(K_ORC_SEQ, String(next)); }catch(e){}
    cloudPush(K_ORC_SEQ, next);
    return next;
  }
  function orcItemTotal(it){ return Math.max(0, parseNum(it.qty)) * parseNum(it.unit); }
  function orcTotals(o){
    var sub = 0;
    (o.items||[]).forEach(function(it){ sub += orcItemTotal(it); });
    var desc = parseNum(o.desconto);
    return {subtotal: sub, desconto: desc, total: Math.max(0, sub - desc)};
  }

  // ---------- tela: notas emitidas (todas, em ordem de emissão) ----------
  function csvEscape(v){
    var s = String(v===undefined||v===null?"":v);
    if (/[";\n]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"';
    return s;
  }
  function downloadTextFile(filename, content, mime){
    var blob = new Blob(["\uFEFF"+content], {type:(mime||"text/csv")+";charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function exportNotasCSV(list){
    var header = ["Número","Data","Hora","Cliente","Documento","Valor","Forma de pagamento","Status"];
    var lines = [header.map(csvEscape).join(";")];
    list.forEach(function(n){
      var d = new Date(n.createdAt);
      var hora = isNaN(d.getTime()) ? "" : pad(d.getHours())+":"+pad(d.getMinutes());
      lines.push([
        n.vendaNum, fmtDateBR(n.date), hora, (n.customer&&n.customer.nome)||"",
        customerDocLabel(n.customer||{}), parseNum(n.totalProdutos).toFixed(2).replace(".",","),
        n.formaPagamento||"", (n.pago==="✅"?"Pago":"Pendente")
      ].map(csvEscape).join(";"));
    });
    downloadTextFile("notas-"+today+".csv", lines.join("\r\n"));
  }
  function renderNotas(){

    var totalValor = filtered.reduce(function(a,n){ return a+parseNum(n.totalProdutos); }, 0);
    var pendentes = filtered.filter(function(n){ return n.pago!=="✅"; }).length;

    var rowsHtml = filtered.length ? filtered.map(function(n){
      var d = new Date(n.createdAt);

        '<div class="archive-list">'+rowsHtml+'</div>'+

    root.querySelectorAll("[data-act]").forEach(function(node){

          btn.style.display = (!q || hay.indexOf(q)>-1) ? "" : "none";

        var item = id ? estoqueItem(id) : null;

        state.modal.qtd = document.getElementById("grQtd").value;

        render();

  // ---------- modal: dividir o pagamento entre até 4 formas ----------
  function renderMultiPagModal(){
    var rowId = state.modal.rowId;
    var row = state.rows.filter(function(r){ return r.id===rowId; })[0];
    if (!row){ state.modal = null; render(); return; }
    var total = computeValor(row);
    var existentes = Array.isArray(row.pagamentosMultiplos) ? row.pagamentosMultiplos.slice() : [];
    if (existentes.length===0){
      existentes = [{metodo:"Dinheiro", valor: total}];
    }
    while (existentes.length < 4) existentes.push({metodo:"Nenhum", valor:""});
    existentes = existentes.slice(0,4);

    var div = document.createElement("div");
    div.className = "overlay";
    var opcoesMetodo = ["Nenhum"].concat(METODOS_PAGAMENTO);
    var linhasHtml = existentes.map(function(p, i){
      var selOpts = opcoesMetodo.map(function(m){
        return '<option value="'+m+'"'+(p.metodo===m?" selected":"")+'>'+m+'</option>';
      }).join("");
      return '<div style="display:flex;gap:8px;margin-bottom:8px;">'+
        '<select class="mpMetodo" data-idx="'+i+'" style="flex:1.2;background:var(--panel-alt);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:8px;">'+selOpts+'</select>'+
        '<input type="text" inputmode="decimal" class="mpValor" data-idx="'+i+'" placeholder="0,00" value="'+escAttr(p.valor!==""&&p.valor!==undefined&&p.valor!==null?parseNum(p.valor):"")+'" style="flex:1;">'+
      '</div>';
    }).join("");

    div.innerHTML =
      '<div class="modal wide">'+
        '<h3>Dividir pagamento (até 4 formas)</h3>'+
        '<p style="font-size:12.5px;color:var(--text-dim);margin:0 0 12px;">Total da venda: <b style="color:var(--text);">'+fmtCurrency(total)+'</b></p>'+
        '<div id="mpLinhas">'+linhasHtml+'</div>'+
        '<div id="mpResumo" style="font-size:12.5px;color:var(--text-dim);margin:6px 2px 12px;"></div>'+
        '<div class="err">'+escHtml(state.modal.error||"")+'</div>'+
        '<div class="modal-actions">'+
          '<button class="btn ghost small" id="mpCancel">Voltar</button>'+
          '<button class="btn primary small" id="mpSave">Salvar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(div);

    function lerValores(){
      var metodos = div.querySelectorAll(".mpMetodo");
      var valores = div.querySelectorAll(".mpValor");
      var lista = [];
      for (var i=0;i<metodos.length;i++){
        var m = metodos[i].value;
        var v = parseNum(valores[i].value);
        if (m!=="Nenhum" && v>0) lista.push({metodo:m, valor:v});
      }
      return lista;
    }
    function atualizarResumo(){
      var lista = lerValores();
      var soma = lista.reduce(function(s,p){ return s+p.valor; }, 0);
      var resumo = document.getElementById("mpResumo");
      var diff = total - soma;
      if (!resumo) return;
      if (Math.abs(diff) < 0.005){
        resumo.innerHTML = '<span style="color:var(--green);">Soma bate certinho com o total (' + fmtCurrency(soma) + ').</span>';
      } else if (diff > 0){
        resumo.innerHTML = 'Soma atual: '+fmtCurrency(soma)+' — <span style="color:var(--yellow);">ainda falta '+fmtCurrency(diff)+'</span>';
      } else {
        resumo.innerHTML = 'Soma atual: '+fmtCurrency(soma)+' — <span style="color:var(--red);">passou '+fmtCurrency(-diff)+' do total</span>';
      }
    }
    atualizarResumo();
    div.querySelectorAll(".mpMetodo, .mpValor").forEach(function(el){
      el.addEventListener("input", atualizarResumo);
      el.addEventListener("change", atualizarResumo);
    });

    function goBack(){ state.modal = null; render(); }
    document.getElementById("mpCancel").addEventListener("click", goBack);
    div.addEventListener("click", function(e){ if (e.target===div) goBack(); });
    document.getElementById("mpSave").addEventListener("click", function(){
      var lista = lerValores();
      if (lista.length===0){
        state.modal.error = "Escolha ao menos uma forma de pagamento com um valor maior que zero.";
        renderModal();
        return;
      }
      var soma = lista.reduce(function(s,p){ return s+p.valor; }, 0);
      if (Math.abs(soma-total) > 0.01){
        if (!window.confirm("A soma das formas de pagamento (" + fmtCurrency(soma) + ") é diferente do total da venda (" + fmtCurrency(total) + "). Quer salvar assim mesmo?")) return;
      }
      row.formaPagamento = "Múltiplo (até 4 formas)";
      row.pagamentosMultiplos = lista;
      state.modal = null;
      render();
      scheduleSave();
    });
  }

  // ---------- reage a mudanças feitas em outro aparelho ----------
  function handleRemoteChange(key){
    if (key.indexOf(K_ROWS)===0){
      var date = key.slice(K_ROWS.length);
      var month = date.slice(0,7);
      delete state.monthSummaryCache[month];
      delete state.monthPartsCache[month];
      // se a linha alterada é do dia aberto na tela e não há edição pendente,
      // recarrega para não perder digitação em andamento
      if (state.view==="table" && state.date===date && !state.saving){
        getRows(date).then(function(rows){ state.rows = rows; render(); });
        return;
      }
    } else if (key.indexOf(K_SUMMARY)===0){
      var m = key.slice(K_SUMMARY.length);
      delete state.monthSummaryCache[m];
      delete state.monthPartsCache[m];
    }
    render();
  }

  // ---------- login de acesso ao site (Supabase Auth — senha nunca fica no código) ----------
  function renderLoginScreen(errorMsg){
    root.classList.remove("wide");
    root.innerHTML =
      '<div class="login-screen"><div class="login-card">'+
        '<div class="brand"><span class="mark"></span><h1>Painel de Vendas</h1></div>'+
        '<p class="hint">Entre com seu e-mail e senha para acessar o sistema.</p>'+
        '<input type="email" id="loginEmail" placeholder="E-mail" autocomplete="username">'+
        '<input type="password" id="loginPassword" placeholder="Senha" autocomplete="current-password">'+
        '<div class="err">'+escHtml(errorMsg||"")+'</div>'+
        '<button class="btn primary" id="loginBtn">Entrar</button>'+
      '</div></div>';
    var emailInput = document.getElementById("loginEmail");
    var passInput = document.getElementById("loginPassword");
    var btn = document.getElementById("loginBtn");
    emailInput.focus();
    function tryLogin(){
      var email = emailInput.value.trim();
      var pass = passInput.value;
      if (!email || !pass){ renderLoginScreen("Preencha e-mail e senha."); return; }
      btn.disabled = true; btn.textContent = "Entrando...";
      sb.auth.signInWithPassword({email:email, password:pass}).then(function(res){
        if (res.error){ renderLoginScreen((res.error && res.error.message) ? res.error.message : "E-mail ou senha inválidos."); }
        else {
          var u = res && res.data && res.data.user;
          var emailLogado = u ? u.email : email;
          // só registra o login DEPOIS de baixar a lista mais atual da nuvem,
          // senão a gente sobrescreve o histórico com uma versão desatualizada
          // (apagando por engano logins feitos em outros aparelhos)
          bootApp(function(){ addLoginLog(emailLogado); });
        }
      });
    }
    btn.addEventListener("click", tryLogin);
    passInput.addEventListener("keydown", function(e){ if (e.key==="Enter") tryLogin(); });
    emailInput.addEventListener("keydown", function(e){ if (e.key==="Enter") passInput.focus(); });
  }

  // ---------- papel do usuário: "vendedor" (painel de vendas), "estoquista" (só estoque) ou "master" (tudo + histórico + usuários) ----------
  function loadRole(cb){
    if (!sb){ state.role = "vendedor"; return cb(); }
    sb.auth.getUser().then(function(res){
      var user = res && res.data && res.data.user;
      if (!user){ state.role = "vendedor"; return cb(); }
      state.userEmail = user.email || "";
      sb.from("perfis").select("papel").eq("user_id", user.id).limit(1).then(function(r){
        var row = r && r.data && r.data[0];
        var papel = row && row.papel;
        state.role = (papel === "estoquista" || papel === "master") ? papel : "vendedor";
        cb();
      }).catch(function(){ state.role = "vendedor"; cb(); });
    }).catch(function(){ state.role = "vendedor"; cb(); });
  }

  function bootApp(afterPull){
    loadRole(function(){
      cloudPullAll(function(hadRemoteData){
        if (typeof afterPull === "function") afterPull(); // ex: registrar o login já com os dados mais recentes em mãos
        render();
        if (!hadRemoteData) pushAllLocalToCloud(); // primeira ativação: sobe o histórico local pra nuvem
        initCloudSync(handleRemoteChange);
        avisarPendenciasNoBoot();
      });
    });
  }

  // avisa uma vez por dia, ao abrir o app, se há lembretes vencidos ou clientes cuja medida chegou
  function avisarPendenciasNoBoot(){
    try{
      var chave = "vo_last_avisos_toast";
      if (localStorage.getItem(chave) === today) return;
      localStorage.setItem(chave, today);
    }catch(e){}
    var vencidos = lembretesVencidos().length;
    var matched = loadProcurados().filter(function(p){ return !p.resolved && p.matched; }).length;
    var baixo = estoqueBaixoList().length;
    if (!window.uiToast) return;
    if (vencidos>0) window.uiToast("⏰ Você tem "+vencidos+" lembrete(s) para conferir hoje. Veja em 🔔 Avisos.", "", 8000);
    if (matched>0) window.uiToast("🔔 "+matched+" cliente(s) aguardando uma medida que já chegou em estoque.", "ok", 8000);
    if (baixo>0) window.uiToast("📉 "+baixo+" medida(s) abaixo do estoque mínimo.", "err", 8000);
  }

  function checkAuthAndBoot(){
    if (!sb){ bootApp(); return; } // sem Supabase configurado, não há como validar login sem expor a senha — segue liberado
    sb.auth.getSession().then(function(res){
      var session = res && res.data && res.data.session;
      if (session) bootApp();
      else renderLoginScreen();
    });
  }

  // ---------- pontes para o script de melhorias no rodapé (atalhos de teclado, tema) ----------
  window.__appOpenSearch = function(){
    if (!state.authed && state.view!=="table" && !state.modal){ /* segue liberado, busca não exige login */ }
    state.modal = {type:"globalSearch", query:""};
    renderModal();
  };
  window.__appShortcut = function(key){
    if (state.modal) return; // não atropela um modal já aberto
    if (key==="e"){ state.view="estoque"; render(); }
    else if (key==="c"){ state.clientesDetailId=null; state.view="clientes"; render(); }
    else if (key==="n"){
      if (state.view==="table"){ addRow(); }
      else {
        state.date = today; state.view = "table"; state.openDetails = {};
        getRows(today).then(function(rows){ state.rows = rows; addRow(); });
      }
    }
  };

  checkAuthAndBoot();
})();
</script>
<style id="oficina-extras">
  .ui-toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:10050;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100vw - 24px));pointer-events:none}
  .ui-toast{pointer-events:auto;background:#1b2329;border:1px solid var(--border);border-left:3px solid var(--yellow);color:var(--text);
    padding:11px 14px;border-radius:5px;font-size:13px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.4);
    display:flex;gap:10px;align-items:flex-start;animation:uiToastIn .18s ease-out}
  .ui-toast.err{border-left-color:var(--red)}
  .ui-toast.ok{border-left-color:var(--green)}
  .ui-toast b{font-family:inherit}
  .ui-toast-x{margin-left:auto;background:none;border:none;color:var(--text-faint);font-size:15px;line-height:1;cursor:pointer;padding:0 2px}
  @keyframes uiToastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ui-offline{position:fixed;left:0;right:0;top:4px;z-index:10060;background:var(--red);color:#fff;
    font-size:12px;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:5px 10px}
  .ui-top{position:fixed;right:16px;bottom:18px;z-index:9000;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--border);background:var(--panel);color:var(--yellow);font-size:17px;cursor:pointer;
    box-shadow:0 8px 22px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s ease}
  .ui-top.show{opacity:1;pointer-events:auto}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#2c3840;border-radius:6px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#3d4d57}
  :focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
  .btn:disabled,button:disabled{opacity:.5;cursor:not-allowed}
  @media(max-width:700px){.ui-top{right:12px;bottom:14px}.ui-toast-wrap{bottom:70px}}
</style>
<script>
(function(){
  var wrap = document.createElement("div");
  wrap.className = "ui-toast-wrap";
  document.body.appendChild(wrap);

  function toast(msg, kind, ms){
    var t = document.createElement("div");
    t.className = "ui-toast" + (kind ? " " + kind : "");
    var span = document.createElement("span");
    span.textContent = String(msg);
    var x = document.createElement("button");
    x.className = "ui-toast-x"; x.type = "button"; x.innerHTML = "&times;";
    x.setAttribute("aria-label","Fechar aviso");
    t.appendChild(span); t.appendChild(x);
    wrap.appendChild(t);
    var timer = setTimeout(close, ms || 4600);
    function close(){ clearTimeout(timer); if (t.parentNode) t.parentNode.removeChild(t); }
    x.addEventListener("click", close);
    return close;
  }
  window.uiToast = toast;

  // avisos do sistema passam a aparecer como toast em vez de caixa do navegador
  window.alert = function(msg){
    var s = String(msg == null ? "" : msg);
    var kind = /não foi poss|erro|inválid|falh/i.test(s) ? "err"
             : /sucesso|salvo|enviado|conclu/i.test(s) ? "ok" : "";
    toast(s, kind, 6000);
  };

  // aviso de conexão
  var offBar = null;
  function setOnline(on){
    if (on){ if (offBar){ offBar.remove(); offBar = null; toast("Conexão restabelecida — sincronizando.", "ok"); } }
    else if (!offBar){
      offBar = document.createElement("div");
      offBar.className = "ui-offline";
      offBar.textContent = "Sem internet — as vendas continuam sendo salvas neste aparelho";
      document.body.appendChild(offBar);
    }
  }
  window.addEventListener("online", function(){ setOnline(true); });
  window.addEventListener("offline", function(){ setOnline(false); });
  if (navigator.onLine === false) setOnline(false);

  // botão voltar ao topo
  var top = document.createElement("button");
  top.className = "ui-top"; top.type = "button"; top.innerHTML = "&#8593;";
  top.setAttribute("aria-label","Voltar ao topo");
  top.addEventListener("click", function(){ window.scrollTo({ top:0, behavior:"smooth" }); });
  document.body.appendChild(top);
  var ticking = false;
  window.addEventListener("scroll", function(){
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function(){
      top.classList.toggle("show", window.scrollY > 420);
      ticking = false;
    });
  }, { passive:true });

  // atalhos: Esc fecha o que estiver aberto, "/" vai direto para a busca,
  // Ctrl/Cmd+K abre a busca global, N/E/C abrem nova venda/estoque/clientes
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      var ov = document.querySelectorAll(".modal-overlay, .overlay");
      var last = ov[ov.length-1];
      if (last){
        var cancel = last.querySelector('[data-close], .btn.ghost, .modal-actions .btn:not(.primary)');
        if (cancel) cancel.click(); else last.remove();
      }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")){
      e.preventDefault();
      if (window.__appOpenSearch) window.__appOpenSearch();
      return;
    }
    if (e.key === "/" ){
      var tag = (e.target && e.target.tagName || "").toLowerCase();
      if (tag === "input" || tag === "textarea" || tag === "select") return;
      var s = document.querySelector(".search-input, .dash-cust-search, #custSearch");
      if (s){ e.preventDefault(); s.focus(); s.select && s.select(); }
      return;
    }
    var tagN = (e.target && e.target.tagName || "").toLowerCase();
    if (tagN === "input" || tagN === "textarea" || tagN === "select" || e.metaKey || e.ctrlKey || e.altKey) return;
    var k = (e.key||"").toLowerCase();
    if ((k==="n" || k==="e" || k==="c") && window.__appShortcut){
      window.__appShortcut(k);
    }
  });

  // botão flutuante: alternar tema claro/escuro
  var themeBtn = document.createElement("button");
  themeBtn.className = "ui-theme-toggle"; themeBtn.type = "button";
  themeBtn.setAttribute("aria-label","Alternar tema claro/escuro");
  function currentTheme(){ try{ return localStorage.getItem("vo_theme") || "dark"; }catch(e){ return "dark"; } }
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    themeBtn.innerHTML = t==="light" ? "&#9789;" : "&#9788;";
    try{ localStorage.setItem("vo_theme", t); }catch(e){}
  }
  applyTheme(currentTheme());
  themeBtn.addEventListener("click", function(){ applyTheme(currentTheme()==="light" ? "dark" : "light"); });
  document.body.appendChild(themeBtn);
})();
</script>
</body>
</html>
